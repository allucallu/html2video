name: Render Video Aset

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Aset yang dirender (pilih "all" untuk SEMUA aset sekaligus, atau ketik path spesifik misal: assets/asset5.html)'
        required: false
        default: 'all'
      bg:
        description: 'Latar Belakang (black | alpha)'
        type: choice
        options:
          - black
          - alpha
        default: black
      codec:
        description: 'Codec (auto | h264 | prores | prores4444)'
        type: choice
        options:
          - auto
          - h264
          - prores
          - prores4444
        default: auto
      res:
        description: 'Resolusi (mis. 3840x2160; kosongkan untuk default 4K)'
        default: ''
      fps:
        description: 'FPS (mis. 30; kosongkan untuk default 30)'
        default: ''

jobs:
  # Tahap 1: Deteksi otomatis semua file HTML di assets/
  discover:
    name: Deteksi Daftar Aset
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          ASSET_INPUT="${{ inputs.asset }}"
          if [ -z "$ASSET_INPUT" ] || [ "$ASSET_INPUT" = "all" ]; then
            # Ambil seluruh file .html di folder assets/
            FILES=$(find assets -maxdepth 1 -name "*.html" -type f | sort)
            COUNT=$(echo "$FILES" | grep -c . || true)
            JSON_ARRAY=$(echo "$FILES" | jq -R -s -c 'split("\n")[:-1]')
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Menemukan $COUNT aset untuk dirender sekaligus secara paralel:"
            echo "$FILES"
          else
            # Single asset mode jika user memilih file spesifik
            JSON_ARRAY=$(jq -nc --arg asset "$ASSET_INPUT" '[$asset]')
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "Mode single asset: $ASSET_INPUT"
          fi

  # Tahap 2: Render seluruh aset secara paralel (Matrix)
  render-matrix:
    name: Render ${{ matrix.asset }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright & Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright System Deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - id: asset-name
        run: |
          BASENAME=$(basename "${{ matrix.asset }}" .html)
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Render Video & Poster 4K
        run: |
          mkdir -p out
          CMD_ARGS=()
          [ -n "${{ inputs.res }}" ] && CMD_ARGS+=(--res "${{ inputs.res }}")
          [ -n "${{ inputs.fps }}" ] && CMD_ARGS+=(--fps "${{ inputs.fps }}")
          [ -n "${{ inputs.bg }}" ] && CMD_ARGS+=(--bg "${{ inputs.bg }}")
          [ "${{ inputs.codec }}" != "auto" ] && CMD_ARGS+=(--codec "${{ inputs.codec }}")

          node core/render.mjs "${{ matrix.asset }}" "${CMD_ARGS[@]}"

      - name: Upload Artefak Video (${{ steps.asset-name.outputs.basename }})
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.asset-name.outputs.basename }}
          path: out/
          retention-days: 7

  # Tahap 3: Gabungkan semua hasil video ke satu artefak download sekaligus
  bundle-all:
    name: Paket Semua Video Sekaligus
    needs: render-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unduh Seluruh Video Hasil Render
        uses: actions/download-artifact@v4
        with:
          pattern: 'video-*'
          merge-multiple: true
          path: all-rendered-videos

      - name: Sertakan Metadata Adobe Stock CSV
        run: |
          if [ -f "metadata/adobe_stock_metadata.csv" ]; then
            cp metadata/adobe_stock_metadata.csv all-rendered-videos/
          fi
          echo "Isi paket all-rendered-videos yang siap diunduh:"
          ls -la all-rendered-videos/

      - name: Upload Artefak All-In-One (Download Semua Sekaligus)
        uses: actions/upload-artifact@v4
        with:
          name: all-rendered-videos
          path: all-rendered-videos/
          retention-days: 7
