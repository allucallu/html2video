name: Render Video Aset

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Target: "all" (semua), "hud" (5 HUD Viewfinder), "cta" (15 Social CTA), "tech" (10 Math/Science/AI), atau nama file spesifik (misal: cinema_camera_raw_viewfinder_overlay.html atau cta_follow_for_more_kinetic_pill.html)'
        required: false
        default: 'all'
      duration:
        description: 'Durasi video dalam detik (mis. 4, 8, atau 10; kosongkan untuk menggunakan durasi bawaan aset)'
        required: false
        default: ''
      bg:
        description: 'Latar Belakang (black | alpha)'
        type: choice
        options:
          - black
          - alpha
        default: black
      codec:
        description: 'Codec (auto | h264 | prores | prores4444)'
        type: choice
        options:
          - auto
          - h264
          - prores
          - prores4444
        default: auto
      res:
        description: 'Resolusi (mis. 3840x2160; kosongkan untuk default 4K UHD)'
        default: ''
      fps:
        description: 'FPS (mis. 30 atau 60; kosongkan untuk default 30)'
        default: ''

jobs:
  # Tahap 1: Deteksi dan filter daftar aset HTML yang akan dirender
  discover:
    name: Deteksi Daftar Aset
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          ASSET_INPUT="${{ inputs.asset }}"
          FILES=""

          if [ -z "$ASSET_INPUT" ] || [ "$ASSET_INPUT" = "all" ]; then
            # Ambil seluruh file .html di folder assets/
            FILES=$(find assets -maxdepth 1 -name "*.html" -type f | sort)
          elif [ "$ASSET_INPUT" = "hud" ]; then
            # Khusus HUD overlay viewfinder
            FILES=$(find assets -maxdepth 1 \( -name "*hud*" -o -name "*overlay*" -o -name "*viewfinder*" \) -type f | sort)
          elif [ "$ASSET_INPUT" = "cta" ]; then
            # Khusus CTA Social Media
            FILES=$(find assets -maxdepth 1 -name "cta_*.html" -type f | sort)
          elif [ "$ASSET_INPUT" = "tech" ] || [ "$ASSET_INPUT" = "science" ]; then
            # Khusus Science, AI, & Math
            FILES=$(find assets -maxdepth 1 \( -name "*neuron*" -o -name "*network*" -o -name "*transformer*" -o -name "*cymatics*" -o -name "*wave*" -o -name "*lattice*" -o -name "*spirograph*" -o -name "*lissajous*" -o -name "*mandala*" -o -name "*washi*" \) -type f | sort)
          else
            # Single asset atau pola kustom
            if [ -f "$ASSET_INPUT" ]; then
              FILES="$ASSET_INPUT"
            elif [ -f "assets/$ASSET_INPUT" ]; then
              FILES="assets/$ASSET_INPUT"
            elif [ -f "assets/${ASSET_INPUT}.html" ]; then
              FILES="assets/${ASSET_INPUT}.html"
            else
              MATCHES=$(find assets -maxdepth 1 -name "*$ASSET_INPUT*" -type f | sort)
              if [ -n "$MATCHES" ]; then
                FILES="$MATCHES"
              else
                echo "Error: File atau pola '$ASSET_INPUT' tidak ditemukan di assets/"
                exit 1
              fi
            fi
          fi

          COUNT=$(echo "$FILES" | grep -c . || true)
          JSON_ARRAY=$(echo "$FILES" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Menemukan $COUNT aset untuk dirender:"
          echo "$FILES"

  # Tahap 2: Render seluruh aset terpilih secara paralel
  render-matrix:
    name: Render ${{ matrix.asset }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        asset: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright & Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright System Deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-freefont-ttf \
            fonts-dejavu-core \
            fontconfig \
            ffmpeg
          sudo fc-cache -f -v

      - id: asset-name
        run: |
          BASENAME=$(basename "${{ matrix.asset }}" .html)
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Render Video & Poster 4K
        run: |
          mkdir -p out
          CMD_ARGS=()
          [ -n "${{ inputs.res }}" ] && CMD_ARGS+=(--res "${{ inputs.res }}")
          [ -n "${{ inputs.fps }}" ] && CMD_ARGS+=(--fps "${{ inputs.fps }}")
          [ -n "${{ inputs.duration }}" ] && CMD_ARGS+=(--duration "${{ inputs.duration }}")
          [ -n "${{ inputs.bg }}" ] && CMD_ARGS+=(--bg "${{ inputs.bg }}")
          [ "${{ inputs.codec }}" != "auto" ] && CMD_ARGS+=(--codec "${{ inputs.codec }}")

          node core/render.mjs "${{ matrix.asset }}" "${CMD_ARGS[@]}"

      - name: Upload Artefak Video (${{ steps.asset-name.outputs.basename }})
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.asset-name.outputs.basename }}
          path: out/
          retention-days: 7

  # Tahap 3: Gabungkan semua hasil video ke satu artefak download sekaligus
  bundle-all:
    name: Paket Semua Video Sekaligus
    if: always() && needs.discover.result == 'success' && !cancelled()
    needs: [discover, render-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unduh Seluruh Video Hasil Render
        uses: actions/download-artifact@v4
        with:
          pattern: 'video-*'
          merge-multiple: true
          path: all-rendered-videos

      - name: Sertakan Metadata Adobe Stock CSV jika Ada
        run: |
          if [ -f "metadata/adobe_stock_metadata.csv" ]; then
            cp metadata/adobe_stock_metadata.csv all-rendered-videos/
          fi
          echo "Daftar file dalam paket all-rendered-videos:"
          ls -la all-rendered-videos/

      - name: Upload Artefak All-In-One (Download Semua Sekaligus)
        uses: actions/upload-artifact@v4
        with:
          name: all-rendered-videos
          path: all-rendered-videos/
          retention-days: 7
