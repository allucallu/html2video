<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Single Sticker 01: 2.5D Spinning Coin (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Gerakan Melayang Vertikal Koin (Siklus 3s = 2x per loop) */
    .coin-levitate {
      animation: floatCoin 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes floatCoin {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-28px) rotate(3deg); }
    }

    /* 2. Putaran Koin 2.5D (Siklus 3s) */
    .coin-spin-25d {
      animation: spinCoin 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes spinCoin {
      0%, 12% { transform: scaleX(1); }
      45% { transform: scaleX(0.14); }
      55% { transform: scaleX(-0.14); }
      88%, 100% { transform: scaleX(1); }
    }

    /* Ketebalan Sisi Koin (Muncul saat koin menyamping) */
    .coin-rim-shift {
      animation: shiftRim 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes shiftRim {
      0%, 12%, 88%, 100% { transform: translateX(18px); }
      45% { transform: translateX(95px); }
      55% { transform: translateX(-95px); }
    }

    /* 3. Bayangan Lantai Mengecil Saat Koin Naik (Siklus 3s) */
    .floor-shadow-scale {
      animation: shadowSync 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes shadowSync {
      0%, 100% { transform: scaleX(1) scaleY(1); }
      50% { transform: scaleX(0.76) scaleY(0.76); }
    }

    /* 4. Percikan Garis Komik & Bintang Kilau (Siklus 3s) */
    .comic-burst-pop {
      animation: burstPop 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstPop {
      0%, 8% { transform: scale(0.85); opacity: 1; }
      22% { transform: scale(1.12); opacity: 1; }
      40%, 75% { transform: scale(0.5); opacity: 0; }
      90%, 100% { transform: scale(1); opacity: 1; }
    }

    .sparkle-twinkle-1 {
      animation: twinkleStar 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0s;
    }
    .sparkle-twinkle-2 {
      animation: twinkleStar 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.25s;
    }
    @keyframes twinkleStar {
      0%, 15% { transform: scale(1) rotate(0deg); }
      45%, 65% { transform: scale(0) rotate(45deg); }
      88%, 100% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO STICKER: 2.5D SPINNING BRUTALIST COIN
      ====================================================== -->
      <!-- Bayangan Lantai Kaku di Bawah Koin -->
      <g transform="translate(960, 815)">
        <g class="floor-shadow-scale">
          <ellipse cx="0" cy="0" rx="145" ry="26" fill="var(--ink)"/>
        </g>
      </g>

      <!-- Dekorasi Bintang Kilau & Garis Komik di Sekeliling Koin -->
      <g transform="translate(960, 515)">
        <!-- Garis Ledakan Komik -->
        <g class="comic-burst-pop" stroke="var(--ink)" stroke-width="8" stroke-linecap="round">
          <line x1="-255" y1="-155" x2="-305" y2="-185"/>
          <line x1="-275" y1="0" x2="-335" y2="0"/>
          <line x1="-255" y1="155" x2="-305" y2="185"/>

          <line x1="255" y1="-155" x2="305" y2="-185"/>
          <line x1="275" y1="0" x2="335" y2="0"/>
          <line x1="255" y1="155" x2="305" y2="185"/>
        </g>

        <!-- Stiker Kilau Bintang 4 Sudut (Kiri Atas) -->
        <g transform="translate(-265, -215)">
          <g class="sparkle-twinkle-1">
            <path d="M0 -44 C4 -12 12 -4 44 0 C12 4 4 12 0 44 C-4 12 -12 4 -44 0 C-12 -4 -4 -12 0 -44 Z" fill="var(--white)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- Stiker Kilau Bintang 4 Sudut (Kanan Bawah) -->
        <g transform="translate(270, 205)">
          <g class="sparkle-twinkle-2">
            <path d="M0 -38 C3 -10 10 -3 38 0 C10 3 3 10 0 38 C-3 10 -10 3 -38 0 C-10 -3 -3 -10 0 -38 Z" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- Bodi Utama Koin Melayang & Berputar 2.5D -->
        <g class="coin-levitate">
          <g class="coin-spin-25d">
            <!-- Lapisan Ketebalan Sisi Koin (2.5D Extrusion) -->
            <g class="coin-rim-shift">
              <circle cx="0" cy="0" r="215" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="10"/>
            </g>

            <!-- Permukaan Depan Koin (Kuning Neon) -->
            <circle cx="0" cy="0" r="215" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="10"/>

            <!-- Cincin Dalam Koin (Hijau Limau) -->
            <circle cx="0" cy="0" r="168" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="8"/>

            <!-- Lingkaran Inti Putih -->
            <circle cx="0" cy="0" r="134" fill="var(--white)" stroke="var(--ink)" stroke-width="7"/>

            <!-- Simbol Dolar ($) Geometris Tebal di Tengah -->
            <g>
              <!-- Tiang Vertikal Dolar -->
              <rect x="-11" y="-92" width="22" height="184" rx="11" fill="var(--ink)"/>
              <!-- Kurva Huruf S Tebal -->
              <path d="M 42 -42 C 42 -72 -42 -72 -42 -36 C -42 2 42 -4 42 36 C 42 72 -42 72 -42 42" fill="none" stroke="var(--ink)" stroke-width="26" stroke-linecap="round"/>
            </g>

            <!-- Aksen Kilau Diagonal di Permukaan Koin -->
            <path d="M-112 -96 A145 145 0 0 1 -55 -136" fill="none" stroke="var(--white)" stroke-width="10" stroke-linecap="round"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
