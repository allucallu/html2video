<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Single Item 02: Security Padlock Card (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --cyber-cyan: #38BDF8;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --hot-pink: #FB7185;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Kartu Melayang & Miring Dinamis (6s) */
    .hero-card-float {
      animation: cardFloat 6s ease-in-out infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(2.5deg); }
      50% { transform: translateY(-16px) rotate(0.5deg); }
    }

    /* 2. Tangkai Gembok Turun Mengunci Rapat (Siklus 3s = 2x per loop) */
    .shackle-lock {
      animation: snapShackle 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes snapShackle {
      0%, 18% { transform: translateY(-26px); }
      32%, 86% { transform: translateY(0px); }
      96%, 100% { transform: translateY(-26px); }
    }

    /* 3. Bodi Gembok Membal Saat Terkunci (Siklus 3s) */
    .lock-body-impact {
      animation: lockImpact 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes lockImpact {
      0%, 28%, 46%, 100% { transform: translateY(0px) scale(1, 1); }
      33% { transform: translateY(8px) scale(1.08, 0.92); }
      40% { transform: translateY(-3px) scale(0.97, 1.03); }
    }

    /* 4. Percikan Garis Komik Saat Terkunci (Siklus 3s) */
    .lock-sparks {
      animation: popSparks 3s ease-out infinite;
    }
    @keyframes popSparks {
      0%, 29% { transform: scale(0.4); opacity: 0; }
      35% { transform: scale(1); opacity: 1; }
      55%, 100% { transform: scale(1.35); opacity: 0; }
    }

    /* 5. Bar Status Keamanan Bawah Berubah Hijau Limau (Siklus 3s) */
    .security-bar-fill {
      transform-origin: 0px 0px;
      animation: fillSecurity 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes fillSecurity {
      0%, 24% { transform: scaleX(0.28); fill: var(--hot-pink); }
      38%, 86% { transform: scaleX(1); fill: var(--acid-lime); }
      96%, 100% { transform: scaleX(0.28); fill: var(--hot-pink); }
    }

    /* 6. Ikon Centang Verifikasi di Bar Bawah Pop-Up (Siklus 3s) */
    .shield-check-pop {
      animation: popCheck 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popCheck {
      0%, 32%, 92%, 100% { transform: scale(0.75); fill: var(--white); }
      42%, 86% { transform: scale(1.1); fill: var(--acid-lime); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: KARTU SECURITY PADLOCK (PUSAT)
      ====================================================== -->
      <g transform="translate(960, 540)">
        <g class="hero-card-float">
          <!-- Bayangan Keras Tanpa Blur (Hard Offset Shadow) -->
          <rect x="-242" y="-292" width="520" height="620" rx="28" fill="var(--ink)"/>

          <!-- Bodi Utama Kartu (Cyber Cyan) -->
          <rect x="-260" y="-310" width="520" height="620" rx="28" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Header Bar Putih di Bagian Atas Kartu -->
          <path d="M-255 -282 C-255 -298 -242 -305 -232 -305 H232 C242 -305 255 -298 255 -282 V-232 H-255 Z" fill="var(--white)"/>
          <line x1="-260" y1="-232" x2="260" y2="-232" stroke="var(--ink)" stroke-width="9"/>

          <!-- Aksen Pill Hitam & Tombol Sudut di Header -->
          <rect x="-215" y="-278" width="145" height="20" rx="10" fill="var(--ink)"/>
          <circle cx="176" cy="-268" r="10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="212" cy="-268" r="10" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="4"/>

          <!-- Layar Viewport Putih di Tengah Kartu -->
          <rect x="-215" y="-185" width="430" height="335" rx="24" fill="var(--white)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Bayangan Lantai Gembok -->
          <ellipse cx="0" cy="108" rx="74" ry="14" fill="var(--ink)" opacity="0.16"/>

          <!-- IKON GEMBOK GEOMETRIS (PUSAT VIEWPORT) -->
          <g transform="translate(0, -10)">
            <!-- Percikan Garis Komik Saat Mengunci -->
            <g class="lock-sparks" stroke="var(--ink)" stroke-width="6" stroke-linecap="round">
              <line x1="-112" y1="-20" x2="-138" y2="-32"/>
              <line x1="-116" y1="12" x2="-144" y2="12"/>
              <line x1="112" y1="-20" x2="138" y2="-32"/>
              <line x1="116" y1="12" x2="144" y2="12"/>
            </g>

            <!-- Tangkai Gembok (Shackle) Bergerak Naik-Turun -->
            <g class="shackle-lock">
              <path d="M-46 -12 V-52 C-46 -78 -26 -98 0 -98 C26 -98 46 -78 46 -52 V-12" fill="none" stroke="var(--ink)" stroke-width="26" stroke-linecap="round"/>
              <path d="M-46 -12 V-52 C-46 -78 -26 -98 0 -98 C26 -98 46 -78 46 -52 V-12" fill="none" stroke="var(--electric-purple)" stroke-width="12" stroke-linecap="round"/>
            </g>

            <!-- Bodi Utama Gembok Kuning Neon -->
            <g class="lock-body-impact">
              <!-- Hard Shadow Bodi Gembok -->
              <rect x="-68" y="-12" width="148" height="122" rx="22" fill="var(--ink)"/>
              <!-- Bodi Utama -->
              <rect x="-76" y="-20" width="148" height="122" rx="22" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="8"/>

              <!-- Lubang Kunci (Keyhole) -->
              <circle cx="-2" cy="30" r="15" fill="var(--ink)"/>
              <path d="M-9 38 L-12 66 H8 L5 38 Z" fill="var(--ink)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Bar Kontrol Bawah (Status Enkripsi / Keamanan) -->
          <rect x="-215" y="182" width="430" height="84" rx="22" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Lencana Centang Status di Kiri -->
          <g transform="translate(-165, 224)">
            <g class="shield-check-pop">
              <circle cx="0" cy="0" r="24" fill="var(--white)" stroke="var(--ink)" stroke-width="6"/>
              <path d="M-9 1 L-2 8 L10 -6" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Track & Progress Bar Status Keamanan -->
          <rect x="-118" y="211" width="295" height="26" rx="13" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(-112, 217)">
            <rect class="security-bar-fill" x="0" y="0" width="283" height="14" rx="7" fill="var(--hot-pink)"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
