<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Energy & Smart Battery - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --emerald-border: #A7F3D0;
      --lime: #84CC16;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --amber: #F59E0B;
      --amber-soft: #FEF3C7;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Putaran Bilah Turbin Angin Utama & Sekunder (6s) */
    .turbine-blades-main {
      animation: spinBlades 3s linear infinite;
    }
    .turbine-blades-sub {
      animation: spinBlades 6s linear infinite;
    }
    @keyframes spinBlades {
      to { transform: rotate(360deg); }
    }

    /* 2. Garis Aliran Angin & Listrik Hijau (2s) */
    .wind-stream {
      stroke-dasharray: 28 24;
      animation: blowWind 2s linear infinite;
    }
    .power-line {
      stroke-dasharray: 12 12;
      animation: flowPower 2s linear infinite;
    }
    @keyframes blowWind {
      from { stroke-dashoffset: 104; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowPower {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }

    /* 3. Pulsa Energi Mengalir dari Turbin ke Baterai (Siklus 3s) */
    .energy-orb-in {
      animation: chargeFlow 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes chargeFlow {
      0% {
        transform: translate(0px, 0px) scale(0.4);
        opacity: 0;
      }
      18% {
        transform: translate(65px, 0px) scale(1);
        opacity: 1;
      }
      45% {
        transform: translate(225px, -85px) scale(1);
        opacity: 1;
      }
      55%, 100% {
        transform: translate(265px, -85px) scale(0.3);
        opacity: 0;
      }
    }

    /* 4. Pengisian 4 Blok Sel Baterai Bertahap (Siklus 3s) */
    .cell-1 { animation: fillCell1 3s ease-in-out infinite; }
    .cell-2 { animation: fillCell2 3s ease-in-out infinite; }
    .cell-3 { animation: fillCell3 3s ease-in-out infinite; }
    .cell-4 { animation: fillCell4 3s ease-in-out infinite; }

    @keyframes fillCell1 {
      0%, 10% { fill: var(--slate-light); }
      20%, 45% { fill: var(--amber); }
      55%, 90% { fill: var(--emerald); }
      100% { fill: var(--slate-light); }
    }
    @keyframes fillCell2 {
      0%, 24% { fill: var(--slate-light); }
      34%, 45% { fill: var(--amber); }
      55%, 90% { fill: var(--emerald); }
      100% { fill: var(--slate-light); }
    }
    @keyframes fillCell3 {
      0%, 38% { fill: var(--slate-light); }
      48%, 90% { fill: var(--emerald); }
      100% { fill: var(--slate-light); }
    }
    @keyframes fillCell4 {
      0%, 52% { fill: var(--slate-light); }
      62%, 90% { fill: var(--emerald); }
      100% { fill: var(--slate-light); }
    }

    /* 5. Lencana Daun Eco & Petir Aktif Saat Baterai Penuh (Siklus 3s) */
    .eco-badge-pop {
      animation: ecoPop 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes ecoPop {
      0%, 54%, 94%, 100% { transform: scale(0.82); }
      65%, 86% { transform: scale(1.14); }
    }

    .full-charge-ring {
      animation: pulseRing 3s ease-out infinite;
    }
    @keyframes pulseRing {
      0%, 55% { transform: scale(0.7); opacity: 0; }
      65% { transform: scale(1); opacity: 0.9; }
      95%, 100% { transform: scale(1.65); opacity: 0; }
    }

    /* 6. Aliran Daya Bersih Keluar ke Grid Kanan (Siklus 3s) */
    .energy-orb-out {
      animation: dispatchGrid 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes dispatchGrid {
      0%, 58% {
        transform: translate(0px, 0px) scale(0.4);
        opacity: 0;
      }
      68% {
        transform: translate(75px, 0px) scale(1);
        opacity: 1;
      }
      90% {
        transform: translate(235px, 0px) scale(1);
        opacity: 1;
      }
      98%, 100% {
        transform: translate(265px, 0px) scale(0.4);
        opacity: 0;
      }
    }

    /* 7. Grafik Efisiensi & Kartu Kanan Melayang Halus (6s & 3s) */
    .right-card-bob {
      animation: bobCard 6s ease-in-out infinite;
    }
    @keyframes bobCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .eco-bar-1 { transform-origin: 48px 250px; animation: growEco 3s ease-in-out infinite 0.55s; }
    .eco-bar-2 { transform-origin: 94px 250px; animation: growEco 3s ease-in-out infinite 0.65s; }
    .eco-bar-3 { transform-origin: 140px 250px; animation: growEco 3s ease-in-out infinite 0.75s; }
    .eco-bar-4 { transform-origin: 186px 250px; animation: growEco 3s ease-in-out infinite 0.85s; }

    @keyframes growEco {
      0%, 55%, 100% { transform: scaleY(0.55); }
      72%, 88% { transform: scaleY(1); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- =====================================================
           DEKORASI LATAR BELAKANG EDITORIAL
      ====================================================== -->
      <circle cx="960" cy="540" r="425" fill="var(--emerald-soft)" opacity="0.65"/>
      <circle cx="960" cy="540" r="425" fill="none" stroke="var(--emerald-border)" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="960" cy="540" r="305" fill="none" stroke="#D1FAE5" stroke-width="2"/>

      <!-- Hembusan Angin Minimalis di Kiri -->
      <g fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" opacity="0.75">
        <path class="wind-stream" d="M165 320 H340"/>
        <path class="wind-stream" d="M135 375 H295"/>
        <path class="wind-stream" d="M180 430 H355"/>
      </g>

      <!-- =====================================================
           JALUR TRANSMISI ENERGI (TURBIN -> BATERAI -> GRID)
      ====================================================== -->
      <!-- Jalur Kiri (Turbin Utama ke Baterai) -->
      <path d="M510 625 L625 625 L695 540 L785 540" fill="none" stroke="var(--emerald-border)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="power-line" d="M510 625 L625 625 L695 540 L785 540" fill="none" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Jalur Kanan (Baterai ke Smart Grid Card) -->
      <line x1="1135" y1="540" x2="1395" y2="540" stroke="var(--emerald-border)" stroke-width="6" stroke-linecap="round"/>
      <line class="power-line" x1="1135" y1="540" x2="1395" y2="540" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round"/>

      <!-- =====================================================
           1. TURBIN ANGIN GEOMETRIS (SISI KIRI)
      ====================================================== -->
      <!-- Turbin Sekunder (Latar Belakang Kiri) -->
      <g>
        <path d="M295 795 L303 525 L311 525 L319 795 Z" fill="#CBD5E1"/>
        <g transform="translate(307, 525)">
          <g class="turbine-blades-sub">
            <path d="M-5 0 L-2 -115 C-1 -122 1 -122 2 -115 L5 0 Z" fill="#94A3B8"/>
            <path d="M-5 0 L-2 -115 C-1 -122 1 -122 2 -115 L5 0 Z" fill="#94A3B8" transform="rotate(120)"/>
            <path d="M-5 0 L-2 -115 C-1 -122 1 -122 2 -115 L5 0 Z" fill="#94A3B8" transform="rotate(240)"/>
          </g>
          <circle cx="0" cy="0" r="11" fill="var(--navy)"/>
        </g>
      </g>

      <!-- Turbin Utama (Depan Kiri) -->
      <g>
        <!-- Menara Turbin -->
        <path d="M432 795 L443 435 L457 435 L468 795 Z" fill="var(--navy)"/>
        <!-- Modul Generator Hub -->
        <rect x="434" y="422" width="38" height="24" rx="10" fill="var(--blue)"/>

        <!-- 3 Bilah Rotor Utama (Titik Poros Tepat di 450, 434) -->
        <g transform="translate(450, 434)">
          <g class="turbine-blades-main">
            <path d="M-8 0 L-3 -165 C-2 -175 2 -175 3 -165 L8 0 Z" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5" stroke-linejoin="round"/>
            <path d="M-8 0 L-3 -165 C-2 -175 2 -175 3 -165 L8 0 Z" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5" stroke-linejoin="round" transform="rotate(120)"/>
            <path d="M-8 0 L-3 -165 C-2 -175 2 -175 3 -165 L8 0 Z" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5" stroke-linejoin="round" transform="rotate(240)"/>
          </g>
          <!-- Hidung Rotor -->
          <circle cx="0" cy="0" r="16" fill="var(--emerald)" stroke="var(--navy)" stroke-width="4.5"/>
          <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
        </g>

        <!-- Kotak Kontrol Dasar Turbin -->
        <rect x="415" y="605" width="70" height="44" rx="12" fill="var(--navy)"/>
        <circle cx="450" cy="627" r="9" fill="var(--emerald)"/>
      </g>

      <!-- Garis Tanah / Fondasi Kiri -->
      <line x1="220" y1="795" x2="540" y2="795" stroke="var(--navy)" stroke-width="6" stroke-linecap="round"/>

      <!-- =====================================================
           2. PULSA ENERGI BERGERAK SEPANJANG JALUR
      ====================================================== -->
      <!-- Pulsa Masuk ke Baterai -->
      <g transform="translate(520, 625)">
        <g class="energy-orb-in">
          <circle cx="0" cy="0" r="15" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3.5"/>
        </g>
      </g>

      <!-- Pulsa Keluar ke Smart Grid -->
      <g transform="translate(1135, 540)">
        <g class="energy-orb-out">
          <circle cx="0" cy="0" r="15" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3.5"/>
        </g>
      </g>

      <!-- =====================================================
           3. SMART BATTERY CORE (PUSAT)
      ====================================================== -->
      <g>
        <!-- Gelombang Efisiensi Saat 100% Terisi -->
        <g transform="translate(960, 540)">
          <circle class="full-charge-ring" cx="0" cy="0" r="210" fill="none" stroke="var(--emerald)" stroke-width="4"/>
        </g>

        <!-- Bayangan 2.5D Baterai -->
        <rect x="815" y="335" width="320" height="440" rx="44" fill="#D1FAE5"/>

        <!-- Terminal Kutub Positif Baterai (Atas) -->
        <rect x="895" y="285" width="130" height="36" rx="14" fill="var(--navy)"/>
        <rect x="915" y="294" width="90" height="10" rx="5" fill="var(--emerald)"/>

        <!-- Rangka Utama Smart Battery -->
        <rect x="800" y="315" width="320" height="445" rx="42" fill="#FFFFFF" stroke="var(--navy)" stroke-width="8"/>

        <!-- 4 Sel Kapasitas Baterai (Dari Bawah ke Atas) -->
        <rect class="cell-4" x="832" y="352" width="256" height="82" rx="18" fill="var(--slate-light)"/>
        <rect class="cell-3" x="832" y="450" width="256" height="82" rx="18" fill="var(--slate-light)"/>
        <rect class="cell-2" x="832" y="548" width="256" height="82" rx="18" fill="var(--slate-light)"/>
        <rect class="cell-1" x="832" y="646" width="256" height="82" rx="18" fill="var(--slate-light)"/>

        <!-- Emblem Petir & Daun Eco di Tengah Baterai -->
        <g transform="translate(960, 540)">
          <g class="eco-badge-pop">
            <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="var(--navy)" stroke-width="6"/>
            <circle cx="0" cy="0" r="42" fill="var(--emerald-soft)"/>
            <!-- Ikon Petir Energi Bersih -->
            <polygon points="4,-24 -18,4 -2,4 -6,24 18,-4 2,-4" fill="var(--emerald)" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <!-- =====================================================
           4. MODUL ECO-EFFICIENCY & SMART GRID (KANAN)
      ====================================================== -->
      <g transform="translate(1395, 355)">
        <g class="right-card-bob">
          <!-- Bayangan Kartu -->
          <rect x="12" y="14" width="285" height="350" rx="28" fill="#DCFCE7"/>
          <!-- Bodi Kartu -->
          <rect x="0" y="0" width="285" height="350" rx="28" fill="#FFFFFF" stroke="var(--navy)" stroke-width="5"/>

          <!-- Header Lencana Daun Eco -->
          <circle cx="62" cy="64" r="30" fill="var(--emerald-soft)"/>
          <!-- Ikon Daun Geometris -->
          <path d="M46 76 C46 54 64 44 80 44 C80 62 70 78 48 78 Z" fill="var(--emerald)"/>
          <path d="M46 78 L66 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

          <!-- Judul & Sub-bar -->
          <rect x="108" y="48" width="135" height="15" rx="7.5" fill="var(--navy)"/>
          <rect x="108" y="72" width="85" height="11" rx="5.5" fill="var(--slate)"/>

          <!-- Garis Pemisah -->
          <line x1="30" y1="120" x2="255" y2="120" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- Grafik Efisiensi Daya (4 Batang) -->
          <rect class="eco-bar-1" x="48" y="185" width="32" height="65" rx="8" fill="#A7F3D0"/>
          <rect class="eco-bar-2" x="94" y="165" width="32" height="85" rx="8" fill="#34D399"/>
          <rect class="eco-bar-3" x="140" y="148" width="32" height="102" rx="8" fill="var(--emerald)"/>
          <rect class="eco-bar-4" x="186" y="135" width="32" height="115" rx="8" fill="var(--emerald-dark)"/>

          <line x1="34" y1="252" x2="250" y2="252" stroke="var(--navy)" stroke-width="4" stroke-linecap="round"/>

          <!-- Indikator Status Optimal Bawah -->
          <rect x="34" y="282" width="216" height="36" rx="18" fill="var(--emerald-soft)"/>
          <circle cx="58" cy="300" r="8" fill="var(--emerald)"/>
          <rect x="78" y="294" width="115" height="12" rx="6" fill="var(--emerald-dark)"/>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="670" cy="315" r="11" fill="var(--amber)"/>
      <circle cx="1265" cy="325" r="12" fill="var(--emerald)"/>
      <rect x="1255" y="730" width="18" height="18" rx="5" transform="rotate(20 1255 730)" fill="var(--lime)"/>
    </svg>
  </div>

</body>
</html>
