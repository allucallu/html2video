<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Analytics & Business Growth - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --cyan: #0EA5E9;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --emerald-border: #A7F3D0;
      --amber: #F59E0B;
      --amber-soft: #FEF3C7;
      --coral: #F43F5E;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Kartu Samping Melayang Halus (6s) */
    .float-left { animation: bobA 6s ease-in-out infinite; }
    .float-right { animation: bobB 6s ease-in-out infinite; }

    @keyframes bobA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes bobB {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(0px); }
    }

    /* 2. Aliran Garis Koneksi Data (2s) */
    .data-trace {
      stroke-dasharray: 10 12;
      animation: moveTrace 2s linear infinite;
    }
    @keyframes moveTrace {
      from { stroke-dashoffset: 44; }
      to { stroke-dashoffset: 0; }
    }

    /* 3. Kurva Grafik Garis Utama Tergambar Menanjak (Siklus 3s) */
    .growth-line {
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      animation: drawGrowth 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes drawGrowth {
      0%, 8% { stroke-dashoffset: 620; }
      56%, 88% { stroke-dashoffset: 0; }
      98%, 100% { stroke-dashoffset: 620; }
    }

    /* Arsiran Area Bawah Kurva Muncul Halus (Siklus 3s) */
    .growth-area {
      animation: fadeArea 3s ease-in-out infinite;
    }
    @keyframes fadeArea {
      0%, 12%, 96%, 100% { opacity: 0; }
      45%, 86% { opacity: 0.32; }
    }

    /* 4. Empat Titik Simpul Data Pop-Up Berurutan (Siklus 3s) */
    .node-pt-1 { animation: popNode 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.1s; }
    .node-pt-2 { animation: popNode 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.35s; }
    .node-pt-3 { animation: popNode 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.65s; }
    .node-pt-4 { animation: popNodePeak 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.95s; }

    @keyframes popNode {
      0%, 10%, 92%, 100% { transform: scale(0); }
      22%, 86% { transform: scale(1); }
    }
    @keyframes popNodePeak {
      0%, 10%, 92%, 100% { transform: scale(0); }
      24% { transform: scale(1.25); }
      34%, 86% { transform: scale(1); }
    }

    /* 5. Donut Chart Melingkar Terisi (Keliling r=54 -> ~340, Siklus 3s) */
    .donut-seg-1 {
      stroke-dasharray: 150 340;
      stroke-dashoffset: 340;
      animation: fillDonut1 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .donut-seg-2 {
      stroke-dasharray: 110 340;
      stroke-dashoffset: 340;
      animation: fillDonut2 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .donut-seg-3 {
      stroke-dasharray: 80 340;
      stroke-dashoffset: 340;
      animation: fillDonut3 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes fillDonut1 {
      0%, 10% { stroke-dashoffset: 340; }
      55%, 88% { stroke-dashoffset: 0; }
      98%, 100% { stroke-dashoffset: 340; }
    }
    @keyframes fillDonut2 {
      0%, 15% { stroke-dashoffset: 340; }
      60%, 88% { stroke-dashoffset: -150; }
      98%, 100% { stroke-dashoffset: 340; }
    }
    @keyframes fillDonut3 {
      0%, 20% { stroke-dashoffset: 340; }
      65%, 88% { stroke-dashoffset: -260; }
      98%, 100% { stroke-dashoffset: 340; }
    }

    /* 6. Grafik Batang Pembanding (Bawah Kanan Dashboard, Siklus 3s) */
    .cmp-bar-1 { animation: barScale 3s ease-in-out infinite 0.1s; }
    .cmp-bar-2 { animation: barScale 3s ease-in-out infinite 0.2s; }
    .cmp-bar-3 { animation: barScale 3s ease-in-out infinite 0.3s; }
    .cmp-bar-4 { animation: barScale 3s ease-in-out infinite 0.4s; }

    @keyframes barScale {
      0%, 100% { transform: scaleY(0.35); }
      55%, 85% { transform: scaleY(1); }
    }

    /* 7. Lencana Panah Naik (Kartu Kiri) & Target Tercapai (Kartu Kanan) */
    .kpi-arrow-pop {
      animation: arrowBoost 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes arrowBoost {
      0%, 45%, 94%, 100% { transform: translateY(0px) scale(1); }
      58%, 84% { transform: translateY(-6px) scale(1.14); }
    }

    .target-check-pop {
      animation: targetHit 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes targetHit {
      0%, 52%, 94%, 100% { transform: scale(0.75); opacity: 0.4; }
      64%, 86% { transform: scale(1.12); opacity: 1; }
    }

    .milestone-pill {
      animation: pillGreen 3s ease-in-out infinite;
    }
    @keyframes pillGreen {
      0%, 54%, 94%, 100% { fill: var(--slate-light); }
      64%, 88% { fill: var(--emerald); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Gradien Area Grafik Garis -->
        <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
        </linearGradient>

        <!-- Gradien Garis Kurva Utama -->
        <linearGradient id="chartStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="50%" stop-color="#0EA5E9"/>
          <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
      </defs>

      <!-- =====================================================
           DEKORASI LATAR BELAKANG EDITORIAL
      ====================================================== -->
      <circle cx="960" cy="540" r="440" fill="var(--blue-soft)" opacity="0.55"/>
      <circle cx="960" cy="540" r="440" fill="none" stroke="var(--blue-border)" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="960" cy="540" r="320" fill="none" stroke="#DBEAFE" stroke-width="2"/>

      <!-- Jalur Koneksi Antar Kartu -->
      <path d="M500 450 L565 450 L605 490 L640 490" fill="none" stroke="var(--blue-border)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="data-trace" d="M500 450 L565 450 L605 490 L640 490" fill="none" stroke="var(--blue-bright)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M1280 570 L1315 570 L1355 610 L1420 610" fill="none" stroke="var(--emerald-border)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="data-trace" d="M1280 570 L1315 570 L1355 610 L1420 610" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- =====================================================
           1. KARTU KPI & TREN PERTUMBUHAN (SISI KIRI)
      ====================================================== -->
      <g transform="translate(215, 340)">
        <g class="float-left">
          <rect x="10" y="12" width="285" height="220" rx="26" fill="#DBEAFE"/>
          <rect x="0" y="0" width="285" height="220" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Badge Panah Naik -->
          <rect x="28" y="28" width="76" height="76" rx="20" fill="var(--emerald-soft)"/>
          <g transform="translate(66, 66)">
            <g class="kpi-arrow-pop">
              <path d="M-16 12 L-4 0 L4 8 L18 -10" fill="none" stroke="var(--emerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="6,-10 18,-10 18,2" fill="none" stroke="var(--emerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Bar Angka KPI -->
          <rect x="122" y="38" width="128" height="16" rx="8" fill="var(--navy)"/>
          <rect x="122" y="64" width="84" height="12" rx="6" fill="var(--slate)"/>
          <rect x="122" y="86" width="62" height="20" rx="10" fill="var(--emerald-soft)"/>

          <line x1="28" y1="128" x2="257" y2="128" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- Mini Sparkline Bawah -->
          <polyline points="34,182 78,174 122,180 166,162 210,166 250,146" fill="none" stroke="var(--blue-bright)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="250" cy="146" r="7" fill="var(--emerald)"/>
        </g>
      </g>

      <!-- =====================================================
           2. DASHBOARD ANALITIK UTAMA (PUSAT)
      ====================================================== -->
      <g transform="translate(640, 220)">
        <!-- Bayangan Window -->
        <rect x="16" y="18" width="640" height="640" rx="34" fill="#DBEAFE"/>
        <!-- Bodi Window Utama -->
        <rect x="0" y="0" width="640" height="640" rx="32" fill="#FFFFFF" stroke="var(--navy)" stroke-width="6"/>

        <!-- Header Bar Dashboard -->
        <circle cx="40" cy="36" r="7" fill="var(--coral)"/>
        <circle cx="62" cy="36" r="7" fill="var(--amber)"/>
        <circle cx="84" cy="36" r="7" fill="var(--emerald)"/>
        <rect x="124" y="29" width="160" height="14" rx="7" fill="var(--slate-light)"/>
        <rect x="510" y="25" width="94" height="22" rx="11" fill="var(--blue-soft)"/>

        <line x1="0" y1="68" x2="640" y2="68" stroke="var(--slate-light)" stroke-width="3"/>

        <!-- A. PANEL GRAFIK GARIS UTAMA (ATAS DASHBOARD) -->
        <g transform="translate(36, 96)">
          <rect x="0" y="0" width="568" height="260" rx="22" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>

          <!-- Garis Grid Horizontal Tipis -->
          <g stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6">
            <line x1="32" y1="60" x2="536" y2="60"/>
            <line x1="32" y1="115" x2="536" y2="115"/>
            <line x1="32" y1="170" x2="536" y2="170"/>
            <line x1="32" y1="220" x2="536" y2="220"/>
          </g>

          <!-- Arsiran Area Bawah Kurva -->
          <path class="growth-area" d="M 48 205 L 185 162 L 345 128 L 512 46 L 512 220 L 48 220 Z" fill="url(#chartAreaGrad)"/>

          <!-- Garis Kurva Pertumbuhan Utama -->
          <path class="growth-line" d="M 48 205 L 185 162 L 345 128 L 512 46" fill="none" stroke="url(#chartStrokeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- 4 Titik Simpul Data (Posisi Terpisah dari Grup Animasi) -->
          <g transform="translate(48, 205)">
            <circle class="node-pt-1" cx="0" cy="0" r="11" fill="#FFFFFF" stroke="var(--blue)" stroke-width="5"/>
          </g>
          <g transform="translate(185, 162)">
            <circle class="node-pt-2" cx="0" cy="0" r="11" fill="#FFFFFF" stroke="var(--cyan)" stroke-width="5"/>
          </g>
          <g transform="translate(345, 128)">
            <circle class="node-pt-3" cx="0" cy="0" r="11" fill="#FFFFFF" stroke="var(--emerald)" stroke-width="5"/>
          </g>
          <g transform="translate(512, 46)">
            <g class="node-pt-4">
              <circle cx="0" cy="0" r="16" fill="var(--emerald-soft)"/>
              <circle cx="0" cy="0" r="11" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="4"/>
            </g>
          </g>
        </g>

        <!-- B. PANEL DONUT CHART (KIRI BAWAH DASHBOARD) -->
        <g transform="translate(36, 382)">
          <rect x="0" y="0" width="272" height="222" rx="22" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>

          <!-- Lingkaran Donut Chart (Pusat di 96, 111) -->
          <g transform="translate(96, 111) rotate(-90)">
            <!-- Track Dasar -->
            <circle cx="0" cy="0" r="54" fill="none" stroke="#E2E8F0" stroke-width="20"/>
            <!-- 3 Segmen Berwarna -->
            <circle class="donut-seg-1" cx="0" cy="0" r="54" fill="none" stroke="var(--blue)" stroke-width="20"/>
            <circle class="donut-seg-2" cx="0" cy="0" r="54" fill="none" stroke="var(--cyan)" stroke-width="20"/>
            <circle class="donut-seg-3" cx="0" cy="0" r="54" fill="none" stroke="var(--emerald)" stroke-width="20"/>
          </g>

          <!-- Legenda Kanan Donut -->
          <g transform="translate(176, 68)">
            <circle cx="8" cy="8" r="6" fill="var(--blue)"/>
            <rect x="22" y="3" width="52" height="10" rx="5" fill="var(--navy)"/>

            <circle cx="8" cy="42" r="6" fill="var(--cyan)"/>
            <rect x="22" y="37" width="44" height="10" rx="5" fill="var(--slate)"/>

            <circle cx="8" cy="76" r="6" fill="var(--emerald)"/>
            <rect x="22" y="71" width="56" height="10" rx="5" fill="var(--navy)"/>
          </g>
        </g>

        <!-- C. PANEL BAR PEMBANDING (KANAN BAWAH DASHBOARD) -->
        <g transform="translate(332, 382)">
          <rect x="0" y="0" width="272" height="222" rx="22" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>

          <!-- Header Mini -->
          <rect x="26" y="24" width="110" height="12" rx="6" fill="var(--navy)"/>
          <rect x="206" y="22" width="40" height="16" rx="8" fill="var(--emerald-soft)"/>

          <!-- 4 Batang Grafik Bertumbuh (Titik Poros Bawah y=182) -->
          <g transform="translate(42, 182)">
            <rect class="cmp-bar-1" x="0" y="-68" width="32" height="68" rx="8" fill="#BFDBFE"/>
          </g>
          <g transform="translate(94, 182)">
            <rect class="cmp-bar-2" x="0" y="-88" width="32" height="88" rx="8" fill="#60A5FA"/>
          </g>
          <g transform="translate(146, 182)">
            <rect class="cmp-bar-3" x="0" y="-104" width="32" height="104" rx="8" fill="var(--blue)"/>
          </g>
          <g transform="translate(198, 182)">
            <rect class="cmp-bar-4" x="0" y="-122" width="32" height="122" rx="8" fill="var(--emerald)"/>
          </g>

          <!-- Baseline -->
          <line x1="26" y1="184" x2="246" y2="184" stroke="var(--navy)" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- =====================================================
           3. KARTU TARGET MILESTONE TERCAPAI (SISI KANAN)
      ====================================================== -->
      <g transform="translate(1420, 500)">
        <g class="float-right">
          <rect x="10" y="12" width="285" height="220" rx="26" fill="#DCFCE7"/>
          <rect x="0" y="0" width="285" height="220" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Ikon Sasaran Target (Bullseye) -->
          <g transform="translate(66, 68)">
            <circle cx="0" cy="0" r="36" fill="var(--amber-soft)"/>
            <circle cx="0" cy="0" r="26" fill="none" stroke="var(--amber)" stroke-width="5"/>
            <circle cx="0" cy="0" r="14" fill="none" stroke="var(--coral)" stroke-width="5"/>
            <circle cx="0" cy="0" r="5" fill="var(--navy)"/>

            <!-- Badge Centang Muncul Saat Target Tercapai -->
            <g transform="translate(24, -22)">
              <g class="target-check-pop">
                <circle cx="0" cy="0" r="16" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3"/>
                <path d="M-6 0 L-2 4 L7 -5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>
          </g>

          <!-- Bar Info Pencapaian -->
          <rect x="122" y="42" width="128" height="15" rx="7.5" fill="var(--navy)"/>
          <rect x="122" y="67" width="84" height="11" rx="5.5" fill="var(--slate)"/>
          <rect x="122" y="88" width="68" height="18" rx="9" fill="var(--amber-soft)"/>

          <line x1="28" y1="130" x2="257" y2="130" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- Pill Status Target Tercapai -->
          <rect class="milestone-pill" x="28" y="154" width="229" height="36" rx="18" fill="var(--slate-light)"/>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="560" cy="300" r="10" fill="var(--amber)"/>
      <circle cx="1365" cy="340" r="12" fill="var(--emerald)"/>
      <rect x="545" y="745" width="18" height="18" rx="5" transform="rotate(20 545 745)" fill="var(--blue-bright)"/>
    </svg>
  </div>

</body>
</html>
