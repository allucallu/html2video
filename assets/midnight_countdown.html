<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism New Year 02: Midnight Countdown Clock (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Bodi Jam: Diam Saat Detak -> Bergetar Nyaring Saat Pukul 12 (Siklus 3s = 2x per loop) */
    .clock-ring-shake {
      animation: midnightShake 3s ease-in-out infinite;
    }
    @keyframes midnightShake {
      0%, 42%, 86%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      46% {
        transform: translateY(-14px) rotate(-6deg) scale(1.05);
      }
      51% {
        transform: translateY(-16px) rotate(6deg) scale(1.06);
      }
      56% {
        transform: translateY(-14px) rotate(-5deg) scale(1.05);
      }
      61% {
        transform: translateY(-15px) rotate(5deg) scale(1.05);
      }
      66% {
        transform: translateY(-10px) rotate(-3deg) scale(1.03);
      }
      72% {
        transform: translateY(-4px) rotate(2deg) scale(1.01);
      }
    }

    /* 2. Jarum Detik / Menit Melompat Tegas ke Pukul 12 (Siklus 3s) */
    .hand-minute-tick {
      animation: tickToMidnight 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes tickToMidnight {
      0%, 8% { transform: rotate(-90deg); }
      14%, 21% { transform: rotate(-60deg); }
      27%, 34% { transform: rotate(-30deg); }
      42%, 78% { transform: rotate(0deg); }
      92%, 100% { transform: rotate(-90deg); }
    }

    /* 3. Jarum Jam Pendek Bergeser Halus Menuju Pukul 12 (Siklus 3s) */
    .hand-hour-tick {
      animation: hourToMidnight 3s ease-in-out infinite;
    }
    @keyframes hourToMidnight {
      0%, 8% { transform: rotate(-24deg); }
      42%, 78% { transform: rotate(0deg); }
      92%, 100% { transform: rotate(-24deg); }
    }

    /* 4. Palu Lonceng Atas Memukul Cepat Saat Tengah Malam (Siklus 3s) */
    .hammer-strike {
      animation: strikeBells 3s ease-in-out infinite;
    }
    @keyframes strikeBells {
      0%, 42%, 82%, 100% { transform: rotate(0deg); }
      46%, 56%, 66% { transform: rotate(-22deg); }
      51%, 61%, 71% { transform: rotate(22deg); }
    }

    /* 5. Bintang Puncak Pukul 12 Menyala & Membal Saat Tercapai (Siklus 3s) */
    .midnight-star-pop {
      animation: popTwelveStar 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popTwelveStar {
      0%, 38%, 84%, 100% { transform: scale(1); }
      46%, 72% { transform: scale(1.32); }
    }

    /* 6. Garis Dering Komik di Sekitar Lonceng (Siklus 3s) */
    .ring-waves {
      animation: waveRing 3s ease-out infinite;
    }
    @keyframes waveRing {
      0%, 41%, 82%, 100% { transform: scale(0.75); opacity: 0; }
      48%, 72% { transform: scale(1.06); opacity: 1; }
    }

    /* 7. Bintang Kilau Sudut Berkedip Kontra-Ritme (Siklus 3s) */
    .sparkle-left {
      animation: twinkleA 3s ease-in-out infinite;
    }
    .sparkle-right {
      animation: twinkleB 3s ease-in-out infinite;
    }
    @keyframes twinkleA {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.45) rotate(45deg); }
    }
    @keyframes twinkleB {
      0%, 100% { transform: scale(0.45) rotate(-45deg); }
      50% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: MIDNIGHT COUNTDOWN CLOCK (PUSAT)
      ====================================================== -->
      <!-- Bintang Kilau Sudut Kiri Bawah (Cyber Cyan) -->
      <g transform="translate(650, 770)">
        <g class="sparkle-left">
          <path d="M0 -42 C4 -11 11 -4 42 0 C11 4 4 11 0 42 C-4 11 -11 4 -42 0 C-11 -4 -4 -11 0 -42 Z" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Bintang Kilau Sudut Kanan Atas (Hot Pink) -->
      <g transform="translate(1275, 290)">
        <g class="sparkle-right">
          <path d="M0 -44 C4 -12 12 -4 44 0 C12 4 4 12 0 44 C-4 12 -12 4 -44 0 C-12 -4 -4 -12 0 -44 Z" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- PUSAT JAM WEKER BRUTALIST -->
      <g transform="translate(960, 560)">
        <g class="clock-ring-shake">

          <!-- Gelombang Garis Dering Komik di Kiri & Kanan Lonceng -->
          <g class="ring-waves" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round">
            <path d="M -255 -235 Q -295 -195 -285 -145"/>
            <path d="M -285 -255 Q -330 -205 -318 -140"/>
            <path d="M 255 -235 Q 295 -195 285 -145"/>
            <path d="M 285 -255 Q 330 -205 318 -140"/>
          </g>

          <!-- Kaki Jam Kiri & Kanan -->
          <g>
            <!-- Kaki Kiri -->
            <g transform="translate(-145, 215) rotate(28)">
              <rect x="-20" y="-12" width="48" height="76" rx="18" fill="var(--ink)"/>
              <rect x="-26" y="-18" width="48" height="76" rx="18" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="9"/>
            </g>
            <!-- Kaki Kanan -->
            <g transform="translate(145, 215) rotate(-28)">
              <rect x="-14" y="-12" width="48" height="76" rx="18" fill="var(--ink)"/>
              <rect x="-22" y="-18" width="48" height="76" rx="18" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="9"/>
            </g>
          </g>

          <!-- Lonceng Kembar Atas (Twin Bells) -->
          <!-- Lonceng Kiri (Hot Pink) -->
          <g transform="translate(-175, -185) rotate(-38)">
            <path d="M-76 28 C-76 -26 76 -26 76 28 Z" fill="var(--ink)" transform="translate(10, 10)"/>
            <path d="M-76 28 C-76 -26 76 -26 76 28 Z" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="10" stroke-linejoin="round"/>
          </g>

          <!-- Lonceng Kanan (Acid Lime) -->
          <g transform="translate(175, -185) rotate(38)">
            <path d="M-76 28 C-76 -26 76 -26 76 28 Z" fill="var(--ink)" transform="translate(10, 10)"/>
            <path d="M-76 28 C-76 -26 76 -26 76 28 Z" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="10" stroke-linejoin="round"/>
          </g>

          <!-- Palu Pemukul Lonceng (Berayun Cepat Saat Tengah Malam) -->
          <g transform="translate(0, -210)">
            <g class="hammer-strike">
              <rect x="-9" y="-68" width="18" height="68" rx="9" fill="var(--ink)"/>
              <circle cx="0" cy="-74" r="22" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="9"/>
            </g>
          </g>

          <!-- Hard Offset Shadow Bodi Utama Jam -->
          <circle cx="18" cy="20" r="245" fill="var(--ink)"/>

          <!-- Bingkai Luar Jam (Electric Purple) -->
          <circle cx="0" cy="0" r="245" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="11"/>

          <!-- Layar Muka Jam (Putih Bersih) -->
          <circle cx="0" cy="0" r="196" fill="var(--white)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Penanda Waktu Geometris (Tanpa Angka) -->
          <!-- Pukul 3 (Kanan) -->
          <rect x="142" y="-9" width="32" height="18" rx="9" fill="var(--ink)"/>
          <!-- Pukul 6 (Bawah) -->
          <rect x="-9" y="142" width="18" height="32" rx="9" fill="var(--ink)"/>
          <!-- Pukul 9 (Kiri) -->
          <rect x="-174" y="-9" width="32" height="18" rx="9" fill="var(--ink)"/>

          <!-- Titik Sekunder Diagonal (Pukul 1, 2, 4, 5, 7, 8, 10, 11) -->
          <g fill="var(--ink)" opacity="0.35">
            <circle cx="80" cy="-138" r="7"/>
            <circle cx="138" cy="-80" r="7"/>
            <circle cx="138" cy="80" r="7"/>
            <circle cx="80" cy="138" r="7"/>
            <circle cx="-80" cy="138" r="7"/>
            <circle cx="-138" cy="80" r="7"/>
            <circle cx="-138" cy="-80" r="7"/>
            <circle cx="-80" cy="-138" r="7"/>
          </g>

          <!-- Lencana Bintang Puncak Pukul 12 (Target Tengah Malam) -->
          <g transform="translate(0, -146)">
            <g class="midnight-star-pop">
              <polygon points="0,-32 9,-10 32,-10 13,4 20,26 0,12 -20,26 -13,4 -32,-10 -9,-10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5.5" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- JARUM JAM PENDEK (HOUR HAND) -->
          <g class="hand-hour-tick">
            <rect x="-11" y="-92" width="22" height="92" rx="11" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="7"/>
          </g>

          <!-- JARUM MENIT PANJANG (MINUTE HAND) -->
          <g class="hand-minute-tick">
            <rect x="-9" y="-128" width="18" height="128" rx="9" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="7"/>
          </g>

          <!-- Poros Tengah Jam (Kuning Neon) -->
          <circle cx="0" cy="0" r="24" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="8"/>
          <circle cx="0" cy="0" r="8" fill="var(--ink)"/>

        </g>
      </g>

    </svg>
  </div>

</body>
</html>
