<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Geometry 8-Fold Rotating Circles Mandala</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const P = window.__cliParams || {};
const BG = P.bg || 'black';
const SEED = Number(P.seed) || 1;
const VARIANT = Number(P.variant) || 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

// Seeded PRNG used only at load time
function createSeededPRNG(seed) {
  let s = (seed % 2147483647);
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(SEED * 8191 + VARIANT * 521 + 19);

function hexToRgb(hex) {
  const clean = hex.replace('#', '').trim();
  const num = parseInt(clean.length === 3
    ? clean.split('').map(c => c + c).join('')
    : clean, 16);
  return {
    r: (num >> 16) & 255,
    g: (num >> 8) & 255,
    b: num & 255
  };
}

function rgba(rgb, a) {
  return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${Math.max(0, Math.min(1, a))})`;
}

// Default Palette: White / Silver lines + Luminous Gold Accent
const COLORS = {
  white: { r: 255, g: 255, b: 255 },
  silver: { r: 186, g: 204, b: 228 },
  guide: { r: 122, g: 146, b: 180 },
  accent: { r: 255, g: 184, b: 48 },       // Sacred Gold Accent
  accentSoft: { r: 255, g: 222, b: 130 },  // Pale Champagne Gold
  accentDeep: { r: 175, g: 105, b: 15 }    // Deep Amber Bronze
};

if (P.palette && typeof P.palette === 'string') {
  const parts = P.palette.split(',').map(s => s.trim()).filter(Boolean);
  if (parts[0]) COLORS.accent = hexToRgb(parts[0]);
  if (parts[1]) COLORS.white = hexToRgb(parts[1]);
  if (parts[2]) COLORS.silver = hexToRgb(parts[2]);
  COLORS.accentSoft = {
    r: Math.min(255, Math.round((COLORS.accent.r + 255) * 0.5)),
    g: Math.min(255, Math.round((COLORS.accent.g + 255) * 0.5)),
    b: Math.min(255, Math.round((COLORS.accent.b + 255) * 0.5))
  };
  COLORS.accentDeep = {
    r: Math.round(COLORS.accent.r * 0.58),
    g: Math.round(COLORS.accent.g * 0.58),
    b: Math.round(COLORS.accent.b * 0.58)
  };
}

// Lookup table of 8 distinct 8-Fold Sacred Geometry Rotating-Circle Presets indexed by VARIANT
// N: 8-fold symmetry order
// d1, r1: Primary ring center distance & circle radius (relative to S)
// d2, r2: Secondary counter-rotating ring center distance & circle radius
// d3, r3: Outer satellite / inner seed circle ring parameters
// starStep: {8 / starStep} octagram chord step (2 or 3)
// subDiv: 1 (8 circles) or 2 (16 circles in fine torus weave)
const PRESETS = [
  { N: 8, d1: 0.138, r1: 0.138, d1Amp: 0.024, d2: 0.195, r2: 0.098, d2Amp: 0.020, d3: 0.072, r3: 0.072, starStep: 3, subDiv: 1, breathK: 2, secK: 3 },
  { N: 8, d1: 0.115, r1: 0.165, d1Amp: 0.022, d2: 0.215, r2: 0.082, d2Amp: 0.018, d3: 0.062, r3: 0.088, starStep: 2, subDiv: 2, breathK: 1, secK: 3 },
  { N: 8, d1: 0.156, r1: 0.125, d1Amp: 0.026, d2: 0.156, r2: 0.125, d2Amp: 0.026, d3: 0.085, r3: 0.065, starStep: 3, subDiv: 1, breathK: 2, secK: 5 },
  { N: 8, d1: 0.128, r1: 0.152, d1Amp: 0.020, d2: 0.228, r2: 0.072, d2Amp: 0.015, d3: 0.092, r3: 0.092, starStep: 3, subDiv: 2, breathK: 2, secK: 3 },
  { N: 8, d1: 0.168, r1: 0.118, d1Amp: 0.025, d2: 0.112, r2: 0.142, d2Amp: 0.022, d3: 0.054, r3: 0.054, starStep: 2, subDiv: 1, breathK: 3, secK: 5 },
  { N: 8, d1: 0.142, r1: 0.142, d1Amp: 0.028, d2: 0.182, r2: 0.108, d2Amp: 0.020, d3: 0.078, r3: 0.078, starStep: 3, subDiv: 2, breathK: 1, secK: 4 },
  { N: 8, d1: 0.105, r1: 0.175, d1Amp: 0.018, d2: 0.205, r2: 0.092, d2Amp: 0.022, d3: 0.068, r3: 0.068, starStep: 2, subDiv: 1, breathK: 2, secK: 3 },
  { N: 8, d1: 0.148, r1: 0.134, d1Amp: 0.024, d2: 0.212, r2: 0.086, d2Amp: 0.018, d3: 0.082, r3: 0.058, starStep: 3, subDiv: 2, breathK: 2, secK: 5 }
];

const CFG = PRESETS[((VARIANT % PRESETS.length) + PRESETS.length) % PRESETS.length];

// Precompute traveling pulse seeds along the rotating circles at load time
const CIRCLE_PULSES = [];
const NUM_PULSES = 32;
for (let i = 0; i < NUM_PULSES; i++) {
  CIRCLE_PULSES.push({
    circleIdx: i % 8,
    ringType: i < 16 ? 1 : 2,
    s0: (i / 16 + rand() * 0.03) % 1.0,
    speed: (i % 2 === 0) ? 2 : -2, // Integer turns per loop along the circle circumference
    twinkleFreq: 4 + (i % 4),
    twinklePhase: rand() * TAU,
    isAccent: (i % 2 === 0)
  });
}

// Helper: Multi-pass glowing vector stroke (no shadowBlur, fast 4K CPU rendering)
function strokeGlowingPath(pathFn, coreWidth, rgb, baseAlpha, glowPasses) {
  if (baseAlpha <= 0.004) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (BG === 'black' && glowPasses > 1) {
    ctx.globalCompositeOperation = 'lighter';
  }

  for (let p = glowPasses; p >= 1; p--) {
    const mult = p === 1 ? 1.0 : (p === 2 ? 2.6 : 5.4);
    const alphaMult = p === 1 ? 1.0 : (p === 2 ? 0.28 : 0.09);
    ctx.strokeStyle = rgba(rgb, baseAlpha * alphaMult);
    ctx.lineWidth = coreWidth * mult;
    pathFn();
    ctx.stroke();
  }
  ctx.restore();
}

// Helper: Draw a bright sacred intersection node with soft radial alpha halo
function drawGlowingNode(x, y, radius, coreRgb, haloRgb, alpha) {
  if (alpha <= 0.01 || radius <= 0.2) return;
  ctx.save();
  if (BG === 'black') {
    ctx.globalCompositeOperation = 'lighter';
  }

  const haloR = radius * 4.2;
  const grad = ctx.createRadialGradient(x, y, 0, x, y, haloR);
  grad.addColorStop(0.0, rgba(coreRgb, alpha * 0.96));
  grad.addColorStop(0.26, rgba(haloRgb, alpha * 0.56));
  grad.addColorStop(0.65, rgba(haloRgb, alpha * 0.15));
  grad.addColorStop(1.0, rgba(haloRgb, 0.0));

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, haloR, 0, TAU);
  ctx.fill();

  ctx.fillStyle = rgba(coreRgb, alpha);
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Helper: Analytically compute and draw all vesica piscis intersection points
// for a ring of N circles of radius R whose centers lie at distance D from the origin
function drawSymmetricRingIntersections(N, D, R, S, nodeScale, haloRgb, baseAlpha) {
  // Check chords between circle i and circle (i + step) for step = 1 .. floor(N/2)
  const maxStep = Math.floor(N / 2);
  for (let step = 1; step <= maxStep; step++) {
    const halfDelta = (step * Math.PI) / N;
    const sinHalf = Math.sin(halfDelta);
    const cosHalf = Math.cos(halfDelta);
    const halfChord = D * sinHalf;

    if (halfChord > 0.0005 * S && halfChord < R * 0.996) {
      const h = Math.sqrt(R * R - halfChord * halfChord);
      const rMid = D * cosHalf;
      const rOuter = rMid + h;
      const rInner = Math.abs(rMid - h);

      const isPrimaryStep = (step === 1 || step === 2);
      const rad = (isPrimaryStep ? 0.0033 : 0.0023) * S * nodeScale;
      const alpha = baseAlpha * (isPrimaryStep ? 0.92 : 0.68);

      for (let i = 0; i < N; i++) {
        const aMid = ((i + 0.5 * step) * TAU) / N;
        const ca = Math.cos(aMid);
        const sa = Math.sin(aMid);

        drawGlowingNode(ca * rOuter, sa * rOuter, rad, COLORS.white, haloRgb, alpha);
        if (rInner > 0.008 * S && step < maxStep) {
          drawGlowingNode(ca * rInner, sa * rInner, rad * 0.85, COLORS.white, haloRgb, alpha * 0.85);
        }
      }
    }
  }
}

window.renderFrame = function(t) {
  const W = canvas.width;
  const H = canvas.height;
  const S = Math.min(W, H);
  const cx = 0.5 * W;
  const cy = 0.5 * H;

  // Deterministic state reset
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.setLineDash([]);
  ctx.lineWidth = 1;

  // Background Mode Handling
  if (BG === 'alpha') {
    ctx.clearRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
  }

  const phase = (((t % window.DURATION) + window.DURATION) % window.DURATION) / window.DURATION;

  // Seamless Loop Periodic Harmonics
  // Primary (k = 1, 2): Whole-turn rotation, sacred circle radius & center-distance breathing
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sinB = Math.sin(TAU * phase * CFG.breathK);
  const cosB = Math.cos(TAU * phase * CFG.breathK);

  // Secondary (k = 3, 5): Counter-rotating secondary circle ring & harmonic octagram pulse
  const sinSec = Math.sin(TAU * phase * CFG.secK);
  const cosSec = Math.cos(TAU * phase * CFG.secK);

  // Ambient (k = 4, 7): Node twinkling & halo pulse
  const sin4 = Math.sin(TAU * phase * 4);
  const sin7 = Math.sin(TAU * phase * 7);

  // Subject occupies ~70% of shorter canvas side S (outer radius = 0.352 * S)
  const maxMandalaR = 0.352 * S;
  const innerRimR   = 0.324 * S;

  // Animated radii and center distances for the 3 concentric rotating circle rings
  const D1 = (CFG.d1 + CFG.d1Amp * sinB) * S;
  const R1 = (CFG.r1 - CFG.d1Amp * 0.55 * sinB) * S;

  const D2 = (CFG.d2 + CFG.d2Amp * cosSec) * S;
  const R2 = (CFG.r2 - CFG.d2Amp * 0.50 * cosSec) * S;

  const D3 = (CFG.d3 + 0.012 * sin4) * S;
  const R3 = (CFG.r3 + 0.010 * cosB) * S;

  // =========================================================================
  // 1. SOFT CONTAINED CENTRAL HALO (Alpha radial gradient reaching 0 inside safe bounds)
  // =========================================================================
  ctx.save();
  const haloR = maxMandalaR * (1.06 + 0.03 * sin4);
  const bgHalo = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
  const haloAlpha = 0.12 + 0.03 * sinB;
  bgHalo.addColorStop(0.0, rgba(COLORS.accent, haloAlpha));
  bgHalo.addColorStop(0.38, rgba(COLORS.accentDeep, haloAlpha * 0.55));
  bgHalo.addColorStop(0.74, rgba(COLORS.guide, haloAlpha * 0.18));
  bgHalo.addColorStop(1.0, rgba(COLORS.guide, 0.0));
  ctx.fillStyle = bgHalo;
  ctx.beginPath();
  ctx.arc(cx, cy, haloR, 0, TAU);
  ctx.fill();
  ctx.restore();

  // =========================================================================
  // 2. FAINT SCIENTIFIC & SACRED CONSTRUCTION GEOMETRY (Outer Astrolabe & 16 Radial Axes)
  // =========================================================================
  ctx.save();
  ctx.translate(cx, cy);

  // Outer Graduated Astrolabe Reference Ring (rotates slowly via whole-turn rotation)
  ctx.save();
  ctx.rotate(TAU * 1 * phase);

  ctx.strokeStyle = rgba(COLORS.guide, 0.26);
  ctx.lineWidth = 0.0008 * S;
  ctx.beginPath();
  ctx.arc(0, 0, maxMandalaR, 0, TAU);
  ctx.arc(0, 0, innerRimR, 0, TAU);
  ctx.stroke();

  // 128 Precision Degree Ticks around the 8-fold outer perimeter
  const numTicks = 128;
  ctx.strokeStyle = rgba(COLORS.silver, 0.32);
  ctx.lineWidth = 0.0008 * S;
  ctx.beginPath();
  for (let i = 0; i < numTicks; i++) {
    const a = (i / numTicks) * TAU;
    const isOctant = (i % 16 === 0);
    const isHalfOctant = (i % 8 === 0);
    const tLen = (isOctant ? 0.015 : (isHalfOctant ? 0.009 : 0.004)) * S;
    ctx.moveTo(Math.cos(a) * (maxMandalaR - tLen), Math.sin(a) * (maxMandalaR - tLen));
    ctx.lineTo(Math.cos(a) * maxMandalaR, Math.sin(a) * maxMandalaR);
  }
  ctx.stroke();

  // 16 Faint Radial Symmetry Axes
  ctx.strokeStyle = rgba(COLORS.guide, 0.16);
  ctx.lineWidth = 0.0006 * S;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    ctx.moveTo(Math.cos(a) * (0.02 * S), Math.sin(a) * (0.02 * S));
    ctx.lineTo(Math.cos(a) * innerRimR, Math.sin(a) * innerRimR);
  }
  ctx.stroke();

  // Dashed Envelope & Locus Reference Circles (Locus of circle centers at D1, D2, and outer tangent D1+R1)
  ctx.save();
  ctx.setLineDash([0.005 * S, 0.005 * S]);
  ctx.strokeStyle = rgba(COLORS.silver, 0.24);
  ctx.lineWidth = 0.0007 * S;
  ctx.beginPath();
  ctx.arc(0, 0, D1, 0, TAU);
  ctx.arc(0, 0, D2, 0, TAU);
  ctx.arc(0, 0, D1 + R1, 0, TAU);
  ctx.stroke();
  ctx.restore();

  ctx.restore(); // End outer construction ring rotation

  // =========================================================================
  // 3. SECONDARY LAYER: COUNTER-ROTATING 8-FOLD OUTER CIRCLE RING & OCTAGRAM
  // Uses whole-turn counter-rotation: ctx.rotate(-TAU * 1 * phase)
  // =========================================================================
  ctx.save();
  ctx.rotate(-TAU * 1 * phase);

  // Inscribed {8/2} (Two interlocked squares) connecting the outer tangent points at D2 + R2
  const rOctOuter = Math.min(innerRimR * 0.96, D2 + R2);
  for (let sq = 0; sq < 2; sq++) {
    const aOffset = (sq * Math.PI) / 4;
    strokeGlowingPath(() => {
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = aOffset + (k * Math.PI) / 2;
        const px = Math.cos(a) * rOctOuter;
        const py = Math.sin(a) * rOctOuter;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }, 0.0011 * S, COLORS.silver, 0.36, 1);
  }

  // Draw the 8 (or 16 if subDiv === 2) Counter-Rotating Sacred Circles of Ring 2
  const count2 = 8 * CFG.subDiv;
  for (let i = 0; i < count2; i++) {
    const a = (i * TAU) / count2;
    const isMain8 = (i % CFG.subDiv === 0);
    const cx2 = Math.cos(a) * D2;
    const cy2 = Math.sin(a) * D2;

    const col = isMain8 ? COLORS.accentSoft : COLORS.silver;
    const lw = (isMain8 ? 0.0014 : 0.0009) * S;
    const alpha = isMain8 ? (0.58 + 0.14 * sinSec) : 0.30;

    strokeGlowingPath(() => {
      ctx.beginPath();
      ctx.arc(cx2, cy2, R2, 0, TAU);
    }, lw, col, alpha, isMain8 ? 2 : 1);

    // Center pivot dot for each main circle in Ring 2
    if (isMain8) {
      drawGlowingNode(cx2, cy2, 0.0028 * S, COLORS.white, COLORS.accent, 0.78);
    }
  }

  // Analytical vesica piscis intersection nodes of Ring 2
  drawSymmetricRingIntersections(8, D2, R2, S, 0.85, COLORS.accentSoft, 0.75);

  ctx.restore(); // End Secondary Layer counter-rotation

  // =========================================================================
  // 4. PRIMARY LAYER: 8-FOLD FLOWER OF LIFE / TORUS ROSETTE OF ROTATING CIRCLES
  // Uses whole-turn clockwise rotation: ctx.rotate(TAU * 1 * phase)
  // =========================================================================
  ctx.save();
  ctx.rotate(TAU * 1 * phase);

  // Inscribed {8 / starStep} Sacred Octagram connecting the 8 primary circle centers & apices
  const rApex1 = D1 + R1;
  strokeGlowingPath(() => {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a0 = (i * TAU) / 8;
      const a1 = ((i + CFG.starStep) * TAU) / 8;
      ctx.moveTo(Math.cos(a0) * rApex1, Math.sin(a0) * rApex1);
      ctx.lineTo(Math.cos(a1) * rApex1, Math.sin(a1) * rApex1);
    }
  }, 0.0013 * S, COLORS.accent, 0.48 + 0.15 * cosB, 2);

  // If subDiv === 2, draw the 8 intermediate silver torus circles at half-angles first
  if (CFG.subDiv === 2) {
    const traceSubCircles = () => {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = ((i + 0.5) * TAU) / 8;
        const scx = Math.cos(a) * D1;
        const scy = Math.sin(a) * D1;
        ctx.moveTo(scx + R1, scy);
        ctx.arc(scx, scy, R1, 0, TAU);
      }
    };
    strokeGlowingPath(traceSubCircles, 0.0011 * S, COLORS.silver, 0.42, 1);
  }

  // Draw the 8 Primary Sacred Circles of Ring 1 (Alternating Crisp White & Luminous Gold)
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8;
    const c1x = Math.cos(a) * D1;
    const c1y = Math.sin(a) * D1;
    const isGold = (i % 2 === 0);

    const col = isGold ? COLORS.accent : COLORS.white;
    const lw = (isGold ? 0.0022 : 0.0019) * S;

    strokeGlowingPath(() => {
      ctx.beginPath();
      ctx.arc(c1x, c1y, R1, 0, TAU);
    }, lw, col, 0.90, 3);

    // Radial construction spoke from origin through circle center to outer apex
    ctx.strokeStyle = rgba(COLORS.silver, 0.28);
    ctx.lineWidth = 0.0008 * S;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * rApex1, Math.sin(a) * rApex1);
    ctx.stroke();

    // Bright node at each of the 8 circle centers and 8 outer tangent apices
    const pulseNode = 0.85 + 0.15 * Math.sin(TAU * phase * 4 + i * (TAU / 8));
    drawGlowingNode(c1x, c1y, 0.0038 * S * pulseNode, COLORS.white, COLORS.accent, 0.92);
    drawGlowingNode(
      Math.cos(a) * rApex1,
      Math.sin(a) * rApex1,
      0.0042 * S * pulseNode,
      COLORS.white,
      isGold ? COLORS.accent : COLORS.silver,
      0.95
    );
  }

  // Analytical Vesica Piscis Intersection Nodes for the 8 Primary Circles
  drawSymmetricRingIntersections(8, D1, R1, S, 1.05, COLORS.accent, 0.92);

  // =========================================================================
  // 5. TRAVELING PULSES GLIDING ALONG THE ROTATING CIRCLES
  // Uses seamless recipe #6: position = fract(s0 + m * phase)
  // =========================================================================
  for (let i = 0; i < NUM_PULSES; i++) {
    const p = CIRCLE_PULSES[i];
    const pos = (((p.s0 + p.speed * phase) % 1.0) + 1.0) % 1.0;
    const localAngle = pos * TAU;

    const aCenter = (p.circleIdx * TAU) / 8;
    const dRing = (p.ringType === 1) ? D1 : D2;
    const rRing = (p.ringType === 1) ? R1 : R2;

    const px = Math.cos(aCenter) * dRing + Math.cos(localAngle) * rRing;
    const py = Math.sin(aCenter) * dRing + Math.sin(localAngle) * rRing;

    const twinkle = 0.50 + 0.50 * (0.5 + 0.5 * Math.sin(TAU * phase * p.twinkleFreq + p.twinklePhase));
    drawGlowingNode(
      px,
      py,
      0.0028 * S * (0.75 + 0.45 * twinkle),
      COLORS.white,
      p.isAccent ? COLORS.accent : COLORS.silver,
      twinkle * 0.90
    );
  }

  ctx.restore(); // End Primary Layer rotation

  // =========================================================================
  // 6. INNER SEED OF LIFE ROSETTE & CENTRAL FOCAL CORE (+2 whole turns per loop)
  // =========================================================================
  ctx.save();
  ctx.rotate(TAU * 2 * phase);

  const traceInnerSeed = () => {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * TAU) / 8;
      const icx = Math.cos(a) * D3;
      const icy = Math.sin(a) * D3;
      ctx.moveTo(icx + R3, icy);
      ctx.arc(icx, icy, R3, 0, TAU);
    }
  };
  strokeGlowingPath(traceInnerSeed, 0.0014 * S, COLORS.accentSoft, 0.68, 2);

  // Inner Seed intersection nodes
  drawSymmetricRingIntersections(8, D3, R3, S, 0.80, COLORS.accent, 0.85);

  // Outer Framing Ring around the entire 8-fold Mandala
  strokeGlowingPath(() => {
    ctx.beginPath();
    ctx.arc(0, 0, innerRimR, 0, TAU);
  }, 0.0018 * S, COLORS.white, 0.82, 2);

  // 8 Cardinal & Ordinal Bezel Nodes on the Outer Framing Ring
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8;
    drawGlowingNode(
      Math.cos(a) * innerRimR,
      Math.sin(a) * innerRimR,
      0.0036 * S,
      COLORS.white,
      COLORS.accent,
      0.90
    );
  }

  // High-Contrast Central Focal Hub at (0, 0) (Ensures instant readability at 180px thumbnail)
  const centerPulse = 1.0 + 0.14 * sin4 + 0.06 * sin7;
  strokeGlowingPath(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 0.022 * S * centerPulse, 0, TAU);
  }, 0.0016 * S, COLORS.white, 0.92, 2);

  drawGlowingNode(0, 0, 0.0072 * S * centerPulse, COLORS.white, COLORS.accent, 1.0);

  ctx.restore(); // End Inner Core rotation
  ctx.restore(); // End center translate
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
