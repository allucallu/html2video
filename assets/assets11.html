<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Heart Outline Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_CORAL = '#FF6B6B';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(274918);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom spline interpolation through hand-drawn waypoints with marker width variation (14-22px)
function buildHandDrawnSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn organic imperfection along the curve
    const wobbleX = Math.sin(u * 36 + seedPhase) * 2.5 + Math.cos(u * 21 - seedPhase) * 1.6;
    const wobbleY = Math.cos(u * 34 + seedPhase) * 2.5 + Math.sin(u * 25 + seedPhase) * 1.6;

    // Marker pressure variation (14-22px), tapering slightly at start and end tips
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * 3.5 + seedPhase);
    let taper = 1.0;
    if (u < 0.035) taper = 0.65 + 0.35 * (u / 0.035);
    else if (u > 0.96) taper = 0.62 + 0.38 * ((1 - u) / 0.04);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + wobbleX,
      y: y + wobbleY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// ============================================================================
// 1. PRIMARY HERO WHITE MARKER HEART OUTLINE (With expressive double-pass top cleft & tail)
// Centered around (CX, CY), safe margins: X in [-560, +560], Y in [-490, +520]
// ============================================================================
const mainHeartWaypoints = [
  { x: 35,   y: -155 }, // Start lead-in just inside top cleft
  { x: -2,   y: -215 }, // Top center cleft
  { x: -95,  y: -365 },
  { x: -255, y: -445 }, // Upper-left lobe peak
  { x: -425, y: -375 },
  { x: -485, y: -195 }, // Leftmost cheek
  { x: -425, y: 15 },
  { x: -245, y: 235 },
  { x: -8,   y: 445 },  // Bottom sharp apex of the heart
  { x: 225,  y: 225 },
  { x: 415,  y: 5 },
  { x: 478,  y: -205 }, // Rightmost cheek
  { x: 415,  y: -385 },
  { x: 245,  y: -452 }, // Upper-right lobe peak
  { x: 88,   y: -368 },
  { x: -2,   y: -212 }, // Back to top center cleft
  { x: -75,  y: -315 }, // Sketchy hand-drawn overshoot into left lobe
  { x: -195, y: -385 }
];
const MAIN_HEART_OUTLINE = buildHandDrawnSpline(mainHeartWaypoints, 250, 16, 22, 0, 0.5);

// 2. SECONDARY SKETCHY WHITE INNER SHINE ARC & DOUBLE-LINE CONTOUR
const innerShineWaypoints = [
  { x: -215, y: -345 },
  { x: -335, y: -285 },
  { x: -378, y: -155 },
  { x: -335, y: -25 }
];
const INNER_SHINE_ARC = buildHandDrawnSpline(innerShineWaypoints, 64, 15, 20, 260, 1.9);

// 3. SECONDARY MATTE CORAL (#FF6B6B) OFFSET HEART OUTLINE (Overlapping delayed follow-through)
const coralHeartWaypoints = [
  { x: 8,    y: -192 },
  { x: -85,  y: -342 },
  { x: -242, y: -418 },
  { x: -398, y: -352 },
  { x: -455, y: -182 },
  { x: -395, y: 25 },
  { x: -222, y: 242 },
  { x: 12,   y: 468 },  // Slightly offset below/right of the white heart tip
  { x: 245,  y: 245 },
  { x: 438,  y: 22 },
  { x: 502,  y: -192 },
  { x: 438,  y: -368 },
  { x: 262,  y: -432 },
  { x: 102,  y: -348 },
  { x: 8,    y: -195 }
];
const CORAL_HEART_OUTLINE = buildHandDrawnSpline(coralHeartWaypoints, 210, 15, 20, 110, 3.4);

// ============================================================================
// 4. SMALL HAND-DRAWN SPARKLE TICKS AROUND THE HEART OUTLINE
// Radiating marker tick dashes & 4-stroke cross-sparkle ticks
// ============================================================================
const SPARKLE_TICKS = [
  // Upper-Left Lobe Radiating Sparkle Ticks
  {
    pts: buildHandDrawnSpline([
      { x: -535, y: -365 }, { x: -598, y: -408 }, { x: -662, y: -448 }
    ], 28, 15, 21, 330, 0.4),
    color: COLOR_CORAL,
    phaseOff: 0.46
  },
  {
    pts: buildHandDrawnSpline([
      { x: -575, y: -235 }, { x: -652, y: -248 }, { x: -728, y: -258 }
    ], 28, 16, 21, 340, 1.1),
    color: COLOR_WHITE,
    phaseOff: 0.49
  },
  {
    pts: buildHandDrawnSpline([
      { x: -395, y: -495 }, { x: -428, y: -568 }, { x: -458, y: -638 }
    ], 28, 15, 20, 350, 1.8),
    color: COLOR_WHITE,
    phaseOff: 0.52
  },
  // Upper-Right Lobe Radiating Sparkle Ticks
  {
    pts: buildHandDrawnSpline([
      { x: 528, y: -375 }, { x: 592, y: -418 }, { x: 655, y: -458 }
    ], 28, 16, 21, 360, 2.5),
    color: COLOR_WHITE,
    phaseOff: 0.47
  },
  {
    pts: buildHandDrawnSpline([
      { x: 568, y: -242 }, { x: 645, y: -255 }, { x: 722, y: -265 }
    ], 28, 15, 20, 370, 3.2),
    color: COLOR_CORAL,
    phaseOff: 0.50
  },
  {
    pts: buildHandDrawnSpline([
      { x: 385, y: -505 }, { x: 418, y: -578 }, { x: 448, y: -648 }
    ], 28, 15, 20, 380, 3.9),
    color: COLOR_CORAL,
    phaseOff: 0.53
  },
  // Lower-Left & Lower-Right Cheek Sparkle Ticks
  {
    pts: buildHandDrawnSpline([
      { x: -515, y: 75 }, { x: -585, y: 112 }, { x: -652, y: 148 }
    ], 26, 15, 19, 390, 4.6),
    color: COLOR_CORAL,
    phaseOff: 0.54
  },
  {
    pts: buildHandDrawnSpline([
      { x: 515, y: 68 }, { x: 585, y: 105 }, { x: 652, y: 142 }
    ], 26, 15, 19, 400, 5.3),
    color: COLOR_WHITE,
    phaseOff: 0.55
  },
  // Bottom Tip Accent Ticks
  {
    pts: buildHandDrawnSpline([
      { x: -95, y: 515 }, { x: -125, y: 582 }, { x: -155, y: 645 }
    ], 26, 15, 20, 410, 0.9),
    color: COLOR_WHITE,
    phaseOff: 0.48
  },
  {
    pts: buildHandDrawnSpline([
      { x: 95, y: 515 }, { x: 125, y: 582 }, { x: 155, y: 645 }
    ], 26, 15, 20, 420, 1.6),
    color: COLOR_CORAL,
    phaseOff: 0.51
  }
];

// 5. AMBIENT 4-POINT SPARKLE CROSS-TICKS (Beside the heart lobes)
const SPARKLE_STARS = [
  { x: -685, y: -65,  size: 42, ang: 0.12,  color: COLOR_WHITE, phaseOff: 0.48, slot: 440 },
  { x: 685,  y: -75,  size: 44, ang: -0.15, color: COLOR_CORAL, phaseOff: 0.52, slot: 450 },
  { x: 0,    y: -555, size: 38, ang: 0.08,  color: COLOR_CORAL, phaseOff: 0.45, slot: 460 },
  { x: -385, y: 395,  size: 34, ang: 0.35,  color: COLOR_WHITE, phaseOff: 0.18, slot: 470 },
  { x: 395,  y: 385,  size: 36, ang: -0.28, color: COLOR_CORAL, phaseOff: 0.24, slot: 480 }
];

// Progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.36]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.36, 0.64]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.64, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.36) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.36) };
  } else if (c < 0.64) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.64) / 0.32), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker stroke between [uStart, uEnd] with discrete 12fps line boil & radial heartbeat pulse
function renderMarkerPath(pts, uStart, uEnd, color, boilStep, radialExpand) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Radial expansion along vector from center during heartbeat pulse
    const dist = Math.hypot(p.x, p.y) || 1;
    const rx = (p.x / dist) * radialExpand;
    const ry = (p.y / dist) * radialExpand;

    return {
      x: p.x + bx + rx,
      y: p.y + by + ry,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// Render 4-stroke hand-drawn sparkle cross-ticks beside the heart
function renderSparkleCrossTicks(baseCycle, boilStep) {
  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < SPARKLE_STARS.length; i++) {
    const st = SPARKLE_STARS[i];
    const win = getDrawEraseWindow(baseCycle + st.phaseOff);
    if (win.uEnd - win.uStart <= 0.02) continue;

    const bx = boilRowX[st.slot];
    const by = boilRowY[st.slot];
    const cx = st.x + bx;
    const cy = st.y + by;

    ctx.strokeStyle = st.color;

    // 2 main long orthogonal sparkle ticks + 2 shorter diagonal ticks
    const axes = [
      { a: 0, len: st.size, w: 16 },
      { a: Math.PI * 0.5, len: st.size * 1.15, w: 16 },
      { a: Math.PI * 0.25, len: st.size * 0.58, w: 14 },
      { a: Math.PI * 0.75, len: st.size * 0.58, w: 14 }
    ];

    for (let k = 0; k < axes.length; k++) {
      const ax = axes[k];
      const ang = st.ang + ax.a;
      const l0 = -ax.len + win.uStart * (2 * ax.len);
      const l1 = -ax.len + win.uEnd * (2 * ax.len);
      ctx.lineWidth = ax.w;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * l0, cy + Math.sin(ang) * l0);
      ctx.lineTo(cx + Math.cos(ang) * l1, cy + Math.sin(ang) * l1);
      ctx.stroke();
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Primary Motion: Playful Heartbeat Squash & Stretch, gentle bounce, and rocking sway (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  // Lub-dub double-harmonic heartbeat pulse
  const beatPulse = 0.022 * sin2 + 0.014 * sin4;
  const scaleX = 1.0 + beatPulse;
  const scaleY = 1.0 - beatPulse * 0.75;
  const swayRot = 0.038 * sin1 + 0.020 * cos2;
  const bobX = 10 * cos1;
  const bobY = 15 * sin2;

  ctx.save();
  ctx.translate(CX + bobX, CY + bobY);
  ctx.rotate(swayRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 the Hero White Heart Outline + its main sparkle ticks
  // are in their FULL held state, while the Secondary Coral Heart Outline overlaps with delayed follow-through:
  const baseCycle = phase * 2;

  const winMainWhite  = getDrawEraseWindow(baseCycle + 0.50);
  const winInnerShine = getDrawEraseWindow(baseCycle + 0.45);
  const winCoralHeart = getDrawEraseWindow(baseCycle + 0.16);

  // 1. Secondary Motion Layer: Matte Coral (#FF6B6B) Offset Heart Outline
  renderMarkerPath(
    CORAL_HEART_OUTLINE,
    winCoralHeart.uStart,
    winCoralHeart.uEnd,
    COLOR_CORAL,
    boilStep,
    12 * sin2
  );

  // 2. Primary Motion Layer: Hero Bold White Marker Heart Outline & Inner Lobe Shine Curve
  renderMarkerPath(
    MAIN_HEART_OUTLINE,
    winMainWhite.uStart,
    winMainWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    8 * sin2
  );
  renderMarkerPath(
    INNER_SHINE_ARC,
    winInnerShine.uStart,
    winInnerShine.uEnd,
    COLOR_WHITE,
    boilStep,
    6 * sin2
  );

  // 3. Secondary Motion Layer: Radiating Small Sparkle Ticks around the Heart
  for (let i = 0; i < SPARKLE_TICKS.length; i++) {
    const tk = SPARKLE_TICKS[i];
    const winTick = getDrawEraseWindow(baseCycle + tk.phaseOff);
    renderMarkerPath(
      tk.pts,
      winTick.uStart,
      winTick.uEnd,
      tk.color,
      boilStep,
      16 * sin2
    );
  }

  // 4. Ambient Motion Layer: 4-Stroke Hand-Drawn Sparkle Cross-Ticks beside the Heart
  renderSparkleCrossTicks(baseCycle, boilStep);

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
