<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism 03: E-Commerce Flash Promo & Green Screen Frame - 6s Loop</title>
  <style>
    :root {
      --bg-base: #F6F2E9;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --electric-purple: #C084FC;
      --acid-lime: #A3E635;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --white: #FFFFFF;
      --chroma-green: #00FF00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua durasi sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Bingkai Utama Berdenyut Halus & Tegas (6s) */
    .hero-frame-bob {
      animation: framePulse 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes framePulse {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-4px, -6px); }
    }

    /* 2. Pita Panah Marquee Berjalan Kontinu (3s) */
    .ticker-move-right {
      animation: slideRight 3s linear infinite;
    }
    .ticker-move-left {
      animation: slideLeft 3s linear infinite;
    }
    @keyframes slideRight {
      from { transform: translateX(-160px); }
      to { transform: translateX(0px); }
    }
    @keyframes slideLeft {
      from { transform: translateX(0px); }
      to { transform: translateX(-160px); }
    }

    /* 3. Bintang Bergerigi (%) Kiri Atas Berputar & Membal (6s & 3s) */
    .starburst-spin {
      animation: spinStep 6s steps(12, end) infinite;
    }
    @keyframes spinStep {
      to { transform: rotate(360deg); }
    }

    .badge-pop-1 {
      animation: popBeat1 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popBeat1 {
      0%, 100% { transform: scale(1) rotate(-6deg); }
      25% { transform: scale(1.14) rotate(4deg); }
      50% { transform: scale(0.96) rotate(-4deg); }
      75% { transform: scale(1.1) rotate(2deg); }
    }

    /* 4. Tas Belanja Kanan Atas Membal Bergantian (3s) */
    .badge-pop-2 {
      animation: popBeat2 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popBeat2 {
      0%, 100% { transform: scale(1) rotate(6deg); }
      25% { transform: scale(0.95) rotate(2deg); }
      50% { transform: scale(1.14) rotate(-4deg); }
      75% { transform: scale(0.98) rotate(5deg); }
    }

    /* 5. Label Harga Kiri Bawah Mengayun Cepat (3s) */
    .tag-swing {
      animation: swingTag 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes swingTag {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      35% { transform: rotate(6deg) scale(1.08); }
      70% { transform: rotate(-14deg) scale(1.04); }
    }

    /* 6. Tiket Flash Deal Kanan Bawah Berdenyut (1.5s = 4x per loop) */
    .flash-ticket-beat {
      animation: flashPulse 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes flashPulse {
      0%, 100% { transform: scale(1) rotate(5deg); }
      45% { transform: scale(1.12) rotate(2deg); }
    }

    /* 7. Lencana Status Pojok Kanan Atas Bingkai Menyala (3s) */
    .promo-pill-blink {
      animation: blinkPill 3s ease-in-out infinite;
    }
    @keyframes blinkPill {
      0%, 100% { fill: var(--hot-pink); }
      50% { fill: var(--acid-lime); }
    }
  </style>
</head>
