<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Question & Exclamation Mark Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(482719);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom spline interpolation through hand-drawn waypoints with marker width variation (14-22px)
function buildHandDrawnSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn organic imperfection along the stroke
    const wobbleX = Math.sin(u * 35 + seedPhase) * 2.4 + Math.cos(u * 21 - seedPhase) * 1.5;
    const wobbleY = Math.cos(u * 33 + seedPhase) * 2.4 + Math.sin(u * 25 + seedPhase) * 1.5;

    // Marker pressure variation (14-22px), tapering slightly at start and end tips
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * 3.2 + seedPhase);
    let taper = 1.0;
    if (u < 0.04) taper = 0.66 + 0.34 * (u / 0.04);
    else if (u > 0.95) taper = 0.64 + 0.36 * ((1 - u) / 0.05);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + wobbleX,
      y: y + wobbleY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// Helper: Build a hand-scribbled circular marker dot (2.2-turn tight spiral loop)
function buildScribbleDot(cx, cy, radius, minW, maxW, boilOffset, seedPhase) {
  const wps = [];
  const steps = 14;
  const turns = 2.15;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const a = seedPhase + u * turns * TAU;
    const r = radius * (0.45 + 0.55 * Math.sin(u * Math.PI * 0.85 + 0.2)) + (rand() - 0.5) * 6;
    wps.push({
      x: cx + Math.cos(a) * r,
      y: cy + Math.sin(a) * r
    });
  }
  return buildHandDrawnSpline(wps, 56, minW, maxW, boilOffset, seedPhase);
}

// ============================================================================
// 1. LEFT CHARACTER: HAND-DRAWN QUESTION MARK (?)
// Local coordinates centered around (-255, 0)
// ============================================================================
// Main White Question Mark Hook & Stem (Double-pass sketchy loop at top arch)
const qMainWaypoints = [
  { x: -375, y: -185 }, // Inner curl tip
  { x: -425, y: -235 },
  { x: -435, y: -345 },
  { x: -345, y: -455 },
  { x: -195, y: -468 }, // Top arch crest
  { x: -65,  y: -385 },
  { x: -42,  y: -245 }, // Right cheek of ?
  { x: -115, y: -125 },
  { x: -205, y: -25 },  // Inward bend to vertical stem
  { x: -218, y: 95 },
  { x: -212, y: 198 },  // Bottom of ? stem, loops slightly back up for chunky doodle feel
  { x: -178, y: 125 },
  { x: -168, y: -5 },
  { x: -82,  y: -115 },
  { x: -12,  y: -245 },
  { x: -42,  y: -395 },
  { x: -185, y: -492 },
  { x: -355, y: -475 },
  { x: -455, y: -355 }
];
const Q_MAIN_WHITE = buildHandDrawnSpline(qMainWaypoints, 220, 16, 22, 0, 0.4);

// Question Mark Bottom Dot (White)
const Q_DOT_WHITE = buildScribbleDot(-202, 365, 42, 16, 22, 230, 0.8);

// Secondary Warm Yellow (#FFD93D) Offset Question Mark Accent
const qYellowWaypoints = [
  { x: -395, y: -215 },
  { x: -412, y: -335 },
  { x: -325, y: -435 },
  { x: -182, y: -445 },
  { x: -72,  y: -362 },
  { x: -58,  y: -235 },
  { x: -135, y: -115 },
  { x: -225, y: -15 },
  { x: -235, y: 115 },
  { x: -228, y: 215 }
];
const Q_ACCENT_YELLOW = buildHandDrawnSpline(qYellowWaypoints, 140, 15, 20, 110, 2.2);
const Q_DOT_YELLOW    = buildScribbleDot(-185, 382, 38, 15, 20, 290, 2.9);

// ============================================================================
// 2. RIGHT CHARACTER: HAND-DRAWN EXCLAMATION MARK (!)
// Local coordinates centered around (+255, 0)
// ============================================================================
// Main White Exclamation Mark Stem (Hand-sketched tapered loop + inner spine)
const exMainWaypoints = [
  { x: 255, y: -455 }, // Top center-left start
  { x: 222, y: -425 },
  { x: 208, y: -245 },
  { x: 205, y: -45 },
  { x: 208, y: 145 },
  { x: 222, y: 198 },  // Bottom tapered tip of ! stem
  { x: 248, y: 152 },
  { x: 278, y: -35 },
  { x: 305, y: -245 },
  { x: 318, y: -415 }, // Top right corner
  { x: 272, y: -468 }, // Top rounded cap
  { x: 225, y: -435 },
  { x: 262, y: -385 }, // Inner marker spine slash down the middle
  { x: 248, y: -165 },
  { x: 232, y: 65 }
];
const EX_MAIN_WHITE = buildHandDrawnSpline(exMainWaypoints, 200, 16, 22, 320, 1.5);

// Exclamation Mark Bottom Dot (White)
const EX_DOT_WHITE = buildScribbleDot(215, 365, 42, 16, 22, 410, 3.7);

// Secondary Warm Yellow (#FFD93D) Offset Exclamation Mark Accent
const exYellowWaypoints = [
  { x: 245, y: -438 },
  { x: 232, y: -225 },
  { x: 225, y: 15 },
  { x: 235, y: 215 },
  { x: 268, y: 165 },
  { x: 302, y: -25 },
  { x: 335, y: -235 },
  { x: 342, y: -405 },
  { x: 285, y: -452 }
];
const EX_ACCENT_YELLOW = buildHandDrawnSpline(exYellowWaypoints, 140, 15, 20, 360, 4.4);
const EX_DOT_YELLOW    = buildScribbleDot(235, 382, 38, 15, 20, 450, 5.1);

// ============================================================================
// 3. AMBIENT RADIATING EMPHASIS TICKS, SHOCK ARCS & DOODLE STARS AROUND ?!
// ============================================================================
const AMBIENT_TICKS = [
  // Above & left of the Question Mark (?)
  {
    pts: buildHandDrawnSpline([
      { x: -515, y: -425 }, { x: -578, y: -468 }, { x: -642, y: -508 }
    ], 26, 15, 20, 460, 0.6),
    color: COLOR_YELLOW,
    phaseOff: 0.46,
    side: -1
  },
  {
    pts: buildHandDrawnSpline([
      { x: -545, y: -265 }, { x: -618, y: -275 }, { x: -692, y: -282 }
    ], 26, 15, 20, 468, 1.3),
    color: COLOR_WHITE,
    phaseOff: 0.49,
    side: -1
  },
  {
    pts: buildHandDrawnSpline([
      { x: -265, y: -555 }, { x: -285, y: -625 }, { x: -305, y: -692 }
    ], 26, 15, 20, 476, 2.0),
    color: COLOR_WHITE,
    phaseOff: 0.52,
    side: -1
  },
  // Above & right of the Exclamation Mark (!)
  {
    pts: buildHandDrawnSpline([
      { x: 395, y: -475 }, { x: 455, y: -528 }, { x: 515, y: -578 }
    ], 26, 16, 21, 484, 2.7),
    color: COLOR_YELLOW,
    phaseOff: 0.47,
    side: 1
  },
  {
    pts: buildHandDrawnSpline([
      { x: 415, y: -315 }, { x: 488, y: -332 }, { x: 562, y: -348 }
    ], 26, 15, 20, 492, 3.4),
    color: COLOR_WHITE,
    phaseOff: 0.50,
    side: 1
  },
  {
    pts: buildHandDrawnSpline([
      { x: 275, y: -545 }, { x: 292, y: -618 }, { x: 312, y: -688 }
    ], 26, 15, 20, 498, 4.1),
    color: COLOR_YELLOW,
    phaseOff: 0.53,
    side: 1
  },
  // Lower emphasis ticks near the two bottom dots
  {
    pts: buildHandDrawnSpline([
      { x: -325, y: 415 }, { x: -388, y: 448 }, { x: -448, y: 482 }
    ], 24, 15, 19, 502, 4.8),
    color: COLOR_YELLOW,
    phaseOff: 0.51,
    side: -1
  },
  {
    pts: buildHandDrawnSpline([
      { x: 335, y: 415 }, { x: 398, y: 448 }, { x: 458, y: 482 }
    ], 24, 15, 19, 506, 5.5),
    color: COLOR_WHITE,
    phaseOff: 0.54,
    side: 1
  }
];

// Progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.35]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.35, 0.65]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.65, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.35) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.35) };
  } else if (c < 0.65) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.65) / 0.31), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker stroke between [uStart, uEnd] with discrete 12fps line boil & custom offset
function renderMarkerPath(pts, uStart, uEnd, color, boilStep, offsetX, offsetY) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    return {
      x: p.x + bx + offsetX,
      y: p.y + by + offsetY,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Periodic Harmonic Waves (Integer cycles per 10s loop: k = 1, 2, 4)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 both the Question Mark (?) and Exclamation Mark (!)
  // (stems + bottom dots + main beside-ticks) are in their FULL held state, then sequentially erase and redraw!
  const baseCycle = phase * 2;

  // Question Mark (?) Windows
  const winQMain      = getDrawEraseWindow(baseCycle + 0.52);
  const winQDotWhite  = getDrawEraseWindow(baseCycle + 0.48);
  const winQYellow    = getDrawEraseWindow(baseCycle + 0.16);
  const winQDotYellow = getDrawEraseWindow(baseCycle + 0.12);

  // Exclamation Mark (!) Windows (Slightly staggered after ? for playful one-two rhythm)
  const winExMain      = getDrawEraseWindow(baseCycle + 0.46);
  const winExDotWhite  = getDrawEraseWindow(baseCycle + 0.42);
  const winExYellow    = getDrawEraseWindow(baseCycle + 0.08);
  const winExDotYellow = getDrawEraseWindow(baseCycle + 0.04);

  ctx.save();
  ctx.translate(CX, CY);

  // =========================================================================
  // 1. RENDER QUESTION MARK (?) WITH CURIOUS TILT & SPRINGY BOUNCE
  // =========================================================================
  ctx.save();
  const qPivotX = -205;
  const qPivotY = 120;
  const qTilt = -0.05 + 0.045 * sin1 + 0.025 * cos2;
  const qSquashX = 1.0 + 0.022 * sin2;
  const qStretchY = 1.0 - 0.022 * sin2;
  const qBounceY = 16 * sin2;
  // Secondary delayed follow-through on the bottom dot of ?
  const qDotLagY = 12 * Math.sin(TAU * (phase * 2 - 0.15));

  ctx.translate(qPivotX, qPivotY + qBounceY);
  ctx.rotate(qTilt);
  ctx.scale(qSquashX, qStretchY);
  ctx.translate(-qPivotX, -qPivotY);

  // Secondary Warm Yellow (#FFD93D) ? Stem & Dot
  renderMarkerPath(Q_ACCENT_YELLOW, winQYellow.uStart, winQYellow.uEnd, COLOR_YELLOW, boilStep, 0, 0);
  renderMarkerPath(Q_DOT_YELLOW, winQDotYellow.uStart, winQDotYellow.uEnd, COLOR_YELLOW, boilStep, 0, qDotLagY);

  // Primary White (#FFFFFF) ? Stem & Dot
  renderMarkerPath(Q_MAIN_WHITE, winQMain.uStart, winQMain.uEnd, COLOR_WHITE, boilStep, 0, 0);
  renderMarkerPath(Q_DOT_WHITE, winQDotWhite.uStart, winQDotWhite.uEnd, COLOR_WHITE, boilStep, 0, qDotLagY);
  ctx.restore();

  // =========================================================================
  // 2. RENDER EXCLAMATION MARK (!) WITH EXCITED HOP & SQUASH/STRETCH
  // =========================================================================
  ctx.save();
  const exPivotX = 225;
  const exPivotY = 120;
  const exTilt = 0.055 - 0.042 * cos1 + 0.028 * sin2;
  const exSquashX = 1.0 - 0.024 * cos2 + 0.010 * sin4;
  const exStretchY = 1.0 + 0.024 * cos2 - 0.010 * sin4;
  const exBounceY = -18 * cos2;
  // Secondary delayed follow-through on the bottom dot of !
  const exDotLagY = -14 * Math.cos(TAU * (phase * 2 - 0.15));

  ctx.translate(exPivotX, exPivotY + exBounceY);
  ctx.rotate(exTilt);
  ctx.scale(exSquashX, exStretchY);
  ctx.translate(-exPivotX, -exPivotY);

  // Secondary Warm Yellow (#FFD93D) ! Stem & Dot
  renderMarkerPath(EX_ACCENT_YELLOW, winExYellow.uStart, winExYellow.uEnd, COLOR_YELLOW, boilStep, 0, 0);
  renderMarkerPath(EX_DOT_YELLOW, winExDotYellow.uStart, winExDotYellow.uEnd, COLOR_YELLOW, boilStep, 0, exDotLagY);

  // Primary White (#FFFFFF) ! Stem & Dot
  renderMarkerPath(EX_MAIN_WHITE, winExMain.uStart, winExMain.uEnd, COLOR_WHITE, boilStep, 0, 0);
  renderMarkerPath(EX_DOT_WHITE, winExDotWhite.uStart, winExDotWhite.uEnd, COLOR_WHITE, boilStep, 0, exDotLagY);
  ctx.restore();

  // =========================================================================
  // 3. AMBIENT RADIATING EMPHASIS TICKS AROUND THE ?! PAIR
  // =========================================================================
  for (let i = 0; i < AMBIENT_TICKS.length; i++) {
    const tk = AMBIENT_TICKS[i];
    const winTick = getDrawEraseWindow(baseCycle + tk.phaseOff);
    const tickShiftY = tk.side === -1 ? (10 * sin2) : (-10 * cos2);
    renderMarkerPath(tk.pts, winTick.uStart, winTick.uEnd, tk.color, boilStep, 0, tickShiftY);
  }

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
