<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism New Year Concert & DJ Festival (Fixed Crowd) - 6s Seamless Loop</title>
  <style>
    :root {
      --sky-deep: #151030;
      --sky-mid: #211947;
      --city-far: #292056;
      --city-near: #1B143D;
      --crowd-back: #261D52;
      --ink: #090712;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--sky-deep);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua durasi sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Sorotan Lampu Panggung Menyapu (6s) */
    .beam-sway-l {
      animation: sweepBeamL 6s ease-in-out infinite;
    }
    .beam-sway-r {
      animation: sweepBeamR 6s ease-in-out infinite;
    }
    @keyframes sweepBeamL {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes sweepBeamR {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-8deg); }
    }

    /* 2. Kembang Api Berlapis Mekar Bergantian (Siklus 3s) */
    .fw-pop-1 {
      animation: burstA 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstA {
      0%, 5% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      18% { transform: scale(1.08) rotate(10deg); opacity: 1; }
      48% { transform: scale(1) rotate(18deg); opacity: 1; }
      62%, 100% { transform: scale(1.2) rotate(25deg); opacity: 0; }
    }

    .fw-pop-2 {
      animation: burstB 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstB {
      0%, 28% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      42% { transform: scale(1.1) rotate(-10deg); opacity: 1; }
      72% { transform: scale(1) rotate(-18deg); opacity: 1; }
      85%, 100% { transform: scale(1.2) rotate(-25deg); opacity: 0; }
    }

    .fw-pop-3 {
      animation: burstC 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstC {
      0%, 48% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      62% { transform: scale(1.08) rotate(8deg); opacity: 1; }
      86% { transform: scale(1) rotate(15deg); opacity: 1; }
      97%, 100% { transform: scale(1.2) rotate(22deg); opacity: 0; }
    }

    /* 3. Equalizer LED Panggung & Woofer Speaker (Siklus 1.5s = 4x per loop) */
    .eq-b1 { animation: bar1 1.5s ease-in-out infinite; }
    .eq-b2 { animation: bar2 1.5s ease-in-out infinite; }
    .eq-b3 { animation: bar3 1.5s ease-in-out infinite; }
    .eq-b4 { animation: bar4 1.5s ease-in-out infinite; }

    @keyframes bar1 { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    @keyframes bar2 { 0%, 100% { transform: scaleY(0.95); } 45% { transform: scaleY(0.3); } }
    @keyframes bar3 { 0%, 100% { transform: scaleY(0.45); } 35% { transform: scaleY(1); } }
    @keyframes bar4 { 0%, 100% { transform: scaleY(0.85); } 60% { transform: scaleY(0.4); } }

    .woofer-thump {
      animation: bassPump 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes bassPump {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.16); }
      50% { transform: scale(0.94); }
      75% { transform: scale(1.12); }
    }

    /* 4. Kerumunan Penonton Melompat Berirama (Siklus 1.5s) */
    .crowd-jump-back {
      animation: jumpCrowdBack 1.5s ease-in-out infinite;
    }
    .crowd-jump-front {
      animation: jumpCrowdFront 1.5s ease-in-out infinite;
    }
    @keyframes jumpCrowdBack {
      0%, 100% { transform: translateY(-10px); }
      50% { transform: translateY(2px); }
    }
    @keyframes jumpCrowdFront {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    /* 5. Balon Pesta Bergoyang (6s) */
    .balloon-bob {
      animation: bobBalloon 6s ease-in-out infinite;
    }
    @keyframes bobBalloon {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-18px) rotate(3deg); }
    }

    /* 6. Hujan Konfeti Terus-Menerus (6s seamless) */
    .confetti-stream-1 { animation: fallConf1 6s linear infinite; }
    .confetti-stream-2 { animation: fallConf2 6s linear infinite; }
    @keyframes fallConf1 {
      0% { transform: translateY(-120px) rotate(0deg); }
      100% { transform: translateY(1120px) rotate(360deg); }
    }
    @keyframes fallConf2 {
      0% { transform: translateY(-260px) rotate(180deg); }
      100% { transform: translateY(980px) rotate(-180deg); }
    }
  </style>
</head>
