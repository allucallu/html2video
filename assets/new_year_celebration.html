<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Full Scene: New Year Celebration - 6s Seamless Loop</title>
  <style>
    :root {
      --bg-cream: #F6F2E9;
      --ink: #111111;
      --midnight: #1E1B4B;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-cream);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Pita Ticker Atas & Bawah Berjalan Kontinu (3s) */
    .ticker-right { animation: slideRight 3s linear infinite; }
    .ticker-left { animation: slideLeft 3s linear infinite; }
    @keyframes slideRight {
      from { transform: translateX(-160px); }
      to { transform: translateX(0px); }
    }
    @keyframes slideLeft {
      from { transform: translateX(0px); }
      to { transform: translateX(-160px); }
    }

    /* 2. Jendela Utama Bernapas Halus (6s) */
    .main-win-float {
      animation: winFloat 6s ease-in-out infinite;
    }
    @keyframes winFloat {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-4px, -7px); }
    }

    /* 3. Tiga Kembang Api Mekar Bergantian di Layar Malam (Siklus 3s) */
    .fw-burst-1 {
      animation: burstFW1 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstFW1 {
      0%, 6% { transform: scale(0.15) rotate(0deg); opacity: 0; }
      18% { transform: scale(1.12) rotate(12deg); opacity: 1; }
      42% { transform: scale(1) rotate(20deg); opacity: 1; }
      55%, 100% { transform: scale(1.25) rotate(30deg); opacity: 0; }
    }

    .fw-burst-2 {
      animation: burstFW2 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstFW2 {
      0%, 28% { transform: scale(0.15) rotate(0deg); opacity: 0; }
      40% { transform: scale(1.12) rotate(-12deg); opacity: 1; }
      65% { transform: scale(1) rotate(-20deg); opacity: 1; }
      78%, 100% { transform: scale(1.25) rotate(-30deg); opacity: 0; }
    }

    .fw-burst-3 {
      animation: burstFW3 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstFW3 {
      0%, 48% { transform: scale(0.15) rotate(0deg); opacity: 0; }
      60% { transform: scale(1.14) rotate(10deg); opacity: 1; }
      84% { transform: scale(1) rotate(18deg); opacity: 1; }
      96%, 100% { transform: scale(1.25) rotate(25deg); opacity: 0; }
    }

    /* 4. Jam Tengah Malam Berdering di Kiri Atas (Siklus 3s) */
    .clock-shake {
      animation: ringClock 3s ease-in-out infinite;
    }
    @keyframes ringClock {
      0%, 10%, 44%, 100% { transform: rotate(-6deg) scale(1); }
      15% { transform: rotate(-13deg) scale(1.06); }
      20% { transform: rotate(2deg) scale(1.06); }
      25% { transform: rotate(-12deg) scale(1.05); }
      30% { transform: rotate(1deg) scale(1.05); }
      36% { transform: rotate(-8deg) scale(1.02); }
    }

    /* 5. Party Popper Recoil & Tembakan Konfeti Kiri Bawah (Siklus 3s) */
    .popper-kick {
      animation: kickPopper 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes kickPopper {
      0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
      14% { transform: translate(-14px, 14px) scale(0.92, 1.06); }
      24% { transform: translate(12px, -12px) scale(1.06, 0.94); }
      38%, 92% { transform: translate(0px, 0px) scale(1, 1); }
    }

    .popper-conf-1 {
      animation: shootA 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootA {
      0%, 18% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      24% { opacity: 1; }
      52% { transform: translate(115px, -175px) scale(1.05) rotate(150deg); opacity: 1; }
      84% { transform: translate(135px, -135px) scale(1) rotate(230deg); opacity: 1; }
      96%, 100% { transform: translate(145px, -110px) scale(0) rotate(270deg); opacity: 0; }
    }

    .popper-conf-2 {
      animation: shootB 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootB {
      0%, 20% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      26% { opacity: 1; }
      54% { transform: translate(185px, -95px) scale(1.05) rotate(-140deg); opacity: 1; }
      85% { transform: translate(205px, -55px) scale(1) rotate(-210deg); opacity: 1; }
      96%, 100% { transform: translate(215px, -30px) scale(0) rotate(-250deg); opacity: 0; }
    }

    /* 6. Kartu Musik Pesta Kanan Atas & Equalizer (6s & 1.5s) */
    .music-card-bob {
      animation: bobRightCard 6s ease-in-out infinite;
    }
    @keyframes bobRightCard {
      0%, 100% { transform: translateY(0px) rotate(3deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    .eq-1 { animation: eqA 1.5s ease-in-out infinite; }
    .eq-2 { animation: eqB 1.5s ease-in-out infinite; }
    .eq-3 { animation: eqC 1.5s ease-in-out infinite; }
    .eq-4 { animation: eqD 1.5s ease-in-out infinite; }

    @keyframes eqA { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @keyframes eqB { 0%, 100% { transform: scaleY(0.95); } 50% { transform: scaleY(0.35); } }
    @keyframes eqC { 0%, 100% { transform: scaleY(0.5); } 40% { transform: scaleY(1); } }
    @keyframes eqD { 0%, 100% { transform: scaleY(0.85); } 60% { transform: scaleY(0.4); } }

    /* 7. Stiker Bintang Bergerigi Kanan Bawah Berputar (6s) */
    .starburst-spin {
      animation: spinStep 6s steps(12, end) infinite;
    }
    @keyframes spinStep {
      to { transform: rotate(360deg); }
    }

    /* 8. Konfeti Latar Melayang Halus (6s) */
    .ambient-float-1 { animation: ambFloat1 6s ease-in-out infinite; }
    .ambient-float-2 { animation: ambFloat2 6s ease-in-out infinite; }
    @keyframes ambFloat1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(24deg); }
    }
    @keyframes ambFloat2 {
      0%, 100% { transform: translateY(-16px) rotate(-18deg); }
      50% { transform: translateY(4px) rotate(12deg); }
    }
  </style>
</head>
