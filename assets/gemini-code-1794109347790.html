<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Golden Stars and Tiny Crescent Moons</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 3840;
  const H = 2160;
  const CX = W * 0.5;
  const CY = H * 0.5;
  const TAU = Math.PI * 2;

  window.DURATION = 10;
  window.FPS = 30;

  // Deterministic PRNG (Mulberry32)
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(20261115);

  // =========================================================================
  // 1. GEOMETRY & CRESCENT HELPERS
  // =========================================================================
  function getCrescentData(R1, d, R2, theta0) {
    const a = (R1 * R1 - R2 * R2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, R1 * R1 - a * a));
    const ux = Math.cos(theta0);
    const uy = Math.sin(theta0);
    const px = -uy;
    const py = ux;

    const x1 = a * ux - h * px;
    const y1 = a * uy - h * py;
    const x2 = a * ux + h * px;
    const y2 = a * uy + h * py;

    const cx = d * ux;
    const cy = d * uy;

    const a1_top = Math.atan2(y1, x1);
    const a1_bot = Math.atan2(y2, x2);
    const a2_top = Math.atan2(y1 - cy, x1 - cx);
    const a2_bot = Math.atan2(y2 - cy, x2 - cx);

    const x_mid = -(R1 + R2 - d) * 0.5;
    const cx_spine_local = (R1 * R1 - x_mid * x_mid) / (2 * (a - x_mid));
    const R_spine = cx_spine_local - x_mid;
    const spine_cx = cx_spine_local * ux;
    const spine_cy = cx_spine_local * uy;
    const alpha_spine = Math.atan2(h, cx_spine_local - a);
    const bellyWidth = R1 + d - R2;

    return {
      R1, d, R2, theta0, a, h, ux, uy, px, py,
      x1, y1, x2, y2, cx, cy,
      a1_top, a1_bot, a2_top, a2_bot,
      spine_cx, spine_cy, R_spine, alpha_spine, bellyWidth
    };
  }

  function traceCrescentPath(ctx, c) {
    ctx.beginPath();
    ctx.arc(0, 0, c.R1, c.a1_bot, c.a1_top, false);
    ctx.arc(c.cx, c.cy, c.R2, c.a2_top, c.a2_bot, true);
    ctx.closePath();
  }

  function getSpinePoint(c, u) {
    const localAngle = Math.PI - u * c.alpha_spine;
    const globalAngle = c.theta0 + localAngle;
    const x = c.spine_cx + c.R_spine * Math.cos(globalAngle);
    const y = c.spine_cy + c.R_spine * Math.sin(globalAngle);
    const nx = Math.cos(globalAngle);
    const ny = Math.sin(globalAngle);
    const tx = -ny;
    const ty = nx;
    const widthFactor = Math.max(0, 1 - u * u);
    const halfWidth = c.bellyWidth * 0.5 * widthFactor;
    return { x, y, nx, ny, tx, ty, globalAngle, widthFactor, halfWidth };
  }

  // Pre-computed unit crescent templates (radius 100 base)
  const CRES_THETA = -0.28;
  const cresOuter = getCrescentData(100, 42, 79, CRES_THETA);
  const cresBevel = getCrescentData(94, 42, 85, CRES_THETA);
  const cresInlay = getCrescentData(88, 42, 91, CRES_THETA);

  // =========================================================================
  // 2. PRE-GENERATE RISING STREAM OF STARS, CRESCENTS & SPARKLES
  // =========================================================================

  // A. 32 Continuously Rising Ornamental Stars & Tiny Crescent Moons
  // Each wraps seamlessly across [0, 1) with staggered phaseOffset so the screen
  // is perpetually filled with rising celestial ornaments without any global fade.
  const risingOrnaments = [];
  const NUM_RISING = 32;
  const kinds = ['star8', 'crescent', 'star4', 'crescent', 'star6', 'star8', 'crescent', 'star4'];

  for (let i = 0; i < NUM_RISING; i++) {
    // Stratify phaseOffset so objects are evenly distributed in time
    const phaseOffset = ((i / NUM_RISING) + (rand() - 0.5) * (0.6 / NUM_RISING) + 1) % 1;
    const kind = kinds[i % kinds.length];

    // Center-weighted horizontal distribution within safe zone [780, 3060]
    const laneU = ((i * 0.61803398875) % 1); // Golden-ratio low-discrepancy spread
    const centeredOffset = (laneU - 0.5) * 2.0; // [-1, 1]
    const shapedX = Math.sign(centeredOffset) * Math.pow(Math.abs(centeredOffset), 0.82);
    const baseX = CX + shapedX * 980 + (rand() - 0.5) * 140;

    // Vertical upward travel path strictly inside safe margins [380, 1780]
    const yStart = 1580 + rand() * 190;
    const yEnd = 390 + rand() * 190;

    const depthLayer = i % 3; // 0 = background small, 1 = mid-ground, 2 = foreground large
    let baseScale;
    if (depthLayer === 0) {
      baseScale = 0.42 + rand() * 0.16;
    } else if (depthLayer === 1) {
      baseScale = 0.60 + rand() * 0.20;
    } else {
      baseScale = 0.80 + rand() * 0.26;
    }

    risingOrnaments.push({
      kind,
      depthLayer,
      phaseOffset,
      cycles: 1, // 1 full graceful rise per 10s loop
      baseX,
      yStart,
      yEnd,
      baseScale,
      swayAmp: 36 + rand() * 58,
      swayFreq: 1 + (i % 2), // 1 or 2 integer wave cycles along the rise
      swayPhase: rand() * TAU,
      rotBase: (rand() - 0.5) * 0.45,
      rotAmp: 0.14 + rand() * 0.16,
      rotFreq: (rand() < 0.5 ? 1 : -1) * (1 + (i % 2)),
      twinkleFreq: 1 + (i % 3),
      twinklePhase: rand() * TAU,
      flipX: rand() < 0.5 ? 1 : -1,
      variant: i % 2,
      hasInnerStar: (kind === 'crescent' && i % 2 === 0),
      tailType: i % 3 // 0 = emerald drop, 1 = amber drop, 2 = mini starlet tail
    });
  }

  // Sort rising ornaments by depthLayer so smaller background pieces render behind larger foreground pieces
  risingOrnaments.sort((a, b) => a.depthLayer - b.depthLayer);

  // B. 9 Buoyant Hero Celestial Ornaments (hovering & surging upward in multi-harmonic loops)
  // These anchor the visual silhouette at every instant while bobbing upward on rising currents.
  const heroSpecs = [
    { bx: CX - 560, by: CY + 140, kind: 'crescent', scale: 1.06, flipX: 1,  variant: 0, hasInnerStar: true,  tailType: 0, pOff: 0.10 },
    { bx: CX - 260, by: CY - 190, kind: 'star8',    scale: 1.02, flipX: 1,  variant: 1, hasInnerStar: false, tailType: 1, pOff: 0.45 },
    { bx: CX + 20,  by: CY + 40,  kind: 'crescent', scale: 1.22, flipX: 1,  variant: 1, hasInnerStar: true,  tailType: 2, pOff: 0.75 },
    { bx: CX + 340, by: CY - 150, kind: 'star8',    scale: 1.08, flipX: 1,  variant: 0, hasInnerStar: false, tailType: 0, pOff: 0.25 },
    { bx: CX + 620, by: CY + 160, kind: 'crescent', scale: 0.98, flipX: -1, variant: 0, hasInnerStar: true,  tailType: 1, pOff: 0.60 },
    { bx: CX - 780, by: CY - 110, kind: 'star4',    scale: 0.88, flipX: 1,  variant: 0, hasInnerStar: false, tailType: 0, pOff: 0.88 },
    { bx: CX + 810, by: CY - 120, kind: 'star6',    scale: 0.88, flipX: 1,  variant: 1, hasInnerStar: false, tailType: 1, pOff: 0.33 },
    { bx: CX - 180, by: CY + 310, kind: 'star6',    scale: 0.84, flipX: 1,  variant: 0, hasInnerStar: false, tailType: 2, pOff: 0.52 },
    { bx: CX + 280, by: CY + 290, kind: 'star4',    scale: 0.86, flipX: 1,  variant: 1, hasInnerStar: false, tailType: 0, pOff: 0.92 }
  ];

  // C. 110 Rising Sparkles & Celestial Stardust Motes
  const sparkles = [];
  const NUM_SPARKLES = 110;
  for (let i = 0; i < NUM_SPARKLES; i++) {
    const phaseOffset = ((i / NUM_SPARKLES) + rand() * 0.01) % 1;
    const lane = (rand() - 0.5) * 2.0;
    const bx = CX + Math.sign(lane) * Math.pow(Math.abs(lane), 0.85) * 1160 + (rand() - 0.5) * 120;
    const yStart = 1650 + rand() * 210;
    const yEnd = 310 + rand() * 220;

    const pRoll = rand();
    let colorCore, colorMid, colorOuter;
    if (pRoll < 0.50) {
      // Radiant Gold
      colorCore = '#FFFFFF';
      colorMid = '#FFE885';
      colorOuter = 'rgba(255, 180, 30, 0)';
    } else if (pRoll < 0.78) {
      // Warm Amber
      colorCore = '#FFF9E2';
      colorMid = '#FFB228';
      colorOuter = 'rgba(220, 100, 0, 0)';
    } else {
      // Deep Emerald Gleam
      colorCore = '#FFFFFF';
      colorMid = '#72F7C2';
      colorOuter = 'rgba(16, 185, 125, 0)';
    }

    sparkles.push({
      bx,
      yStart,
      yEnd,
      phaseOffset,
      cycles: rand() < 0.65 ? 1 : 2, // 1 or 2 integer upward cycles per loop
      swayAmp: 22 + rand() * 54,
      swayFreq: 1 + Math.floor(rand() * 2),
      swayPhase: rand() * TAU,
      twinkleFreq: 2 + Math.floor(rand() * 3), // 2, 3, or 4 integer cycles
      twinklePhase: rand() * TAU,
      rotFreq: rand() < 0.5 ? 1 : -1,
      rotBase: rand() * Math.PI,
      size: 14 + Math.pow(rand(), 1.6) * 38,
      type: i % 4 === 0 ? 'eight' : (i % 3 === 0 ? 'orb' : 'four'),
      layer: i % 2, // 0 = background, 1 = foreground
      colorCore,
      colorMid,
      colorOuter
    });
  }

  // =========================================================================
  // 3. ORNAMENTAL DRAWING PRIMITIVES (GEMS, SPARKLES, CHARMS, TAILS)
  // =========================================================================

  // Smooth lifecycle envelope that starts and ends at 0 (at u=0 and u=1) with a lush plateau
  function getSeamlessEnvelope(u) {
    const s = Math.sin(u * Math.PI);
    return Math.pow(Math.max(0, s), 0.68);
  }

  // Draw a 4-point, 8-point, or orb sparkle with soft contained glow
  function drawSparkleShape(ctx, x, y, radius, rot, type, colorCore, colorMid, colorOuter, alpha) {
    if (alpha <= 0.005 || radius <= 0.5) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;

    const glowRad = radius * (type === 'orb' ? 2.2 : 2.8);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRad);
    grad.addColorStop(0, colorCore);
    grad.addColorStop(0.28, colorMid);
    grad.addColorStop(1, colorOuter);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    if (type === 'orb') {
      ctx.fillStyle = colorCore;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.35, 0, TAU);
      ctx.fill();
      ctx.restore();
      return;
    }

    ctx.rotate(rot);

    const drawFourStar = (rLong, rShort, fill) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const ang = i * Math.PI * 0.5;
        const nextAng = (i + 1) * Math.PI * 0.5;
        const midAng = ang + Math.PI * 0.25;
        const px = Math.cos(ang) * rLong;
        const py = Math.sin(ang) * rLong;
        const cx = Math.cos(midAng) * rShort;
        const cy = Math.sin(midAng) * rShort;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
        ctx.quadraticCurveTo(cx, cy, Math.cos(nextAng) * rLong, Math.sin(nextAng) * rLong);
      }
      ctx.closePath();
      ctx.fill();
    };

    if (type === 'eight') {
      ctx.save();
      ctx.rotate(Math.PI * 0.25);
      drawFourStar(radius * 0.68, radius * 0.11, colorMid);
      ctx.restore();
    }

    drawFourStar(radius * 1.15, radius * 0.15, colorMid);
    drawFourStar(radius * 0.72, radius * 0.08, colorCore);

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.14, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // Draw a glossy cabochon gem in an ornate gold bezel
  function drawCabochonGem(ctx, x, y, radius, type, shimmerPhase) {
    ctx.save();
    ctx.translate(x, y);

    const dropGrad = ctx.createRadialGradient(radius * 0.12, radius * 0.18, radius * 0.1, 0, 0, radius * 1.42);
    dropGrad.addColorStop(0, 'rgba(35, 12, 0, 0.75)');
    dropGrad.addColorStop(1, 'rgba(35, 12, 0, 0)');
    ctx.fillStyle = dropGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.42, 0, TAU);
    ctx.fill();

    const bezelGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
    bezelGrad.addColorStop(0, '#FFF7C2');
    bezelGrad.addColorStop(0.35, '#FFD03B');
    bezelGrad.addColorStop(0.72, '#B35600');
    bezelGrad.addColorStop(1, '#FFE47A');
    ctx.fillStyle = bezelGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.22, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#592000';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.03, 0, TAU);
    ctx.fill();

    const gemGrad = ctx.createRadialGradient(
      radius * 0.22, radius * 0.25, radius * 0.05,
      0, 0, radius
    );
    if (type === 'emerald') {
      gemGrad.addColorStop(0, '#85FFD4');
      gemGrad.addColorStop(0.35, '#12B87D');
      gemGrad.addColorStop(0.75, '#05593B');
      gemGrad.addColorStop(1, '#022417');
    } else {
      gemGrad.addColorStop(0, '#FFFFFF');
      gemGrad.addColorStop(0.32, '#FFBE2E');
      gemGrad.addColorStop(0.75, '#B84500');
      gemGrad.addColorStop(1, '#4A1500');
    }
    ctx.fillStyle = gemGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.fill();

    const shift = Math.sin(shimmerPhase) * 0.07;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.ellipse(
      -radius * (0.30 + shift),
      -radius * (0.32 - shift),
      radius * 0.36,
      radius * 0.18,
      -Math.PI * 0.25,
      0,
      TAU
    );
    ctx.fill();

    ctx.restore();
  }

  // Draw an 8-pointed or 16-pointed geometric rosette
  function drawGeometricRosette(ctx, cx, cy, outerR, innerR, pts, rot, fillStyle, strokeStyle, lineWidth) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    const total = pts * 2;
    for (let i = 0; i < total; i++) {
      const a = (i / total) * TAU;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth || 2.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw an ornate dangling teardrop charm
  function drawTeardropCharm(ctx, length, width, type, shimmerPhase) {
    ctx.save();

    const frameGrad = ctx.createLinearGradient(-width, 0, width, length);
    frameGrad.addColorStop(0, '#FFF7C0');
    frameGrad.addColorStop(0.35, '#FFCC33');
    frameGrad.addColorStop(0.72, '#B55800');
    frameGrad.addColorStop(1, '#FFE47A');
    ctx.fillStyle = frameGrad;
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(width * 0.92, length * 0.38, width * 1.15, length * 0.78, 0, length);
    ctx.bezierCurveTo(-width * 1.15, length * 0.78, -width * 0.92, length * 0.38, 0, 3);
    ctx.closePath();
    ctx.fill();

    const inGrad = ctx.createRadialGradient(-width * 0.15, length * 0.55, 1, 0, length * 0.6, width * 0.85);
    if (type === 'emerald') {
      inGrad.addColorStop(0, '#72F7C2');
      inGrad.addColorStop(0.45, '#0E9E6A');
      inGrad.addColorStop(1, '#032B1C');
    } else {
      inGrad.addColorStop(0, '#FFF8D6');
      inGrad.addColorStop(0.45, '#FF9E00');
      inGrad.addColorStop(1, '#5E2000');
    }
    ctx.fillStyle = inGrad;
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(width * 0.62, length * 0.42, width * 0.78, length * 0.74, 0, length - 5);
    ctx.bezierCurveTo(-width * 0.78, length * 0.74, -width * 0.62, length * 0.42, 0, 9);
    ctx.closePath();
    ctx.fill();

    const shift = Math.sin(shimmerPhase) * 1.1;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.80)';
    ctx.beginPath();
    ctx.ellipse(-width * 0.2 + shift, length * 0.52, width * 0.14, length * 0.13, -0.22, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#FFF3A8';
    ctx.beginPath();
    ctx.arc(0, length + 3, 3.0, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // Draw a trailing articulated golden bead chain & charm (Secondary follow-through motion)
  function drawTrailingCharmTail(ctx, attachX, attachY, parentRot, lagAngle1, lagAngle2, tailType, shimmerPhase) {
    ctx.save();
    ctx.translate(attachX, attachY);
    // Cancel parent rotation so tail hangs downward with its own delayed sway
    ctx.rotate(-parentRot + lagAngle1);

    const seg1 = 30;
    const seg2 = 30;

    // Upper bead segment
    ctx.strokeStyle = 'rgba(255, 210, 75, 0.65)';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, seg1);
    ctx.stroke();

    for (let i = 1; i <= 3; i++) {
      const y = (i / 3) * seg1;
      ctx.fillStyle = i % 2 === 0 ? '#FFF6B8' : '#E08A00';
      ctx.beginPath();
      ctx.arc(0, y, i === 3 ? 4.2 : 3.0, 0, TAU);
      ctx.fill();
    }

    ctx.translate(0, seg1);
    ctx.rotate(lagAngle2 - lagAngle1);

    // Lower bead segment
    ctx.strokeStyle = 'rgba(255, 210, 75, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, seg2);
    ctx.stroke();

    for (let i = 1; i <= 2; i++) {
      const y = (i / 3) * seg2;
      ctx.fillStyle = '#FFE47A';
      ctx.beginPath();
      ctx.arc(0, y, 2.8, 0, TAU);
      ctx.fill();
    }

    ctx.translate(0, seg2);

    if (tailType === 2) {
      // Miniature dangling 8-point starlet
      drawGeometricRosette(ctx, 0, 12, 15, 6, 4, shimmerPhase * 0.2, '#FFD24C', '#FFF8CC', 1.8);
      drawCabochonGem(ctx, 0, 12, 4.5, 'emerald', shimmerPhase);
    } else {
      drawTeardropCharm(ctx, 36, 11, tailType === 0 ? 'emerald' : 'amber', shimmerPhase);
    }

    ctx.restore();
  }

  // =========================================================================
  // 4. HERO & STREAM ORNAMENT RENDERERS (STARS & TINY CRESCENT MOONS)
  // =========================================================================

  // ORNAMENT A: Ornate 8-Pointed Royal Star (Radius ~92 in local coords)
  function drawOrnamentalStar8(ctx, shimmerPhase, twinkleVal, variant, parentRot, lag1, lag2, tailType) {
    const radius = 92;

    ctx.save();

    // 1. Contained Soft Golden & Emerald Glow
    const glowRad = radius * (2.15 + 0.45 * twinkleVal);
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 242, 160, ${(0.32 + 0.32 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.32, `rgba(255, 175, 35, ${(0.14 + 0.16 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.65, `rgba(16, 175, 115, ${(0.035 + 0.05 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // 2. Trailing Secondary Charm Tail (drawn behind the bottom ray tip)
    drawTrailingCharmTail(ctx, 0, radius - 4, parentRot, lag1, lag2, tailType, shimmerPhase);

    // 3. Diagonal 4 Emerald & Gold Rays (45 deg)
    const rDiag = radius * 0.74;
    const rWaistDiag = radius * 0.28;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5 + Math.PI * 0.25);

      const dGrad = ctx.createLinearGradient(-rWaistDiag, -rDiag, rWaistDiag, 0);
      dGrad.addColorStop(0, '#FFF7C2');
      dGrad.addColorStop(0.45, '#FFC833');
      dGrad.addColorStop(1, '#8C3B00');
      ctx.fillStyle = dGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-rWaistDiag, 0);
      ctx.quadraticCurveTo(-rWaistDiag * 0.35, -rDiag * 0.35, 0, -rDiag);
      ctx.quadraticCurveTo(rWaistDiag * 0.35, -rDiag * 0.35, rWaistDiag, 0);
      ctx.closePath();
      ctx.fill();

      // Deep Emerald Inlay Kite
      const emGrad = ctx.createLinearGradient(0, -rDiag * 0.82, 0, -rDiag * 0.16);
      emGrad.addColorStop(0, '#52F2B8');
      emGrad.addColorStop(0.5, '#098054');
      emGrad.addColorStop(1, '#022B1C');
      ctx.fillStyle = emGrad;
      ctx.beginPath();
      ctx.moveTo(0, -rDiag * 0.80);
      ctx.lineTo(rWaistDiag * 0.28, -rDiag * 0.32);
      ctx.lineTo(0, -rDiag * 0.16);
      ctx.lineTo(-rWaistDiag * 0.28, -rDiag * 0.32);
      ctx.closePath();
      ctx.fill();

      // Tip golden pearl
      ctx.fillStyle = '#FFF6B8';
      ctx.beginPath();
      ctx.arc(0, -rDiag - 3, 3.4, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    // 4. Cardinal 4 Sculpted Bevelled Gold Rays
    const rMain = radius;
    const rWaist = radius * 0.29;
    const shift = Math.sin(shimmerPhase) * 0.12;

    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5);

      // Left sunlit facet
      const gL = ctx.createLinearGradient(-rWaist, -rMain * 0.5, 0, -rMain);
      gL.addColorStop(0, '#FFB824');
      gL.addColorStop(0.5 + shift, '#FFFAD6');
      gL.addColorStop(1, '#FFE270');
      ctx.fillStyle = gL;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rMain);
      ctx.quadraticCurveTo(-rWaist * 0.42, -rMain * 0.36, -rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      // Right warm amber shaded facet
      const gR = ctx.createLinearGradient(0, -rMain, rWaist, -rMain * 0.3);
      gR.addColorStop(0, '#FFE478');
      gR.addColorStop(0.5, '#C96500');
      gR.addColorStop(1, '#702800');
      ctx.fillStyle = gR;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rMain);
      ctx.quadraticCurveTo(rWaist * 0.42, -rMain * 0.36, rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      // Recessed emerald or warm amber jewel groove
      ctx.fillStyle = variant === 0 ? '#0B8A5B' : '#B84A00';
      ctx.beginPath();
      ctx.moveTo(0, -rMain * 0.74);
      ctx.lineTo(rWaist * 0.19, -rMain * 0.34);
      ctx.lineTo(0, -rMain * 0.20);
      ctx.lineTo(-rWaist * 0.19, -rMain * 0.34);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 246, 195, 0.8)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // Tip pearl
      ctx.fillStyle = '#FFF9D2';
      ctx.beginPath();
      ctx.arc(0, -rMain - 3.5, 3.8, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    // 5. Central Sunburst Collar & Cabochon Jewel
    drawGeometricRosette(ctx, 0, 0, radius * 0.28, radius * 0.18, 8, 0, '#8C3B00', '#FFF5B8', 2.2);
    drawCabochonGem(ctx, 0, 0, radius * 0.19, variant === 0 ? 'emerald' : 'amber', shimmerPhase);

    ctx.restore();
  }

  // ORNAMENT B: Sculpted 4-Pointed Celestial North Star with Filigree Petals (Radius ~96)
  function drawOrnamentalStar4(ctx, shimmerPhase, twinkleVal, variant, parentRot, lag1, lag2, tailType) {
    const radius = 96;

    ctx.save();

    // 1. Contained Soft Glow
    const glowRad = radius * (2.0 + 0.45 * twinkleVal);
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 246, 175, ${(0.34 + 0.32 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.32, `rgba(255, 180, 40, ${(0.14 + 0.15 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // 2. Trailing Charm Tail
    drawTrailingCharmTail(ctx, 0, radius - 6, parentRot, lag1, lag2, tailType, shimmerPhase);

    // 3. Diagonal Emerald Lotus Petals tucked between the 4 main points
    const rLotus = radius * 0.48;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5 + Math.PI * 0.25);

      // Gold frame of lotus petal
      ctx.fillStyle = '#FFD03B';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-18, -rLotus * 0.45, -14, -rLotus * 0.88, 0, -rLotus);
      ctx.bezierCurveTo(14, -rLotus * 0.88, 18, -rLotus * 0.45, 0, 0);
      ctx.closePath();
      ctx.fill();

      // Deep Emerald Inlay inside lotus petal
      ctx.fillStyle = '#0B8A5B';
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.bezierCurveTo(-10, -rLotus * 0.48, -8, -rLotus * 0.78, 0, -rLotus * 0.86);
      ctx.bezierCurveTo(8, -rLotus * 0.78, 10, -rLotus * 0.48, 0, -10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#FFF5B8';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      ctx.restore();
    }

    // 4. Four Primary Sculpted Gold Points
    const rWaist = radius * 0.22;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5);
      const rTip = (i % 2 === 0) ? radius : radius * 0.86;

      const gL = ctx.createLinearGradient(-rWaist, -rTip * 0.5, 0, -rTip);
      gL.addColorStop(0, '#FFA812');
      gL.addColorStop(0.5, '#FFFCE0');
      gL.addColorStop(1, '#FFE478');
      ctx.fillStyle = gL;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rTip);
      ctx.quadraticCurveTo(-rWaist * 0.35, -rTip * 0.32, -rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      const gR = ctx.createLinearGradient(0, -rTip, rWaist, -rTip * 0.3);
      gR.addColorStop(0, '#FFE478');
      gR.addColorStop(0.5, '#C45E00');
      gR.addColorStop(1, '#6B2400');
      ctx.fillStyle = gR;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rTip);
      ctx.quadraticCurveTo(rWaist * 0.35, -rTip * 0.32, rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      // Crisp center ridge highlight
      ctx.strokeStyle = 'rgba(255, 255, 240, 0.85)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(0, -rTip * 0.92);
      ctx.lineTo(0, -rTip * 0.24);
      ctx.stroke();

      ctx.restore();
    }

    // 5. Center Diamond Medallion
    drawCabochonGem(ctx, 0, 0, radius * 0.17, variant === 0 ? 'amber' : 'emerald', shimmerPhase);

    ctx.restore();
  }

  // ORNAMENT C: Ornate 6-Pointed Arabesque Star (Radius ~86)
  function drawOrnamentalStar6(ctx, shimmerPhase, twinkleVal, variant, parentRot, lag1, lag2, tailType) {
    const radius = 86;

    ctx.save();

    // 1. Contained Soft Glow
    const glowRad = radius * (2.1 + 0.45 * twinkleVal);
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 240, 155, ${(0.30 + 0.32 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.35, `rgba(18, 184, 125, ${(0.10 + 0.12 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // 2. Trailing Charm Tail
    drawTrailingCharmTail(ctx, 0, radius - 4, parentRot, lag1, lag2, tailType, shimmerPhase);

    // 3. Six Sculpted Rays + Interlocking Emerald Hexagonal Ring
    const rWaist = radius * 0.34;
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate((i / 6) * TAU);

      const gL = ctx.createLinearGradient(-rWaist, -radius * 0.5, 0, -radius);
      gL.addColorStop(0, '#FFB824');
      gL.addColorStop(0.5, '#FFFAD6');
      gL.addColorStop(1, '#FFE270');
      ctx.fillStyle = gL;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -radius);
      ctx.quadraticCurveTo(-rWaist * 0.35, -radius * 0.42, -rWaist * Math.sin(Math.PI / 6), -rWaist * Math.cos(Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      const gR = ctx.createLinearGradient(0, -radius, rWaist, -radius * 0.3);
      gR.addColorStop(0, '#FFE478');
      gR.addColorStop(0.5, '#C45E00');
      gR.addColorStop(1, '#6E2600');
      ctx.fillStyle = gR;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -radius);
      ctx.quadraticCurveTo(rWaist * 0.35, -radius * 0.42, rWaist * Math.sin(Math.PI / 6), -rWaist * Math.cos(Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      // Gold pearl in each valley and tip
      ctx.fillStyle = '#FFF6B8';
      ctx.beginPath();
      ctx.arc(0, -radius - 3, 3.2, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    // Inner Emerald Enamel Rosette
    drawGeometricRosette(ctx, 0, 0, radius * 0.42, radius * 0.26, 6, Math.PI / 6, '#098054', '#FFF5B8', 2.2);
    drawCabochonGem(ctx, 0, 0, radius * 0.19, variant === 0 ? 'emerald' : 'amber', shimmerPhase);

    ctx.restore();
  }

  // ORNAMENT D: Tiny Jewelled Crescent Moon (Radius 100 in local coords)
  function drawTinyCrescentMoon(ctx, shimmerPhase, twinkleVal, variant, hasInnerStar, flipX, parentRot, lag1, lag2, tailType) {
    ctx.save();
    ctx.scale(flipX, 1);

    const effRot = parentRot * flipX;
    const effLag1 = lag1 * flipX;
    const effLag2 = lag2 * flipX;

    // 1. Contained Soft Golden & Warm Amber Glow
    const glowRad = 210 * (0.85 + 0.30 * twinkleVal);
    const glow = ctx.createRadialGradient(-28, 0, 8, -15, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 238, 150, ${(0.30 + 0.32 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.34, `rgba(255, 175, 35, ${(0.13 + 0.15 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(0.66, `rgba(16, 175, 115, ${(0.03 + 0.05 * twinkleVal).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(-15, 0, glowRad, 0, TAU);
    ctx.fill();

    // 2. Trailing Charm Tail hanging from the lower horn/belly
    const bellyAnchor = getSpinePoint(cresOuter, 0.62);
    drawTrailingCharmTail(
      ctx,
      bellyAnchor.x,
      bellyAnchor.y,
      effRot,
      effLag1,
      effLag2,
      tailType,
      shimmerPhase
    );

    // 3. Optional Tiny Dangling Star suspended from the Upper Horn inside the crescent hollow
    if (hasInnerStar) {
      ctx.save();
      ctx.translate(cresOuter.x1, cresOuter.y1);
      ctx.rotate(-effRot + effLag1 * 1.15);

      ctx.strokeStyle = '#FFE47A';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 38);
      ctx.stroke();

      ctx.fillStyle = '#FFF6B8';
      ctx.beginPath();
      ctx.arc(0, 19, 3.0, 0, TAU);
      ctx.fill();

      ctx.translate(0, 56);
      drawGeometricRosette(ctx, 0, 0, 22, 8.5, 4, shimmerPhase * 0.25, '#FFD03B', '#FFF9D6', 1.8);
      drawCabochonGem(ctx, 0, 0, 6.0, 'amber', shimmerPhase);
      ctx.restore();
    }

    // 4. Scalloped Golden Pearl Trim along the outer crescent curve
    const numBeads = 19;
    for (let i = 1; i < numBeads; i++) {
      const u = -0.92 + (i / numBeads) * 1.84;
      const sp = getSpinePoint(cresOuter, u);
      const bx = sp.x + sp.nx * (sp.halfWidth + 1.5);
      const by = sp.y + sp.ny * (sp.halfWidth + 1.5);
      const r = 2.0 + 2.4 * sp.widthFactor;
      ctx.fillStyle = i % 2 === 0 ? '#FFF6B8' : '#D97B00';
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, TAU);
      ctx.fill();
    }

    // 5. Outer Sculpted Gold Crescent Body
    ctx.save();
    traceCrescentPath(ctx, cresOuter);
    ctx.clip();

    const bodyGrad = ctx.createLinearGradient(-100, -90, 80, 90);
    bodyGrad.addColorStop(0, '#FFF9D2');
    bodyGrad.addColorStop(0.28, '#FFD84D');
    bodyGrad.addColorStop(0.55, '#FFF2A6');
    bodyGrad.addColorStop(0.78, '#D97B00');
    bodyGrad.addColorStop(1, '#7A3000');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(-130, -130, 260, 260);

    // Inner bevel warm amber shadow step
    traceCrescentPath(ctx, cresBevel);
    const bevGrad = ctx.createLinearGradient(70, 70, -95, -80);
    bevGrad.addColorStop(0, '#FFE885');
    bevGrad.addColorStop(0.5, '#9E4200');
    bevGrad.addColorStop(1, '#4A1800');
    ctx.fillStyle = bevGrad;
    ctx.fill();

    // 6. Recessed Deep Emerald Enamel Channel (or Warm Amber Gold Filigree Channel)
    ctx.save();
    traceCrescentPath(ctx, cresInlay);
    ctx.clip();

    const inlayGrad = ctx.createRadialGradient(-55, -15, 5, -35, 0, 110);
    if (variant === 0) {
      inlayGrad.addColorStop(0, '#1AD18E');
      inlayGrad.addColorStop(0.45, '#08754D');
      inlayGrad.addColorStop(0.85, '#033824');
      inlayGrad.addColorStop(1, '#011C11');
    } else {
      inlayGrad.addColorStop(0, '#14B87B');
      inlayGrad.addColorStop(0.5, '#065E3C');
      inlayGrad.addColorStop(1, '#022416');
    }
    ctx.fillStyle = inlayGrad;
    ctx.fillRect(-130, -130, 260, 260);

    // Golden Filigree Vine waving along the crescent spine
    ctx.strokeStyle = '#FFD24C';
    ctx.lineWidth = 3.0;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 32; i++) {
      const u = -0.86 + (i / 32) * 1.72;
      const sp = getSpinePoint(cresInlay, u);
      const wave = Math.sin(u * Math.PI * 4) * sp.halfWidth * 0.32;
      const vx = sp.x + sp.nx * wave;
      const vy = sp.y + sp.ny * wave;
      if (i === 0) ctx.moveTo(vx, vy);
      else ctx.lineTo(vx, vy);
    }
    ctx.stroke();

    ctx.restore(); // End Inlay Clip

    // Crisp gold wire border around inlay
    ctx.strokeStyle = '#FFF3A8';
    ctx.lineWidth = 2.0;
    traceCrescentPath(ctx, cresInlay);
    ctx.stroke();

    // Travelling Specular Gloss Band across the Crescent
    ctx.save();
    const sheenPos = -30 + 45 * Math.sin(shimmerPhase);
    ctx.rotate(-0.45);
    const sheenGrad = ctx.createLinearGradient(0, sheenPos - 36, 0, sheenPos + 36);
    sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    sheenGrad.addColorStop(0.5, 'rgba(255, 255, 240, 0.52)');
    sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = sheenGrad;
    ctx.fillRect(-150, -150, 300, 300);
    ctx.restore();

    // Bright upper-left rim highlight
    ctx.strokeStyle = 'rgba(255, 253, 230, 0.88)';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.arc(0, 0, cresOuter.R1 - 2, Math.PI * 0.80, Math.PI * 1.45, false);
    ctx.stroke();

    ctx.restore(); // End Outer Crescent Clip

    // 7. Bezel-Set Cabochon Gems along the Crescent Spine
    const gemU = [-0.52, -0.26, 0.0, 0.26, 0.52];
    const gemR = [5.2, 7.2, 10.2, 7.2, 5.2];
    for (let i = 0; i < gemU.length; i++) {
      const sp = getSpinePoint(cresInlay, gemU[i]);
      const gType = (i % 2 === 0) ? (variant === 0 ? 'emerald' : 'amber') : (variant === 0 ? 'amber' : 'emerald');
      drawCabochonGem(ctx, sp.x, sp.y, gemR[i], gType, shimmerPhase + i * 0.6);
    }

    // Horn tip golden finial spheres
    ctx.fillStyle = '#FFF6B8';
    ctx.beginPath();
    ctx.arc(cresOuter.x1, cresOuter.y1, 4.2, 0, TAU);
    ctx.arc(cresOuter.x2, cresOuter.y2, 4.0, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // Unified dispatcher to render any ornament (star8, star4, star6, crescent) at (x, y)
  function renderCelestialOrnament(ctx, item, x, y, scale, rot, alpha, phase, lag1, lag2) {
    if (alpha <= 0.005 || scale <= 0.02) return;
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;
    const shimmerPhase = p1 + (item.twinklePhase || 0);
    const twinkleVal = 0.5 + 0.5 * Math.sin((item.twinkleFreq || 2) * p1 + (item.twinklePhase || 0));
    const flare = Math.pow(twinkleVal, 3.6);

    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;

    // Subtle squash & stretch breathing
    const breathe = 0.022 * Math.sin(p2 + (item.twinklePhase || 0));
    ctx.rotate(rot);
    ctx.scale(scale * (1 + breathe), scale * (1 - breathe * 0.8));

    if (item.kind === 'star8') {
      drawOrnamentalStar8(ctx, shimmerPhase, twinkleVal, item.variant, rot, lag1, lag2, item.tailType);
    } else if (item.kind === 'star4') {
      drawOrnamentalStar4(ctx, shimmerPhase, twinkleVal, item.variant, rot, lag1, lag2, item.tailType);
    } else if (item.kind === 'star6') {
      drawOrnamentalStar6(ctx, shimmerPhase, twinkleVal, item.variant, rot, lag1, lag2, item.tailType);
    } else {
      drawTinyCrescentMoon(
        ctx,
        shimmerPhase,
        twinkleVal,
        item.variant,
        item.hasInnerStar,
        item.flipX,
        rot,
        lag1,
        lag2,
        item.tailType
      );
    }

    // Specular glint burst when twinkling peaks
    if (flare > 0.12) {
      const gx = item.kind === 'crescent' ? -45 * item.flipX : 0;
      const gy = 0;
      drawSparkleShape(
        ctx,
        gx,
        gy,
        46 * flare,
        -rot + p1 * 0.25,
        'four',
        '#FFFFFF',
        '#FFE885',
        'rgba(255, 190, 35, 0)',
        flare * 0.92
      );
    }

    ctx.restore();
  }

  // =========================================================================
  // 5. DETERMINISTIC FRAME RENDERER
  // =========================================================================
  window.renderFrame = function(t) {
    const DURATION = window.DURATION;
    const phase = (((t % DURATION) + DURATION) % DURATION) / DURATION;
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;
    const p3 = phase * TAU * 3;

    // 1. Clear entire 4K canvas to solid pure black #000000
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // 2. Soft Contained Central Celestial Aura (strictly fades to pure #000000 well inside frame)
    const auraPulse = 1 + 0.04 * Math.sin(p1) + 0.02 * Math.cos(p2);
    const centerAura = ctx.createRadialGradient(CX, CY, 60, CX, CY, 880 * auraPulse);
    centerAura.addColorStop(0, 'rgba(255, 200, 55, 0.13)');
    centerAura.addColorStop(0.42, 'rgba(215, 110, 10, 0.055)');
    centerAura.addColorStop(0.72, 'rgba(12, 130, 85, 0.02)');
    centerAura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = centerAura;
    ctx.beginPath();
    ctx.arc(CX, CY, 880 * auraPulse, 0, TAU);
    ctx.fill();

    // 3. Draw Background Layer Rising Sparkles (layer === 0)
    for (let i = 0; i < NUM_SPARKLES; i++) {
      const s = sparkles[i];
      if (s.layer !== 0) continue;

      const u = (phase * s.cycles + s.phaseOffset) % 1;
      const env = getSeamlessEnvelope(u);
      const sy = s.yStart - u * (s.yStart - s.yEnd);
      const sx = s.bx + Math.sin(u * TAU * s.swayFreq + s.swayPhase) * s.swayAmp;

      const tw = 0.5 + 0.5 * Math.sin(s.twinkleFreq * p1 + s.twinklePhase);
      const pulse = Math.pow(tw, 1.6) * env;
      const rad = s.size * (0.3 + 0.7 * pulse);
      const alpha = 0.92 * pulse;
      const rot = s.rotBase + s.rotFreq * p1 * 0.5;

      drawSparkleShape(ctx, sx, sy, rad, rot, s.type, s.colorCore, s.colorMid, s.colorOuter, alpha);
    }

    // 4. Draw Background & Mid-Ground Continuously Rising Stars & Tiny Crescent Moons (depthLayer 0 & 1)
    for (let i = 0; i < NUM_RISING; i++) {
      const item = risingOrnaments[i];
      if (item.depthLayer === 2) continue;

      const u = (phase * item.cycles + item.phaseOffset) % 1;
      const env = getSeamlessEnvelope(u);

      // Upward drift with subtle harmonic velocity modulation
      const y = item.yStart - u * (item.yStart - item.yEnd) - 18 * Math.sin(u * TAU);
      const x = item.baseX + Math.sin(u * TAU * item.swayFreq + item.swayPhase) * item.swayAmp;

      // Primary rotation & secondary delayed pendulum angles for trailing charms
      const rot = item.rotBase + item.rotAmp * Math.sin(item.rotFreq * p1 + item.swayPhase);
      const swayVel = Math.cos(u * TAU * item.swayFreq + item.swayPhase);
      const lag1 = -0.18 * swayVel + 0.14 * Math.sin(p2 - 0.7 + item.swayPhase);
      const lag2 = -0.26 * swayVel + 0.20 * Math.sin(p2 - 1.3 + item.swayPhase);

      renderCelestialOrnament(
        ctx,
        item,
        x,
        y,
        item.baseScale * (0.35 + 0.65 * env),
        rot,
        env,
        phase,
        lag1,
        lag2
      );
    }

    // 5. Draw the 9 Buoyant Hero Stars & Tiny Crescent Moons (Surging & Hovering in the Heart of Frame)
    for (let i = 0; i < heroSpecs.length; i++) {
      const h = heroSpecs[i];
      const off = h.pOff * TAU;

      // Buoyant upward-surging periodic motion (quick graceful lift, gentle float)
      const surgeY = -88 * Math.sin(p1 + off) - 26 * Math.sin(p2 + off * 1.5);
      const driftX = 38 * Math.cos(p1 + off * 0.8) + 14 * Math.sin(p2 + off);

      const hx = h.bx + driftX;
      const hy = h.by + surgeY;

      const rot = 0.12 * Math.sin(p1 + off - 0.3) + 0.04 * Math.cos(p2 + off);
      const lag1 = 0.18 * Math.sin(p1 + off - 0.95) + 0.06 * Math.cos(p2 + off - 0.6);
      const lag2 = 0.25 * Math.sin(p1 + off - 1.45) + 0.09 * Math.sin(p3 + off - 1.1);

      const heroItem = {
        kind: h.kind,
        variant: h.variant,
        hasInnerStar: h.hasInnerStar,
        flipX: h.flipX,
        tailType: h.tailType,
        twinkleFreq: 2,
        twinklePhase: off
      };

      renderCelestialOrnament(ctx, heroItem, hx, hy, h.scale, rot, 1.0, phase, lag1, lag2);

      // Emit a pair of rising wake sparkles trailing below each Hero Ornament
      for (let w = 0; w < 2; w++) {
        const wu = (phase * 2 + h.pOff + w * 0.5) % 1;
        const wEnv = Math.sin(wu * Math.PI);
        const wx = hx + Math.sin(wu * TAU + w * 2.1) * 28;
        const wy = hy + 95 * h.scale + wu * 90;
        drawSparkleShape(
          ctx,
          wx,
          wy,
          (18 - w * 4) * wEnv,
          p1 + w,
          w === 0 ? 'four' : 'orb',
          '#FFFFFF',
          w === 0 ? '#FFE885' : '#72F7C2',
          w === 0 ? 'rgba(255, 180, 30, 0)' : 'rgba(18, 184, 125, 0)',
          wEnv * 0.85
        );
      }
    }

    // 6. Draw Foreground Continuously Rising Stars & Tiny Crescent Moons (depthLayer === 2)
    for (let i = 0; i < NUM_RISING; i++) {
      const item = risingOrnaments[i];
      if (item.depthLayer !== 2) continue;

      const u = (phase * item.cycles + item.phaseOffset) % 1;
      const env = getSeamlessEnvelope(u);

      const y = item.yStart - u * (item.yStart - item.yEnd) - 22 * Math.sin(u * TAU);
      const x = item.baseX + Math.sin(u * TAU * item.swayFreq + item.swayPhase) * item.swayAmp;

      const rot = item.rotBase + item.rotAmp * Math.sin(item.rotFreq * p1 + item.swayPhase);
      const swayVel = Math.cos(u * TAU * item.swayFreq + item.swayPhase);
      const lag1 = -0.18 * swayVel + 0.15 * Math.sin(p2 - 0.7 + item.swayPhase);
      const lag2 = -0.26 * swayVel + 0.22 * Math.sin(p2 - 1.3 + item.swayPhase);

      renderCelestialOrnament(
        ctx,
        item,
        x,
        y,
        item.baseScale * (0.35 + 0.65 * env),
        rot,
        env,
        phase,
        lag1,
        lag2
      );
    }

    // 7. Draw Foreground Layer Rising Sparkles (layer === 1)
    for (let i = 0; i < NUM_SPARKLES; i++) {
      const s = sparkles[i];
      if (s.layer !== 1) continue;

      const u = (phase * s.cycles + s.phaseOffset) % 1;
      const env = getSeamlessEnvelope(u);
      const sy = s.yStart - u * (s.yStart - s.yEnd);
      const sx = s.bx + Math.sin(u * TAU * s.swayFreq + s.swayPhase) * s.swayAmp;

      const tw = 0.5 + 0.5 * Math.sin(s.twinkleFreq * p1 + s.twinklePhase);
      const pulse = Math.pow(tw, 1.55) * env;
      const rad = s.size * (0.32 + 0.68 * pulse);
      const alpha = 0.95 * pulse;
      const rot = s.rotBase + s.rotFreq * p1 * 0.5;

      drawSparkleShape(ctx, sx, sy, rad, rot, s.type, s.colorCore, s.colorMid, s.colorOuter, alpha);
    }
  };

  // Normal playback loop
  function animate(now) {
    window.renderFrame(now * 0.001);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
