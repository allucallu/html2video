<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancient Magic Summoning Circle</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;
const CYCLES = 2; // 2 complete rhythmic summoning surges per 10-second loop

// Seeded deterministic PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(309481);

// Hand-painted AAA Game VFX Palette (Rich, natural, non-fluorescent: warm pale core -> burnished gold / deep lapis -> desaturated slate/bronze edges)
const PAL = {
  coreWhiteGold: '#FFF7E2',
  paleGold: '#F4D99B',
  arcaneGold: '#D6A144',
  burnishedGold: '#9E6B22',
  darkBronze: '#52340E',
  deepUmber: '#261705',
  paleAstralBlue: '#B8D4EE',
  lapisBlue: '#4876B0',
  cobaltDeep: '#244575',
  midnightSlate: '#11223D',
  obsidianBlue: '#070F1C'
};

// Precompute 24 Ancient Rune Glyph definitions (strokes in normalized [-1, 1] box)
const RUNE_GLYPHS = [
  [[-0.5, -0.8, -0.5, 0.8], [-0.5, -0.3, 0.5, -0.8], [-0.5, 0.2, 0.5, 0.7], [0.1, -0.5, 0.5, 0.1]],
  [[0, -0.85, 0, 0.85], [-0.6, -0.4, 0, -0.85], [0.6, -0.4, 0, -0.85], [-0.5, 0.3, 0.5, 0.3]],
  [[-0.5, -0.8, 0.5, 0], [0.5, 0, -0.5, 0.8], [-0.5, -0.8, -0.5, 0.8], [0.1, -0.6, 0.6, -0.6]],
  [[-0.5, -0.8, -0.5, 0.8], [0.5, -0.8, 0.5, 0.8], [-0.5, -0.2, 0.5, 0.3], [-0.2, -0.8, 0.2, -0.8]],
  [[0, -0.85, -0.6, 0.1], [-0.6, 0.1, 0, 0.85], [0, 0.85, 0.6, 0.1], [0, -0.4, 0, 0.4]],
  [[-0.5, -0.8, 0.5, 0.8], [0.5, -0.8, -0.5, 0.8], [0, -0.85, 0, -0.3], [-0.4, 0.8, 0.4, 0.8]],
  [[-0.4, -0.85, -0.4, 0.85], [-0.4, -0.85, 0.5, -0.35], [0.5, -0.35, -0.4, 0.1], [-0.4, 0.1, 0.5, 0.75]],
  [[0, -0.85, 0, 0.85], [-0.55, -0.25, 0, 0.35], [0.55, -0.25, 0, 0.35], [-0.4, -0.75, 0.4, -0.75]],
  [[-0.5, -0.8, 0.5, -0.8], [0, -0.8, 0, 0.8], [-0.5, 0.1, 0.5, -0.3], [-0.4, 0.8, 0.4, 0.8]],
  [[-0.55, -0.7, 0, -0.2], [0.55, -0.7, 0, -0.2], [0, -0.2, 0, 0.85], [-0.5, 0.35, 0.5, 0.35]],
  [[-0.5, -0.8, -0.5, 0.8], [-0.5, 0, 0.5, -0.7], [-0.1, -0.35, 0.55, 0.8], [0.2, 0, 0.6, 0]],
  [[0, -0.85, -0.55, -0.2], [-0.55, -0.2, 0.55, 0.2], [0.55, 0.2, 0, 0.85], [0, -0.85, 0, 0.85]]
];

// Precompute subtle hand-painted brushwork texture arcs inside the stone/metal rings
const BRUSH_STROKES = [];
for (let i = 0; i < 160; i++) {
  BRUSH_STROKES.push({
    r: 145 + rand() * 640,
    aStart: rand() * TAU,
    aSpan: 0.06 + rand() * 0.22,
    width: 4 + rand() * 14,
    isGold: rand() > 0.55,
    isDark: rand() > 0.48,
    alpha: 0.06 + rand() * 0.12
  });
}

// Precompute 68 deterministic arcane motes & floating micro-runes
const PARTICLES = [];
const NUM_PARTICLES = 68;
for (let i = 0; i < NUM_PARTICLES; i++) {
  PARTICLES.push({
    baseAngle: (i / NUM_PARTICLES) * TAU + (rand() - 0.5) * 0.15,
    baseRadius: 110 + rand() * 680,
    radialTravel: 55 + rand() * 115,
    spiralTwist: (rand() - 0.5) * 0.45,
    cycleOffset: rand(), // Phase offset within the ritual cycle
    orbitDir: rand() > 0.5 ? 1 : -1,
    size: 4 + rand() * 10,
    isGold: rand() > 0.38,
    isGlyph: rand() > 0.72,
    glyphIdx: i % RUNE_GLYPHS.length
  });
}

// Helper: Draw a custom ancient rune at (0,0) scaled by size
function traceRuneGlyph(glyphIdx, size) {
  const strokes = RUNE_GLYPHS[glyphIdx % RUNE_GLYPHS.length];
  ctx.beginPath();
  for (let i = 0; i < strokes.length; i++) {
    const s = strokes[i];
    ctx.moveTo(s[0] * size, s[1] * size);
    ctx.lineTo(s[2] * size, s[3] * size);
  }
}

// Helper: Hand-painted chiseled metallic gold stroke (dark bronze bevel -> burnished gold -> warm pale core)
function strokePaintedGold(pathFn, baseWidth, energyIntensity = 0) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Deep umber/bronze recessed shadow border
  ctx.strokeStyle = PAL.deepUmber;
  ctx.lineWidth = baseWidth + 5;
  pathFn();
  ctx.stroke();

  // Weathered antique bronze mid-layer
  ctx.strokeStyle = PAL.burnishedGold;
  ctx.lineWidth = baseWidth;
  pathFn();
  ctx.stroke();

  // Arcane gold main ridge
  ctx.strokeStyle = PAL.arcaneGold;
  ctx.lineWidth = baseWidth * 0.58;
  pathFn();
  ctx.stroke();

  // Warm pale highlight core (brightens during ritual surge)
  ctx.strokeStyle = energyIntensity > 0.25 ? PAL.coreWhiteGold : PAL.paleGold;
  ctx.lineWidth = baseWidth * (0.24 + 0.14 * energyIntensity);
  ctx.globalAlpha = 0.65 + 0.35 * energyIntensity;
  pathFn();
  ctx.stroke();

  ctx.restore();
}

// Helper: Restrained small-radius core glow (strictly localized, no screen-washing bloom)
function drawRestrainedCoreGlow(x, y, radius, alpha, isGold = true) {
  if (alpha <= 0.01) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  if (isGold) {
    g.addColorStop(0.0, `rgba(255, 247, 226, ${alpha})`);
    g.addColorStop(0.32, `rgba(214, 161, 68, ${alpha * 0.65})`);
    g.addColorStop(0.68, `rgba(140, 88, 22, ${alpha * 0.22})`);
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  } else {
    g.addColorStop(0.0, `rgba(210, 232, 252, ${alpha})`);
    g.addColorStop(0.35, `rgba(72, 118, 176, ${alpha * 0.65})`);
    g.addColorStop(0.72, `rgba(28, 56, 98, ${alpha * 0.22})`);
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TAU);
  ctx.fill();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Rhythmic Cycle Behavior: 2 complete ritual cycles inside the 10-second loop
  // cPhase goes from 0.0 -> 1.0 twice per 10s loop.
  // At cPhase = 0.0 and cPhase = 1.0 (which includes phase = 0 and phase = 1),
  // the ritual surge envelope is at 0.0 (completely faded out to resting ember baseline).
  const cPhase = (phase * CYCLES) % 1.0;

  // Smooth bell-shaped ritual surge envelope: 0 at cPhase=0, peaks at cPhase=0.52, fades completely to 0 before cPhase=1
  const rawCycleSin = Math.sin(Math.PI * cPhase);
  const surgeEnvelope = Math.pow(rawCycleSin, 2.6);

  // Anticipation gather (peaks around cPhase = 0.28) vs Release climax (peaks around cPhase = 0.58)
  const gatherWave = Math.pow(Math.sin(Math.PI * Math.min(1, cPhase * 1.6)), 2.2) * (1 - cPhase);
  const climaxWave = Math.pow(Math.max(0, Math.sin(Math.PI * (cPhase - 0.18) / 0.72)), 3.2)
                     * (cPhase > 0.18 && cPhase < 0.90 ? 1 : 0);

  // Primary Rotational Harmonics (Integer turns over the 10s loop)
  const rotOuter = TAU * phase * 1;          // +1 full turn
  const rotOctagram = -TAU * phase * 1;      // -1 full turn
  const rotMiddle = TAU * phase * 2;         // +2 full turns
  const rotInner = -TAU * phase * 2;         // -2 full turns

  // Subtle breathing scale synchronized with the 2 ritual cycles
  const circleScale = 1.0 - 0.014 * gatherWave + 0.022 * climaxWave;

  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(circleScale, circleScale);

  // =========================================================================
  // 1. BASE CONTAINED SUBSURFACE MANA BED (Dark midnight lapis & bronze, fades to #000000)
  // =========================================================================
  const bedRadius = 855;
  const bedGrad = ctx.createRadialGradient(0, 0, 40, 0, 0, bedRadius);
  bedGrad.addColorStop(0.0, `rgba(42, 78, 128, ${0.28 + 0.22 * surgeEnvelope})`);
  bedGrad.addColorStop(0.38, `rgba(22, 44, 78, ${0.22 + 0.14 * surgeEnvelope})`);
  bedGrad.addColorStop(0.68, `rgba(14, 28, 52, ${0.14 + 0.08 * surgeEnvelope})`);
  bedGrad.addColorStop(0.88, 'rgba(6, 12, 24, 0.05)');
  bedGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = bedGrad;
  ctx.beginPath();
  ctx.arc(0, 0, bedRadius, 0, TAU);
  ctx.fill();

  // =========================================================================
  // 2. OUTER ASTRAL COMPASS & CARVED LAPIS STONE RING (Radius 635 to 790)
  // =========================================================================
  ctx.save();
  ctx.rotate(rotOuter);

  // 8 Outer Cardinal & Ordinal Spear Finials (reaching R = 835, safe margin >240px from canvas edge)
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8;
    const isCardinal = (i % 2 === 0);
    const tipR = (isCardinal ? 835 : 795) + 12 * climaxWave;
    const baseR = 725;
    const halfSpan = isCardinal ? 0.065 : 0.048;

    const xTip = Math.cos(a) * tipR;
    const yTip = Math.sin(a) * tipR;
    const xL = Math.cos(a - halfSpan) * baseR;
    const yL = Math.sin(a - halfSpan) * baseR;
    const xR = Math.cos(a + halfSpan) * baseR;
    const yR = Math.sin(a + halfSpan) * baseR;

    const spearPath = () => {
      ctx.beginPath();
      ctx.moveTo(xL, yL);
      ctx.lineTo(xTip, yTip);
      ctx.lineTo(xR, yR);
      ctx.closePath();
    };

    const spGrad = ctx.createRadialGradient(0, 0, baseR, 0, 0, tipR);
    spGrad.addColorStop(0.0, PAL.midnightSlate);
    spGrad.addColorStop(0.55, isCardinal ? PAL.cobaltDeep : PAL.darkBronze);
    spGrad.addColorStop(1.0, isCardinal ? PAL.arcaneGold : PAL.burnishedGold);
    spearPath();
    ctx.fillStyle = spGrad;
    ctx.fill();
    strokePaintedGold(spearPath, 5.5, surgeEnvelope * 0.7);
  }

  // Main Outer Carved Lapis-Stone Annulus (R = 636 to 736)
  ctx.beginPath();
  ctx.arc(0, 0, 736, 0, TAU, false);
  ctx.arc(0, 0, 636, 0, TAU, true);
  ctx.closePath();

  const outerRingGrad = ctx.createRadialGradient(0, 0, 636, 0, 0, 736);
  outerRingGrad.addColorStop(0.0, PAL.obsidianBlue);
  outerRingGrad.addColorStop(0.22, PAL.midnightSlate);
  outerRingGrad.addColorStop(0.52, PAL.cobaltDeep);
  outerRingGrad.addColorStop(0.82, PAL.midnightSlate);
  outerRingGrad.addColorStop(1.0, PAL.obsidianBlue);
  ctx.fillStyle = outerRingGrad;
  ctx.fill();

  // Subtle hand-painted brushstroke texture inside the stone ring
  ctx.save();
  ctx.clip();
  ctx.lineCap = 'round';
  for (let i = 0; i < BRUSH_STROKES.length; i++) {
    const b = BRUSH_STROKES[i];
    if (b.r >= 636 && b.r <= 736) {
      ctx.strokeStyle = b.isDark
        ? `rgba(5, 11, 22, ${b.alpha * 1.4})`
        : (b.isGold ? `rgba(195, 140, 55, ${b.alpha})` : `rgba(95, 145, 205, ${b.alpha})`);
      ctx.lineWidth = b.width;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, b.aStart, b.aStart + b.aSpan);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Radial Partition Bars & 24 Ancient Runes along the Outer Band
  const numRunes = 24;
  for (let i = 0; i < numRunes; i++) {
    const a0 = (i * TAU) / numRunes;
    const aMid = ((i + 0.5) * TAU) / numRunes;

    // Partition divider bar
    ctx.strokeStyle = PAL.burnishedGold;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0) * 640, Math.sin(a0) * 640);
    ctx.lineTo(Math.cos(a0) * 732, Math.sin(a0) * 732);
    ctx.stroke();

    // Sequential rune ignition wave during each of the 2 ritual cycles
    const waveDiff = Math.cos(aMid - cPhase * TAU * 2);
    const runeCharge = Math.max(0, waveDiff * 0.5 + 0.5) * surgeEnvelope;

    const rx = Math.cos(aMid) * 686;
    const ry = Math.sin(aMid) * 686;

    // Restrained small-radius glow strictly on the rune core when charged
    if (runeCharge > 0.15) {
      drawRestrainedCoreGlow(rx, ry, 34, runeCharge * 0.65, i % 2 === 0);
    }

    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(aMid + Math.PI / 2);

    // Carved dark recess behind rune
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    traceRuneGlyph(i, 24);
    ctx.strokeStyle = PAL.obsidianBlue;
    ctx.lineWidth = 9;
    ctx.stroke();

    // Main rune stroke (shifts from weathered bronze to bright pale gold/astral blue on surge)
    traceRuneGlyph(i, 24);
    ctx.strokeStyle = runeCharge > 0.45
      ? PAL.coreWhiteGold
      : (runeCharge > 0.15 ? PAL.paleGold : PAL.arcaneGold);
    ctx.lineWidth = 4.5 + 2.0 * runeCharge;
    ctx.stroke();
    ctx.restore();
  }

  // Chiseled Gold Rims of the Outer Rune Band
  strokePaintedGold(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 736, 0, TAU);
  }, 8, surgeEnvelope);

  strokePaintedGold(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 636, 0, TAU);
  }, 8, surgeEnvelope);

  ctx.restore(); // End Outer Ring

  // =========================================================================
  // 3. INTERLOCKING OCTAGRAM & ASTRAL ECLIPSE NODES (Radius 420 to 636)
  // =========================================================================
  ctx.save();
  ctx.rotate(rotOctagram);

  // Recessed dark lapis channel ring at R = 420..636
  const midBasinGrad = ctx.createRadialGradient(0, 0, 420, 0, 0, 636);
  midBasinGrad.addColorStop(0.0, 'rgba(8, 18, 34, 0.82)');
  midBasinGrad.addColorStop(0.5, 'rgba(18, 38, 68, 0.65)');
  midBasinGrad.addColorStop(1.0, 'rgba(7, 15, 28, 0.85)');
  ctx.fillStyle = midBasinGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 636, 0, TAU, false);
  ctx.arc(0, 0, 420, 0, TAU, true);
  ctx.closePath();
  ctx.fill();

  // 8 Painted Arcane Mana Conduits radiating between R=420 and R=636
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8 + Math.PI / 8;
    const x0 = Math.cos(a) * 422;
    const y0 = Math.sin(a) * 422;
    const x1 = Math.cos(a) * 634;
    const y1 = Math.sin(a) * 634;

    // Mana channel glow (tight width)
    ctx.strokeStyle = `rgba(72, 118, 176, ${0.28 + 0.55 * surgeEnvelope})`;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();

    ctx.strokeStyle = `rgba(244, 217, 155, ${0.35 + 0.6 * surgeEnvelope})`;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // Two Interwoven Arcane Squares forming the Grand Octagram (Vertices at R = 632)
  for (let sq = 0; sq < 2; sq++) {
    const baseA = (sq * Math.PI) / 4;
    const sqPath = () => {
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = baseA + (k * Math.PI) / 2;
        const vx = Math.cos(a) * 630;
        const vy = Math.sin(a) * 630;
        if (k === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
    };

    // Painted double-line transmutation track
    strokePaintedGold(sqPath, 10, surgeEnvelope * 0.85);

    // Inner inscribed parallel square
    const innerSqPath = () => {
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = baseA + (k * Math.PI) / 2;
        const vx = Math.cos(a) * 596;
        const vy = Math.sin(a) * 596;
        if (k === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
    };
    strokePaintedGold(innerSqPath, 4.5, surgeEnvelope * 0.6);
  }

  // 8 Astral Crescent & Cabochon Seal Nodes at the Octagram Vertices (R = 535)
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8;
    const nx = Math.cos(a) * 535;
    const ny = Math.sin(a) * 535;

    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(a);

    // Outer bronze/gold crescent cradle
    const crescPath = () => {
      ctx.beginPath();
      ctx.arc(0, 0, 48, -Math.PI * 0.72, Math.PI * 0.72, false);
      ctx.arc(14, 0, 40, Math.PI * 0.65, -Math.PI * 0.65, true);
      ctx.closePath();
    };
    ctx.fillStyle = PAL.arcaneGold;
    crescPath();
    ctx.fill();
    strokePaintedGold(crescPath, 4, surgeEnvelope);

    // Hand-painted Lapis & Gold Orb inside each node
    const orbGrad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 28);
    if (i % 2 === 0) {
      orbGrad.addColorStop(0.0, surgeEnvelope > 0.3 ? PAL.coreWhiteGold : PAL.paleAstralBlue);
      orbGrad.addColorStop(0.42, PAL.lapisBlue);
      orbGrad.addColorStop(0.85, PAL.midnightSlate);
      orbGrad.addColorStop(1.0, PAL.obsidianBlue);
    } else {
      orbGrad.addColorStop(0.0, PAL.coreWhiteGold);
      orbGrad.addColorStop(0.45, PAL.arcaneGold);
      orbGrad.addColorStop(0.85, PAL.darkBronze);
      orbGrad.addColorStop(1.0, PAL.deepUmber);
    }
    ctx.fillStyle = orbGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 27, 0, TAU);
    ctx.fill();

    strokePaintedGold(() => {
      ctx.beginPath();
      ctx.arc(0, 0, 27, 0, TAU);
    }, 4.5, surgeEnvelope);

    // Small restrained core glow on the node jewel during ritual surge
    drawRestrainedCoreGlow(0, 0, 26, surgeEnvelope * 0.7, i % 2 !== 0);

    ctx.restore();
  }
  ctx.restore(); // End Octagram Layer

  // =========================================================================
  // 4. MIDDLE ROTATING SCRIPT BAND & HEXAGRAM CHORDS (Radius 290 to 420)
  // =========================================================================
  ctx.save();
  ctx.rotate(rotMiddle);

  // Middle Painted Slate & Bronze Ring (R = 355 to 420)
  ctx.beginPath();
  ctx.arc(0, 0, 420, 0, TAU, false);
  ctx.arc(0, 0, 355, 0, TAU, true);
  ctx.closePath();

  const midRingGrad = ctx.createRadialGradient(0, 0, 355, 0, 0, 420);
  midRingGrad.addColorStop(0.0, PAL.deepUmber);
  midRingGrad.addColorStop(0.3, PAL.darkBronze);
  midRingGrad.addColorStop(0.5, PAL.burnishedGold);
  midRingGrad.addColorStop(0.7, PAL.darkBronze);
  midRingGrad.addColorStop(1.0, PAL.obsidianBlue);
  ctx.fillStyle = midRingGrad;
  ctx.fill();

  // 12 Inscribed Arcane Sigils around the Middle Ring
  for (let i = 0; i < 12; i++) {
    const a = (i * TAU) / 12;
    const rx = Math.cos(a) * 387;
    const ry = Math.sin(a) * 387;

    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(a + Math.PI / 2);

    traceRuneGlyph(i + 5, 16);
    ctx.strokeStyle = surgeEnvelope > 0.35 ? PAL.coreWhiteGold : PAL.paleGold;
    ctx.lineWidth = 3.8;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    // Small golden rivet studs between runes
    const aStud = a + Math.PI / 12;
    const sx = Math.cos(aStud) * 387;
    const sy = Math.sin(aStud) * 387;
    ctx.fillStyle = PAL.paleGold;
    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, TAU);
    ctx.fill();
  }

  strokePaintedGold(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 420, 0, TAU);
  }, 7, surgeEnvelope);

  strokePaintedGold(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 355, 0, TAU);
  }, 6.5, surgeEnvelope);

  // Interlaced Hexagram (Two equilateral triangles at R = 355)
  for (let tri = 0; tri < 2; tri++) {
    const tOffset = (tri * Math.PI) / 3;
    const triPath = () => {
      ctx.beginPath();
      for (let k = 0; k < 3; k++) {
        const a = tOffset + (k * TAU) / 3;
        const vx = Math.cos(a) * 352;
        const vy = Math.sin(a) * 352;
        if (k === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
    };
    strokePaintedGold(triPath, 7.5, surgeEnvelope * 0.9);
  }

  ctx.restore(); // End Middle Layer

  // =========================================================================
  // 5. INNER SANCTUM & SWIRLING PAINTED MANA WISPS (Radius 135 to 290)
  // =========================================================================
  ctx.save();
  ctx.rotate(rotInner);

  // Deep Lapis Inner Sanctum Basin (R = 135 to 285)
  const sanctumGrad = ctx.createRadialGradient(0, 0, 120, 0, 0, 285);
  sanctumGrad.addColorStop(0.0, PAL.cobaltDeep);
  sanctumGrad.addColorStop(0.55, PAL.midnightSlate);
  sanctumGrad.addColorStop(1.0, PAL.obsidianBlue);
  ctx.fillStyle = sanctumGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 285, 0, TAU);
  ctx.fill();

  // Hand-painted Swirling Energy Wisps (Secondary motion: curling inward during gather, flaring on climax)
  for (let i = 0; i < 8; i++) {
    const baseA = (i * TAU) / 8;
    const wispTwist = 0.55 + 0.35 * gatherWave - 0.25 * climaxWave;
    const rOuter = 275;
    const rInner = 135;

    const x0 = Math.cos(baseA) * rOuter;
    const y0 = Math.sin(baseA) * rOuter;
    const xCtrl1 = Math.cos(baseA + wispTwist * 0.45) * 225;
    const yCtrl1 = Math.sin(baseA + wispTwist * 0.45) * 225;
    const xCtrl2 = Math.cos(baseA + wispTwist * 0.85) * 175;
    const yCtrl2 = Math.sin(baseA + wispTwist * 0.85) * 175;
    const x1 = Math.cos(baseA + wispTwist) * rInner;
    const y1 = Math.sin(baseA + wispTwist) * rInner;

    // Tapered painted energy brushstroke
    const wispGrad = ctx.createLinearGradient(x0, y0, x1, y1);
    if (i % 2 === 0) {
      wispGrad.addColorStop(0.0, 'rgba(36, 69, 117, 0.1)');
      wispGrad.addColorStop(0.5, `rgba(72, 118, 176, ${0.45 + 0.45 * surgeEnvelope})`);
      wispGrad.addColorStop(1.0, `rgba(184, 212, 238, ${0.7 + 0.3 * surgeEnvelope})`);
    } else {
      wispGrad.addColorStop(0.0, 'rgba(82, 52, 14, 0.1)');
      wispGrad.addColorStop(0.5, `rgba(214, 161, 68, ${0.45 + 0.45 * surgeEnvelope})`);
      wispGrad.addColorStop(1.0, `rgba(255, 247, 226, ${0.7 + 0.3 * surgeEnvelope})`);
    }

    ctx.strokeStyle = wispGrad;
    ctx.lineWidth = 10 + 8 * surgeEnvelope;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(xCtrl1, yCtrl1, xCtrl2, yCtrl2, x1, y1);
    ctx.stroke();

    // Crisp bright filament inside each painted wisp
    ctx.strokeStyle = (i % 2 === 0) ? PAL.paleAstralBlue : PAL.coreWhiteGold;
    ctx.lineWidth = 2.5 + 2.0 * surgeEnvelope;
    ctx.globalAlpha = 0.55 + 0.45 * surgeEnvelope;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  }

  // Ring border at R = 285
  strokePaintedGold(() => {
    ctx.beginPath();
    ctx.arc(0, 0, 285, 0, TAU);
  }, 6.5, surgeEnvelope);

  // 8 Diamond Rune-Stones Mounted on the Inner Threshold (R = 285)
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8;
    const sx = Math.cos(a) * 285;
    const sy = Math.sin(a) * 285;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a);

    const gemPath = () => {
      ctx.beginPath();
      ctx.moveTo(26, 0);
      ctx.lineTo(0, 16);
      ctx.lineTo(-26, 0);
      ctx.lineTo(0, -16);
      ctx.closePath();
    };
    const gemGrad = ctx.createRadialGradient(-4, -3, 1, 0, 0, 24);
    gemGrad.addColorStop(0.0, PAL.coreWhiteGold);
    gemGrad.addColorStop(0.45, PAL.lapisBlue);
    gemGrad.addColorStop(1.0, PAL.obsidianBlue);
    gemPath();
    ctx.fillStyle = gemGrad;
    ctx.fill();
    strokePaintedGold(gemPath, 4, surgeEnvelope);
    ctx.restore();
  }

  ctx.restore(); // End Inner Sanctum

  // =========================================================================
  // 6. THE ARCANE NEXUS CORE (Radius 0 to 145)
  // Bright warm/pale core that darkens toward deeper desaturated edges
  // =========================================================================
  ctx.save();
  ctx.rotate(rotOuter * 2);

  // 8-Pointed Hand-Painted Arcane Star Seal at Center
  const starPath = () => {
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i * TAU) / 16;
      const r = (i % 2 === 0) ? (142 + 12 * climaxWave) : (78 - 6 * gatherWave);
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  };

  const starGrad = ctx.createRadialGradient(0, 0, 8, 0, 0, 148);
  starGrad.addColorStop(0.0, PAL.coreWhiteGold);
  starGrad.addColorStop(0.32, PAL.paleGold);
  starGrad.addColorStop(0.65, PAL.arcaneGold);
  starGrad.addColorStop(0.88, PAL.burnishedGold);
  starGrad.addColorStop(1.0, PAL.darkBronze);
  starPath();
  ctx.fillStyle = starGrad;
  ctx.fill();
  strokePaintedGold(starPath, 6, surgeEnvelope);

  // Recessed Lapis Octagon inside the Central Star
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * TAU) / 8 + Math.PI / 8;
    const r = 68;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  const innerOctGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 68);
  innerOctGrad.addColorStop(0.0, PAL.paleAstralBlue);
  innerOctGrad.addColorStop(0.45, PAL.lapisBlue);
  innerOctGrad.addColorStop(0.85, PAL.cobaltDeep);
  innerOctGrad.addColorStop(1.0, PAL.obsidianBlue);
  ctx.fillStyle = innerOctGrad;
  ctx.fill();
  ctx.strokeStyle = PAL.arcaneGold;
  ctx.lineWidth = 4;
  ctx.stroke();

  // Restrained Small-Radius Soft Glow strictly on the Brightest Central Core
  const coreRadius = 82 + 28 * surgeEnvelope;
  drawRestrainedCoreGlow(0, 0, coreRadius, 0.72 + 0.28 * surgeEnvelope, true);

  // Central Bright Warm Pale Core Jewel & Starburst
  const heartGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 36 + 10 * climaxWave);
  heartGrad.addColorStop(0.0, '#FFFFFF');
  heartGrad.addColorStop(0.38, PAL.coreWhiteGold);
  heartGrad.addColorStop(0.75, PAL.arcaneGold);
  heartGrad.addColorStop(1.0, PAL.darkBronze);
  ctx.fillStyle = heartGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 34 + 8 * climaxWave, 0, TAU);
  ctx.fill();

  // Sharp painted 4-point core flare
  const flareLen = 48 + 38 * surgeEnvelope;
  ctx.fillStyle = PAL.coreWhiteGold;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    const r = (i % 2 === 0) ? flareLen : 9;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore(); // End Central Core

  // =========================================================================
  // 7. RHYTHMIC SUMMONING PULSE WAVE (Expands & fully fades out each cycle)
  // =========================================================================
  // Begins at cPhase = 0.20, expands across the circle, and fades completely to 0 by cPhase = 0.94
  if (cPhase > 0.20 && cPhase < 0.94) {
    const waveU = (cPhase - 0.20) / 0.74; // 0.0 -> 1.0 within the cycle
    const easeOut = 1 - Math.pow(1 - waveU, 2.2);
    const waveR = 95 + easeOut * 690;

    // Smooth fade-in and complete fade-out before cycle ends
    const waveAlpha = Math.sin(Math.PI * waveU) * Math.pow(1 - waveU, 1.3) * 0.85;

    ctx.save();
    // Outer painted lapis/gold shockwave band
    const ringGrad = ctx.createRadialGradient(0, 0, Math.max(1, waveR - 38), 0, 0, waveR + 18);
    ringGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
    ringGrad.addColorStop(0.45, `rgba(72, 118, 176, ${waveAlpha * 0.45})`);
    ringGrad.addColorStop(0.78, `rgba(244, 217, 155, ${waveAlpha * 0.85})`);
    ringGrad.addColorStop(0.92, `rgba(255, 247, 226, ${waveAlpha})`);
    ringGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = ringGrad;
    ctx.beginPath();
    ctx.arc(0, 0, waveR + 18, 0, TAU, false);
    ctx.arc(0, 0, Math.max(0, waveR - 38), 0, TAU, true);
    ctx.closePath();
    ctx.fill();

    // 16 Arcane Geometric Notches riding along the expanding wave crest
    ctx.strokeStyle = `rgba(255, 247, 226, ${waveAlpha * 0.9})`;
    ctx.lineWidth = 3.5;
    for (let k = 0; k < 16; k++) {
      const a = (k * TAU) / 16 + waveU * 0.4;
      const rIn = waveR - 14;
      const rOut = waveR + 10;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
      ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
      ctx.stroke();
    }
    ctx.restore();
  }

  // =========================================================================
  // 8. AMBIENT ARCANE MOTES & FLOATING MINI-RUNES (Wrapped within the 2 cycles)
  // =========================================================================
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const p = PARTICLES[i];

    // Each particle has a lifecycle tied to the rhythmic cycle so it wraps seamlessly
    const pLife = (cPhase + p.cycleOffset) % 1.0;
    const pAlpha = Math.pow(Math.sin(Math.PI * pLife), 2.0);

    if (pAlpha > 0.02) {
      const r = p.baseRadius + (pLife - 0.5) * p.radialTravel;
      const a = p.baseAngle + p.orbitDir * TAU * phase + pLife * p.spiralTwist;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;

      if (p.isGlyph) {
        // Floating glowing micro-rune
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a + Math.PI / 2);
        ctx.globalAlpha = pAlpha * 0.85;
        ctx.strokeStyle = p.isGold ? PAL.paleGold : PAL.paleAstralBlue;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        traceRuneGlyph(p.glyphIdx, p.size * 1.15);
        ctx.stroke();
        ctx.restore();
      } else {
        // Hand-painted tapered ember mote (warm pale core -> darker desaturated edge)
        drawRestrainedCoreGlow(px, py, p.size * 2.2, pAlpha * 0.85, p.isGold);
        ctx.fillStyle = p.isGold ? PAL.coreWhiteGold : PAL.paleAstralBlue;
        ctx.globalAlpha = pAlpha;
        ctx.beginPath();
        ctx.arc(px, py, p.size * 0.42, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }
  }

  ctx.restore(); // End Circle Scale & Center Translate
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
