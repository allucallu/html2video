<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Star Burst Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(394827);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Generate a hand-drawn radiating marker ray from innerR to outerR along angle
function createRadiatingRay(angle, innerR, outerR, archBow, minW, maxW, boilOffset, seedPhase) {
  const numSamples = 36;
  const pts = [];
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const nx = -sinA;
  const ny = cosA;

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const r = innerR + (outerR - innerR) * u;

    // Slight organic hand-drawn curve bow + micro marker wobble perpendicular to the ray
    const bowOffset = Math.sin(u * Math.PI) * archBow
                    + Math.sin(u * 19 + seedPhase) * 2.6
                    + Math.cos(u * 11 - seedPhase) * 1.8;
    const radialJitter = Math.sin(u * 15 + seedPhase) * 2.0;

    const x = cosA * (r + radialJitter) + nx * bowOffset;
    const y = sinA * (r + radialJitter) + ny * bowOffset;

    // Marker pressure variation (14-22px): fuller in the middle-inner third, slightly tapered at start/end caps
    const pressure = 0.45 + 0.55 * Math.sin(u * Math.PI * 0.85 + 0.15);
    let taper = 1.0;
    if (u < 0.08) taper = 0.72 + 0.28 * (u / 0.08);
    else if (u > 0.90) taper = 0.65 + 0.35 * ((1 - u) / 0.10);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x,
      y,
      u,
      angle,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// ============================================================================
// BUILD THE STAR BURST OF SHORT RADIATING HAND-DRAWN LINES
// Centered around (CX, CY), safe margins: outer radius <= 720px (well within 1080px half-height)
// ============================================================================
const PRIMARY_RAYS = [];
const SECONDARY_RAYS = [];
const OUTER_TRAIL_TICKS = [];

const NUM_MAIN_RAYS = 12;

for (let i = 0; i < NUM_MAIN_RAYS; i++) {
  const baseAngle = (i * TAU) / NUM_MAIN_RAYS + (rand() - 0.5) * 0.04;
  const isCardinal = (i % 3 === 0);

  // 1. Primary Inner-to-Mid Radiating Burst Lines (Held full at phase = 0 and phase = 1)
  const rIn1  = (isCardinal ? 165 : 195) + (rand() - 0.5) * 18;
  const rOut1 = (isCardinal ? 495 : 435) + (rand() - 0.5) * 28;
  const bow1  = (rand() - 0.5) * 22;

  // Angular wave offset around the clock face so rays ripple organically,
  // but centered around phaseOffset ~ 0.50 so ALL primary rays are in their full held window at phase=0 & phase=1!
  const waveOffset1 = 0.48 + 0.06 * Math.sin((i / NUM_MAIN_RAYS) * TAU * 2);

  PRIMARY_RAYS.push({
    pts: createRadiatingRay(baseAngle, rIn1, rOut1, bow1, 16, 22, (i * 28) % NUM_BOIL_SLOTS, i * 1.1),
    color: (i % 4 === 1) ? COLOR_YELLOW : COLOR_WHITE,
    phaseOff: waveOffset1,
    hasDoubleSketch: isCardinal
  });

  // Add a rough double-sketch companion line alongside the 4 major rays for authentic marker doodle feel
  if (isCardinal) {
    PRIMARY_RAYS.push({
      pts: createRadiatingRay(
        baseAngle + 0.032,
        rIn1 + 22,
        rOut1 - 28,
        -bow1 * 0.7,
        14,
        18,
        (i * 28 + 14) % NUM_BOIL_SLOTS,
        i * 2.3
      ),
      color: COLOR_WHITE,
      phaseOff: waveOffset1 - 0.02,
      hasDoubleSketch: false
    });
  }

  // 2. Secondary Interleaved Radiating Burst Lines (Between the primary rays, delayed outward ripple)
  const midAngle = ((i + 0.5) * TAU) / NUM_MAIN_RAYS + (rand() - 0.5) * 0.04;
  const rIn2  = 255 + (rand() - 0.5) * 22;
  const rOut2 = 535 + (rand() - 0.5) * 32;
  const bow2  = (rand() - 0.5) * 20;
  const waveOffset2 = 0.22 + 0.06 * Math.cos((i / NUM_MAIN_RAYS) * TAU * 2);

  SECONDARY_RAYS.push({
    pts: createRadiatingRay(midAngle, rIn2, rOut2, bow2, 15, 20, (200 + i * 24) % NUM_BOIL_SLOTS, i * 1.7 + 0.8),
    color: (i % 2 === 0) ? COLOR_YELLOW : COLOR_WHITE,
    phaseOff: waveOffset2
  });

  // 3. Outer Short Follow-Through Dash Ticks (Chasing outward beyond the primary rays)
  const rIn3  = 545 + (rand() - 0.5) * 18;
  const rOut3 = 675 + (rand() - 0.5) * 26;
  const waveOffset3 = 0.04 + 0.05 * Math.sin((i / NUM_MAIN_RAYS) * TAU * 3);

  OUTER_TRAIL_TICKS.push({
    pts: createRadiatingRay(baseAngle + (rand() - 0.5) * 0.03, rIn3, rOut3, (rand() - 0.5) * 12, 14, 19, (360 + i * 12) % NUM_BOIL_SLOTS, i * 3.1),
    color: (i % 2 === 0) ? COLOR_YELLOW : COLOR_WHITE,
    phaseOff: waveOffset3
  });
}

// 4. Central Hand-Drawn 8-Ray Micro Star Core at (0, 0) (Radius 28 to 112 px)
const CORE_MINI_RAYS = [];
for (let k = 0; k < 8; k++) {
  const a = (k * TAU) / 8 + 0.12;
  const rIn = 26;
  const rOut = (k % 2 === 0) ? 108 : 82;
  CORE_MINI_RAYS.push({
    pts: createRadiatingRay(a, rIn, rOut, (rand() - 0.5) * 8, 15, 20, (450 + k * 7) % NUM_BOIL_SLOTS, k * 0.9),
    color: (k % 2 === 0) ? COLOR_YELLOW : COLOR_WHITE,
    phaseOff: 0.52
  });
}

// Progressive Draw-On (Inner to Outer) -> Hold -> Erase from Start (Inner to Outer)
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.34]: Draws itself progressively from inner start to outer tip (uStart = 0, uEnd: 0 -> 1)
// - c in [0.34, 0.66]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.66, 0.96]: Erases from the inner start toward the outer tip (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.34) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.34) };
  } else if (c < 0.66) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.66) / 0.30), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a single radiating marker line between [uStart, uEnd] with discrete 12fps line boil & radial pulse
function renderRadiatingRay(rayObj, uStart, uEnd, boilStep, phase, radialPulseShift) {
  if (uEnd - uStart <= 0.003) return;

  const pts = rayObj.pts;
  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Subtle radial elastic stretch along the ray's direction vector
    const stretchDist = radialPulseShift * (0.4 + 0.6 * p.u);
    const rx = Math.cos(p.angle) * stretchDist;
    const ry = Math.sin(p.angle) * stretchDist;

    return {
      x: p.x + bx + rx,
      y: p.y + by + ry,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = rayObj.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing inner start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing outer end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Whole-burst organic squash & stretch, radial breathing, and rotational wobble (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const scaleX = 1.0 + 0.022 * sin2 - 0.010 * sin4;
  const scaleY = 1.0 - 0.022 * sin2 + 0.010 * sin4;
  const wobbleRot = 0.045 * sin1 + 0.022 * cos2;
  const radialBreath = 16 * sin2;

  ctx.save();
  ctx.translate(CX + 8 * cos1, CY + 8 * sin1);
  ctx.rotate(wobbleRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Radial Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  const baseCycle = phase * 2;

  // 1. Ambient Layer: Outer Short Trail Ticks (Shooting outward beyond the main burst)
  for (let i = 0; i < OUTER_TRAIL_TICKS.length; i++) {
    const tick = OUTER_TRAIL_TICKS[i];
    const win = getDrawEraseWindow(baseCycle + tick.phaseOff);
    renderRadiatingRay(tick, win.uStart, win.uEnd, boilStep, phase, radialBreath * 1.25);
  }

  // 2. Secondary Motion Layer: Interleaved Radiating Burst Lines (Delayed overlapping wave)
  for (let i = 0; i < SECONDARY_RAYS.length; i++) {
    const ray = SECONDARY_RAYS[i];
    const win = getDrawEraseWindow(baseCycle + ray.phaseOff);
    renderRadiatingRay(ray, win.uStart, win.uEnd, boilStep, phase, radialBreath);
  }

  // 3. Primary Motion Layer: 12 Main Bold Radiating Star Burst Lines (Held full at phase = 0 & phase = 1)
  for (let i = 0; i < PRIMARY_RAYS.length; i++) {
    const ray = PRIMARY_RAYS[i];
    const win = getDrawEraseWindow(baseCycle + ray.phaseOff);
    renderRadiatingRay(ray, win.uStart, win.uEnd, boilStep, phase, radialBreath);
  }

  // 4. Central Hand-Drawn Star Core (Anchors the burst center)
  for (let i = 0; i < CORE_MINI_RAYS.length; i++) {
    const coreRay = CORE_MINI_RAYS[i];
    const win = getDrawEraseWindow(baseCycle + coreRay.phaseOff);
    renderRadiatingRay(coreRay, win.uStart, win.uEnd, boilStep, phase, radialBreath * 0.5);
  }

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
