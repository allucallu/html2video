<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String of Ramadan Lanterns and Stars</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 3840;
  const H = 2160;
  const CX = W * 0.5;
  const CY = H * 0.5;
  const TAU = Math.PI * 2;

  window.DURATION = 10;
  window.FPS = 30;

  // Deterministic PRNG (Mulberry32)
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(20261109);

  // =========================================================================
  // 1. PRE-GENERATE DETERMINISTIC AMBIENT SPARKLES ALONG THE GARLAND ROW
  // =========================================================================
  const sparkles = [];
  const NUM_SPARKLES = 76;
  for (let i = 0; i < NUM_SPARKLES; i++) {
    // Spread along the horizontal span of the hanging row, well inside 4K safe margins
    const u = (i + 0.5) / NUM_SPARKLES; // 0 to 1 across the row
    const spreadX = (u - 0.5) * 2680 + (rand() - 0.5) * 220;
    // Catenary curve baseline offset so sparkles follow the drape of the string
    const normX = spreadX / 1360;
    const catenaryY = 480 + (1 - normX * normX * 0.65) * 420;
    const spreadY = catenaryY + (rand() - 0.42) * 620;

    const pRoll = rand();
    let colorCore, colorMid, colorOuter;
    if (pRoll < 0.52) {
      // Warm Gold
      colorCore = '#FFFFFF';
      colorMid = '#FFE885';
      colorOuter = 'rgba(255, 180, 30, 0)';
    } else if (pRoll < 0.80) {
      // Rich Amber
      colorCore = '#FFF9E2';
      colorMid = '#FFB228';
      colorOuter = 'rgba(220, 100, 0, 0)';
    } else {
      // Emerald Gleam
      colorCore = '#FFFFFF';
      colorMid = '#72F7C2';
      colorOuter = 'rgba(16, 185, 125, 0)';
    }

    sparkles.push({
      bx: CX + spreadX,
      by: spreadY,
      uPos: u, // Used to couple ambient sparkle twinkle with the sequential wave
      driftRx: 10 + rand() * 20,
      driftRy: 10 + rand() * 20,
      freqX: (rand() < 0.65 ? 1 : 2) * (rand() < 0.5 ? 1 : -1),
      freqY: (rand() < 0.65 ? 1 : 2) * (rand() < 0.5 ? 1 : -1),
      phaseX: rand() * TAU,
      phaseY: rand() * TAU,
      twinkleFreq: 1 + Math.floor(rand() * 2), // 1 or 2 integer cycles
      twinklePhase: rand() * TAU,
      rotFreq: rand() < 0.5 ? 1 : -1,
      rotBase: rand() * Math.PI,
      size: 13 + Math.pow(rand(), 1.6) * 34,
      type: i % 4 === 0 ? 'eight' : (i % 3 === 0 ? 'orb' : 'four'),
      layer: i % 2,
      colorCore,
      colorMid,
      colorOuter
    });
  }

  // =========================================================================
  // 2. CONFIGURATION OF THE HANGING ROW (9 PRIMARY PENDANTS + 8 MINI STARS)
  // =========================================================================
  // Left Anchor at x = 520, Right Anchor at x = 3320 (Span = 2800px, centered at 1920)
  const ANCHOR_LEFT_X = 520;
  const ANCHOR_RIGHT_X = 3320;
  const ANCHOR_Y = 430;
  const SAG_DEPTH = 195;

  // 9 Primary Pendants alternating Stars and Ramadan Fanous Lanterns
  const primaryNodes = [
    { u: 0.08, kind: 'star8',       scale: 0.86, chainLen: 155, styleVariant: 0, seqIndex: 0 },
    { u: 0.185, kind: 'lantern',    scale: 0.84, chainLen: 185, styleVariant: 0, seqIndex: 2 },
    { u: 0.29, kind: 'crescentStar',scale: 0.92, chainLen: 165, styleVariant: 1, seqIndex: 4 },
    { u: 0.395, kind: 'lantern',    scale: 0.94, chainLen: 215, styleVariant: 1, seqIndex: 6 },
    { u: 0.50, kind: 'star8',       scale: 1.08, chainLen: 170, styleVariant: 0, seqIndex: 8 },
    { u: 0.605, kind: 'lantern',    scale: 0.94, chainLen: 215, styleVariant: 1, seqIndex: 10 },
    { u: 0.71, kind: 'crescentStar',scale: 0.92, chainLen: 165, styleVariant: 1, seqIndex: 12 },
    { u: 0.815, kind: 'lantern',    scale: 0.84, chainLen: 185, styleVariant: 0, seqIndex: 14 },
    { u: 0.92, kind: 'star8',       scale: 0.86, chainLen: 155, styleVariant: 0, seqIndex: 16 }
  ];

  // 8 Intermediate Miniature Hanging Stars & Lantern Charms between the Primary Nodes
  const secondaryNodes = [
    { u: 0.1325, kind: 'miniStar',    scale: 0.75, chainLen: 95,  seqIndex: 1 },
    { u: 0.2375, kind: 'miniLantern', scale: 0.62, chainLen: 110, seqIndex: 3 },
    { u: 0.3425, kind: 'miniStar',    scale: 0.80, chainLen: 105, seqIndex: 5 },
    { u: 0.4475, kind: 'miniLantern', scale: 0.66, chainLen: 125, seqIndex: 7 },
    { u: 0.5525, kind: 'miniLantern', scale: 0.66, chainLen: 125, seqIndex: 9 },
    { u: 0.6575, kind: 'miniStar',    scale: 0.80, chainLen: 105, seqIndex: 11 },
    { u: 0.7625, kind: 'miniLantern', scale: 0.62, chainLen: 110, seqIndex: 13 },
    { u: 0.8675, kind: 'miniStar',    scale: 0.75, chainLen: 95,  seqIndex: 15 }
  ];

  // Evaluate position & tangent on the main catenary cord at parameter u in [0, 1]
  function getMainCordPoint(u, phase) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;

    const baseX = ANCHOR_LEFT_X + u * (ANCHOR_RIGHT_X - ANCHOR_LEFT_X);
    // Parabolic/catenary sag
    const sagFactor = 4 * u * (1 - u);
    const baseY = ANCHOR_Y + SAG_DEPTH * sagFactor;

    // Gentle travelling wave motion along the string (vanishes at endpoints u=0 and u=1)
    const env = Math.sin(u * Math.PI);
    const waveX = env * (12 * Math.sin(p1 - u * 2.2) + 4 * Math.cos(p2 - u * 3.5));
    const waveY = env * (18 * Math.sin(p1 - u * 2.8) + 6 * Math.sin(p2 + u * 2.0));

    return {
      x: baseX + waveX,
      y: baseY + waveY,
      sagFactor,
      env
    };
  }

  // Compute the sequential "one after another" twinkle intensity for an element at normalized position u in [0, 1]
  function getSequentialTwinkle(u, phase) {
    // Primary wave sweeps cleanly from left to right (1 full cycle + 2 cycle shimmer)
    const wave1 = 0.5 + 0.5 * Math.sin(TAU * (phase - u * 0.85));
    const wave2 = 0.5 + 0.5 * Math.sin(TAU * (2 * phase - u * 1.35 + 0.2));
    // Sharp sequential peak when the wave hits position u
    const peak1 = Math.pow(wave1, 3.2);
    const peak2 = Math.pow(wave2, 4.5);
    const combined = Math.min(1, 0.18 + 0.58 * peak1 + 0.38 * peak2);
    return {
      intensity: combined,   // 0.18 to 1.0
      flare: peak2,          // 0.0 to 1.0 sharp specular glint trigger
      softWave: wave1
    };
  }

  // =========================================================================
  // 3. SHARED ORNAMENTAL DRAWING HELPERS
  // =========================================================================

  // Draw a 4-point, 8-point, or orb sparkle with contained glow
  function drawSparkleShape(ctx, x, y, radius, rot, type, colorCore, colorMid, colorOuter, alpha) {
    if (alpha <= 0.005 || radius <= 0.5) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;

    const glowRad = radius * (type === 'orb' ? 2.2 : 2.8);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRad);
    grad.addColorStop(0, colorCore);
    grad.addColorStop(0.28, colorMid);
    grad.addColorStop(1, colorOuter);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    if (type === 'orb') {
      ctx.fillStyle = colorCore;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.34, 0, TAU);
      ctx.fill();
      ctx.restore();
      return;
    }

    ctx.rotate(rot);

    const drawFourStar = (rLong, rShort, fill) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const ang = i * Math.PI * 0.5;
        const nextAng = (i + 1) * Math.PI * 0.5;
        const midAng = ang + Math.PI * 0.25;
        const px = Math.cos(ang) * rLong;
        const py = Math.sin(ang) * rLong;
        const cx = Math.cos(midAng) * rShort;
        const cy = Math.sin(midAng) * rShort;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
        ctx.quadraticCurveTo(cx, cy, Math.cos(nextAng) * rLong, Math.sin(nextAng) * rLong);
      }
      ctx.closePath();
      ctx.fill();
    };

    if (type === 'eight') {
      ctx.save();
      ctx.rotate(Math.PI * 0.25);
      drawFourStar(radius * 0.68, radius * 0.11, colorMid);
      ctx.restore();
    }

    drawFourStar(radius * 1.15, radius * 0.15, colorMid);
    drawFourStar(radius * 0.72, radius * 0.08, colorCore);

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.14, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // Draw a glossy cabochon gem in an ornate gold bezel
  function drawCabochonGem(ctx, x, y, radius, type, shimmerPhase, glowBoost) {
    ctx.save();
    ctx.translate(x, y);

    const dropGrad = ctx.createRadialGradient(radius * 0.12, radius * 0.18, radius * 0.1, 0, 0, radius * 1.4);
    dropGrad.addColorStop(0, 'rgba(35, 12, 0, 0.75)');
    dropGrad.addColorStop(1, 'rgba(35, 12, 0, 0)');
    ctx.fillStyle = dropGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.4, 0, TAU);
    ctx.fill();

    // Outer gold bezel
    const bezelGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
    bezelGrad.addColorStop(0, '#FFF7C2');
    bezelGrad.addColorStop(0.35, '#FFD03B');
    bezelGrad.addColorStop(0.72, '#B35600');
    bezelGrad.addColorStop(1, '#FFE47A');
    ctx.fillStyle = bezelGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.22, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#592000';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.03, 0, TAU);
    ctx.fill();

    // Gemstone body
    const gemGrad = ctx.createRadialGradient(
      radius * 0.22, radius * 0.25, radius * 0.05,
      0, 0, radius
    );
    if (type === 'emerald') {
      gemGrad.addColorStop(0, glowBoost > 0.6 ? '#B8FFE6' : '#78FFD0');
      gemGrad.addColorStop(0.35, '#12B87D');
      gemGrad.addColorStop(0.75, '#05593B');
      gemGrad.addColorStop(1, '#022417');
    } else {
      gemGrad.addColorStop(0, '#FFFFFF');
      gemGrad.addColorStop(0.32, '#FFBE2E');
      gemGrad.addColorStop(0.75, '#B84500');
      gemGrad.addColorStop(1, '#4A1500');
    }
    ctx.fillStyle = gemGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.fill();

    // Specular highlight
    const shift = Math.sin(shimmerPhase) * 0.07;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
    ctx.beginPath();
    ctx.ellipse(
      -radius * (0.30 + shift),
      -radius * (0.32 - shift),
      radius * 0.36,
      radius * 0.18,
      -Math.PI * 0.25,
      0,
      TAU
    );
    ctx.fill();

    ctx.restore();
  }

  // Draw an 8-pointed Islamic geometric rosette
  function drawGeometricRosette(ctx, cx, cy, outerR, innerR, rot, fillStyle, strokeStyle, lineWidth) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    const pts = 16;
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * TAU;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth || 2.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw an ornate dangling teardrop charm
  function drawTeardropCharm(ctx, length, width, type, shimmerPhase) {
    ctx.save();

    const frameGrad = ctx.createLinearGradient(-width, 0, width, length);
    frameGrad.addColorStop(0, '#FFF7C0');
    frameGrad.addColorStop(0.35, '#FFCC33');
    frameGrad.addColorStop(0.72, '#B55800');
    frameGrad.addColorStop(1, '#FFE47A');
    ctx.fillStyle = frameGrad;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(width * 0.92, length * 0.38, width * 1.15, length * 0.78, 0, length);
    ctx.bezierCurveTo(-width * 1.15, length * 0.78, -width * 0.92, length * 0.38, 0, 4);
    ctx.closePath();
    ctx.fill();

    const inGrad = ctx.createRadialGradient(-width * 0.15, length * 0.55, 1, 0, length * 0.6, width * 0.85);
    if (type === 'emerald') {
      inGrad.addColorStop(0, '#72F7C2');
      inGrad.addColorStop(0.45, '#0E9E6A');
      inGrad.addColorStop(1, '#032B1C');
    } else {
      inGrad.addColorStop(0, '#FFF8D6');
      inGrad.addColorStop(0.45, '#FF9E00');
      inGrad.addColorStop(1, '#5E2000');
    }
    ctx.fillStyle = inGrad;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(width * 0.62, length * 0.42, width * 0.78, length * 0.74, 0, length - 6);
    ctx.bezierCurveTo(-width * 0.78, length * 0.74, -width * 0.62, length * 0.42, 0, 10);
    ctx.closePath();
    ctx.fill();

    const shift = Math.sin(shimmerPhase) * 1.2;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
    ctx.beginPath();
    ctx.ellipse(-width * 0.2 + shift, length * 0.52, width * 0.14, length * 0.13, -0.22, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#FFF3A8';
    ctx.beginPath();
    ctx.arc(0, length + 3.5, 3.2, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // Draw a compact hanging silk & gold tassel for lanterns & stars
  function drawMiniSilkTassel(ctx, len, width, swayAngle, shimmerPhase) {
    ctx.save();
    ctx.rotate(swayAngle);

    // Connecting gold bead
    ctx.fillStyle = '#FFE885';
    ctx.beginPath();
    ctx.arc(0, 5, 4.5, 0, TAU);
    ctx.fill();

    ctx.translate(0, 10);

    // Silk skirt
    const skirtGrad = ctx.createLinearGradient(-width, 14, width, len);
    skirtGrad.addColorStop(0, '#9E4200');
    skirtGrad.addColorStop(0.35, '#FFD03B');
    skirtGrad.addColorStop(0.6, '#FFF5B8');
    skirtGrad.addColorStop(0.85, '#B85400');
    skirtGrad.addColorStop(1, '#591D00');
    ctx.fillStyle = skirtGrad;
    ctx.beginPath();
    ctx.moveTo(-width * 0.48, 14);
    ctx.bezierCurveTo(-width * 0.85, len * 0.5, -width * 1.05, len * 0.85, -width * 0.8, len);
    ctx.quadraticCurveTo(0, len + 8, width * 0.8, len);
    ctx.bezierCurveTo(width * 1.05, len * 0.85, width * 0.85, len * 0.5, width * 0.48, 14);
    ctx.closePath();
    ctx.fill();

    // Ribbed strand lines
    ctx.lineWidth = 1.8;
    for (let i = -3; i <= 3; i++) {
      const u = i / 3;
      ctx.strokeStyle = i % 2 === 0 ? '#FFF7C2' : '#0E9E6A';
      ctx.beginPath();
      ctx.moveTo(u * width * 0.4, 15);
      ctx.quadraticCurveTo(u * width * 0.85, len * 0.6, u * width * 0.72, len);
      ctx.stroke();
    }

    // Gold & emerald cap
    const capGrad = ctx.createLinearGradient(-width * 0.6, 0, width * 0.6, 16);
    capGrad.addColorStop(0, '#FFF6B8');
    capGrad.addColorStop(0.5, '#FFC229');
    capGrad.addColorStop(1, '#8C3B00');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(width * 0.6, 2, width * 0.68, 11, width * 0.58, 16);
    ctx.quadraticCurveTo(0, 19, -width * 0.58, 16);
    ctx.bezierCurveTo(-width * 0.68, 11, -width * 0.6, 2, 0, 0);
    ctx.closePath();
    ctx.fill();

    drawCabochonGem(ctx, 0, 8, 5, 'emerald', shimmerPhase, 0.5);

    ctx.restore();
  }

  // =========================================================================
  // 4. HANGING ORNAMENT 1: SMALL RAMADAN FANOUS LANTERN (WITH SEQUENTIAL GLOW)
  // =========================================================================
  // Local origin (0,0) is at the top bail ring of the lantern.
  // Total height before tassel is ~330px (scaled by node.scale).
  function drawSmallFanousLantern(ctx, phase, twinkle, swingAngle, tasselAngle, variant) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;
    const p3 = phase * TAU * 3;
    const tw = twinkle.intensity; // 0.18 to 1.0 sequential twinkle
    const flare = twinkle.flare;

    ctx.save();

    // 1. Contained Soft Golden & Emerald Glow (modulates strongly with sequential twinkle!)
    const glowRadius = 290 * (0.78 + 0.36 * tw);
    const outerGlow = ctx.createRadialGradient(0, 175, 15, 0, 175, glowRadius);
    outerGlow.addColorStop(0, `rgba(255, 240, 155, ${(0.24 + 0.42 * tw).toFixed(3)})`);
    outerGlow.addColorStop(0.28, `rgba(255, 175, 35, ${(0.12 + 0.24 * tw).toFixed(3)})`);
    outerGlow.addColorStop(0.60, `rgba(16, 165, 110, ${(0.03 + 0.07 * tw).toFixed(3)})`);
    outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(0, 175, glowRadius, 0, TAU);
    ctx.fill();

    // 2. Top Bail Ring & Crescent Finial (y: 0 to 32)
    ctx.strokeStyle = '#FFE47A';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, TAU);
    ctx.stroke();

    // Crescent finial
    ctx.fillStyle = '#FFD24C';
    ctx.beginPath();
    ctx.arc(0, 18, 14, 0.15 * Math.PI, 0.85 * Math.PI, false);
    ctx.arc(0, 13, 11, 0.82 * Math.PI, 0.18 * Math.PI, true);
    ctx.closePath();
    ctx.fill();

    // 3. Upper Royal Dome (y: 30 to 106)
    const domeTopY = 30;
    const domeBotY = 104;
    const domeHalfW = variant === 1 ? 82 : 76;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-24, domeTopY);
    ctx.lineTo(24, domeTopY);
    if (variant === 1) {
      // Onion / Lotus dome curve
      ctx.bezierCurveTo(68, domeTopY + 14, 96, domeBotY - 28, domeHalfW, domeBotY);
      ctx.lineTo(-domeHalfW, domeBotY);
      ctx.bezierCurveTo(-96, domeBotY - 28, -68, domeTopY + 14, -24, domeTopY);
    } else {
      // Classic Mamluk Ogee dome curve
      ctx.bezierCurveTo(45, domeTopY + 12, 80, domeBotY - 26, domeHalfW, domeBotY);
      ctx.lineTo(-domeHalfW, domeBotY);
      ctx.bezierCurveTo(-80, domeBotY - 26, -45, domeTopY + 12, -24, domeTopY);
    }
    ctx.closePath();
    ctx.clip();

    // Emerald Enamel Dome Fill
    const domeGrad = ctx.createRadialGradient(-20, 62, 5, 0, 70, 95);
    domeGrad.addColorStop(0, '#1EE098');
    domeGrad.addColorStop(0.45, '#098054');
    domeGrad.addColorStop(0.85, '#033B26');
    domeGrad.addColorStop(1, '#011C11');
    ctx.fillStyle = domeGrad;
    ctx.fillRect(-100, domeTopY, 200, domeBotY - domeTopY + 5);

    // Golden fluted ribs on dome
    const ribs = [-0.72, -0.36, 0, 0.36, 0.72];
    for (let i = 0; i < ribs.length; i++) {
      const u = ribs[i];
      ctx.strokeStyle = '#FFD03B';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(u * 22, domeTopY);
      ctx.quadraticCurveTo(u * domeHalfW * 1.05, (domeTopY + domeBotY) * 0.5, u * domeHalfW, domeBotY);
      ctx.stroke();
    }

    // Glowing pierced star cutouts on dome (brighten when twinkling!)
    for (let side = -1; side <= 1; side++) {
      const cx = side * 34;
      const cy = 72;
      const cutFill = tw > 0.65 ? '#FFFFFF' : '#FFE066';
      drawGeometricRosette(ctx, cx, cy, 9, 4.8, 0, cutFill, '#D97B00', 1.5);
    }

    ctx.restore(); // End Dome Clip

    ctx.strokeStyle = '#FFE885';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-24, domeTopY);
    ctx.lineTo(24, domeTopY);
    ctx.bezierCurveTo(45, domeTopY + 12, 80, domeBotY - 26, domeHalfW, domeBotY);
    ctx.lineTo(-domeHalfW, domeBotY);
    ctx.bezierCurveTo(-80, domeBotY - 26, -45, domeTopY + 12, -24, domeTopY);
    ctx.closePath();
    ctx.stroke();

    // Flared Cornice Eaves (y: 102 to 118)
    const eavesW = domeHalfW + 16;
    const eavesGrad = ctx.createLinearGradient(-eavesW, 102, eavesW, 118);
    eavesGrad.addColorStop(0, '#9E4500');
    eavesGrad.addColorStop(0.3, '#FFF6B8');
    eavesGrad.addColorStop(0.5, '#FFD03B');
    eavesGrad.addColorStop(0.7, '#FFF6B8');
    eavesGrad.addColorStop(1, '#8C3B00');
    ctx.fillStyle = eavesGrad;
    ctx.beginPath();
    ctx.moveTo(-domeHalfW, 102);
    ctx.lineTo(domeHalfW, 102);
    ctx.lineTo(eavesW, 116);
    ctx.lineTo(-eavesW, 116);
    ctx.closePath();
    ctx.fill();

    // 4. Central Glowing Glass Chamber & Sacred Flame (y: 116 to 264)
    const chTopY = 116;
    const chBotY = 264;
    const chTopW = domeHalfW - 2;
    const chBotW = 52;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-chTopW, chTopY);
    ctx.lineTo(chTopW, chTopY);
    ctx.lineTo(chBotW, chBotY);
    ctx.lineTo(-chBotW, chBotY);
    ctx.closePath();
    ctx.clip();

    // Warm Glowing Glass Interior (brightens intensely as the sequential wave passes!)
    const glassGrad = ctx.createRadialGradient(0, 195, 6, 0, 190, 115);
    glassGrad.addColorStop(0, '#FFFFFF');
    glassGrad.addColorStop(0.22 + 0.18 * tw, '#FFF6BA');
    glassGrad.addColorStop(0.55 + 0.12 * tw, '#FFB824');
    glassGrad.addColorStop(0.85, '#C95600');
    glassGrad.addColorStop(1, '#3D1400');
    ctx.fillStyle = glassGrad;
    ctx.fillRect(-100, chTopY, 200, chBotY - chTopY);

    // Inner Dancing Flame (scales & brightens with sequential twinkle!)
    ctx.save();
    ctx.translate(0, chBotY - 12);
    const flameLean = -swingAngle * 0.65 + 0.12 * Math.sin(p2 + variant);
    ctx.rotate(flameLean);
    const flameScale = 0.82 + 0.38 * tw + 0.06 * Math.sin(p3);
    ctx.scale(flameScale, flameScale);

    // Outer amber-gold flame
    ctx.fillStyle = 'rgba(255, 165, 20, 0.9)';
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.bezierCurveTo(26, -10, 28, -52, 4 * Math.sin(p3), -92);
    ctx.bezierCurveTo(-28, -52, -26, -10, 0, 2);
    ctx.closePath();
    ctx.fill();

    // Inner white-gold flame core
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(14, -8, 15, -36, 2 * Math.sin(p3), -64);
    ctx.bezierCurveTo(-15, -36, -14, -8, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Ornate Islamic Girih Lattice Overlay inside the Chamber
    ctx.strokeStyle = '#7A2E00';
    ctx.lineWidth = 6.5;
    const midY = (chTopY + chBotY) * 0.5;
    // Diamond & Star Girih pattern
    ctx.beginPath();
    ctx.moveTo(0, chTopY + 8);
    ctx.lineTo(chTopW * 0.78, midY);
    ctx.lineTo(0, chBotY - 8);
    ctx.lineTo(-chTopW * 0.78, midY);
    ctx.closePath();
    ctx.stroke();

    ctx.strokeStyle = '#FFD24C';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Pointed arch frame inside central pane
    ctx.strokeStyle = '#FFE885';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-36, chBotY);
    ctx.lineTo(-36, chTopY + 42);
    ctx.quadraticCurveTo(-32, chTopY + 12, 0, chTopY + 8);
    ctx.quadraticCurveTo(32, chTopY + 12, 36, chTopY + 42);
    ctx.lineTo(36, chBotY);
    ctx.stroke();

    // Central Rosette Medallion on the glass
    drawGeometricRosette(ctx, 0, midY, 18, 10, 0, '#9E4500', '#FFF5B8', 2.2);
    drawCabochonGem(ctx, 0, midY, 7.5, 'emerald', p2, tw);

    ctx.restore(); // End Chamber Clip

    // 4 Structural Gold Pillars
    const pillars = [
      { tx: -chTopW, bx: -chBotW, w: 8 },
      { tx: -chTopW * 0.44, bx: -chBotW * 0.44, w: 6.5 },
      { tx:  chTopW * 0.44, bx:  chBotW * 0.44, w: 6.5 },
      { tx:  chTopW, bx:  chBotW, w: 8 }
    ];
    for (let i = 0; i < pillars.length; i++) {
      const pl = pillars[i];
      ctx.strokeStyle = '#6E2600';
      ctx.lineWidth = pl.w + 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pl.tx, chTopY);
      ctx.lineTo(pl.bx, chBotY);
      ctx.stroke();

      ctx.strokeStyle = '#FFD03B';
      ctx.lineWidth = pl.w;
      ctx.beginPath();
      ctx.moveTo(pl.tx, chTopY);
      ctx.lineTo(pl.bx, chBotY);
      ctx.stroke();
    }

    // Dangling Eaves Teardrop Charms on Left & Right Corners
    for (let side = -1; side <= 1; side += 2) {
      ctx.save();
      ctx.translate(side * (eavesW - 3), 116);
      ctx.rotate(-swingAngle * 0.9 + 0.18 * Math.sin(p1 - 0.9 + side * 0.3));
      drawTeardropCharm(ctx, 28, 8.5, 'emerald', p2);
      ctx.restore();
    }

    // 5. Lower Pedestal Bowl & Spire (y: 262 to 326)
    ctx.fillStyle = eavesGrad;
    ctx.beginPath();
    ctx.roundRect(-chBotW - 8, 260, (chBotW + 8) * 2, 14, 6);
    ctx.fill();

    // Emerald & Gold Lower Bowl
    const bowlGrad = ctx.createLinearGradient(-chBotW, 274, chBotW, 316);
    bowlGrad.addColorStop(0, '#054D32');
    bowlGrad.addColorStop(0.5, '#14C284');
    bowlGrad.addColorStop(1, '#022618');
    ctx.fillStyle = bowlGrad;
    ctx.beginPath();
    ctx.moveTo(-chBotW, 274);
    ctx.lineTo(chBotW, 274);
    ctx.bezierCurveTo(chBotW * 0.85, 302, 22, 312, 14, 320);
    ctx.lineTo(-14, 320);
    ctx.bezierCurveTo(-22, 312, -chBotW * 0.85, 302, -chBotW, 274);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#FFE47A';
    ctx.lineWidth = 3.2;
    ctx.stroke();

    drawCabochonGem(ctx, 0, 294, 8, 'amber', p1, tw);

    // 6. Hanging Silk Tassel at bottom (y = 320)
    ctx.save();
    ctx.translate(0, 320);
    drawMiniSilkTassel(ctx, 74, 18, tasselAngle, p2);
    ctx.restore();

    // 7. Sequential Twinkle Starburst Glint on the Lantern Center & Crown
    if (flare > 0.08) {
      drawSparkleShape(
        ctx,
        0,
        190,
        58 * flare,
        p1 * 0.25,
        'eight',
        '#FFFFFF',
        '#FFE885',
        'rgba(255, 185, 30, 0)',
        flare * 0.92
      );
      drawSparkleShape(
        ctx,
        -domeHalfW * 0.55,
        108,
        32 * flare,
        -p1 * 0.5,
        'four',
        '#FFFFFF',
        '#78FFD0',
        'rgba(18, 184, 125, 0)',
        flare * 0.85
      );
    }

    ctx.restore();
  }

  // =========================================================================
  // 5. HANGING ORNAMENT 2: ORNATE 8-POINTED CELESTIAL STAR PENDANT
  // =========================================================================
  // Local origin (0,0) is at top bail ring; star center is at (0, radius + 12).
  function drawStar8Pendant(ctx, phase, twinkle, swingAngle, charmAngle) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;
    const tw = twinkle.intensity;
    const flare = twinkle.flare;
    const radius = 112;
    const centerY = radius + 12;

    ctx.save();
    ctx.translate(0, centerY);

    // 1. Contained Soft Glow behind Star (pulses with sequential twinkle)
    const glowRad = radius * (2.1 + 0.75 * tw);
    const starGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, glowRad);
    starGlow.addColorStop(0, `rgba(255, 245, 170, ${(0.28 + 0.46 * tw).toFixed(3)})`);
    starGlow.addColorStop(0.30, `rgba(255, 180, 35, ${(0.12 + 0.24 * tw).toFixed(3)})`);
    starGlow.addColorStop(0.62, `rgba(18, 184, 125, ${(0.03 + 0.08 * tw).toFixed(3)})`);
    starGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = starGlow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // Top bail ring at (0, -radius - 8)
    ctx.strokeStyle = '#FFE885';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.arc(0, -radius - 8, 8, 0, TAU);
    ctx.stroke();

    // 2. Diagonal 4 Emerald & Gold Points (at 45 degrees)
    const rDiag = radius * 0.74;
    const rWaistDiag = radius * 0.28;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5 + Math.PI * 0.25);

      const dGrad = ctx.createLinearGradient(-rWaistDiag, -rDiag, rWaistDiag, 0);
      dGrad.addColorStop(0, '#FFF7C2');
      dGrad.addColorStop(0.45, '#FFC833');
      dGrad.addColorStop(1, '#8C3B00');
      ctx.fillStyle = dGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-rWaistDiag, 0);
      ctx.quadraticCurveTo(-rWaistDiag * 0.35, -rDiag * 0.35, 0, -rDiag);
      ctx.quadraticCurveTo(rWaistDiag * 0.35, -rDiag * 0.35, rWaistDiag, 0);
      ctx.closePath();
      ctx.fill();

      // Deep Emerald Inlay inside diagonal ray
      ctx.fillStyle = '#098054';
      ctx.beginPath();
      ctx.moveTo(0, -rDiag * 0.80);
      ctx.lineTo(rWaistDiag * 0.28, -rDiag * 0.32);
      ctx.lineTo(0, -rDiag * 0.16);
      ctx.lineTo(-rWaistDiag * 0.28, -rDiag * 0.32);
      ctx.closePath();
      ctx.fill();

      // Gold tip pearl
      ctx.fillStyle = '#FFF6B8';
      ctx.beginPath();
      ctx.arc(0, -rDiag - 3, 3.5, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    // 3. Cardinal 4 Sculpted Bevelled Gold Points
    const rMain = radius;
    const rWaist = radius * 0.29;
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 0.5);

      // Left sunlit bevel
      const gL = ctx.createLinearGradient(-rWaist, -rMain * 0.5, 0, -rMain);
      gL.addColorStop(0, '#FFB824');
      gL.addColorStop(0.5, '#FFFAD6');
      gL.addColorStop(1, '#FFE270');
      ctx.fillStyle = gL;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rMain);
      ctx.quadraticCurveTo(-rWaist * 0.42, -rMain * 0.36, -rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      // Right shaded bevel
      const gR = ctx.createLinearGradient(0, -rMain, rWaist, -rMain * 0.3);
      gR.addColorStop(0, '#FFE478');
      gR.addColorStop(0.5, '#C96500');
      gR.addColorStop(1, '#752A00');
      ctx.fillStyle = gR;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -rMain);
      ctx.quadraticCurveTo(rWaist * 0.42, -rMain * 0.36, rWaist * Math.SQRT1_2, -rWaist * Math.SQRT1_2);
      ctx.closePath();
      ctx.fill();

      // Emerald & Gold inner jewel kite
      ctx.fillStyle = '#0D9965';
      ctx.beginPath();
      ctx.moveTo(0, -rMain * 0.74);
      ctx.lineTo(rWaist * 0.20, -rMain * 0.33);
      ctx.lineTo(0, -rMain * 0.20);
      ctx.lineTo(-rWaist * 0.20, -rMain * 0.33);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#FFF4B0';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.restore();
    }

    // 4. Center Rosette & Glowing Emerald Cabochon
    drawGeometricRosette(ctx, 0, 0, radius * 0.28, radius * 0.18, 0, '#8C3B00', '#FFF5B8', 2.5);
    drawCabochonGem(ctx, 0, 0, radius * 0.19, 'emerald', p2, tw);

    // 5. Dangling Teardrop Charm from bottom point of the Star
    ctx.save();
    ctx.translate(0, rMain + 4);
    ctx.rotate(charmAngle);
    drawTeardropCharm(ctx, 48, 14, 'emerald', p2);
    ctx.restore();

    // 6. Sequential Twinkle Glint Burst at the Star Core
    if (flare > 0.05) {
      drawSparkleShape(
        ctx,
        0,
        0,
        72 * flare,
        -p1 * 0.3,
        'eight',
        '#FFFFFF',
        '#FFE885',
        'rgba(255, 195, 45, 0)',
        flare * 0.95
      );
    }

    ctx.restore();
  }

  // =========================================================================
  // 6. HANGING ORNAMENT 3: CRESCENT MOON CRADLING A TWINKLING STAR
  // =========================================================================
  // Local origin (0,0) is at top bail ring; crescent center is at (0, 108).
  function drawCrescentStarPendant(ctx, phase, twinkle, swingAngle, innerStarAngle) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;
    const tw = twinkle.intensity;
    const flare = twinkle.flare;
    const cY = 108;

    ctx.save();
    ctx.translate(0, cY);

    // 1. Contained Soft Glow
    const glowRad = 225 * (0.8 + 0.35 * tw);
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 238, 155, ${(0.25 + 0.42 * tw).toFixed(3)})`);
    glow.addColorStop(0.32, `rgba(255, 175, 35, ${(0.11 + 0.22 * tw).toFixed(3)})`);
    glow.addColorStop(0.64, `rgba(16, 175, 118, ${(0.03 + 0.07 * tw).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // Top bail ring at (0, -102)
    ctx.strokeStyle = '#FFE885';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.arc(0, -102, 8, 0, TAU);
    ctx.stroke();

    // 2. Sculpted Golden & Emerald Crescent Body (opening toward top-right/right)
    const R1 = 98;
    const d = 40;
    const R2 = 76;
    const theta0 = -0.35;
    const a = (R1 * R1 - R2 * R2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, R1 * R1 - a * a));
    const ux = Math.cos(theta0);
    const uy = Math.sin(theta0);
    const px = -uy;
    const py = ux;
    const x1 = a * ux - h * px;
    const y1 = a * uy - h * py;
    const x2 = a * ux + h * px;
    const y2 = a * uy + h * py;
    const cx2 = d * ux;
    const cy2 = d * uy;

    const a1_top = Math.atan2(y1, x1);
    const a1_bot = Math.atan2(y2, x2);
    const a2_top = Math.atan2(y1 - cy2, x1 - cx2);
    const a2_bot = Math.atan2(y2 - cy2, x2 - cx2);

    // Outer Gold Crescent
    const cGrad = ctx.createLinearGradient(-R1, -R1, R1, R1);
    cGrad.addColorStop(0, '#FFF8CC');
    cGrad.addColorStop(0.35, '#FFD03B');
    cGrad.addColorStop(0.75, '#B85400');
    cGrad.addColorStop(1, '#FFE47A');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(0, 0, R1, a1_bot, a1_top, false);
    ctx.arc(cx2, cy2, R2, a2_top, a2_bot, true);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#FFF5B8';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Inner Emerald Enamel Crescent Channel
    const R1_em = 87;
    const R2_em = 85;
    const a_em = (R1_em * R1_em - R2_em * R2_em + d * d) / (2 * d);
    const h_em = Math.sqrt(Math.max(0, R1_em * R1_em - a_em * a_em));
    const ex1 = a_em * ux - h_em * px;
    const ey1 = a_em * uy - h_em * py;
    const ex2 = a_em * ux + h_em * px;
    const ey2 = a_em * uy + h_em * py;

    const emGrad = ctx.createLinearGradient(-R1_em, -R1_em, R1_em, R1_em);
    emGrad.addColorStop(0, '#1AD18E');
    emGrad.addColorStop(0.5, '#076B46');
    emGrad.addColorStop(1, '#02291A');
    ctx.fillStyle = emGrad;
    ctx.beginPath();
    ctx.arc(0, 0, R1_em, Math.atan2(ey2, ex2), Math.atan2(ey1, ex1), false);
    ctx.arc(cx2, cy2, R2_em, Math.atan2(ey1 - cy2, ex1 - cx2), Math.atan2(ey2 - cy2, ex2 - cx2), true);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#FFD03B';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3 Cabochon Gems along the crescent belly
    drawCabochonGem(ctx, -64, 18, 10, 'emerald', p2, tw);
    drawCabochonGem(ctx, -56, -24, 7.5, 'amber', p1, tw);
    drawCabochonGem(ctx, -44, 54, 7.5, 'amber', p1 + 1, tw);

    // 3. Hanging Miniature Twinkling Star suspended inside the Crescent Hollow
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(innerStarAngle);
    // Tiny golden chain from upper horn to inner star
    ctx.strokeStyle = '#FFE478';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 46);
    ctx.stroke();

    ctx.translate(0, 74);
    // Draw 8-pointed golden star inside the crescent
    drawGeometricRosette(ctx, 0, 0, 32, 12, p1 * 0.12, '#FFD03B', '#FFF9D6', 2.2);
    drawCabochonGem(ctx, 0, 0, 8, 'amber', p2, tw);

    if (flare > 0.05) {
      drawSparkleShape(
        ctx,
        0,
        0,
        54 * flare,
        p1 * 0.4,
        'four',
        '#FFFFFF',
        '#FFE885',
        'rgba(255, 190, 35, 0)',
        flare * 0.95
      );
    }
    ctx.restore();

    // 4. Dangling Teardrop Charm below the Crescent
    ctx.save();
    ctx.translate(-12, R1 - 2);
    ctx.rotate(innerStarAngle * 0.85);
    drawTeardropCharm(ctx, 46, 13, 'amber', p2);
    ctx.restore();

    ctx.restore();
  }

  // =========================================================================
  // 7. INTERMEDIATE MINIATURE HANGING STAR & MINI LANTERN CHARM
  // =========================================================================
  function drawMiniStarCharm(ctx, phase, twinkle) {
    const p1 = phase * TAU;
    const tw = twinkle.intensity;
    const flare = twinkle.flare;
    const r = 46;

    ctx.save();
    ctx.translate(0, r + 6);

    // Soft glow
    const glowRad = r * (2.2 + 0.9 * tw);
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRad);
    glow.addColorStop(0, `rgba(255, 248, 190, ${(0.32 + 0.50 * tw).toFixed(3)})`);
    glow.addColorStop(0.35, `rgba(255, 185, 40, ${(0.14 + 0.25 * tw).toFixed(3)})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRad, 0, TAU);
    ctx.fill();

    // 8-pointed sculpted mini star
    drawGeometricRosette(ctx, 0, 0, r * 0.72, r * 0.26, Math.PI * 0.25, '#098054', '#FFD03B', 2);
    drawGeometricRosette(ctx, 0, 0, r, r * 0.28, 0, '#FFD24C', '#FFF8CC', 2.2);
    drawCabochonGem(ctx, 0, 0, 9.5, 'amber', p1, tw);

    // Dangling pearl
    ctx.fillStyle = '#FFF6B8';
    ctx.beginPath();
    ctx.arc(0, r + 9, 4.5, 0, TAU);
    ctx.fill();

    if (flare > 0.04) {
      drawSparkleShape(
        ctx,
        0,
        0,
        48 * flare,
        -p1 * 0.5,
        'four',
        '#FFFFFF',
        '#FFE885',
        'rgba(255, 190, 40, 0)',
        flare * 0.95
      );
    }

    ctx.restore();
  }

  // =========================================================================
  // 8. ROYAL END-ANCHOR MEDALLIONS & CATENARY FESTOON GARLAND
  // =========================================================================
  function drawEndAnchorClasp(ctx, x, y, isRight, phase) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;

    ctx.save();
    ctx.translate(x, y);
    if (isRight) ctx.scale(-1, 1);

    // Contained soft glow behind anchor medallion
    const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, 145);
    glow.addColorStop(0, 'rgba(255, 215, 90, 0.34)');
    glow.addColorStop(0.55, 'rgba(18, 184, 125, 0.08)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 145, 0, TAU);
    ctx.fill();

    // Decorative filigree scroll bracket
    ctx.strokeStyle = '#FFD03B';
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.bezierCurveTo(-36, -48, -68, -22, -56, 12);
    ctx.bezierCurveTo(-48, 34, -20, 32, -22, 14);
    ctx.stroke();

    // 8-pointed Royal Star Medallion
    drawGeometricRosette(ctx, 0, 0, 42, 22, 0, '#9E4500', '#FFE885', 3.5);
    drawGeometricRosette(ctx, 0, 0, 33, 17, Math.PI / 8, '#08754D', '#FFF5B8', 2.2);
    drawCabochonGem(ctx, 0, 0, 13, 'emerald', p2, 0.6);

    // Dangling side tassel on the anchor medallion
    ctx.save();
    ctx.translate(0, 42);
    const sway = (isRight ? -1 : 1) * (0.12 * Math.sin(p1 - 0.5));
    drawMiniSilkTassel(ctx, 64, 15, sway, p1);
    ctx.restore();

    ctx.restore();
  }

  // Draw the draped golden & emerald bead cord and secondary festoon swags
  function drawFestoonGarland(ctx, phase) {
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;

    // 1. Secondary Festoon Swags draped between consecutive Primary Nodes
    const allMainU = [0.0, ...primaryNodes.map(n => n.u), 1.0];
    for (let s = 0; s < allMainU.length - 1; s++) {
      const uA = allMainU[s];
      const uB = allMainU[s + 1];
      const ptA = getMainCordPoint(uA, phase);
      const ptB = getMainCordPoint(uB, phase);

      const midX = (ptA.x + ptB.x) * 0.5;
      const midY = (ptA.y + ptB.y) * 0.5 + 58 + 6 * Math.sin(p2 + s);

      // Subtle golden wire of secondary swag
      ctx.strokeStyle = 'rgba(255, 205, 70, 0.45)';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(ptA.x, ptA.y);
      ctx.quadraticCurveTo(midX, midY, ptB.x, ptB.y);
      ctx.stroke();

      // Pearls along secondary swag
      const numSwagBeads = 9;
      for (let b = 1; b < numSwagBeads; b++) {
        const t = b / numSwagBeads;
        const inv = 1 - t;
        const bx = inv * inv * ptA.x + 2 * inv * t * midX + t * t * ptB.x;
        const by = inv * inv * ptA.y + 2 * inv * t * midY + t * t * ptB.y;
        const isCenter = (b === Math.floor(numSwagBeads / 2));
        ctx.fillStyle = isCenter ? '#14C284' : '#FFE885';
        ctx.beginPath();
        ctx.arc(bx, by, isCenter ? 5.2 : 3.4, 0, TAU);
        ctx.fill();
      }
    }

    // 2. Main Catenary Golden Cord
    ctx.save();
    ctx.strokeStyle = '#8C3B00';
    ctx.lineWidth = 8;
    ctx.beginPath();
    const STEPS = 90;
    for (let i = 0; i <= STEPS; i++) {
      const u = i / STEPS;
      const pt = getMainCordPoint(u, phase);
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#FFD64D';
    ctx.lineWidth = 4.2;
    ctx.stroke();

    // 3. Sequential Twinkling Golden & Emerald Beads along the Main Cord
    const NUM_CORD_BEADS = 72;
    for (let i = 1; i < NUM_CORD_BEADS; i++) {
      const u = i / NUM_CORD_BEADS;
      const pt = getMainCordPoint(u, phase);
      const tw = getSequentialTwinkle(u, phase);

      const isEmerald = i % 4 === 0;
      const r = (isEmerald ? 6.5 : 4.8) * (0.9 + 0.22 * tw.intensity);

      if (tw.intensity > 0.65 && i % 2 === 0) {
        // Subtle travelling bead glow along the string
        const bGlow = ctx.createRadialGradient(pt.x, pt.y, 1, pt.x, pt.y, r * 3.2);
        bGlow.addColorStop(0, 'rgba(255, 240, 150, 0.55)');
        bGlow.addColorStop(1, 'rgba(255, 180, 30, 0)');
        ctx.fillStyle = bGlow;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r * 3.2, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = isEmerald ? '#14C284' : (tw.intensity > 0.6 ? '#FFFFFF' : '#FFE885');
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 4. Draw Left & Right End Anchor Medallions
    const leftPt = getMainCordPoint(0, phase);
    const rightPt = getMainCordPoint(1, phase);
    drawEndAnchorClasp(ctx, leftPt.x, leftPt.y, false, phase);
    drawEndAnchorClasp(ctx, rightPt.x, rightPt.y, true, phase);
  }

  // Draw a vertical articulated golden bead chain from a cord node to a pendant
  function drawArticulatedChain(ctx, nodeX, nodeY, chainLen, swing1, swing2, twinkleIntensity, phase) {
    const halfLen = chainLen * 0.5;
    const p2 = phase * TAU * 2;

    const midX = nodeX - Math.sin(swing1) * halfLen;
    const midY = nodeY + Math.cos(swing1) * halfLen;
    const endX = midX - Math.sin(swing2) * halfLen;
    const endY = midY + Math.cos(swing2) * halfLen;

    ctx.save();
    // Chain wire
    ctx.strokeStyle = 'rgba(255, 205, 65, 0.62)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(nodeX, nodeY);
    ctx.lineTo(midX, midY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Beads on upper half
    const numBeads = Math.max(3, Math.floor(halfLen / 18));
    for (let i = 1; i < numBeads; i++) {
      const t = i / numBeads;
      const bx1 = nodeX + (midX - nodeX) * t;
      const by1 = nodeY + (midY - nodeY) * t;
      const bx2 = midX + (endX - midX) * t;
      const by2 = midY + (endY - midY) * t;

      ctx.fillStyle = i % 2 === 0 ? '#FFF6B8' : '#E08A00';
      ctx.beginPath();
      ctx.arc(bx1, by1, 4.2, 0, TAU);
      ctx.arc(bx2, by2, 4.2, 0, TAU);
      ctx.fill();
    }

    // Mid-chain emerald diamond link
    drawCabochonGem(ctx, midX, midY, 6.5, 'emerald', p2, twinkleIntensity);

    // Top node rosette clasp on the main cord
    drawCabochonGem(ctx, nodeX, nodeY, 8.5, 'amber', p2 + 1.0, twinkleIntensity);

    ctx.restore();

    return { endX, endY };
  }

  // =========================================================================
  // 9. DETERMINISTIC FRAME RENDERER
  // =========================================================================
  window.renderFrame = function(t) {
    const DURATION = window.DURATION;
    const phase = (((t % DURATION) + DURATION) % DURATION) / DURATION;
    const p1 = phase * TAU;
    const p2 = phase * TAU * 2;

    // 1. Clear entire 4K canvas to solid pure black #000000
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // 2. Draw Background Layer Sparkles (coupled to sequential wave + individual twinkle)
    for (let i = 0; i < NUM_SPARKLES; i++) {
      const s = sparkles[i];
      if (s.layer !== 0) continue;
      const sx = s.bx + Math.cos(s.freqX * p1 + s.phaseX) * s.driftRx;
      const sy = s.by + Math.sin(s.freqY * p1 + s.phaseY) * s.driftRy;

      const seqTw = getSequentialTwinkle(s.uPos, phase);
      const localTw = 0.5 + 0.5 * Math.sin(s.twinkleFreq * p1 + s.twinklePhase);
      const combined = Math.pow(localTw * (0.45 + 0.55 * seqTw.intensity), 1.6);

      const rad = s.size * (0.24 + 0.76 * combined);
      const alpha = 0.10 + 0.88 * combined;
      const rot = s.rotBase + s.rotFreq * p1 * 0.25;
      drawSparkleShape(ctx, sx, sy, rad, rot, s.type, s.colorCore, s.colorMid, s.colorOuter, alpha);
    }

    // 3. Draw the Festooned Catenary Garland & End Anchor Medallions
    drawFestoonGarland(ctx, phase);

    // 4. Draw the 8 Intermediate Miniature Hanging Stars & Lantern Charms
    for (let i = 0; i < secondaryNodes.length; i++) {
      const node = secondaryNodes[i];
      const cordPt = getMainCordPoint(node.u, phase);
      const twinkle = getSequentialTwinkle(node.u, phase);

      const phaseOffset = node.seqIndex * 0.38;
      const swing1 = 0.065 * Math.sin(p1 - phaseOffset) + 0.02 * Math.cos(p2 - phaseOffset);
      const swing2 = 0.085 * Math.sin(p1 - phaseOffset - 0.3) + 0.025 * Math.cos(p2 - phaseOffset - 0.4);
      const pendantAngle = 0.105 * Math.sin(p1 - phaseOffset - 0.55) + 0.03 * Math.sin(p2 - phaseOffset);

      const attach = drawArticulatedChain(
        ctx,
        cordPt.x,
        cordPt.y,
        node.chainLen,
        swing1,
        swing2,
        twinkle.intensity,
        phase
      );

      ctx.save();
      ctx.translate(attach.endX, attach.endY);
      ctx.rotate(pendantAngle);
      const breathe = node.scale * (1 + 0.025 * twinkle.intensity * Math.sin(p2 - phaseOffset));
      ctx.scale(breathe, breathe);

      if (node.kind === 'miniStar') {
        drawMiniStarCharm(ctx, phase, twinkle);
      } else {
        const tasselAng = -pendantAngle * 0.9 + 0.18 * Math.sin(p1 - phaseOffset - 1.1);
        drawSmallFanousLantern(ctx, phase, twinkle, pendantAngle, tasselAng, 0);
      }
      ctx.restore();
    }

    // 5. Draw the 9 Primary Hanging Ramadan Lanterns & Celestial Stars
    for (let i = 0; i < primaryNodes.length; i++) {
      const node = primaryNodes[i];
      const cordPt = getMainCordPoint(node.u, phase);
      const twinkle = getSequentialTwinkle(node.u, phase);

      const phaseOffset = node.seqIndex * 0.38;
      const swing1 = 0.058 * Math.sin(p1 - phaseOffset) + 0.016 * Math.cos(p2 - phaseOffset);
      const swing2 = 0.076 * Math.sin(p1 - phaseOffset - 0.28) + 0.022 * Math.cos(p2 - phaseOffset - 0.4);
      const pendantAngle = 0.092 * Math.sin(p1 - phaseOffset - 0.52) + 0.024 * Math.sin(p2 - phaseOffset - 0.7);
      const secondaryLagAngle = -pendantAngle * 0.92 + 0.19 * Math.sin(p1 - phaseOffset - 1.15) + 0.05 * Math.cos(p2 - phaseOffset);

      const attach = drawArticulatedChain(
        ctx,
        cordPt.x,
        cordPt.y,
        node.chainLen,
        swing1,
        swing2,
        twinkle.intensity,
        phase
      );

      ctx.save();
      ctx.translate(attach.endX, attach.endY);
      ctx.rotate(pendantAngle);

      // Subtle squash/stretch & sequential twinkle swell
      const swell = 1 + 0.028 * (twinkle.intensity - 0.3);
      const breatheX = node.scale * swell * (1 + 0.01 * Math.sin(p2 - phaseOffset));
      const breatheY = node.scale * swell * (1 - 0.008 * Math.sin(p2 - phaseOffset));
      ctx.scale(breatheX, breatheY);

      if (node.kind === 'lantern') {
        drawSmallFanousLantern(ctx, phase, twinkle, pendantAngle, secondaryLagAngle, node.styleVariant);
      } else if (node.kind === 'star8') {
        drawStar8Pendant(ctx, phase, twinkle, pendantAngle, secondaryLagAngle);
      } else if (node.kind === 'crescentStar') {
        drawCrescentStarPendant(ctx, phase, twinkle, pendantAngle, secondaryLagAngle);
      }

      ctx.restore();
    }

    // 6. Draw Foreground Layer Sparkles (in front of the lanterns and stars)
    for (let i = 0; i < NUM_SPARKLES; i++) {
      const s = sparkles[i];
      if (s.layer !== 1) continue;
      const sx = s.bx + Math.cos(s.freqX * p1 + s.phaseX) * s.driftRx;
      const sy = s.by + Math.sin(s.freqY * p1 + s.phaseY) * s.driftRy;

      const seqTw = getSequentialTwinkle(s.uPos, phase);
      const localTw = 0.5 + 0.5 * Math.sin(s.twinkleFreq * p1 + s.twinklePhase);
      const combined = Math.pow(localTw * (0.45 + 0.55 * seqTw.intensity), 1.55);

      const rad = s.size * (0.28 + 0.72 * combined);
      const alpha = 0.14 + 0.86 * combined;
      const rot = s.rotBase + s.rotFreq * p1 * 0.25;
      drawSparkleShape(ctx, sx, sy, rad, rot, s.type, s.colorCore, s.colorMid, s.colorOuter, alpha);
    }
  };

  // Normal playback loop
  function animate(now) {
    window.renderFrame(now * 0.001);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
