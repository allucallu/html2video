<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branching Lightning Strike VFX</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;
const CYCLES = 4; // 4 rhythmic lightning strike cycles per 10-second loop

// Hand-Painted AAA 2D Game VFX Palette (Non-fluorescent: pale white-blue core -> cornflower/cobalt -> deep storm slate)
const PAL = {
  coreWhite: '#F7FBFF',
  paleIceBlue: '#DCEEFF',
  skyBlue: '#8EBEED',
  cobaltMid: '#4678B2',
  stormBlue: '#244573',
  deepSlate: '#112340',
  darkIndigo: '#081224',
  warmSparkCore: '#FFF5E0',
  amberSparkEdge: '#C99752'
};

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(482917);

// Precompute branching lightning tree structure (normalized coordinates + harmonic jitter weights)
// Origin at top sky node (CX, 310), ground impact nexus at (CX, 1750) - safe margins > 300px top/bottom
const ORIGIN_Y = 310;
const IMPACT_Y = 1750;

// Generate a jagged lightning path between (x0, y0) and (x1, y1) with deterministic segments
function createBoltDefinition(x0, y0, x1, y1, numSegs,ampScale, thickness, startU, endU, generation) {
  const nodes = [];
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;

  for (let i = 0; i <= numSegs; i++) {
    const u = i / numSegs;
    const env = Math.sin(u * Math.PI); // 0 at ends, 1 in middle
    // Sharp angular zig-zag offset characteristic of hand-painted 2D FX lightning
    const baseZig = (i === 0 || i === numSegs) ? 0 : ((i % 2 === 0 ? 1 : -1) * (0.35 + 0.65 * rand()) + (rand() - 0.5) * 0.8);
    const offset = baseZig * ampScale * (0.4 + 0.6 * env);

    nodes.push({
      u,
      baseX: x0 + dx * u + nx * offset,
      baseY: y0 + dy * u + ny * offset,
      nx,
      ny,
      flutterAmp: (12 + rand() * 26) * (generation === 0 ? 0.7 : 1.15) * env,
      flutterPhase: rand() * TAU,
      flutterFreq: 2 + (i % 3),
      kneeSpike: (i > 0 && i < numSegs && rand() > 0.42) ? (1.35 + 0.55 * rand()) : 1.0,
      beadSeed: rand()
    });
  }

  return {
    nodes,
    thickness,
    startU,
    endU,
    generation
  };
}

// Build the Main Trunk and Hierarchical Branches
const BOLTS = [];

// 1. Primary Main Trunk (Generation 0)
const mainTrunk = createBoltDefinition(CX - 15, ORIGIN_Y, CX + 10, IMPACT_Y, 22, 92, 44, 0.0, 0.72, 0);
BOLTS.push(mainTrunk);

// 2. Primary Side Branches (Generation 1) forking off the Main Trunk
const branchConfigs = [
  { nodeIdx: 3,  dx: -340, dy: 290, segs: 11, amp: 48, thick: 22, delay: 0.08 },
  { nodeIdx: 5,  dx: 390,  dy: 330, segs: 12, amp: 52, thick: 24, delay: 0.12 },
  { nodeIdx: 8,  dx: -460, dy: 380, segs: 13, amp: 58, thick: 26, delay: 0.18 },
  { nodeIdx: 11, dx: 480,  dy: 360, segs: 13, amp: 55, thick: 24, delay: 0.24 },
  { nodeIdx: 14, dx: -390, dy: 310, segs: 11, amp: 46, thick: 20, delay: 0.30 },
  { nodeIdx: 17, dx: 350,  dy: 260, segs: 10, amp: 42, thick: 18, delay: 0.36 }
];

branchConfigs.forEach((cfg) => {
  const rootNode = mainTrunk.nodes[cfg.nodeIdx];
  const bStartU = cfg.delay;
  const bEndU = bStartU + 0.42;
  const branch = createBoltDefinition(
    rootNode.baseX, rootNode.baseY,
    rootNode.baseX + cfg.dx, rootNode.baseY + cfg.dy,
    cfg.segs, cfg.amp, cfg.thick, bStartU, bEndU, 1
  );
  branch.parentIdx = cfg.nodeIdx;
  BOLTS.push(branch);

  // 3. Secondary Sub-Twigs (Generation 2) forking off each Primary Branch
  [3, 7].forEach((subIdx, sNum) => {
    if (subIdx < branch.nodes.length - 1) {
      const subRoot = branch.nodes[subIdx];
      const sideSign = Math.sign(cfg.dx) * (sNum % 2 === 0 ? 1 : 0.65);
      const subDx = sideSign * (130 + rand() * 130);
      const subDy = 110 + rand() * 130;
      const subBranch = createBoltDefinition(
        subRoot.baseX, subRoot.baseY,
        subRoot.baseX + subDx, subRoot.baseY + subDy,
        7, 28, cfg.thick * 0.55, bStartU + 0.08, bEndU + 0.12, 2
      );
      BOLTS.push(subBranch);
    }
  });
});

// 4. Secondary Whipping Electric Arcs (looping bow-shaped plasma filaments along the trunk and impact zone)
const WHIP_ARCS = [];
for (let i = 0; i < 9; i++) {
  const nStart = 2 + i * 2;
  const nEnd = Math.min(mainTrunk.nodes.length - 1, nStart + 3 + (i % 2));
  const pA = mainTrunk.nodes[nStart];
  const pB = mainTrunk.nodes[nEnd];
  const side = (i % 2 === 0) ? 1 : -1;
  WHIP_ARCS.push({
    x0: pA.baseX,
    y0: pA.baseY,
    x1: pB.baseX,
    y1: pB.baseY,
    bowSide: side,
    bowDist: 75 + rand() * 95,
    phaseOffset: i * 0.07,
    seed: rand()
  });
}

// 5. Ground Impact Splash Arcs radiating upward & outward from (CX, IMPACT_Y)
const IMPACT_ARCS = [];
const impactAngles = [-2.65, -2.35, -2.0, -1.15, -0.8, -0.48];
impactAngles.forEach((ang, idx) => {
  const reach = 190 + (idx % 2) * 95 + rand() * 60;
  const tx = CX + Math.cos(ang) * reach;
  const ty = IMPACT_Y + Math.sin(ang) * reach * 0.72;
  IMPACT_ARCS.push(
    createBoltDefinition(CX + (idx - 2.5) * 14, IMPACT_Y, tx, ty, 8, 32, 19, 0.45, 0.85, 1)
  );
});

// 6. Deterministic Spark Embers & Ionized Plasma Motes
const SPARKS = [];
for (let i = 0; i < 64; i++) {
  const alongTrunk = rand();
  const trunkIdx = Math.min(mainTrunk.nodes.length - 1, Math.floor(alongTrunk * mainTrunk.nodes.length));
  const refNode = mainTrunk.nodes[trunkIdx];
  const ang = (rand() - 0.5) * Math.PI * 1.6 - Math.PI * 0.5;
  const speed = 70 + rand() * 190;
  SPARKS.push({
    originX: refNode.baseX + (rand() - 0.5) * 90,
    originY: refNode.baseY + (rand() - 0.5) * 60,
    vx: Math.cos(ang) * speed * (rand() > 0.5 ? 1 : -1),
    vy: Math.sin(ang) * speed * 0.65,
    gravity: 85 + rand() * 90,
    birthCPhase: 0.14 + alongTrunk * 0.28 + rand() * 0.12,
    lifeSpan: 0.36 + rand() * 0.24,
    size: 4 + rand() * 9,
    isWarm: rand() > 0.62,
    rot: rand() * TAU
  });
}

// Helper: Restrained small-radius core glow (strictly localized to brightest plasma knots)
function drawRestrainedGlow(x, y, rad, alpha, isWarm = false) {
  if (alpha <= 0.01 || rad <= 1) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  if (isWarm) {
    g.addColorStop(0.0, `rgba(255, 246, 224, ${alpha})`);
    g.addColorStop(0.35, `rgba(215, 168, 95, ${alpha * 0.55})`);
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  } else {
    g.addColorStop(0.0, `rgba(240, 250, 255, ${alpha})`);
    g.addColorStop(0.32, `rgba(115, 168, 225, ${alpha * 0.58})`);
    g.addColorStop(0.70, `rgba(42, 82, 138, ${alpha * 0.20})`);
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, TAU);
  ctx.fill();
}

// Helper: Render a sculpted, variable-width hand-painted lightning bolt polygon
function renderPaintedBolt(bolt, cPhase, surgeIntensity, decayPinch) {
  // Determine leader extension progress based on cPhase
  const leaderWindow = bolt.endU - bolt.startU;
  const extendProgress = Math.max(0, Math.min(1, (cPhase - bolt.startU) / (leaderWindow * 0.35)));
  if (extendProgress <= 0.02 || surgeIntensity <= 0.01) return;

  const pts = [];
  const totalNodes = bolt.nodes.length;
  const activeCount = Math.max(2, Math.ceil(extendProgress * totalNodes));

  // Compute animated node positions for this frame
  for (let i = 0; i < activeCount; i++) {
    const n = bolt.nodes[i];
    // High-frequency electric crackle harmonic (integer multiples of cPhase)
    const crackle = Math.sin(TAU * (cPhase * n.flutterFreq + n.flutterPhase))
                  + 0.45 * Math.cos(TAU * (cPhase * 4 - n.flutterPhase * 1.7));

    // Outward bow expansion as plasma heats and decays
    const bowDrift = (cPhase - 0.18) * 34 * (n.u * (1 - n.u));
    const px = n.baseX + n.nx * (crackle * n.flutterAmp * 0.42 + bowDrift);
    const py = n.baseY + n.ny * (crackle * n.flutterAmp * 0.42);

    // Taper profile: thick at root/trunk, spiked at angular knees, needle-sharp at tip
    const tipTaper = bolt.generation === 0
      ? (1.0 - 0.28 * n.u)
      : Math.pow(1.0 - i / (totalNodes - 1), 0.75);

    // During late decay (decayPinch > 0), the bolt pinches into beads between knees
    const pinchFactor = 1.0 - decayPinch * (0.55 + 0.45 * Math.sin(i * 2.1 + n.beadSeed * TAU));
    const halfW = Math.max(0.5, bolt.thickness * 0.5 * tipTaper * n.kneeSpike * surgeIntensity * Math.max(0, pinchFactor));

    pts.push({ x: px, y: py, halfW, knee: n.kneeSpike > 1.15, u: n.u });
  }

  // Construct Left & Right jagged polygon contours for a given width multiplier
  function traceRibbonContour(widthMult, jitterScale = 0) {
    const leftSide = [];
    const rightSide = [];

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const pPrev = pts[Math.max(0, i - 1)];
      const pNext = pts[Math.min(pts.length - 1, i + 1)];
      const tx = pNext.x - pPrev.x;
      const ty = pNext.y - pPrev.y;
      const len = Math.hypot(tx, ty) || 1;
      const nx = -ty / len;
      const ny = tx / len;

      const w = (i === pts.length - 1 && bolt.generation > 0) ? 0.5 : p.halfW * widthMult;
      const spur = (p.knee && jitterScale > 0) ? w * 0.45 * jitterScale : 0;

      leftSide.push({ x: p.x + nx * (w + spur), y: p.y + ny * (w + spur) });
      rightSide.push({ x: p.x - nx * (w - spur * 0.5), y: p.y - ny * (w - spur * 0.5) });
    }

    ctx.beginPath();
    ctx.moveTo(leftSide[0].x, leftSide[0].y);
    for (let i = 1; i < leftSide.length; i++) {
      ctx.lineTo(leftSide[i].x, leftSide[i].y);
    }
    for (let i = rightSide.length - 1; i >= 0; i--) {
      ctx.lineTo(rightSide[i].x, rightSide[i].y);
    }
    ctx.closePath();
  }

  ctx.save();
  ctx.lineJoin = 'miter';
  ctx.miterLimit = 4;

  // LAYER 1: Deep Desaturated Storm-Slate Outer Silhouette Fringe
  traceRibbonContour(2.15, 1.2);
  const outerGrad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
  outerGrad.addColorStop(0.0, `rgba(22, 45, 82, ${0.75 * surgeIntensity})`);
  outerGrad.addColorStop(0.5, `rgba(36, 69, 115, ${0.82 * surgeIntensity})`);
  outerGrad.addColorStop(1.0, `rgba(17, 35, 64, ${0.55 * surgeIntensity})`);
  ctx.fillStyle = outerGrad;
  ctx.fill();

  // LAYER 2: Hand-Painted Cobalt & Cornflower Mid-Body with Subtle Internal Texture
  traceRibbonContour(1.42, 0.6);
  const midGrad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
  midGrad.addColorStop(0.0, PAL.skyBlue);
  midGrad.addColorStop(0.45, PAL.cobaltMid);
  midGrad.addColorStop(0.85, PAL.stormBlue);
  midGrad.addColorStop(1.0, PAL.deepSlate);
  ctx.fillStyle = midGrad;
  ctx.fill();

  // Internal hand-painted plasma facet striations clipped inside the mid-body
  if (bolt.generation <= 1 && surgeIntensity > 0.25) {
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = `rgba(185, 220, 250, ${0.35 * surgeIntensity})`;
    ctx.lineWidth = 3;
    for (let i = 1; i < pts.length - 1; i += 2) {
      const p = pts[i];
      ctx.beginPath();
      ctx.moveTo(p.x - 28, p.y - 12);
      ctx.lineTo(p.x + 28, p.y + 12);
      ctx.stroke();
    }
    ctx.restore();
  }

  // LAYER 3: Pale Ice-Blue Inner Sheath
  traceRibbonContour(0.85, 0.2);
  ctx.fillStyle = PAL.paleIceBlue;
  ctx.globalAlpha = Math.min(1, surgeIntensity * 1.1);
  ctx.fill();

  // LAYER 4: Bright Pale White-Blue Core (#F7FBFF)
  traceRibbonContour(0.44, 0.0);
  ctx.fillStyle = PAL.coreWhite;
  ctx.fill();

  // Restrained Small-Radius Soft Glow strictly at major branch knee vertices
  if (bolt.generation === 0) {
    for (let i = 2; i < pts.length - 1; i += 3) {
      const p = pts[i];
      drawRestrainedGlow(p.x, p.y, p.halfW * 2.4, surgeIntensity * 0.55, i % 6 === 0);
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Rhythmic Cycle Progress: 4 complete lightning strikes inside the 10-second loop
  // Each cycle runs cPhase from 0.0 -> 1.0 and fully fades out before the next begins,
  // ensuring frame at phase=0 and phase=1 are identical.
  const cPhase = (phase * CYCLES) % 1.0;

  // Envelope of the rhythmic strike cycle:
  // 0.00 - 0.05: Rest / silence (0 intensity, ensuring clean fade-out at cycle boundary)
  // 0.05 - 0.16: Rapid stepped-leader charge & downward snap
  // 0.16 - 0.34: First blinding return-stroke surge
  // 0.34 - 0.44: Brief harmonic dip (flicker)
  // 0.44 - 0.62: Second major re-strike surge & full branch bloom
  // 0.62 - 0.94: Plasma pinch-off, bead fragmentation, and full fade out to 0.0
  let surgeIntensity = 0;
  let decayPinch = 0;

  if (cPhase >= 0.05 && cPhase <= 0.94) {
    const u = (cPhase - 0.05) / 0.89; // Normalized active window [0, 1]
    // Double-peaked lightning flicker profile
    const mainEnv = Math.sin(Math.PI * u);
    const pulse1 = Math.exp(-Math.pow((cPhase - 0.22) / 0.09, 2));
    const pulse2 = 0.92 * Math.exp(-Math.pow((cPhase - 0.48) / 0.12, 2));
    const leaderRamp = Math.min(1, (cPhase - 0.05) / 0.09);
    const tailFade = Math.pow(Math.max(0, (0.94 - cPhase) / 0.34), 1.8);

    surgeIntensity = leaderRamp * Math.min(1, (0.32 * mainEnv + 0.78 * Math.max(pulse1, pulse2))) * (cPhase > 0.60 ? tailFade : 1.0);

    if (cPhase > 0.56) {
      decayPinch = Math.min(1, (cPhase - 0.56) / 0.36);
    }
  }

  // Anticipation pre-charge at the sky origin node (0.02 -> 0.22)
  const originCharge = (cPhase > 0.02 && cPhase < 0.88)
    ? Math.sin(Math.PI * ((cPhase - 0.02) / 0.86)) * (cPhase < 0.22 ? 1.0 : 0.65)
    : 0;

  // =========================================================================
  // 1. CONTAINED SUBSURFACE ATMOSPHERIC BACK-ILLUMINATION (Tight along trunk)
  // Fades strictly to pure #000000 well within the canvas bounds
  // =========================================================================
  if (surgeIntensity > 0.01) {
    const spineGlow = ctx.createRadialGradient(CX, CY, 30, CX, CY, 680);
    spineGlow.addColorStop(0.0, `rgba(45, 82, 138, ${0.18 * surgeIntensity})`);
    spineGlow.addColorStop(0.45, `rgba(22, 44, 82, ${0.09 * surgeIntensity})`);
    spineGlow.addColorStop(0.80, `rgba(8, 18, 36, ${0.03 * surgeIntensity})`);
    spineGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = spineGlow;
    ctx.beginPath();
    ctx.arc(CX, CY, 680, 0, TAU);
    ctx.fill();
  }

  // =========================================================================
  // 2. SECONDARY WHIPPING ELECTRIC ARCS & DISSIPATING PLASMA WISPS
  // =========================================================================
  if (cPhase > 0.14 && cPhase < 0.92) {
    for (let i = 0; i < WHIP_ARCS.length; i++) {
      const w = WHIP_ARCS[i];
      const localC = (cPhase - 0.14 - w.phaseOffset * 0.4);
      if (localC > 0 && localC < 0.55) {
        const wProg = localC / 0.55; // 0 -> 1
        const wAlpha = Math.sin(Math.PI * wProg) * (1 - wProg * 0.4) * surgeIntensity;
        if (wAlpha > 0.03) {
          const midX = (w.x0 + w.x1) * 0.5 + w.bowSide * (w.bowDist * (0.4 + 0.8 * wProg));
          const midY = (w.y0 + w.y1) * 0.5 + Math.sin(TAU * (cPhase * 4 + w.seed)) * 28;

          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Build jagged 5-segment arc along the quadratic curve
          const arcPts = [];
          const steps = 7;
          for (let s = 0; s <= steps; s++) {
            const u = s / steps;
            const inv = 1 - u;
            const bx = inv * inv * w.x0 + 2 * inv * u * midX + u * u * w.x1;
            const by = inv * inv * w.y0 + 2 * inv * u * midY + u * u * w.y1;
            const jit = (s === 0 || s === steps) ? 0 : Math.sin(s * 3.7 + cPhase * TAU * 5) * 18;
            arcPts.push({ x: bx + jit, y: by });
          }

          const traceArc = () => {
            ctx.beginPath();
            for (let s = 0; s < arcPts.length; s++) {
              if (s === 0) ctx.moveTo(arcPts[s].x, arcPts[s].y);
              else ctx.lineTo(arcPts[s].x, arcPts[s].y);
            }
          };

          // Outer storm-blue sheath
          ctx.strokeStyle = `rgba(36, 69, 115, ${wAlpha * 0.85})`;
          ctx.lineWidth = 14 * (1 - wProg * 0.5);
          traceArc();
          ctx.stroke();

          // Mid cobalt-blue body
          ctx.strokeStyle = `rgba(110, 165, 225, ${wAlpha * 0.9})`;
          ctx.lineWidth = 7 * (1 - wProg * 0.5);
          traceArc();
          ctx.stroke();

          // Pale white-blue core filament
          ctx.strokeStyle = `rgba(247, 251, 255, ${wAlpha})`;
          ctx.lineWidth = 2.8 * (1 - wProg * 0.4);
          traceArc();
          ctx.stroke();

          ctx.restore();
        }
      }
    }
  }

  // =========================================================================
  // 3. PRIMARY & SECONDARY BRANCHING LIGHTNING BOLTS (Hand-Painted Layered Ribbons)
  // =========================================================================
  // Render sub-branches first, then primary branches, then the main central trunk on top
  for (let g = 2; g >= 0; g--) {
    for (let i = 0; i < BOLTS.length; i++) {
      if (BOLTS[i].generation === g) {
        const branchBoost = g === 0 ? 1.0 : (g === 1 ? 0.92 : 0.82);
        renderPaintedBolt(BOLTS[i], cPhase, surgeIntensity * branchBoost, decayPinch);
      }
    }
  }

  // =========================================================================
  // 4. GROUND IMPACT NEXUS & SPLASH ARCS AT (CX, IMPACT_Y)
  // =========================================================================
  if (cPhase > 0.16 && cPhase < 0.92) {
    const impU = (cPhase - 0.16) / 0.76;
    const impAlpha = Math.sin(Math.PI * impU) * surgeIntensity;

    if (impAlpha > 0.02) {
      const impX = mainTrunk.nodes[mainTrunk.nodes.length - 1].baseX;
      const impY = IMPACT_Y;

      // Ground plasma pool (foreshortened painted ellipse at the strike base)
      ctx.save();
      ctx.translate(impX, impY);
      const poolRx = (110 + 160 * Math.sin(Math.PI * impU)) * (1 - 0.3 * decayPinch);
      const poolRy = poolRx * 0.24;

      const poolGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, poolRx);
      poolGrad.addColorStop(0.0, PAL.coreWhite);
      poolGrad.addColorStop(0.28, PAL.paleIceBlue);
      poolGrad.addColorStop(0.58, PAL.cobaltMid);
      poolGrad.addColorStop(0.85, PAL.deepSlate);
      poolGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

      ctx.globalAlpha = Math.min(1, impAlpha * 1.15);
      ctx.scale(1.0, poolRy / poolRx);
      ctx.fillStyle = poolGrad;
      ctx.beginPath();
      ctx.arc(0, 0, poolRx, 0, TAU);
      ctx.fill();
      ctx.restore();

      // Upward-splashing jagged ground impact arcs
      for (let i = 0; i < IMPACT_ARCS.length; i++) {
        renderPaintedBolt(IMPACT_ARCS[i], cPhase + 0.32, impAlpha * 0.88, decayPinch);
      }

      // Restrained core flash & painted star spikes at the impact nexus
      drawRestrainedGlow(impX, impY, 95 * impAlpha, impAlpha * 0.85, true);

      ctx.save();
      ctx.translate(impX, impY);
      ctx.fillStyle = PAL.coreWhite;
      ctx.globalAlpha = impAlpha;
      ctx.beginPath();
      const spikes = 10;
      for (let k = 0; k < spikes * 2; k++) {
        const a = (k * Math.PI) / spikes;
        const r = (k % 2 === 0)
          ? (68 + 35 * (k % 4 === 0 ? 1 : 0.4)) * impAlpha
          : 11 * impAlpha;
        const sx = Math.cos(a) * r * 1.35;
        const sy = Math.sin(a) * r * 0.65;
        if (k === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // =========================================================================
  // 5. UPPER SKY ORIGIN CONDUCTOR NODE AT (CX - 15, ORIGIN_Y)
  // =========================================================================
  if (originCharge > 0.01) {
    const ox = mainTrunk.nodes[0].baseX;
    const oy = ORIGIN_Y;

    drawRestrainedGlow(ox, oy, 85 * originCharge, originCharge * 0.8, false);

    // Jagged painted plasma crown at origin
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(cPhase * Math.PI);
    ctx.fillStyle = PAL.cobaltMid;
    ctx.globalAlpha = originCharge * 0.85;
    ctx.beginPath();
    for (let k = 0; k < 16; k++) {
      const a = (k * TAU) / 16;
      const r = (k % 2 === 0 ? 54 : 20) * originCharge;
      if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = PAL.coreWhite;
    ctx.beginPath();
    for (let k = 0; k < 16; k++) {
      const a = (k * TAU) / 16;
      const r = (k % 2 === 0 ? 32 : 9) * originCharge;
      if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // =========================================================================
  // 6. AMBIENT ELECTRIC SPARKS & IONIZED PLASMA BEADS (Fading cleanly to #000000)
  // =========================================================================
  for (let i = 0; i < SPARKS.length; i++) {
    const sp = SPARKS[i];
    const age = cPhase - sp.birthCPhase;
    if (age > 0 && age < sp.lifeSpan) {
      const u = age / sp.lifeSpan; // 0 -> 1 within the single strike cycle
      const spAlpha = Math.sin(Math.PI * u) * Math.pow(1 - u, 1.3);

      if (spAlpha > 0.02) {
        const px = sp.originX + sp.vx * u;
        const py = sp.originY + sp.vy * u + 0.5 * sp.gravity * u * u;
        const curSize = sp.size * (1 - 0.45 * u);

        // Restrained tight halo around spark
        drawRestrainedGlow(px, py, curSize * 2.2, spAlpha * 0.7, sp.isWarm);

        // Hand-painted diamond spark core oriented along velocity vector
        const vxNow = sp.vx;
        const vyNow = sp.vy + sp.gravity * u;
        const vAng = Math.atan2(vyNow, vxNow);

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(vAng);
        ctx.globalAlpha = spAlpha;

        // Outer mid-tone sheath
        ctx.fillStyle = sp.isWarm ? PAL.amberSparkEdge : PAL.cobaltMid;
        ctx.beginPath();
        ctx.moveTo(curSize * 2.1, 0);
        ctx.lineTo(0, curSize * 0.65);
        ctx.lineTo(-curSize * 2.6, 0);
        ctx.lineTo(0, -curSize * 0.65);
        ctx.closePath();
        ctx.fill();

        // Bright pale core
        ctx.fillStyle = sp.isWarm ? PAL.warmSparkCore : PAL.coreWhite;
        ctx.beginPath();
        ctx.moveTo(curSize * 1.2, 0);
        ctx.lineTo(0, curSize * 0.32);
        ctx.lineTo(-curSize * 1.5, 0);
        ctx.lineTo(0, -curSize * 0.32);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }
  }
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
