<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Underline Squiggle Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Seeded deterministic PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(904123);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom / Cardinal spline interpolation through hand-drawn control waypoints
// Produces dense polyline vertices with organic marker width variation (14-22px)
function buildHandDrawnSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrlPt(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrlPt(segIdx - 1);
    const p1 = getCtrlPt(segIdx);
    const p2 = getCtrlPt(segIdx + 1);
    const p3 = getCtrlPt(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    // Catmull-Rom spline formula
    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn micro-imperfection along the stroke
    const microWobbleY = Math.sin(u * 45 + seedPhase) * 2.4 + Math.cos(u * 29 - seedPhase) * 1.8;
    const microWobbleX = Math.cos(u * 37 + seedPhase) * 1.8;

    // Marker nib width variation (14-22px), heavier on downstrokes, slightly tapered at start/end tips
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * 4.5 + seedPhase);
    let taper = 1.0;
    if (u < 0.035) taper = 0.65 + 0.35 * (u / 0.035);
    else if (u > 0.96) taper = 0.60 + 0.40 * ((1 - u) / 0.04);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + microWobbleX,
      y: y + microWobbleY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// 1. PRIMARY HERO WHITE MARKER UNDERLINE SQUIGGLE (Sweeps Left to Right, then whips into a double-underline flourish)
// Stays well within safe horizontal margins [-920, +920] and vertical margins [-220, +240] around (CX, CY)
const primaryWaypoints = [
  { x: -910, y: 18 },
  { x: -770, y: -58 },
  { x: -610, y: 42 },
  { x: -445, y: -68 },
  { x: -270, y: 38 },
  { x: -95,  y: -74 },
  { x: 85,   y: 35 },
  { x: 265,  y: -70 },
  { x: 445,  y: 36 },
  { x: 625,  y: -62 },
  { x: 790,  y: 28 },
  { x: 915,  y: -38 }, // Right end of main wavy sweep, whips down & back left
  { x: 720,  y: 95 },
  { x: 220,  y: 78 },
  { x: -340, y: 118 },
  { x: -620, y: 148 }, // Left turn of lower underline flourish, sweeps back right
  { x: -280, y: 192 },
  { x: 160,  y: 168 },
  { x: 540,  y: 205 },
  { x: 675,  y: 162 }  // Final upward flick tip on the right
];
const PRIMARY_UNDERLINE = buildHandDrawnSpline(primaryWaypoints, 280, 16, 22, 0, 0.5);

// 2. SECONDARY WARM YELLOW (#FFD93D) WAVY UNDERLINE SQUIGGLE (Draws Left to Right with overlapping delay)
const yellowWaypoints = [
  { x: -840, y: 58 },
  { x: -690, y: 112 },
  { x: -520, y: 34 },
  { x: -350, y: 108 },
  { x: -175, y: 26 },
  { x: 5,    y: 102 },
  { x: 185,  y: 24 },
  { x: 365,  y: 100 },
  { x: 545,  y: 28 },
  { x: 715,  y: 96 },
  { x: 865,  y: 32 }
];
const YELLOW_UNDERLINE = buildHandDrawnSpline(yellowWaypoints, 210, 15, 20, 180, 2.3);

// 3. SECONDARY UPPER WHITE LEAD-IN EMPHASIS SQUIGGLE (Sweeps Left to Right above the main squiggle)
const upperWhiteWaypoints = [
  { x: -860, y: -115 },
  { x: -560, y: -152 },
  { x: -210, y: -124 },
  { x: 170,  y: -156 },
  { x: 530,  y: -120 },
  { x: 845,  y: -142 }
];
const UPPER_WHITE_LINE = buildHandDrawnSpline(upperWhiteWaypoints, 160, 14, 19, 320, 4.1);

// 4. AMBIENT HAND-DRAWN DOODLE ACCENTS (Left & Right Emphasis Ticks, Exclamation Dots, Little Scribble Stars)
const AMBIENT_MARKS = [
  // Left entry emphasis dashes
  { x: -995, y: -45, ang: -2.65, len: 56, color: COLOR_WHITE,  phaseOff: 0.48, type: 'dash', slot: 410 },
  { x: -1015, y: 18, ang: 3.10,  len: 64, color: COLOR_YELLOW, phaseOff: 0.52, type: 'dash', slot: 415 },
  { x: -990, y: 82,  ang: 2.55,  len: 54, color: COLOR_WHITE,  phaseOff: 0.55, type: 'dash', slot: 420 },
  // Right finish impact rays & star (triggered as the left-to-right sweep reaches the right side)
  { x: 995,  y: -92, ang: -0.55, len: 62, color: COLOR_YELLOW, phaseOff: 0.14, type: 'dash', slot: 430 },
  { x: 1025, y: -22, ang: 0.05,  len: 70, color: COLOR_WHITE,  phaseOff: 0.17, type: 'dash', slot: 435 },
  { x: 990,  y: 52,  ang: 0.62,  len: 58, color: COLOR_YELLOW, phaseOff: 0.20, type: 'dash', slot: 440 },
  // Hand-drawn 4-stroke scribble stars above left-center and below right-center
  { x: -580, y: -235, ang: 0.2,  len: 34, color: COLOR_YELLOW, phaseOff: 0.08, type: 'star', slot: 450 },
  { x: 760,  y: 215,  ang: -0.3, len: 38, color: COLOR_WHITE,  phaseOff: 0.26, type: 'star', slot: 460 },
  { x: 190,  y: -245, ang: 0.4,  len: 30, color: COLOR_WHITE,  phaseOff: 0.64, type: 'star', slot: 470 },
  // Little double-tick quotation/emphasis marks under the tail flourish
  { x: -45,  y: 268,  ang: 1.45, len: 42, color: COLOR_YELLOW, phaseOff: 0.32, type: 'doubleTick', slot: 480 }
];

// Progressive Draw-On (Left to Right) -> Hold -> Erase from Start (Left to Right)
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.42]: Draws itself progressively left-to-right (uStart = 0, uEnd: 0 -> 1)
// - c in [0.42, 0.58]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.58, 0.96]: Erases from the start (left) toward the end (right) (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.42) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.42) };
  } else if (c < 0.58) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.58) / 0.38), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker squiggle stroke between [uStart, uEnd] with discrete 12fps line boil
// and dynamic elastic wave oscillation
function renderSquiggleStroke(pts, uStart, uEnd, color, boilStep, phase, waveFreq) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with neighbors
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Subtle organic wave follow-through along the squiggle (integer frequency per loop)
    const waveY = Math.sin(TAU * (phase * waveFreq - p.u * 1.5)) * 8.5;
    const waveX = Math.cos(TAU * (phase * 2 - p.u * 1.0)) * 4.5;

    return {
      x: p.x + bx + waveX,
      y: p.y + by + waveY,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Render in short 4-segment batches to preserve marker width variation (14-22px)
  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Smooth sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Smooth sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// Render Ambient Hand-Drawn Marker Emphasis Doodles
function renderAmbientMarks(phase, boilStep) {
  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < AMBIENT_MARKS.length; i++) {
    const m = AMBIENT_MARKS[i];
    const localC = (phase * 2 + m.phaseOff) % 1.0;
    const win = getDrawEraseWindow(localC);
    if (win.uEnd - win.uStart <= 0.02) continue;

    const bx = boilRowX[m.slot];
    const by = boilRowY[m.slot];
    const cx = m.x + bx;
    const cy = m.y + by;

    ctx.strokeStyle = m.color;
    ctx.lineWidth = 16;

    if (m.type === 'dash') {
      const d0 = win.uStart * m.len;
      const d1 = win.uEnd * m.len;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(m.ang) * d0, cy + Math.sin(m.ang) * d0);
      ctx.lineTo(cx + Math.cos(m.ang) * d1, cy + Math.sin(m.ang) * d1);
      ctx.stroke();
    } else if (m.type === 'doubleTick') {
      for (let k = -1; k <= 1; k += 2) {
        const ox = cx + k * 22;
        const d0 = win.uStart * m.len;
        const d1 = win.uEnd * m.len;
        ctx.beginPath();
        ctx.moveTo(ox + Math.cos(m.ang) * d0, cy + Math.sin(m.ang) * d0);
        ctx.lineTo(ox + Math.cos(m.ang) * d1, cy + Math.sin(m.ang) * d1);
        ctx.stroke();
      }
    } else if (m.type === 'star') {
      const s = m.len;
      const axes = [0, Math.PI * 0.5, Math.PI * 0.25, Math.PI * 0.75];
      ctx.lineWidth = 14;
      for (let k = 0; k < 4; k++) {
        const a = m.ang + axes[k];
        const l0 = -s + win.uStart * (2 * s);
        const l1 = -s + win.uEnd * (2 * s);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * l0, cy + Math.sin(a) * l0);
        ctx.lineTo(cx + Math.cos(a) * l1, cy + Math.sin(a) * l1);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, wrapping identically at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Whole-object subtle hand-drawn squash & stretch, tilt wobble, and breathing (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);

  const scaleX = 1.0 + 0.018 * sin2;
  const scaleY = 1.0 - 0.018 * sin2;
  const tiltRot = -0.025 + 0.022 * sin1 + 0.014 * cos2;
  const bobX = 10 * cos1;
  const bobY = 14 * sin2;

  ctx.save();
  ctx.translate(CX + bobX, CY + bobY);
  ctx.rotate(tiltRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Left-to-Right Draw-On -> Hold -> Left-to-Right Erase Cycles per 10s loop (k = 2)
  // Staggered phase offsets so the Primary White Squiggle is at its FULL held state at phase=0 & phase=1,
  // while the Secondary Yellow & Upper White squiggles overlap with delayed follow-through:
  const baseCycle = phase * 2;

  const winUpperWhite = getDrawEraseWindow(baseCycle + 0.00);
  const winYellow     = getDrawEraseWindow(baseCycle + 0.24);
  const winPrimary    = getDrawEraseWindow(baseCycle + 0.50);

  // 1. Secondary Motion Layer: Upper White Lead-In Squiggle (Draws Left to Right)
  renderSquiggleStroke(
    UPPER_WHITE_LINE,
    winUpperWhite.uStart,
    winUpperWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    2
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Wavy Underline Squiggle (Draws Left to Right with delay)
  renderSquiggleStroke(
    YELLOW_UNDERLINE,
    winYellow.uStart,
    winYellow.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    3
  );

  // 3. Primary Motion Layer: Hero White Marker Underline Squiggle & Return Flourish (Draws Left to Right)
  renderSquiggleStroke(
    PRIMARY_UNDERLINE,
    winPrimary.uStart,
    winPrimary.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    2
  );

  // 4. Ambient Motion Layer: Hand-Drawn Marker Emphasis Dashes & Doodle Stars
  renderAmbientMarks(phase, boilStep);

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
