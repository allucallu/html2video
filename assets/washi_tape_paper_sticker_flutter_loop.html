<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washi Tape Scrapbook Sticker Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Retro Scrapbook Palette
const PALETTE = {
  stickerWhite: '#FAF5EA',
  stickerCream: '#F2E8D5',
  paperShadow: '#DED0B8',
  printShadow: '#C9B89D',
  inkOutline: '#4A3F39',
  dustyPink: '#E08D8F',
  dustyPinkDark: '#C87174',
  dustyPinkLight: '#EEB2B3',
  mustard: '#E5B144',
  mustardDark: '#C99326',
  sage: '#8CA88E',
  sageDark: '#6E8B70',
  softRed: '#D45D56',
  softRedDark: '#B5443E',
  warmCream: '#FBF6EC'
};

// Seeded deterministic PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(541987);

// Precompute hand-drawn edge imperfections along the tape
const NUM_SEGMENTS = 64;
const topEdgeJitter = [];
const botEdgeJitter = [];
for (let i = 0; i <= NUM_SEGMENTS; i++) {
  const a = (i / NUM_SEGMENTS) * TAU;
  topEdgeJitter.push((rand() - 0.5) * 6.5 + Math.sin(a * 5) * 3.5);
  botEdgeJitter.push((rand() - 0.5) * 6.5 + Math.cos(a * 6) * 3.5);
}

// Precompute torn/serrated zig-zag teeth at left and right ends of the washi tape
const NUM_TEETH = 17;
const leftTeethJitter = [];
const rightTeethJitter = [];
for (let i = 0; i <= NUM_TEETH; i++) {
  leftTeethJitter.push({
    dx: (i % 2 === 0 ? -18 : 10) + (rand() - 0.5) * 8,
    dy: (rand() - 0.5) * 5
  });
  rightTeethJitter.push({
    dx: (i % 2 === 0 ? 18 : -10) + (rand() - 0.5) * 8,
    dy: (rand() - 0.5) * 5
  });
}

// Precompute Polka Dots across the washi tape in UV space (u in [0, 1], v in [-0.5, 0.5])
const POLKA_DOTS = [];
const DOT_COLORS = [
  { main: PALETTE.mustard, rim: PALETTE.mustardDark },
  { main: PALETTE.sage, rim: PALETTE.sageDark },
  { main: PALETTE.softRed, rim: PALETTE.softRedDark },
  { main: PALETTE.warmCream, rim: PALETTE.paperShadow }
];

const cols = 13;
const rows = 4;
for (let c = 0; c < cols; c++) {
  for (let r = 0; r < rows; r++) {
    const uBase = (c + 0.5 + (r % 2 === 1 ? 0.25 : -0.25)) / cols;
    const vBase = ((r + 0.5) / rows) - 0.5;
    if (uBase > 0.03 && uBase < 0.97) {
      const u = uBase + (rand() - 0.5) * 0.018;
      const v = vBase * 0.82 + (rand() - 0.5) * 0.04;
      const colObj = DOT_COLORS[(c * 3 + r * 2) % DOT_COLORS.length];
      // Hand-cut imperfect circle vertices
      const dotVerts = [];
      const nV = 14;
      const baseRad = 32 + (rand() - 0.5) * 6;
      for (let k = 0; k < nV; k++) {
        const ang = (k / nV) * TAU;
        const rJit = baseRad * (0.94 + 0.12 * rand());
        dotVerts.push({ cos: Math.cos(ang), sin: Math.sin(ang), r: rJit });
      }
      POLKA_DOTS.push({ u, v, colObj, dotVerts, baseRad });
    }
  }
}

// Precompute deterministic paper texture fibers & specks inside the tape and sticker backing
const PAPER_FIBERS = [];
for (let i = 0; i < 380; i++) {
  PAPER_FIBERS.push({
    u: rand(),
    v: rand() - 0.5,
    len: 8 + rand() * 24,
    ang: rand() * TAU,
    alpha: 0.08 + rand() * 0.14,
    isLight: rand() > 0.45
  });
}

// Precompute Ambient Floating Die-Cut Mini Scrapbook Confetti Stickers (punch-out dots, stars, tiny tape bits)
const MINI_STICKERS = [];
const MINI_PALETTE = [PALETTE.dustyPink, PALETTE.mustard, PALETTE.sage, PALETTE.softRed, PALETTE.warmCream];
for (let i = 0; i < 18; i++) {
  const angle = (i / 18) * TAU + (rand() - 0.5) * 0.2;
  const radX = 860 + rand() * 380;
  const radY = 390 + rand() * 260;
  const shapeTypes = ['dot', 'star', 'heart', 'diamond'];
  MINI_STICKERS.push({
    baseX: CX + Math.cos(angle) * radX,
    baseY: CY + Math.sin(angle) * radY,
    wobbleRx: 14 + rand() * 22,
    wobbleRy: 14 + rand() * 22,
    freqX: 1 + (i % 2),
    freqY: 1 + ((i + 1) % 2),
    rotFreq: 1 + (i % 3),
    rotAmp: 0.14 + rand() * 0.18,
    scaleFreq: 2,
    phaseOffset: rand(),
    size: 24 + rand() * 18,
    shape: shapeTypes[i % shapeTypes.length],
    color: MINI_PALETTE[i % MINI_PALETTE.length],
    scissorJit: [rand(), rand(), rand(), rand(), rand(), rand(), rand(), rand()]
  });
}

// Helper: Draw a mini die-cut scrapbook sticker (thick scissor-cut white border + offset print shadow + flat retro fill)
function drawMiniSticker(s, phase) {
  const px = s.baseX + Math.sin(TAU * (phase * s.freqX + s.phaseOffset)) * s.wobbleRx;
  const py = s.baseY + Math.cos(TAU * (phase * s.freqY + s.phaseOffset)) * s.wobbleRy;
  const rot = Math.sin(TAU * (phase * s.rotFreq + s.phaseOffset)) * s.rotAmp + s.phaseOffset * TAU;
  const sc = 1.0 + 0.06 * Math.sin(TAU * (phase * s.scaleFreq + s.phaseOffset));

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(rot);
  ctx.scale(sc, sc);

  const defineShape = (rScale, ox, oy) => {
    ctx.beginPath();
    const R = s.size * rScale;
    if (s.shape === 'dot') {
      const pts = 10;
      for (let k = 0; k < pts; k++) {
        const a = (k / pts) * TAU;
        const jr = R * (0.94 + 0.12 * s.scissorJit[k % 8]);
        const x = ox + Math.cos(a) * jr;
        const y = oy + Math.sin(a) * jr;
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
    } else if (s.shape === 'star') {
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * TAU - Math.PI / 2;
        const jr = (k % 2 === 0 ? R * 1.15 : R * 0.52) * (0.95 + 0.1 * s.scissorJit[k % 8]);
        const x = ox + Math.cos(a) * jr;
        const y = oy + Math.sin(a) * jr;
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
    } else if (s.shape === 'diamond') {
      const pts = [
        { x: 0, y: -R * 1.2 },
        { x: R * 0.9, y: 0 },
        { x: 0, y: R * 1.2 },
        { x: -R * 0.9, y: 0 }
      ];
      pts.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(ox + p.x, oy + p.y);
        else ctx.lineTo(ox + p.x, oy + p.y);
      });
    } else {
      // Scissor-cut heart
      const hr = R * 0.95;
      ctx.moveTo(ox, oy + hr * 0.95);
      ctx.bezierCurveTo(ox - hr * 1.3, oy + hr * 0.2, ox - hr * 1.2, oy - hr * 0.95, ox, oy - hr * 0.35);
      ctx.bezierCurveTo(ox + hr * 1.2, oy - hr * 0.95, ox + hr * 1.3, oy + hr * 0.2, ox, oy + hr * 0.95);
    }
    ctx.closePath();
  };

  // 1. Thick scissor-cut white die-cut sticker border
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  defineShape(1.0, 0, 0);
  ctx.fillStyle = PALETTE.stickerWhite;
  ctx.fill();
  ctx.strokeStyle = PALETTE.stickerWhite;
  ctx.lineWidth = 24;
  ctx.stroke();

  // Subtle inner sticker cut-edge line
  ctx.strokeStyle = PALETTE.paperShadow;
  ctx.lineWidth = 3;
  ctx.stroke();

  // 2. Internal offset print shadow (strictly inside the white sticker border)
  defineShape(0.88, 5, 6);
  ctx.fillStyle = PALETTE.printShadow;
  ctx.fill();

  // 3. Main retro flat color fill
  defineShape(0.88, 0, 0);
  ctx.fillStyle = s.color;
  ctx.fill();

  // 4. Subtle hand-drawn ink registration outline
  defineShape(0.88, -2, -2);
  ctx.strokeStyle = PALETTE.inkOutline;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Harmonic periodic functions (integer cycles k = 1, 2, 3, 4)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin3 = Math.sin(TAU * phase * 3);
  const sin4 = Math.sin(TAU * phase * 4);

  // 1. Draw Ambient Scrapbook Confetti Stickers around the main subject
  for (let i = 0; i < MINI_STICKERS.length; i++) {
    drawMiniSticker(MINI_STICKERS[i], phase);
  }

  // 2. Primary Sticker Motion: Gentle scrapbook wobble, tilt, and playful bounce
  const stickerAngle = -0.055 + 0.024 * sin1 + 0.012 * cos2;
  const bounceX = 10 * cos1;
  const bounceY = 16 * sin2 + 6 * sin1;
  const scaleX = 1.0 + 0.012 * sin2;
  const scaleY = 1.0 - 0.012 * sin2;

  ctx.save();
  ctx.translate(CX + bounceX, CY + bounceY);
  ctx.rotate(stickerAngle);
  ctx.scale(scaleX, scaleY);

  // Dimensions of the Washi Tape Strip
  const tapeLength = 1520;
  const tapeHeight = 350;
  const halfL = tapeLength / 2;
  const halfH = tapeHeight / 2;

  // Secondary Motion: Peeling & Fluttering Geometry
  // Right end peels back between u = peelHingeU and u = 1.0
  // Peel lifts and relaxes rhythmically (2 main cycles + 1 slow cycle), while the tip flutters faster (3 & 4 cycles)
  const peelAmount = 0.52 + 0.36 * (0.5 + 0.5 * sin2) + 0.12 * sin1; // in [0.4, 1.0]
  const peelHingeU = 0.66 - 0.13 * peelAmount; // Hinge line rolls between u = 0.53 and u = 0.61
  const leftFlutter = 0.5 + 0.5 * Math.sin(TAU * (phase * 2 - 0.2));

  // Function mapping tape coordinates (u in [0,1], v in [-0.5, 0.5]) for the FLAT/BASE sticker footprint
  function getBasePoint(u, v) {
    const xBase = (u - 0.5) * tapeLength;
    // Slight organic arch across the whole strip
    const archY = Math.sin(u * Math.PI) * (-18 + 8 * sin1);
    const idx = Math.min(NUM_SEGMENTS, Math.max(0, Math.round(u * NUM_SEGMENTS)));
    const edgeJit = v < 0 ? topEdgeJitter[idx] : botEdgeJitter[idx];
    const yBase = v * tapeHeight + archY + edgeJit * Math.abs(v) * 2;
    return { x: xBase, y: yBase };
  }

  // Function mapping tape coordinates (u in [0,1], v in [-0.5, 0.5]) for the ACTIVE/PEELING Washi Tape
  function getPeelPoint(u, v) {
    const base = getBasePoint(u, v);

    // Subtle left-end corner breath (u < 0.14)
    if (u < 0.14) {
      const sL = (0.14 - u) / 0.14;
      const liftL = sL * sL * (14 + 12 * leftFlutter);
      return {
        x: base.x + liftL * 0.45,
        y: base.y - liftL * (0.7 - 0.4 * v)
      };
    }

    // Right-end peeling and fluttering (u > peelHingeU)
    if (u > peelHingeU) {
      const s = (u - peelHingeU) / (1.0 - peelHingeU); // 0 at peel crease, 1 at fluttering right edge
      const s2 = s * s;
      const s3 = s2 * s;

      // Diagonal peel lift: top-right lifts higher and curls back to the left
      const diagSkew = 1.0 - 0.32 * (v + 0.5); // v = -0.5 (top) lifts more than v = +0.5 (bottom)
      const liftHeight = (155 * peelAmount * s2 + 38 * s3 * sin3 + 18 * s2 * sin4) * diagSkew;
      const curlBackX = (135 * peelAmount * Math.pow(s, 1.75) + 26 * s2 * sin3 - 14 * s3 * cos2) * diagSkew;

      // Flutter wave rippling through the lifted tail
      const flutterWaveY = Math.sin(TAU * (phase * 3 - s * 0.65)) * (28 * s2)
                         + Math.cos(TAU * (phase * 4 - s * 0.9)) * (12 * s3);

      return {
        x: base.x - curlBackX,
        y: base.y - liftHeight + flutterWaveY
      };
    }

    return base;
  }

  // Build path for the complete Sticker Backing (union of flat bed + peeled silhouette)
  // Surrounding the whole sticker with a thick, scissor-cut die-cut white border!
  function buildFlatBedPath(offsetX = 0, offsetY = 0) {
    ctx.beginPath();
    // Top edge left to right
    for (let i = 0; i <= NUM_SEGMENTS; i++) {
      const u = i / NUM_SEGMENTS;
      const p = getBasePoint(u, -0.5);
      if (i === 0) ctx.moveTo(p.x + leftTeethJitter[0].dx + offsetX, p.y + offsetY);
      else ctx.lineTo(p.x + offsetX, p.y + offsetY);
    }
    // Right serrated edge top to bottom
    for (let j = 0; j <= NUM_TEETH; j++) {
      const v = -0.5 + (j / NUM_TEETH);
      const p = getBasePoint(1.0, v);
      const tj = rightTeethJitter[j];
      ctx.lineTo(p.x + tj.dx + offsetX, p.y + tj.dy + offsetY);
    }
    // Bottom edge right to left
    for (let i = NUM_SEGMENTS; i >= 0; i--) {
      const u = i / NUM_SEGMENTS;
      const p = getBasePoint(u, 0.5);
      ctx.lineTo(p.x + offsetX, p.y + offsetY);
    }
    // Left serrated edge bottom to top
    for (let j = NUM_TEETH; j >= 0; j--) {
      const v = -0.5 + (j / NUM_TEETH);
      const p = getBasePoint(0.0, v);
      const tj = leftTeethJitter[j];
      ctx.lineTo(p.x + tj.dx + offsetX, p.y + tj.dy + offsetY);
    }
    ctx.closePath();
  }

  function buildPeeledTapePath(offsetX = 0, offsetY = 0) {
    ctx.beginPath();
    for (let i = 0; i <= NUM_SEGMENTS; i++) {
      const u = i / NUM_SEGMENTS;
      const p = getPeelPoint(u, -0.5);
      if (i === 0) ctx.moveTo(p.x + leftTeethJitter[0].dx + offsetX, p.y + offsetY);
      else ctx.lineTo(p.x + offsetX, p.y + offsetY);
    }
    for (let j = 0; j <= NUM_TEETH; j++) {
      const v = -0.5 + (j / NUM_TEETH);
      const p = getPeelPoint(1.0, v);
      const tj = rightTeethJitter[j];
      ctx.lineTo(p.x + tj.dx * 0.75 + offsetX, p.y + tj.dy + offsetY);
    }
    for (let i = NUM_SEGMENTS; i >= 0; i--) {
      const u = i / NUM_SEGMENTS;
      const p = getPeelPoint(u, 0.5);
      ctx.lineTo(p.x + offsetX, p.y + offsetY);
    }
    for (let j = NUM_TEETH; j >= 0; j--) {
      const v = -0.5 + (j / NUM_TEETH);
      const p = getPeelPoint(0.0, v);
      const tj = leftTeethJitter[j];
      ctx.lineTo(p.x + tj.dx + offsetX, p.y + tj.dy + offsetY);
    }
    ctx.closePath();
  }

  // =========================================================================
  // LAYER A: THICK SCISSOR-CUT WHITE DIE-CUT STICKER BORDER
  // =========================================================================
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Outer thick white sticker border around both the flat backing and the lifted peel flap
  const borderWidth = 76;

  // Paper thickness rim (subtle warm cream edge inside the outer cut)
  ctx.strokeStyle = PALETTE.paperShadow;
  ctx.lineWidth = borderWidth + 6;
  buildFlatBedPath(4, 6);
  ctx.stroke();
  buildPeeledTapePath(4, 6);
  ctx.stroke();

  // Pure warm sticker white border
  ctx.fillStyle = PALETTE.stickerWhite;
  ctx.strokeStyle = PALETTE.stickerWhite;
  ctx.lineWidth = borderWidth;
  buildFlatBedPath(0, 0);
  ctx.fill();
  ctx.stroke();
  buildPeeledTapePath(0, 0);
  ctx.fill();
  ctx.stroke();

  // Subtle hand-cut scissor facets along the white border edge (dashed subtle paper crease)
  ctx.strokeStyle = '#EFE6D5';
  ctx.lineWidth = 4;
  buildFlatBedPath(0, 0);
  ctx.stroke();
  ctx.restore();

  // =========================================================================
  // LAYER B: EXPOSED STICKER BACKING & INTERNAL OFFSET PRINT SHADOW
  // (Visible on the right where the tape peels up, and as an offset print shadow)
  // =========================================================================
  ctx.save();
  // 1. Offset Print Shadow inside the sticker only (bottom-right risograph offset)
  buildFlatBedPath(14, 18);
  ctx.fillStyle = PALETTE.printShadow;
  ctx.fill();

  // 2. Exposed cream sticker backing sheet where the tape was originally stuck
  buildFlatBedPath(0, 0);
  ctx.fillStyle = PALETTE.stickerCream;
  ctx.fill();

  // Clip to flat bed to draw subtle exposed backing grid & peel shadow
  ctx.clip();

  // Faint scrapbook dot-grid / release-liner pattern on the exposed sticker backing
  ctx.fillStyle = '#DFD1B8';
  for (let gx = -halfL; gx <= halfL; gx += 36) {
    for (let gy = -halfH; gy <= halfH; gy += 36) {
      ctx.beginPath();
      ctx.arc(gx, gy, 2.5, 0, TAU);
      ctx.fill();
    }
  }

  // Dashed die-cut kiss-cut guide line on the exposed right backing
  ctx.strokeStyle = '#C7B69B';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 12]);
  buildFlatBedPath(-6, -6);
  ctx.stroke();
  ctx.setLineDash([]);

  // Dynamic Shadow cast by the peeling right flap onto the flat sticker backing!
  // (Strictly clipped inside the sticker backing - never touches the black background)
  ctx.beginPath();
  const hingeIdx = Math.floor(peelHingeU * NUM_SEGMENTS);
  for (let i = hingeIdx; i <= NUM_SEGMENTS; i++) {
    const u = i / NUM_SEGMENTS;
    const s = (u - peelHingeU) / (1.0 - peelHingeU);
    const p = getPeelPoint(u, -0.5);
    const sx = p.x + 28 * s;
    const sy = p.y + 52 * s * peelAmount;
    if (i === hingeIdx) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(sx, sy);
  }
  for (let j = 0; j <= NUM_TEETH; j++) {
    const v = -0.5 + (j / NUM_TEETH);
    const p = getPeelPoint(1.0, v);
    ctx.lineTo(p.x + 34, p.y + 62 * peelAmount);
  }
  for (let i = NUM_SEGMENTS; i >= hingeIdx; i--) {
    const u = i / NUM_SEGMENTS;
    const s = (u - peelHingeU) / (1.0 - peelHingeU);
    const p = getPeelPoint(u, 0.5);
    ctx.lineTo(p.x + 28 * s, p.y + 44 * s * peelAmount);
  }
  ctx.closePath();

  const hingePt = getBasePoint(peelHingeU, 0);
  const castShadowGrad = ctx.createLinearGradient(hingePt.x, hingePt.y, hingePt.x + 360, hingePt.y + 120);
  castShadowGrad.addColorStop(0.0, 'rgba(95, 72, 55, 0.42)');
  castShadowGrad.addColorStop(0.55, 'rgba(120, 95, 75, 0.25)');
  castShadowGrad.addColorStop(1.0, 'rgba(145, 118, 95, 0.05)');
  ctx.fillStyle = castShadowGrad;
  ctx.fill();

  ctx.restore();

  // =========================================================================
  // LAYER C: MAIN WASHI TAPE STRIP (DUSTY PINK BASE + RETRO POLKA DOTS + PAPER TEXTURE)
  // =========================================================================
  ctx.save();
  buildPeeledTapePath(0, 0);

  // Base Dusty Pink Washi Paper Fill with subtle lighting gradient near the peel bend
  const tapeGrad = ctx.createLinearGradient(-halfL, 0, halfL, 0);
  tapeGrad.addColorStop(0.0, '#DC8789');
  tapeGrad.addColorStop(peelHingeU - 0.06, PALETTE.dustyPink);
  // Slight highlight ridge along the peel bend
  tapeGrad.addColorStop(peelHingeU + 0.02, PALETTE.dustyPinkLight);
  // Underside / curled flap shading on the lifted right side
  tapeGrad.addColorStop(peelHingeU + 0.14, '#D1787B');
  tapeGrad.addColorStop(0.92, '#E89FA1');
  tapeGrad.addColorStop(1.0, '#F2B8BA');

  ctx.fillStyle = tapeGrad;
  ctx.fill();

  // Clip all polka dots, risograph offsets, and paper textures strictly to the Washi Tape shape
  ctx.clip();

  // 1. Subtle Washi Rice-Paper Crosshatch & Fibers Texture
  ctx.lineCap = 'round';
  for (let i = 0; i < PAPER_FIBERS.length; i++) {
    const f = PAPER_FIBERS[i];
    const pt = getPeelPoint(f.u, f.v);
    ctx.strokeStyle = f.isLight
      ? `rgba(255, 248, 235, ${f.alpha})`
      : `rgba(165, 85, 88, ${f.alpha * 0.85})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    const dx = Math.cos(f.ang) * f.len * 0.5;
    const dy = Math.sin(f.ang) * f.len * 0.5;
    ctx.moveTo(pt.x - dx, pt.y - dy);
    ctx.lineTo(pt.x + dx, pt.y + dy);
    ctx.stroke();
  }

  // 2. Polka Dots warped smoothly onto the flat and peeling surface of the tape
  for (let i = 0; i < POLKA_DOTS.length; i++) {
    const dot = POLKA_DOTS[i];

    // Map each vertex of the hand-cut polka dot through getPeelPoint(u, v)
    const mappedVerts = [];
    const scaleU = 1 / tapeLength;
    const scaleV = 1 / tapeHeight;

    for (let k = 0; k < dot.dotVerts.length; k++) {
      const dv = dot.dotVerts[k];
      const uPt = Math.min(1, Math.max(0, dot.u + dv.cos * dv.r * scaleU));
      const vPt = Math.min(0.5, Math.max(-0.5, dot.v + dv.sin * dv.r * scaleV));
      mappedVerts.push(getPeelPoint(uPt, vPt));
    }

    // Slight offset print registration shadow for each polka dot (retro screenprint feel)
    ctx.beginPath();
    for (let k = 0; k < mappedVerts.length; k++) {
      const p = mappedVerts[k];
      if (k === 0) ctx.moveTo(p.x + 5, p.y + 5);
      else ctx.lineTo(p.x + 5, p.y + 5);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(155, 72, 75, 0.38)';
    ctx.fill();

    // Main Polka Dot Fill
    ctx.beginPath();
    for (let k = 0; k < mappedVerts.length; k++) {
      const p = mappedVerts[k];
      if (k === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = dot.colObj.main;
    ctx.fill();

    // Subtle hand-inked outline on the polka dot
    ctx.strokeStyle = dot.colObj.rim;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // 3. Soft Translucent Paper Curl Shading & Crease Highlight on the Peeling End
  const pHingeTop = getPeelPoint(peelHingeU, -0.5);
  const pHingeBot = getPeelPoint(peelHingeU, 0.5);
  const pTipMid = getPeelPoint(1.0, 0.0);

  const curlShadeGrad = ctx.createLinearGradient(pHingeTop.x, pHingeTop.y, pTipMid.x, pTipMid.y);
  curlShadeGrad.addColorStop(0.0, 'rgba(255, 250, 240, 0.0)');
  curlShadeGrad.addColorStop(0.15, 'rgba(255, 250, 240, 0.26)'); // Crease highlight
  curlShadeGrad.addColorStop(0.48, 'rgba(130, 58, 62, 0.22)');   // Concave curl shadow
  curlShadeGrad.addColorStop(0.82, 'rgba(255, 248, 236, 0.28)');  // Catching light at lifted tip
  curlShadeGrad.addColorStop(1.0, 'rgba(255, 252, 245, 0.42)');

  ctx.fillStyle = curlShadeGrad;
  ctx.fillRect(-halfL - 100, -halfH - 350, tapeLength + 300, tapeHeight + 500);

  // 4. Translucent Underside Fold-Back Lip along the Top-Right Peeling Corner
  // Shows the reverse cream-tinted side of the curled washi tape edge
  ctx.beginPath();
  const foldStartU = peelHingeU + 0.06;
  for (let i = Math.floor(foldStartU * NUM_SEGMENTS); i <= NUM_SEGMENTS; i++) {
    const u = i / NUM_SEGMENTS;
    const p = getPeelPoint(u, -0.5);
    if (i === Math.floor(foldStartU * NUM_SEGMENTS)) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  for (let i = NUM_SEGMENTS; i >= Math.floor(foldStartU * NUM_SEGMENTS); i--) {
    const u = i / NUM_SEGMENTS;
    const s = (u - foldStartU) / (1.0 - foldStartU);
    const vIn = -0.5 + 0.24 * Math.pow(s, 1.35) * peelAmount;
    const p = getPeelPoint(u, vIn);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(251, 244, 232, 0.72)';
  ctx.fill();
  ctx.strokeStyle = PALETTE.dustyPinkDark;
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // Subtle decorative stitched/printed border lines along top and bottom margins of the tape
  ctx.strokeStyle = 'rgba(251, 246, 236, 0.55)';
  ctx.lineWidth = 4;
  ctx.setLineDash([18, 14]);
  [-0.42, 0.42].forEach((vLine) => {
    ctx.beginPath();
    for (let i = 0; i <= NUM_SEGMENTS; i++) {
      const u = i / NUM_SEGMENTS;
      const p = getPeelPoint(u, vLine);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  ctx.restore(); // End Washi Tape Clip

  // =========================================================================
  // LAYER D: HAND-DRAWN IMPERFECT INK OUTLINES & SCISSOR-CUT DETAILS
  // =========================================================================
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Outline around the Washi Tape Strip
  buildPeeledTapePath(0, 0);
  ctx.strokeStyle = PALETTE.inkOutline;
  ctx.lineWidth = 5.5;
  ctx.stroke();

  // Subtle crease line along the peel hinge
  ctx.beginPath();
  for (let j = 0; j <= 16; j++) {
    const v = -0.45 + (j / 16) * 0.9;
    const p = getPeelPoint(peelHingeU + 0.02 * Math.sin(j * 0.4), v);
    if (j === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(135, 65, 68, 0.35)';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // Playful hand-drawn motion lines ("flutter ticks") inside the white sticker border near the peeling right corner
  const tipTop = getPeelPoint(1.0, -0.45);
  const flutterAlpha = 0.45 + 0.45 * Math.abs(sin3);
  ctx.strokeStyle = `rgba(74, 63, 57, ${flutterAlpha})`;
  ctx.lineWidth = 4.5;
  for (let m = 0; m < 2; m++) {
    const arcOffset = 16 + m * 11;
    ctx.beginPath();
    ctx.arc(tipTop.x + 8, tipTop.y - 4, arcOffset, -Math.PI * 0.75, -Math.PI * 0.2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.restore(); // End Main Sticker transform
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
