<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism New Year 04: Retro OS Celebration Card (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --hot-pink: #FB7185;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --cyber-cyan: #38BDF8;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Kartu Melayang & Miring Dinamis (6s) */
    .hero-card-float {
      animation: cardFloat 6s ease-in-out infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(2.5deg); }
      50% { transform: translateY(-16px) rotate(0.5deg); }
    }

    /* 2. Kembang Api Geometris Mekar di Dalam Layar (Siklus 3s = 2x per loop) */
    .screen-firework-burst {
      animation: screenBurst 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes screenBurst {
      0%, 100% { transform: scale(0.35) rotate(0deg); }
      18% { transform: scale(0.25) rotate(-10deg); }
      34% { transform: scale(1.1) rotate(8deg); }
      52%, 82% { transform: scale(1) rotate(0deg); }
      92% { transform: scale(0.45) rotate(-6deg); }
    }

    /* 3. Sinar Kembang Api Luar di Layar (Siklus 3s) */
    .screen-rays {
      animation: raysExpand 3s ease-out infinite;
    }
    @keyframes raysExpand {
      0%, 24% { transform: scale(0.4); opacity: 0; }
      36% { transform: scale(1.05); opacity: 1; }
      72% { transform: scale(1.15); opacity: 1; }
      88%, 100% { transform: scale(1.25); opacity: 0; }
    }

    /* 4. Konfeti Melayang di Dalam Layar (Siklus 3s) */
    .mini-conf-left {
      animation: floatConfL 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes floatConfL {
      0%, 24% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      38% { transform: translate(-115px, -75px) scale(1.05) rotate(-120deg); opacity: 1; }
      78% { transform: translate(-130px, -35px) scale(1) rotate(-200deg); opacity: 1; }
      92%, 100% { transform: translate(-140px, -10px) scale(0) rotate(-240deg); opacity: 0; }
    }

    .mini-conf-right {
      animation: floatConfR 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes floatConfR {
      0%, 26% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      40% { transform: translate(115px, -80px) scale(1.05) rotate(130deg); opacity: 1; }
      80% { transform: translate(130px, -40px) scale(1) rotate(210deg); opacity: 1; }
      94%, 100% { transform: translate(140px, -15px) scale(0) rotate(250deg); opacity: 0; }
    }

    .mini-conf-bot-l {
      animation: floatConfBL 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes floatConfBL {
      0%, 25% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      40% { transform: translate(-120px, 65px) scale(1); opacity: 1; }
      80% { transform: translate(-135px, 95px) scale(1); opacity: 1; }
      94%, 100% { transform: translate(-145px, 115px) scale(0); opacity: 0; }
    }

    .mini-conf-bot-r {
      animation: floatConfBR 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes floatConfBR {
      0%, 27% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      42% { transform: translate(120px, 60px) scale(1) rotate(90deg); opacity: 1; }
      82% { transform: translate(135px, 90px) scale(1) rotate(160deg); opacity: 1; }
      95%, 100% { transform: translate(145px, 110px) scale(0) rotate(200deg); opacity: 0; }
    }

    /* 5. Bintang Status di Bar Kontrol Bawah Membal (1.5s = 4x per loop) */
    .footer-star-pulse {
      animation: starBeat 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes starBeat {
      0%, 100% { transform: scale(1) rotate(0deg); }
      40% { transform: scale(1.18) rotate(18deg); }
    }

    /* 6. Progress Bar Perayaan Terisi Sinkron (Siklus 3s) */
    .party-bar-fill {
      transform-origin: 0px 0px;
      animation: fillParty 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes fillParty {
      0%, 18% { transform: scaleX(0.16); fill: var(--cyber-cyan); }
      38%, 86% { transform: scaleX(1); fill: var(--acid-lime); }
      95%, 100% { transform: scaleX(0.16); fill: var(--cyber-cyan); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath Layar Viewport Putih agar Konfeti Tetap Rapi di Dalam Bingkai -->
        <clipPath id="viewportClip">
          <rect x="-211" y="-181" width="422" height="327" rx="20"/>
        </clipPath>
      </defs>

      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: RETRO OS CELEBRATION CARD (PUSAT)
      ====================================================== -->
      <g transform="translate(960, 540)">
        <g class="hero-card-float">
          <!-- Bayangan Keras Tanpa Blur (Hard Offset Shadow) -->
          <rect x="-242" y="-292" width="520" height="620" rx="28" fill="var(--ink)"/>

          <!-- Bodi Utama Kartu (Hot Pink) -->
          <rect x="-260" y="-310" width="520" height="620" rx="28" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Header Bar Putih di Bagian Atas Kartu -->
          <path d="M-255 -282 C-255 -298 -242 -305 -232 -305 H232 C242 -305 255 -298 255 -282 V-232 H-255 Z" fill="var(--white)"/>
          <line x1="-260" y1="-232" x2="260" y2="-232" stroke="var(--ink)" stroke-width="9"/>

          <!-- Aksen Pill Hitam & Tombol Sudut di Header -->
          <rect x="-215" y="-278" width="145" height="20" rx="10" fill="var(--ink)"/>
          <circle cx="176" cy="-268" r="10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="212" cy="-268" r="10" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="4"/>

          <!-- Layar Viewport Putih di Tengah Kartu -->
          <rect x="-215" y="-185" width="430" height="335" rx="24" fill="var(--white)" stroke="var(--ink)" stroke-width="8"/>

          <!-- KONTEN ANIMASI DI DALAM LAYAR VIEWPORT -->
          <g clip-path="url(#viewportClip)">
            <g transform="translate(0, -18)">
              <!-- Garis Pancaran Sinar Kembang Api -->
              <g class="screen-rays" stroke="var(--ink)" stroke-width="7" stroke-linecap="round">
                <line x1="0" y1="-112" x2="0" y2="-142"/>
                <line x1="80" y1="-80" x2="102" y2="-102"/>
                <line x1="112" y1="0" x2="142" y2="0"/>
                <line x1="80" y1="80" x2="102" y2="102"/>
                <line x1="0" y1="112" x2="0" y2="142"/>
                <line x1="-80" y1="80" x2="-102" y2="102"/>
                <line x1="-112" y1="0" x2="-142" y2="0"/>
                <line x1="-80" y1="-80" x2="-102" y2="-102"/>
              </g>

              <!-- Partikel Konfeti Satelit di Dalam Layar -->
              <!-- Kiri Atas: Segitiga Cyber Cyan -->
              <g class="mini-conf-left">
                <polygon points="0,-20 18,14 -18,14" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
              </g>

              <!-- Kanan Atas: Bintang Acid Lime -->
              <g class="mini-conf-right">
                <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
              </g>

              <!-- Kiri Bawah: Lingkaran Electric Purple -->
              <g class="mini-conf-bot-l">
                <circle cx="0" cy="0" r="15" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="5"/>
              </g>

              <!-- Kanan Bawah: Kotak Neon Yellow -->
              <g class="mini-conf-bot-r">
                <rect x="-14" y="-14" width="28" height="28" rx="6" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5"/>
              </g>

              <!-- Inti Starburst Kembang Api Utama -->
              <g class="screen-firework-burst">
                <!-- Hard Offset Shadow -->
                <g transform="translate(8, 10)">
                  <polygon points="0,-96 22,-64 64,-78 58,-36 96,-16 68,16 86,58 44,58 32,96 0,68 -32,96 -44,58 -86,58 -68,16 -96,-16 -58,-36 -64,-78 -22,-64" fill="var(--ink)"/>
                </g>

                <!-- Starburst Kuning Neon -->
                <polygon points="0,-96 22,-64 64,-78 58,-36 96,-16 68,16 86,58 44,58 32,96 0,68 -32,96 -44,58 -86,58 -68,16 -96,-16 -58,-36 -64,-78 -22,-64" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="7.5" stroke-linejoin="round"/>

                <!-- Lingkaran Inti Cyber Cyan -->
                <circle cx="0" cy="0" r="42" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6.5"/>

                <!-- Bintang Putih di Tengah -->
                <polygon points="0,-24 7,-7 24,-7 10,4 15,21 0,10 -15,21 -10,4 -24,-7 -7,-7" fill="var(--white)" stroke="var(--ink)" stroke-width="4.5" stroke-linejoin="round"/>
              </g>
            </g>
          </g>

          <!-- Bar Kontrol Bawah Kuning Neon -->
          <rect x="-215" y="182" width="430" height="84" rx="22" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Lencana Lingkaran Bintang di Kiri -->
          <g transform="translate(-165, 224)">
            <g class="footer-star-pulse">
              <circle cx="0" cy="0" r="24" fill="var(--white)" stroke="var(--ink)" stroke-width="6"/>
              <polygon points="0,-13 4,-4 13,-4 6,2 8,11 0,6 -8,11 -6,2 -13,-4 -4,-4" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Track & Progress Bar Perayaan di Kanan -->
          <rect x="-118" y="211" width="295" height="26" rx="13" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(-112, 217)">
            <rect class="party-bar-fill" x="0" y="0" width="283" height="14" rx="7" fill="var(--cyber-cyan)"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
