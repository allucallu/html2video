<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fintech Payment Gateway & QR Flow - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --blue: #1D4ED8;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --amber: #F59E0B;
      --amber-light: #FEF3C7;
      --coral: #F43F5E;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Ponsel Utama Melayang Halus (6s) */
    .phone-float {
      animation: floatY 6s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    /* 2. Sinar Laser Pemindai QR di Layar Ponsel (3s) */
    .qr-laser {
      animation: scanQR 3s ease-in-out infinite;
    }
    @keyframes scanQR {
      0%, 100% { transform: translateY(0px); opacity: 0.95; }
      50% { transform: translateY(136px); opacity: 1; }
    }

    /* 3. Cincin Progres Lingkaran di Atas Layar Ponsel (3s) */
    .progress-ring {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transform-origin: 175px 155px;
      transform: rotate(-90deg);
      animation: ringLoad 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes ringLoad {
      0%, 15% { stroke-dashoffset: 220; }
      55%, 85% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 220; }
    }

    /* 4. Status Pill Verifikasi Berubah Hijau (3s) */
    .verify-pill {
      animation: pillSuccess 3s ease-in-out infinite;
    }
    @keyframes pillSuccess {
      0%, 48%, 92%, 100% { fill: var(--slate-light); }
      56%, 82% { fill: var(--emerald); }
    }

    /* 5. Kartu Kredit Kiri & Efek Kilau Holografik (6s & 3s) */
    .card-left-float {
      animation: floatCardLeft 6s ease-in-out infinite;
    }
    @keyframes floatCardLeft {
      0%, 100% { transform: translateY(-10px) rotate(-6deg); }
      50% { transform: translateY(12px) rotate(-3deg); }
    }

    .card-shimmer {
      animation: shimmerSweep 3s ease-in-out infinite;
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-220px); }
      60%, 100% { transform: translateX(480px); }
    }

    /* 6. Lencana Kapsul Keamanan (6s) */
    .security-pill-float {
      animation: floatPill 6s ease-in-out infinite;
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* 7. Aliran Paket Data pada Jalur Koneksi (2s) */
    .data-line {
      stroke-dasharray: 12 14;
      animation: lineFlow 2s linear infinite;
    }
    @keyframes lineFlow {
      from { stroke-dashoffset: 52; }
      to { stroke-dashoffset: 0; }
    }

    /* 8. Kartu Brankas & Grafik Batang Kanan (6s & 3s) */
    .vault-right-float {
      animation: floatVaultRight 6s ease-in-out infinite;
    }
    @keyframes floatVaultRight {
      0%, 100% { transform: translateY(10px); }
      50% { transform: translateY(-12px); }
    }

    .bar-grow-1 { transform-origin: 58px 250px; animation: growBar 3s ease-in-out infinite 0s; }
    .bar-grow-2 { transform-origin: 102px 250px; animation: growBar 3s ease-in-out infinite 0.15s; }
    .bar-grow-3 { transform-origin: 146px 250px; animation: growBar 3s ease-in-out infinite 0.3s; }
    .bar-grow-4 { transform-origin: 190px 250px; animation: growBar 3s ease-in-out infinite 0.45s; }
    .bar-grow-5 { transform-origin: 234px 250px; animation: growBar 3s ease-in-out infinite 0.6s; }

    @keyframes growBar {
      0%, 100% { transform: scaleY(0.65); }
      55%, 75% { transform: scaleY(1); }
    }

    /* 9. Koin Mengorbit dengan Fase Berbeda (3s) */
    .coin-float-1 { animation: coinHop 3s ease-in-out infinite; }
    .coin-float-2 { animation: coinHop 3s ease-in-out infinite 1s; }
    .coin-float-3 { animation: coinHop 3s ease-in-out infinite 2s; }

    @keyframes coinHop {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath Presisi untuk Kartu Kredit Kiri -->
        <clipPath id="creditCardClip">
          <rect x="0" y="0" width="360" height="225" rx="24"/>
        </clipPath>

        <!-- Gradien Kilau Holografik Kartu -->
        <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <!-- Gradien Laser QR -->
        <linearGradient id="laserGlow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
          <stop offset="100%" stop-color="#10B981" stop-opacity="0.25"/>
        </linearGradient>
      </defs>

      <!-- =====================================================
           DEKORASI LATAR BELAKANG HALUS
      ====================================================== -->
      <circle cx="960" cy="540" r="430" fill="var(--blue-soft)" opacity="0.65"/>
      <circle cx="960" cy="540" r="430" fill="none" stroke="var(--blue-border)" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="960" cy="540" r="315" fill="none" stroke="#DBEAFE" stroke-width="2"/>

      <!-- Node Titik Koordinat Minimalis -->
      <g fill="var(--slate)" opacity="0.45">
        <circle cx="380" cy="240" r="5"/>
        <circle cx="410" cy="240" r="5"/>
        <circle cx="380" cy="270" r="5"/>
        <circle cx="410" cy="270" r="5"/>

        <circle cx="1460" cy="790" r="5"/>
        <circle cx="1490" cy="790" r="5"/>
        <circle cx="1460" cy="820" r="5"/>
        <circle cx="1490" cy="820" r="5"/>
      </g>

      <!-- =====================================================
           JALUR KONEKSI ANTAR NODE (KIRI -> TENGAH -> KANAN)
      ====================================================== -->
      <path d="M560 510 C645 510, 695 450, 785 450" fill="none" stroke="var(--blue-border)" stroke-width="6" stroke-linecap="round"/>
      <path class="data-line" d="M560 510 C645 510, 695 450, 785 450" fill="none" stroke="var(--blue-bright)" stroke-width="4" stroke-linecap="round"/>

      <path d="M1135 580 C1225 580, 1275 520, 1365 520" fill="none" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round"/>
      <path class="data-line" d="M1135 580 C1225 580, 1275 520, 1365 520" fill="none" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round"/>

      <!-- =====================================================
           1. KARTU KREDIT HOLOGRAFIK & LENCANA KAPSUL (KIRI)
      ====================================================== -->
      <!-- Grup Posisi Luar + Grup Animasi Dalam agar Tidak Konflik dengan (0,0) -->
      <g transform="translate(385, 315)">
        <g class="security-pill-float">
          <rect x="4" y="6" width="176" height="52" rx="26" fill="#DBEAFE"/>
          <rect x="0" y="0" width="176" height="52" rx="26" fill="#FFFFFF" stroke="var(--blue-border)" stroke-width="2.5"/>
          <circle cx="28" cy="26" r="16" fill="var(--emerald-soft)"/>
          <path d="M22 26 L26 30 L34 22" fill="none" stroke="var(--emerald)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="54" y="17" width="94" height="8" rx="4" fill="var(--navy)"/>
          <rect x="54" y="30" width="62" height="6" rx="3" fill="var(--slate)"/>
        </g>
      </g>

      <g class="card-left-float">
        <g transform="translate(245, 420)">
          <rect x="12" y="16" width="360" height="225" rx="24" fill="#DBEAFE"/>

          <g clip-path="url(#creditCardClip)">
            <rect x="0" y="0" width="360" height="225" fill="var(--blue)"/>
            <circle cx="320" cy="40" r="130" fill="#1E40AF" opacity="0.55"/>
            <circle cx="60" cy="210" r="110" fill="var(--blue-bright)" opacity="0.35"/>
            <polygon class="card-shimmer" points="0,0 95,0 35,225 -60,225" fill="url(#shimmerGrad)"/>
          </g>

          <rect x="0" y="0" width="360" height="225" rx="24" fill="none" stroke="var(--navy)" stroke-width="5"/>

          <!-- Chip EMV Detail -->
          <rect x="36" y="44" width="54" height="40" rx="8" fill="var(--amber)" stroke="#B45309" stroke-width="2"/>
          <line x1="36" y1="64" x2="90" y2="64" stroke="#B45309" stroke-width="2"/>
          <line x1="63" y1="44" x2="63" y2="84" stroke="#B45309" stroke-width="2"/>

          <!-- Simbol Contactless -->
          <g transform="translate(290, 48)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round">
            <path d="M0 14 A14 14 0 0 1 14 0"/>
            <path d="M6 20 A10 10 0 0 1 20 6"/>
            <path d="M12 26 A6 6 0 0 1 26 12"/>
          </g>

          <!-- 4 Blok Nomor Kartu -->
          <g fill="#93C5FD">
            <rect x="36" y="128" width="48" height="10" rx="5"/>
            <rect x="96" y="128" width="48" height="10" rx="5"/>
            <rect x="156" y="128" width="48" height="10" rx="5"/>
            <rect x="216" y="128" width="48" height="10" rx="5"/>
          </g>

          <!-- Nama Pemegang & Masa Berlaku -->
          <rect x="36" y="164" width="110" height="11" rx="5.5" fill="#FFFFFF" opacity="0.85"/>
          <rect x="165" y="164" width="44" height="11" rx="5.5" fill="#60A5FA"/>

          <!-- Logo Jaringan Kartu -->
          <circle cx="286" cy="166" r="20" fill="var(--coral)"/>
          <circle cx="310" cy="166" r="20" fill="var(--amber)" opacity="0.92"/>
        </g>
      </g>

      <!-- =====================================================
           2. SMARTPHONE PEMINDAI QR & GATEWAY (TENGAH)
      ====================================================== -->
      <g class="phone-float">
        <g transform="translate(785, 200)">
          <rect x="-16" y="16" width="350" height="680" rx="48" fill="var(--blue)"/>
          <rect x="0" y="0" width="350" height="680" rx="46" fill="#FFFFFF" stroke="var(--navy)" stroke-width="8"/>
          
          <!-- Dynamic Island -->
          <rect x="120" y="24" width="110" height="22" rx="11" fill="var(--navy)"/>

          <!-- Cincin Progres & Ikon Bank -->
          <circle cx="175" cy="155" r="46" fill="var(--blue-soft)"/>
          <circle cx="175" cy="155" r="35" fill="none" stroke="#DBEAFE" stroke-width="6"/>
          <circle class="progress-ring" cx="175" cy="155" r="35" fill="none" stroke="var(--emerald)" stroke-width="6" stroke-linecap="round"/>
          
          <g fill="var(--blue)" transform="translate(157, 137)">
            <polygon points="18,0 36,11 0,11"/>
            <rect x="4" y="14" width="5" height="14"/>
            <rect x="12" y="14" width="5" height="14"/>
            <rect x="20" y="14" width="5" height="14"/>
            <rect x="28" y="14" width="5" height="14"/>
            <rect x="1" y="31" width="34" height="5" rx="2"/>
          </g>

          <!-- Indikator Status Transaksi -->
          <rect class="verify-pill" x="105" y="220" width="140" height="16" rx="8" fill="var(--slate-light)"/>

          <!-- Area Pemindai QR Code -->
          <g transform="translate(75, 265)">
            <rect x="0" y="0" width="200" height="200" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>

            <g fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round">
              <path d="M22 48 V28 C22 24 24 22 28 22 H48"/>
              <path d="M152 22 H172 C176 22 178 24 178 28 V48"/>
              <path d="M22 152 V172 C22 176 24 178 28 178 H48"/>
              <path d="M152 178 H172 C176 178 178 176 178 172 V152"/>
            </g>

            <g fill="var(--navy)">
              <rect x="42" y="42" width="36" height="36" rx="6" fill="none" stroke="var(--navy)" stroke-width="6"/>
              <rect x="53" y="53" width="14" height="14" rx="2"/>
              <rect x="122" y="42" width="36" height="36" rx="6" fill="none" stroke="var(--navy)" stroke-width="6"/>
              <rect x="133" y="53" width="14" height="14" rx="2"/>
              <rect x="42" y="122" width="36" height="36" rx="6" fill="none" stroke="var(--navy)" stroke-width="6"/>
              <rect x="53" y="133" width="14" height="14" rx="2"/>

              <rect x="92" y="44" width="14" height="14" rx="3"/>
              <rect x="92" y="70" width="14" height="28" rx="3"/>
              <rect x="44" y="92" width="28" height="14" rx="3"/>
              <rect x="122" y="92" width="36" height="14" rx="3"/>
              <rect x="92" y="114" width="14" height="44" rx="3"/>
              <rect x="122" y="122" width="14" height="14" rx="3"/>
              <rect x="144" y="144" width="14" height="14" rx="3"/>
            </g>

            <circle cx="100" cy="100" r="20" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="4"/>
            <text x="100" y="107" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">$</text>

            <g class="qr-laser">
              <rect x="24" y="16" width="152" height="18" fill="url(#laserGlow)"/>
              <line x1="20" y1="34" x2="180" y2="34" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round"/>
            </g>
          </g>

          <!-- Kartu Mini Ringkasan Bawah Layar -->
          <g transform="translate(45, 500)">
            <rect x="0" y="0" width="260" height="70" rx="18" fill="var(--blue-soft)" stroke="var(--blue-border)" stroke-width="2"/>
            <circle cx="38" cy="35" r="18" fill="var(--blue)"/>
            <path d="M31 35 L36 40 L46 30" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="70" y="21" width="105" height="12" rx="6" fill="var(--navy)"/>
            <rect x="70" y="40" width="65" height="10" rx="5" fill="var(--slate)"/>
            <rect x="192" y="23" width="48" height="24" rx="12" fill="var(--emerald-soft)"/>
            <text x="216" y="39" text-anchor="middle" fill="var(--emerald-dark)" font-family="system-ui, sans-serif" font-size="13" font-weight="800">+$$$</text>
          </g>

          <rect x="125" y="646" width="100" height="7" rx="3.5" fill="var(--slate)"/>
        </g>
      </g>

      <!-- =====================================================
           3. BRANKAS DIGITAL & GRAFIK PERTUMBUHAN (KANAN)
      ====================================================== -->
      <g class="vault-right-float">
        <g transform="translate(1355, 360)">
          <rect x="12" y="14" width="310" height="310" rx="28" fill="#DCFCE7"/>
          <rect x="0" y="0" width="310" height="310" rx="28" fill="#FFFFFF" stroke="var(--navy)" stroke-width="5"/>

          <circle cx="62" cy="64" r="28" fill="var(--emerald-soft)"/>
          <text x="62" y="75" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, sans-serif" font-size="32" font-weight="800">$</text>

          <rect x="106" y="46" width="140" height="16" rx="8" fill="var(--navy)"/>
          <rect x="106" y="72" width="90" height="12" rx="6" fill="var(--slate)"/>

          <line x1="32" y1="118" x2="278" y2="118" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- Grafik Batang Pertumbuhan (5 Bar) -->
          <rect class="bar-grow-1" x="44" y="185" width="28" height="65" rx="8" fill="#DBEAFE"/>
          <rect class="bar-grow-2" x="88" y="165" width="28" height="85" rx="8" fill="#93C5FD"/>
          <rect class="bar-grow-3" x="132" y="150" width="28" height="100" rx="8" fill="var(--blue-bright)"/>
          <rect class="bar-grow-4" x="176" y="160" width="28" height="90" rx="8" fill="var(--blue)"/>
          <rect class="bar-grow-5" x="220" y="135" width="28" height="115" rx="8" fill="var(--emerald)"/>

          <line x1="34" y1="252" x2="276" y2="252" stroke="var(--navy)" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- =====================================================
           4. KOIN DOLAR MENGORBIT (POSISI TERPISAH & RAPI)
      ====================================================== -->
      <!-- Koin 1 (Atas Kanan Ponsel) -->
      <g transform="translate(1240, 300)">
        <g class="coin-float-1">
          <circle cx="5" cy="7" r="44" fill="var(--navy)"/>
          <circle cx="0" cy="0" r="44" fill="var(--emerald)"/>
          <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
          <text x="0" y="13" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, sans-serif" font-size="36" font-weight="800">$</text>
        </g>
      </g>

      <!-- Koin 2 (Bawah Kiri Ponsel) -->
      <g transform="translate(650, 730)">
        <g class="coin-float-2">
          <circle cx="5" cy="7" r="40" fill="var(--navy)"/>
          <circle cx="0" cy="0" r="40" fill="var(--amber)"/>
          <circle cx="0" cy="0" r="29" fill="#FFFFFF"/>
          <text x="0" y="11" text-anchor="middle" fill="var(--amber)" font-family="system-ui, sans-serif" font-size="32" font-weight="800">$</text>
        </g>
      </g>

      <!-- Koin 3 (Kanan Bawah Kartu Analitik) -->
      <g transform="translate(1635, 760)">
        <g class="coin-float-3">
          <circle cx="5" cy="7" r="38" fill="var(--navy)"/>
          <circle cx="0" cy="0" r="38" fill="var(--blue)"/>
          <circle cx="0" cy="0" r="27" fill="#FFFFFF"/>
          <text x="0" y="10" text-anchor="middle" fill="var(--blue)" font-family="system-ui, sans-serif" font-size="30" font-weight="800">$</text>
        </g>
      </g>

      <!-- Aksen Partikel Geometris -->
      <circle cx="320" cy="730" r="11" fill="var(--coral)"/>
      <rect x="1275" y="755" width="18" height="18" rx="5" transform="rotate(25 1275 755)" fill="var(--amber)"/>
      <circle cx="1580" cy="275" r="12" fill="none" stroke="var(--blue-bright)" stroke-width="4"/>
    </svg>
  </div>

</body>
</html>
