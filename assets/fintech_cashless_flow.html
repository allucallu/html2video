<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fintech & Cashless Flow - 6s Seamless Loop</title>
  <style>
    :root {
      /* Ubah ke #000000 (Hitam Solid) atau #00FF00 (Green Screen) jika diperlukan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --blue: #1D4ED8;
      --blue-mid: #3B82F6;
      --blue-light: #DBEAFE;
      --emerald: #16A34A;
      --emerald-light: #DCFCE7;
      --amber: #FACC15;
      --coral: #FB7185;
      --slate: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       SEAMLESS LOOP TIMELINE (MASTER: 6 DETIK)
       Semua durasi menggunakan pembagi bulat (6s, 3s, 2s)
       dan posisi 0% === 100% agar loop 100% mulus.
    ===================================================== */

    /* 1. Ponsel Melayang (Siklus 6s) */
    .phone-float {
      animation: floatPhone 6s ease-in-out infinite;
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    /* 2. Kartu Debit Melayang Berlawanan Fase (Siklus 6s) */
    .card-float {
      animation: floatCard 6s ease-in-out infinite;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(-14px); }
      50% { transform: translateY(10px); }
    }

    /* 3. Uang Kertas Masuk ke Celah Layar Ponsel (Siklus 3s = 2x per loop) */
    .bill-insert {
      animation: slideIntoSlot 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes slideIntoSlot {
      0% {
        transform: translateX(130px);
        opacity: 0;
      }
      20% {
        transform: translateX(40px);
        opacity: 1;
      }
      65% {
        transform: translateX(-235px);
        opacity: 1;
      }
      80%, 100% {
        transform: translateX(-260px);
        opacity: 0;
      }
    }

    /* 4. Gelombang Konfirmasi di Ikon Bank Saat Uang Masuk (Siklus 3s) */
    .bank-ripple {
      transform-origin: 165px 190px;
      animation: confirmPulse 3s ease-out infinite;
    }
    @keyframes confirmPulse {
      0%, 50% {
        transform: scale(0.85);
        opacity: 0;
      }
      62% {
        transform: scale(1);
        opacity: 0.85;
      }
      95%, 100% {
        transform: scale(1.65);
        opacity: 0;
      }
    }

    /* 5. Centang Verifikasi di Layar Ponsel (Siklus 3s) */
    .status-pill {
      animation: pillHighlight 3s ease-in-out infinite;
    }
    @keyframes pillHighlight {
      0%, 52%, 95%, 100% { fill: #E2E8F0; }
      62%, 82% { fill: var(--emerald); }
    }

    /* 6. Sinyal Contactless pada Kartu (Siklus 2s = 3x per loop) */
    .wave-1 { animation: waveSignal 2s ease-in-out infinite 0s; }
    .wave-2 { animation: waveSignal 2s ease-in-out infinite 0.25s; }
    .wave-3 { animation: waveSignal 2s ease-in-out infinite 0.5s; }

    @keyframes waveSignal {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    /* 7. Koin Dolar Melayang Harmonis (Siklus 3s & 6s) */
    .coin-a { animation: coinBobA 3s ease-in-out infinite; }
    .coin-b { animation: coinBobB 3s ease-in-out infinite; }
    .coin-c { animation: coinBobA 6s ease-in-out infinite; }

    @keyframes coinBobA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }
    @keyframes coinBobB {
      0%, 100% { transform: translateY(-14px); }
      50% { transform: translateY(4px); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Masking presisi tepat di garis celah slot layar ponsel -->
        <clipPath id="slotMask">
          <rect x="854" y="540" width="520" height="220"/>
        </clipPath>
      </defs>

      <!-- =====================================================
           ELEMEN LATAR DEKORATIF MINIMALIS
      ====================================================== -->
      <circle cx="960" cy="540" r="380" fill="#F8FAFC"/>
      <circle cx="960" cy="540" r="380" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="10 14"/>

      <!-- Partikel Geometris Halus -->
      <circle cx="515" cy="430" r="14" fill="none" stroke="var(--slate)" stroke-width="3"/>
      <circle cx="565" cy="365" r="8" fill="var(--emerald)"/>
      <circle cx="1410" cy="635" r="12" fill="none" stroke="var(--slate)" stroke-width="3"/>
      <circle cx="1365" cy="690" r="15" fill="var(--blue)"/>
      <rect x="545" y="750" width="16" height="16" rx="4" transform="rotate(20 545 750)" fill="var(--amber)"/>

      <!-- =====================================================
           KARTU DEBIT NIR-SENTUH (KANAN ATAS)
      ====================================================== -->
      <g class="card-float">
        <g transform="translate(1070, 215) rotate(14)">
          <!-- Bayangan Kartu -->
          <rect x="10" y="14" width="370" height="230" rx="26" fill="var(--blue-light)"/>
          <!-- Bodi Utama Kartu -->
          <rect x="0" y="0" width="370" height="230" rx="26" fill="var(--blue)"/>
          
          <!-- Chip EMV Emas -->
          <rect x="38" y="46" width="54" height="40" rx="8" fill="var(--amber)"/>
          <line x1="38" y1="66" x2="92" y2="66" stroke="#D97706" stroke-width="2"/>
          <line x1="65" y1="46" x2="65" y2="86" stroke="#D97706" stroke-width="2"/>

          <!-- Ikon Contactless Animasi -->
          <g transform="translate(295, 52)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round">
            <path class="wave-1" d="M0 14 A14 14 0 0 1 14 0"/>
            <path class="wave-2" d="M6 20 A10 10 0 0 1 20 6"/>
            <path class="wave-3" d="M12 26 A6 6 0 0 1 26 12"/>
          </g>

          <!-- Detail Nomor & Simbol Jaringan Kartu -->
          <rect x="38" y="148" width="125" height="11" rx="5.5" fill="#60A5FA"/>
          <rect x="38" y="170" width="75" height="11" rx="5.5" fill="#3B82F6"/>
          <circle cx="290" cy="162" r="22" fill="var(--coral)"/>
          <circle cx="316" cy="162" r="22" fill="var(--amber)" opacity="0.9"/>
        </g>
      </g>

      <!-- =====================================================
           SMARTPHONE FINTECH (TENGAH-KIRI)
      ====================================================== -->
      <g class="phone-float">
        <g transform="translate(660, 225)">
          <!-- Sisi Tebal 3D Biru Kobalt -->
          <rect x="-18" y="14" width="330" height="630" rx="46" fill="var(--blue)"/>
          <!-- Bingkai Utama Ponsel -->
          <rect x="0" y="0" width="330" height="630" rx="44" fill="#FFFFFF" stroke="var(--navy)" stroke-width="8"/>
          
          <!-- Dynamic Island -->
          <rect x="115" y="24" width="100" height="22" rx="11" fill="var(--navy)"/>

          <!-- Efek Gelombang Konfirmasi Transaksi -->
          <circle class="bank-ripple" cx="165" cy="190" r="56" fill="none" stroke="var(--emerald)" stroke-width="4"/>

          <!-- Ikon Institusi Bank -->
          <circle cx="165" cy="190" r="56" fill="var(--emerald-light)"/>
          <g fill="var(--emerald)" transform="translate(135, 160)">
            <polygon points="30,0 60,18 0,18"/>
            <rect x="8" y="22" width="8" height="22"/>
            <rect x="21" y="22" width="8" height="22"/>
            <rect x="34" y="22" width="8" height="22"/>
            <rect x="47" y="22" width="8" height="22"/>
            <rect x="3" y="48" width="54" height="8" rx="3"/>
          </g>

          <!-- Indikator Status & Saldo -->
          <rect class="status-pill" x="95" y="275" width="140" height="16" rx="8" fill="#E2E8F0"/>
          <rect x="120" y="303" width="90" height="12" rx="6" fill="#CBD5E1"/>

          <!-- Celah Slot Dompet Digital (Koordinat X = 854 pada kanvas global) -->
          <rect x="190" y="340" width="10" height="195" rx="5" fill="var(--navy)"/>
        </g>
      </g>

      <!-- =====================================================
           UANG KERTAS DIGITAL MELUNCUR KE SLOT PONSEL
      ====================================================== -->
      <g clip-path="url(#slotMask)">
        <g class="bill-insert">
          <!-- Lembaran Uang -->
          <rect x="854" y="590" width="270" height="136" rx="18" fill="var(--blue)"/>
          <rect x="870" y="606" width="238" height="104" rx="12" fill="#FFFFFF"/>
          
          <!-- Emblem Dolar Tengah -->
          <circle cx="989" cy="658" r="32" fill="var(--emerald-light)"/>
          <text x="989" y="671" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">$</text>
          
          <!-- Aksen Sudut Uang -->
          <circle cx="892" cy="628" r="6" fill="var(--blue)"/>
          <circle cx="1086" cy="628" r="6" fill="var(--blue)"/>
          <circle cx="892" cy="688" r="6" fill="var(--blue)"/>
          <circle cx="1086" cy="688" r="6" fill="var(--blue)"/>
        </g>
      </g>

      <!-- =====================================================
           3 KOIN DOLAR MELAYANG (HIERARKI KEDALAMAN)
      ====================================================== -->
      <!-- Koin 1 (Kiri Atas) -->
      <g class="coin-a" transform="translate(550, 275)">
        <circle cx="6" cy="8" r="50" fill="var(--navy)"/>
        <circle cx="0" cy="0" r="50" fill="var(--emerald)"/>
        <circle cx="0" cy="0" r="37" fill="#FFFFFF"/>
        <text x="0" y="14" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800">$</text>
      </g>

      <!-- Koin 2 (Tengah Kanan) -->
      <g class="coin-b" transform="translate(1195, 535)">
        <circle cx="7" cy="9" r="56" fill="var(--navy)"/>
        <circle cx="0" cy="0" r="56" fill="var(--emerald)"/>
        <circle cx="0" cy="0" r="42" fill="#FFFFFF"/>
        <text x="0" y="15" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">$</text>
      </g>

      <!-- Koin 3 (Bawah Kanan) -->
      <g class="coin-c" transform="translate(1080, 795)">
        <circle cx="5" cy="7" r="42" fill="var(--navy)"/>
        <circle cx="0" cy="0" r="42" fill="var(--emerald)"/>
        <circle cx="0" cy="0" r="31" fill="#FFFFFF"/>
        <text x="0" y="11" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">$</text>
      </g>

    </svg>
  </div>

</body>
</html>
