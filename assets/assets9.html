<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn X Cross Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_CORAL = '#FF6B6B';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(519283);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Build a rough hand-drawn marker stroke spline with organic edge tooth and width variation (14-22px)
function buildRoughMarkerStroke(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Rough hand-drawn marker grit along the stroke
    const roughX = Math.sin(u * 47 + seedPhase) * 3.6 + Math.cos(u * 23 - seedPhase) * 2.4;
    const roughY = Math.cos(u * 43 + seedPhase) * 3.6 + Math.sin(u * 29 + seedPhase) * 2.4;

    // Marker pressure variation (14-22px): heavier through the middle crossing, slightly tapered at tips
    const centerWeight = Math.exp(-Math.pow((u - 0.5) / 0.28, 2)) * 0.25;
    const pressure = Math.min(1, 0.45 + 0.42 * Math.sin(u * TAU * 3.5 + seedPhase) + centerWeight);
    let taper = 1.0;
    if (u < 0.04) taper = 0.65 + 0.35 * (u / 0.04);
    else if (u > 0.95) taper = 0.62 + 0.38 * ((1 - u) / 0.05);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + roughX,
      y: y + roughY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// ============================================================================
// PRIMARY WHITE X CROSS: TWO ROUGH MARKER STROKES (With vigorous return-scribble tails)
// Safe margins: X in [-520, +520], Y in [-510, +510] around center (1920, 1080)
// ============================================================================

// Stroke 1A: Main Top-Left to Bottom-Right Rough Slash (\)
const slash1MainWaypoints = [
  { x: -465, y: -445 },
  { x: -430, y: -415 },
  { x: -255, y: -235 },
  { x: -65,  y: -52 },
  { x: 115,  y: 122 },
  { x: 295,  y: 292 },
  { x: 465,  y: 448 },
  { x: 410,  y: 382 }  // Rough marker flick-back at bottom-right tip
];
const SLASH_1_MAIN = buildRoughMarkerStroke(slash1MainWaypoints, 160, 16, 22, 0, 0.4);

// Stroke 1B: Rough Split-Nib / Double-Sketch Strand along Slash 1 (gives genuine rough marker texture)
const slash1RoughWaypoints = [
  { x: -435, y: -468 },
  { x: -235, y: -262 },
  { x: -25,  y: -48 },
  { x: 175,  y: 148 },
  { x: 355,  y: 318 },
  { x: 488,  y: 428 }
];
const SLASH_1_ROUGH = buildRoughMarkerStroke(slash1RoughWaypoints, 130, 14, 19, 90, 1.9);

// Stroke 2A: Main Top-Right to Bottom-Left Rough Slash (/)
const slash2MainWaypoints = [
  { x: 468,  y: -448 },
  { x: 432,  y: -412 },
  { x: 258,  y: -228 },
  { x: 68,   y: -45 },
  { x: -118, y: 128 },
  { x: -298, y: 298 },
  { x: -468, y: 455 },
  { x: -408, y: 388 }  // Rough marker flick-back at bottom-left tip
];
const SLASH_2_MAIN = buildRoughMarkerStroke(slash2MainWaypoints, 160, 16, 22, 180, 3.2);

// Stroke 2B: Rough Split-Nib / Double-Sketch Strand along Slash 2
const slash2RoughWaypoints = [
  { x: 438,  y: -472 },
  { x: 232,  y: -255 },
  { x: 22,   y: -38 },
  { x: -178, y: 155 },
  { x: -358, y: 325 },
  { x: -492, y: 432 }
];
const SLASH_2_ROUGH = buildRoughMarkerStroke(slash2RoughWaypoints, 130, 14, 19, 270, 4.7);

// ============================================================================
// SECONDARY CORAL (#FF6B6B) ACCENT ROUGH X STROKES (Overlapping delayed follow-through)
// ============================================================================
const coralSlash1Waypoints = [
  { x: -415, y: -485 },
  { x: -205, y: -275 },
  { x: 15,   y: -55 },
  { x: 235,  y: 162 },
  { x: 435,  y: 365 },
  { x: 505,  y: 415 }
];
const CORAL_SLASH_1 = buildRoughMarkerStroke(coralSlash1Waypoints, 130, 15, 20, 340, 2.5);

const coralSlash2Waypoints = [
  { x: 495,  y: -405 },
  { x: 295,  y: -205 },
  { x: 75,   y: 12 },
  { x: -145, y: 225 },
  { x: -355, y: 425 },
  { x: -425, y: 485 }
];
const CORAL_SLASH_2 = buildRoughMarkerStroke(coralSlash2Waypoints, 130, 15, 20, 410, 5.4);

// ============================================================================
// AMBIENT DOODLE IMPACT TICKS, CORNER STRESS ARCS & SCRIBBLE SPARKS
// ============================================================================
const AMBIENT_MARKS = [
  // 4 Center Intersection Impact Burst Ticks (Horizontal & Vertical cardinal pops between the X arms)
  {
    pts: buildRoughMarkerStroke([
      { x: 0, y: -125 }, { x: -4, y: -185 }, { x: 2, y: -245 }
    ], 24, 15, 20, 460, 0.7),
    color: COLOR_CORAL,
    phaseOff: 0.44
  },
  {
    pts: buildRoughMarkerStroke([
      { x: 0, y: 125 }, { x: 5, y: 185 }, { x: -3, y: 245 }
    ], 24, 15, 20, 468, 1.4),
    color: COLOR_CORAL,
    phaseOff: 0.47
  },
  {
    pts: buildRoughMarkerStroke([
      { x: -130, y: 0 }, { x: -195, y: -5 }, { x: -255, y: 4 }
    ], 24, 15, 20, 476, 2.1),
    color: COLOR_WHITE,
    phaseOff: 0.46
  },
  {
    pts: buildRoughMarkerStroke([
      { x: 130, y: 0 }, { x: 195, y: 5 }, { x: 255, y: -4 }
    ], 24, 15, 20, 484, 2.8),
    color: COLOR_WHITE,
    phaseOff: 0.49
  },
  // 4 Outer Tip Emphasis Brackets / Motion Dashes around the ends of the two X strokes
  {
    pts: buildRoughMarkerStroke([
      { x: -535, y: -465 }, { x: -575, y: -515 }, { x: -615, y: -555 }
    ], 24, 15, 19, 490, 3.5),
    color: COLOR_CORAL,
    phaseOff: 0.51
  },
  {
    pts: buildRoughMarkerStroke([
      { x: 535, y: -465 }, { x: 575, y: -515 }, { x: 615, y: -555 }
    ], 24, 15, 19, 496, 4.2),
    color: COLOR_WHITE,
    phaseOff: 0.53
  },
  {
    pts: buildRoughMarkerStroke([
      { x: 535, y: 475 }, { x: 578, y: 525 }, { x: 618, y: 565 }
    ], 24, 15, 19, 502, 4.9),
    color: COLOR_CORAL,
    phaseOff: 0.52
  },
  {
    pts: buildRoughMarkerStroke([
      { x: -535, y: 475 }, { x: -578, y: 525 }, { x: -618, y: 565 }
    ], 24, 15, 19, 506, 5.6),
    color: COLOR_WHITE,
    phaseOff: 0.55
  }
];

// Progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.34]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.34, 0.64]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.64, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.34) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.34) };
  } else if (c < 0.64) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.64) / 0.32), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial rough marker stroke between [uStart, uEnd] with discrete 12fps line boil & elastic bow flex
function renderMarkerPath(pts, uStart, uEnd, color, boilStep, phase, flexDirX, flexDirY) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with neighbors
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Elastic bow & whip follow-through along the diagonal stroke (integer frequency per loop)
    const archWeight = Math.sin(p.u * Math.PI);
    const wave = Math.sin(TAU * (phase * 2 - p.u * 0.55));
    const fx = flexDirX * wave * archWeight;
    const fy = flexDirY * wave * archWeight;

    return {
      x: p.x + bx + fx,
      y: p.y + by + fy,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Primary Motion: Whole-X springy squash & stretch, impact recoil, and angular wobble (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const scaleX = 1.0 + 0.024 * sin2 - 0.012 * sin4;
  const scaleY = 1.0 - 0.024 * sin2 + 0.012 * sin4;
  const wobbleRot = 0.036 * sin1 + 0.020 * cos2;
  const shakeX = 10 * cos1 + 6 * sin4;
  const shakeY = 12 * sin2 - 6 * sin4;

  ctx.save();
  ctx.translate(CX + shakeX, CY + shakeY);
  ctx.rotate(wobbleRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 both main white X strokes (Slash 1 & Slash 2)
  // are in their FULL held state, then sequentially erase from start and slash back on one-two!
  const baseCycle = phase * 2;

  // Primary White Stroke 1 (\) leads slightly ahead of Primary White Stroke 2 (/)
  const winSlash1Main  = getDrawEraseWindow(baseCycle + 0.54);
  const winSlash1Rough = getDrawEraseWindow(baseCycle + 0.50);

  const winSlash2Main  = getDrawEraseWindow(baseCycle + 0.44);
  const winSlash2Rough = getDrawEraseWindow(baseCycle + 0.40);

  // Secondary Coral (#FF6B6B) Accent X Strokes overlap during the cycle transition
  const winCoral1 = getDrawEraseWindow(baseCycle + 0.14);
  const winCoral2 = getDrawEraseWindow(baseCycle + 0.04);

  // 1. Secondary Motion Layer: Matte Coral (#FF6B6B) Offset Rough X Strokes
  renderMarkerPath(
    CORAL_SLASH_1,
    winCoral1.uStart,
    winCoral1.uEnd,
    COLOR_CORAL,
    boilStep,
    phase,
    11,
    -11
  );
  renderMarkerPath(
    CORAL_SLASH_2,
    winCoral2.uStart,
    winCoral2.uEnd,
    COLOR_CORAL,
    boilStep,
    phase,
    11,
    11
  );

  // 2. Primary Motion Layer - Stroke 1: Top-Left to Bottom-Right Rough White Slash (\)
  renderMarkerPath(
    SLASH_1_ROUGH,
    winSlash1Rough.uStart,
    winSlash1Rough.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    9,
    -9
  );
  renderMarkerPath(
    SLASH_1_MAIN,
    winSlash1Main.uStart,
    winSlash1Main.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    8,
    -8
  );

  // 3. Primary Motion Layer - Stroke 2: Top-Right to Bottom-Left Rough White Slash (/)
  renderMarkerPath(
    SLASH_2_ROUGH,
    winSlash2Rough.uStart,
    winSlash2Rough.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    9,
    9
  );
  renderMarkerPath(
    SLASH_2_MAIN,
    winSlash2Main.uStart,
    winSlash2Main.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    8,
    8
  );

  // 4. Ambient Motion Layer: Center Intersection Impact Ticks & Outer Tip Dashes
  for (let i = 0; i < AMBIENT_MARKS.length; i++) {
    const m = AMBIENT_MARKS[i];
    const winMark = getDrawEraseWindow(baseCycle + m.phaseOff);
    renderMarkerPath(
      m.pts,
      winMark.uStart,
      winMark.uEnd,
      m.color,
      boilStep,
      phase,
      4,
      4
    );
  }

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
