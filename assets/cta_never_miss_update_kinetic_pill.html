<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Never Miss An Update — Bespoke Vector Kinetic CTA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    object-fit: contain;
  }
</style>
</head>
<body>
<canvas id="stage" width="3840" height="2160"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // --- CLI & URL PARAMETERS ---
  const P = window.__cliParams || {};
  const BG = P.bg || 'black';
  const SEED = Number(P.seed) || 1;
  const VARIANT = Number(P.variant) || 0;

  const DURATION = 10;
  const FPS = 30;
  const TAU = Math.PI * 2;

  window.DURATION = DURATION;
  window.FPS = FPS;

  // --- PALETTE PRESETS ---
  const PRESET_PALETTES = [
    // Variant 0: Solar Amber, Emerald Radar & Pure White
    ['#FFFFFF', '#F5EFE6', '#FFA800', '#10E898', '#7A4B00'],
    // Variant 1: Electric Cyan, Magenta Radar & White
    ['#FFFFFF', '#E6F4F8', '#00E5FF', '#FF2A85', '#005C70'],
    // Variant 2: Neon Emerald, Gold Radar & White
    ['#FFFFFF', '#E6F8EE', '#00E676', '#FFD000', '#006332'],
    // Variant 3: Hyper Coral, Cyan Radar & White
    ['#FFFFFF', '#FFEAE6', '#FF4D2A', '#00F0FF', '#7A1C08'],
    // Variant 4: Royal Gold, Violet Accent & White
    ['#FFFFFF', '#FFF8E6', '#FFD000', '#B366FF', '#755C00'],
    // Variant 5: Ultraviolet, Mint Radar & White
    ['#FFFFFF', '#F0E6FF', '#9D4EDD', '#00F5A0', '#461273']
  ];

  let rawPal = PRESET_PALETTES[((VARIANT % PRESET_PALETTES.length) + PRESET_PALETTES.length) % PRESET_PALETTES.length];
  if (typeof P.palette === 'string' && P.palette.trim()) {
    const custom = P.palette.split(',').map(s => s.trim()).filter(Boolean);
    if (custom.length >= 2) {
      rawPal = [
        custom[0],
        custom[1 % custom.length],
        custom[2 % custom.length],
        custom[3 % custom.length],
        custom[4 % custom.length]
      ];
    }
  }

  function hexToRgb(hex) {
    let h = hex.replace('#', '').trim();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  const RGB = rawPal.map(hexToRgb);
  function rgba(idx, a) {
    const c = RGB[idx % RGB.length];
    const alpha = Math.max(0, Math.min(1, a));
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha.toFixed(4)})`;
  }

  // --- 100% PROPRIETARY ROUNDED GEOMETRIC VECTOR FONT (Zero External/OS Fonts, 100% Commercial-Free) ---
  const VECTOR_FONT = {
    'N': { w: 0.78, p: c => { c.m(0.10, 1); c.l(0.10, 0); c.l(0.68, 1); c.l(0.68, 0); } },
    'E': { w: 0.66, p: c => {
      c.m(0.58, 0); c.l(0.10, 0); c.l(0.10, 1); c.l(0.58, 1);
      c.m(0.10, 0.49); c.l(0.48, 0.49);
    }},
    'V': { w: 0.76, p: c => { c.m(0.06, 0); c.l(0.38, 1); c.l(0.70, 0); } },
    'R': { w: 0.74, p: c => {
      c.m(0.10, 1); c.l(0.10, 0); c.l(0.41, 0);
      c.arc(0.41, 0.26, 0.24, 0.26, -Math.PI * 0.5, Math.PI * 0.5, false);
      c.l(0.10, 0.52);
      c.m(0.36, 0.52); c.l(0.66, 1);
    }},
    'M': { w: 0.94, p: c => { c.m(0.08, 1); c.l(0.08, 0); c.l(0.47, 0.66); c.l(0.86, 0); c.l(0.86, 1); } },
    'I': { w: 0.28, p: c => { c.m(0.14, 0); c.l(0.14, 1); } },
    'S': { w: 0.70, p: c => {
      c.m(0.58, 0.18);
      c.b(0.52, -0.02, 0.10, -0.02, 0.10, 0.24);
      c.b(0.10, 0.49, 0.62, 0.49, 0.62, 0.76);
      c.b(0.62, 1.02, 0.16, 1.02, 0.08, 0.82);
    }},
    'A': { w: 0.82, p: c => {
      c.m(0.06, 1); c.l(0.41, 0); c.l(0.76, 1);
      c.m(0.18, 0.65); c.l(0.64, 0.65);
    }},
    'U': { w: 0.76, p: c => {
      c.m(0.10, 0); c.l(0.10, 0.64);
      c.arc(0.38, 0.64, 0.28, 0.36, Math.PI, 0, true);
      c.l(0.66, 0);
    }},
    'P': { w: 0.72, p: c => {
      c.m(0.10, 1); c.l(0.10, 0); c.l(0.41, 0);
      c.arc(0.41, 0.27, 0.24, 0.27, -Math.PI * 0.5, Math.PI * 0.5, false);
      c.l(0.10, 0.54);
    }},
    'D': { w: 0.78, p: c => {
      c.m(0.10, 0); c.l(0.38, 0);
      c.arc(0.38, 0.50, 0.34, 0.50, -Math.PI * 0.5, Math.PI * 0.5, false);
      c.l(0.10, 1); c.l(0.10, 0);
    }},
    'T': { w: 0.70, p: c => {
      c.m(0.04, 0); c.l(0.66, 0);
      c.m(0.35, 0); c.l(0.35, 1);
    }},
    ' ': { w: 0.36, p: () => {} }
  };

  function createGlyphPathHelper(ox, oy, scaleX, scaleY) {
    const tx = x => ox + x * scaleX;
    const ty = y => oy + y * scaleY;
    return {
      m(x, y) { ctx.moveTo(tx(x), ty(y)); },
      l(x, y) { ctx.lineTo(tx(x), ty(y)); },
      b(x1, y1, x2, y2, x3, y3) {
        ctx.bezierCurveTo(tx(x1), ty(y1), tx(x2), ty(y2), tx(x3), ty(y3));
      },
      arc(cx, cy, rx, ry, a0, a1, ccw) {
        const steps = 28;
        let delta = a1 - a0;
        if (ccw && delta > 0) delta -= TAU;
        if (!ccw && delta < 0) delta += TAU;
        for (let i = 0; i <= steps; i++) {
          const a = a0 + (i / steps) * delta;
          const px = cx + Math.cos(a) * rx;
          const py = cy + Math.sin(a) * ry;
          if (i === 0) ctx.moveTo(tx(px), ty(py));
          else ctx.lineTo(tx(px), ty(py));
        }
      }
    };
  }

  function measureVectorText(str, capHeight, tracking) {
    let total = 0;
    for (let i = 0; i < str.length; i++) {
      const g = VECTOR_FONT[str[i]] || VECTOR_FONT[' '];
      total += g.w * capHeight;
      if (i < str.length - 1) total += tracking;
    }
    return total;
  }

  function drawVectorStringCentered(str, centerX, centerY, capHeight, tracking, options) {
    const totalW = measureVectorText(str, capHeight, tracking);
    let curX = centerX - totalW * 0.5;
    const wavePhase = options.wavePhase || 0;
    const waveAmp = options.waveAmp || 0;
    const strokeW = Math.max(options.strokeW, capHeight * 0.165);
    const mainColorIdx = options.colorIdx;
    const glowColorIdx = options.glowColorIdx !== undefined ? options.glowColorIdx : mainColorIdx;
    const alpha = options.alpha !== undefined ? options.alpha : 1;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = VECTOR_FONT[ch] || VECTOR_FONT[' '];
      const yWave = Math.sin(wavePhase - i * 0.45) * waveAmp;
      const topY = centerY - capHeight * 0.5 + yWave;

      if (ch !== ' ') {
        const helper = createGlyphPathHelper(curX, topY, capHeight, capHeight);

        ctx.beginPath();
        g.p(helper);
        ctx.strokeStyle = rgba(glowColorIdx, alpha * 0.22);
        ctx.lineWidth = strokeW * 1.9;
        ctx.stroke();

        ctx.beginPath();
        g.p(helper);
        ctx.strokeStyle = rgba(mainColorIdx, alpha);
        ctx.lineWidth = strokeW;
        ctx.stroke();
      }

      curX += g.w * capHeight + tracking;
    }
  }

  function drawRadialGlow(x, y, r, colorIdx, alpha) {
    if (r <= 0.5 || alpha <= 0.002) return;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, rgba(colorIdx, alpha));
    grad.addColorStop(0.35, rgba(colorIdx, alpha * 0.45));
    grad.addColorStop(0.70, rgba(colorIdx, alpha * 0.12));
    grad.addColorStop(1, rgba(colorIdx, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  // Smooth periodic slot-reel spin that is locked steady at phase = 0.0, phase = 0.5 (thumbnail!), and phase = 1.0,
  // while executing 2 crisp mechanical vertical reel flips around phase = 0.22 and phase = 0.78!
  function getSlotReelOffset(phase) {
    // Flip 1 between [0.14, 0.32], Flip 2 between [0.68, 0.86]
    if (phase >= 0.14 && phase <= 0.32) {
      const p = (phase - 0.14) / 0.18;
      return p - Math.sin(p * TAU) / TAU;
    }
    if (phase >= 0.68 && phase <= 0.86) {
      const p = (phase - 0.68) / 0.18;
      return p - Math.sin(p * TAU) / TAU;
    }
    return 0;
  }

  // --- MAIN RENDER FUNCTION ---
  function renderFrame(t) {
    const W = canvas.width;
    const H = canvas.height;
    const S = Math.min(W, H);
    const cx = W * 0.5;
    const cy = H * 0.5;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    if (BG === 'alpha') {
      ctx.clearRect(0, 0, W, H);
    } else {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
    }

    const phase = (((t % DURATION) + DURATION) % DURATION) / DURATION;
    const p1 = TAU * 1 * phase;
    const p2 = TAU * 2 * phase;
    const p3 = TAU * 3 * phase;
    const u = S * 0.001; // 2.16px at 4K

    // 1. Ambient Background Glow
    drawRadialGlow(cx, cy + S * 0.03, S * 0.46, 4, 0.20 + 0.05 * Math.sin(p2));

    ctx.save();
    ctx.translate(cx, cy);

    // 2. Top Live Radar Pulse Beacon & Telemetry Wings
    const radarY = -S * 0.155;
    ctx.save();
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    // 2 staggered expanding radar rings (each fades out with sin(prog * PI) so 0 at ends)
    for (let r = 0; r < 2; r++) {
      const prog = ((phase * 2 + r * 0.5) % 1 + 1) % 1;
      const ringR = S * (0.009 + prog * 0.042);
      const ringAlpha = Math.sin(prog * Math.PI) * 0.85;

      ctx.beginPath();
      ctx.arc(0, radarY, ringR, 0, TAU);
      ctx.strokeStyle = rgba(3, ringAlpha);
      ctx.lineWidth = u * (2.6 * (1 - prog * 0.6));
      ctx.stroke();
    }

    // Glowing emerald live beacon core
    drawRadialGlow(0, radarY, S * 0.028, 3, 0.75 + 0.25 * Math.sin(p3));
    ctx.fillStyle = rgba(0, 0.98);
    ctx.beginPath();
    ctx.arc(0, radarY, u * 4.5, 0, TAU);
    ctx.fill();

    // Horizontal telemetry wings flanking the radar beacon
    const wingInner = S * 0.045;
    const wingOuter = S * (0.18 + 0.02 * Math.sin(p2));
    for (let side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * wingInner, radarY);
      ctx.lineTo(side * wingOuter, radarY);
      ctx.strokeStyle = rgba(1, 0.35);
      ctx.lineWidth = u * 1.1;
      ctx.stroke();

      // Graduation ticks on wing
      for (let k = 0; k < 4; k++) {
        const tx = side * (wingInner + (k / 3) * (wingOuter - wingInner));
        ctx.beginPath();
        ctx.moveTo(tx, radarY - u * 4);
        ctx.lineTo(tx, radarY + u * 4);
        ctx.strokeStyle = rgba(3, 0.55);
        ctx.lineWidth = u * 1.1;
        ctx.stroke();
      }
    }
    ctx.restore();

    // 3. Line 1: BESPOKE VECTOR TYPOGRAPHY "NEVER MISS" (With Harmonic Kerning Breath)
    ctx.save();
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    const line1 = 'NEVER MISS';
    const capH1 = S * 0.062;
    const track1 = S * (0.013 + 0.0028 * Math.cos(p2));
    const line1Y = -S * 0.055;

    drawVectorStringCentered(line1, 0, line1Y, capH1, track1, {
      strokeW: u * 6.5,
      colorIdx: 0,
      glowColorIdx: 1,
      inlineIdx: 2,
      wavePhase: p2,
      waveAmp: u * 2.0,
      alpha: 0.98
    });
    ctx.restore();

    // 4. Line 2: Clipped Mechanical Slot-Reel Capsule for "AN UPDATE"
    const boxW = S * 0.62;
    const boxH = S * 0.125;
    const boxY = S * 0.088;
    const boxR = boxH * 0.5;

    // Dark chamber fill
    ctx.fillStyle = (BG === 'alpha') ? 'rgba(10, 6, 0, 0.92)' : '#080500';
    ctx.beginPath();
    ctx.roundRect(-boxW * 0.5, boxY - boxH * 0.5, boxW, boxH, boxR);
    ctx.fill();

    // Clipped interior for vertical slot-reel flip
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(-boxW * 0.5 + u * 3, boxY - boxH * 0.5 + u * 3, boxW - u * 6, boxH - u * 6, boxR - u * 3);
    ctx.clip();

    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    const spinProg = getSlotReelOffset(phase); // 0 -> 1 during flip, 0 at phase=0.5
    const reelShift = spinProg * boxH;
    const capH2 = S * 0.054;
    const track2 = S * 0.012;

    // Current copy & incoming copy above it
    drawVectorStringCentered('AN UPDATE', 0, boxY + reelShift, capH2, track2, {
      strokeW: u * 5.8,
      colorIdx: 2,
      glowColorIdx: 2,
      inlineIdx: 0,
      wavePhase: p2,
      waveAmp: u * 1.4,
      alpha: 0.98
    });

    if (spinProg > 0.001) {
      drawVectorStringCentered('AN UPDATE', 0, boxY + reelShift - boxH, capH2, track2, {
        strokeW: u * 5.8,
        colorIdx: 2,
        glowColorIdx: 2,
        inlineIdx: 0,
        wavePhase: p2,
        waveAmp: u * 1.4,
        alpha: 0.98
      });
    }
    ctx.restore();

    // Glowing Capsule Border around "AN UPDATE"
    ctx.save();
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    ctx.beginPath();
    ctx.roundRect(-boxW * 0.5, boxY - boxH * 0.5, boxW, boxH, boxR);
    ctx.strokeStyle = rgba(2, 0.26);
    ctx.lineWidth = u * 8.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.roundRect(-boxW * 0.5, boxY - boxH * 0.5, boxW, boxH, boxR);
    ctx.strokeStyle = rgba(2, 0.95);
    ctx.lineWidth = u * 2.8;
    ctx.stroke();

    // 5. Flanking Kinetic Telemetry Calipers on Left & Right of the Capsule
    for (let side of [-1, 1]) {
      const calX = side * (boxW * 0.5 + S * 0.038);
      const calY = boxY + Math.sin(p2) * (S * 0.012) * side;
      const calH = boxH * 0.34;
      const calW = S * 0.012;

      ctx.beginPath();
      ctx.moveTo(calX - side * calW, calY - calH);
      ctx.lineTo(calX, calY - calH);
      ctx.lineTo(calX, calY + calH);
      ctx.lineTo(calX - side * calW, calY + calH);
      ctx.strokeStyle = rgba(0, 0.85);
      ctx.lineWidth = u * 2.4;
      ctx.stroke();

      drawRadialGlow(calX, calY, u * 10, 3, 0.85);
      ctx.fillStyle = rgba(3, 1);
      ctx.beginPath();
      ctx.arc(calX, calY, u * 3.0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }

  window.renderFrame = renderFrame;
  window.renderAtTime = renderFrame;

  let startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    renderFrame((now - startTime) * 0.001);
    requestAnimationFrame(loop);
  }

  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
