<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthTech & Smart Diagnostics - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --cyan: #0EA5E9;
      --cyan-soft: #E0F2FE;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --emerald-border: #A7F3D0;
      --coral: #F43F5E;
      --coral-soft: #FFF1F2;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Kartu Samping Melayang Halus (6s) */
    .float-left { animation: bobA 6s ease-in-out infinite; }
    .float-right { animation: bobB 6s ease-in-out infinite; }

    @keyframes bobA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes bobB {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(0px); }
    }

    /* 2. Aliran Garis Koneksi Sinyal Medis (2s) */
    .bio-stream {
      stroke-dasharray: 10 12;
      animation: moveStream 2s linear infinite;
    }
    @keyframes moveStream {
      from { stroke-dashoffset: 44; }
      to { stroke-dashoffset: 0; }
    }

    /* 3. Pulsa Sensor Biometrik Meluncur ke Monitor (Siklus 3s) */
    .sensor-orb {
      animation: sendBioSignal 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes sendBioSignal {
      0% {
        transform: translate(0px, 0px) scale(0.4);
        opacity: 0;
      }
      20% {
        transform: translate(55px, 0px) scale(1);
        opacity: 1;
      }
      46% {
        transform: translate(155px, 40px) scale(1);
        opacity: 1;
      }
      55%, 100% {
        transform: translate(185px, 40px) scale(0.2);
        opacity: 0;
      }
    }

    /* 4. Denyut Jantung Biometrik di Tengah Monitor (Siklus 1.5s = 4x per loop) */
    .heart-beat {
      animation: pulseHeart 1.5s ease-in-out infinite;
    }
    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.18); }
      32% { transform: scale(0.98); }
      46% { transform: scale(1.12); }
      65% { transform: scale(1); }
    }

    /* 5. Garis Laser Pemindai Biometrik Naik-Turun (Siklus 3s) */
    .bio-scanner-line {
      animation: scanVertical 3s ease-in-out infinite;
    }
    @keyframes scanVertical {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(156px); }
    }

    /* 6. Gelombang ECG Bergerak Kontinu (Siklus 2s) */
    .ecg-wave-scroll {
      animation: scrollECG 2s linear infinite;
    }
    @keyframes scrollECG {
      from { transform: translateX(0px); }
      to { transform: translateX(-240px); }
    }

    /* 7. Cincin Diagnostik Terisi di Layar Utama (Siklus 3s) */
    .diag-ring-progress {
      stroke-dasharray: 565;
      stroke-dashoffset: 565;
      transform: rotate(-90deg);
      animation: fillDiagRing 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes fillDiagRing {
      0%, 12% { stroke-dashoffset: 565; stroke: var(--cyan); }
      58%, 88% { stroke-dashoffset: 0; stroke: var(--emerald); }
      98%, 100% { stroke-dashoffset: 565; stroke: var(--cyan); }
    }

    /* 8. Indikator Rekam Medis Kanan Aktif & Centang Verifikasi (Siklus 3s) */
    .vital-bar-1 { animation: fillVital 3s ease-in-out infinite 0.55s; }
    .vital-bar-2 { animation: fillVital 3s ease-in-out infinite 0.68s; }

    @keyframes fillVital {
      0%, 52%, 96%, 100% { transform: scaleX(0.35); fill: var(--blue-bright); }
      66%, 90% { transform: scaleX(1); fill: var(--emerald); }
    }

    .health-check-pop {
      animation: popVerified 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popVerified {
      0%, 60%, 95%, 100% { transform: scale(0.75); opacity: 0.4; }
      72%, 88% { transform: scale(1.14); opacity: 1; }
    }

    .status-optimal-pill {
      animation: pillHealthy 3s ease-in-out infinite;
    }
    @keyframes pillHealthy {
      0%, 62%, 95%, 100% { fill: var(--slate-light); }
      72%, 90% { fill: var(--emerald); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath Presisi untuk Layar Gelombang ECG -->
        <clipPath id="ecgScreenClip">
          <rect x="0" y="0" width="496" height="118" rx="18"/>
        </clipPath>

        <!-- Gradien Sinar Pemindai Biometrik -->
        <linearGradient id="bioScanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
          <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.25"/>
        </linearGradient>
      </defs>

      <!-- =====================================================
           DEKORASI LATAR BELAKANG EDITORIAL
      ====================================================== -->
      <circle cx="960" cy="540" r="440" fill="var(--cyan-soft)" opacity="0.45"/>
      <circle cx="960" cy="540" r="440" fill="none" stroke="var(--blue-border)" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="960" cy="540" r="320" fill="none" stroke="#BAE6FD" stroke-width="2"/>

      <!-- Jalur Koneksi Antar Modul -->
      <path d="M485 450 L555 450 L595 490 L660 490" fill="none" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="bio-stream" d="M485 450 L555 450 L595 490 L660 490" fill="none" stroke="var(--cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M1260 570 L1325 570 L1365 610 L1435 610" fill="none" stroke="var(--emerald-border)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="bio-stream" d="M1260 570 L1325 570 L1365 610 L1435 610" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- =====================================================
           1. SENSOR WEARABLE BIOMETRIK (SISI KIRI)
      ====================================================== -->
      <g transform="translate(215, 330)">
        <g class="float-left">
          <rect x="10" y="12" width="270" height="235" rx="26" fill="#E0F2FE"/>
          <rect x="0" y="0" width="270" height="235" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Ikon Sensor Gelombang & Palang Medis -->
          <rect x="28" y="28" width="76" height="76" rx="20" fill="var(--blue-soft)"/>
          <g transform="translate(66, 66)">
            <rect x="-7" y="-20" width="14" height="40" rx="4" fill="var(--blue)"/>
            <rect x="-20" y="-7" width="40" height="14" rx="4" fill="var(--blue)"/>
          </g>

          <!-- Bar Info Sensor -->
          <rect x="120" y="40" width="118" height="14" rx="7" fill="var(--navy)"/>
          <rect x="120" y="64" width="76" height="11" rx="5.5" fill="var(--slate)"/>
          <rect x="120" y="86" width="54" height="18" rx="9" fill="var(--cyan-soft)"/>

          <line x1="28" y1="128" x2="242" y2="128" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- 3 Bar Gelombang Audio/Sinyal Biometrik -->
          <g transform="translate(34, 152)">
            <rect x="0" y="0" width="202" height="52" rx="14" fill="#F8FAFC"/>
            <polyline points="22,28 54,28 68,14 82,42 96,10 110,36 124,28 180,28" fill="none" stroke="var(--cyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <!-- Pulsa Sinyal Bergerak dari Sensor ke Monitor -->
      <g transform="translate(490, 450)">
        <g class="sensor-orb">
          <circle cx="0" cy="0" r="14" fill="var(--cyan)" stroke="#FFFFFF" stroke-width="3.5"/>
        </g>
      </g>

      <!-- =====================================================
           2. MONITOR DIAGNOSTIK & PEMINDAI BIOMETRIK (PUSAT)
      ====================================================== -->
      <g transform="translate(660, 210)">
        <!-- Bayangan Monitor -->
        <rect x="16" y="18" width="600" height="660" rx="34" fill="#BAE6FD"/>
        <!-- Bodi Utama Monitor Diagnostik -->
        <rect x="0" y="0" width="600" height="660" rx="32" fill="#FFFFFF" stroke="var(--navy)" stroke-width="6"/>

        <!-- Top Bar Status -->
        <circle cx="40" cy="36" r="8" fill="var(--emerald)"/>
        <rect x="64" y="29" width="145" height="14" rx="7" fill="var(--navy)"/>
        <rect x="465" y="25" width="98" height="22" rx="11" fill="var(--cyan-soft)"/>

        <line x1="0" y1="68" x2="600" y2="68" stroke="var(--slate-light)" stroke-width="3"/>

        <!-- A. AREA PEMINDAIAN JANTUNG & CINCIN BIOMETRIK -->
        <g transform="translate(300, 225)">
          <!-- Latar Lingkaran Pemindai -->
          <circle cx="0" cy="0" r="112" fill="var(--blue-soft)"/>
          
          <!-- Track Cincin Progres (r=90 -> keliling ~565) -->
          <circle cx="0" cy="0" r="90" fill="none" stroke="#DBEAFE" stroke-width="12"/>
          <circle class="diag-ring-progress" cx="0" cy="0" r="90" fill="none" stroke="var(--cyan)" stroke-width="12" stroke-linecap="round"/>

          <!-- Siku Bingkai Pemindai Biometrik -->
          <g fill="none" stroke="var(--navy)" stroke-width="5" stroke-linecap="round">
            <path d="M-126 -96 V-118 C-126 -123 -123 -126 -118 -126 H-96"/>
            <path d="M96 -126 H118 C123 -126 126 -123 126 -118 V-96"/>
            <path d="M-126 96 V118 C-126 123 -123 126 -118 126 H-96"/>
            <path d="M96 126 H118 C123 126 126 123 126 118 V96"/>
          </g>

          <!-- Ikon Hati Geometris Berdenyut -->
          <g class="heart-beat">
            <path d="M0 36 C0 36 -44 8 -44 -18 C-44 -34 -31 -46 -16 -46 C-7 -46 0 -41 0 -34 C0 -41 7 -46 16 -46 C31 -46 44 -34 44 -18 C44 8 0 36 0 36 Z" fill="var(--coral)" stroke="var(--navy)" stroke-width="4" stroke-linejoin="round"/>
            <!-- Kilau Halus Hati -->
            <path d="M-26 -24 A10 10 0 0 1 -16 -32" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- Sinar Laser Pemindai Biometrik Naik-Turun -->
          <g transform="translate(0, -78)">
            <g class="bio-scanner-line">
              <rect x="-105" y="-14" width="210" height="14" fill="url(#bioScanGlow)"/>
              <line x1="-112" y1="0" x2="112" y2="0" stroke="var(--cyan)" stroke-width="4" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- B. LAYAR GELOMBANG ECG KONTINU (TENGAH BAWAH) -->
        <g transform="translate(52, 390)">
          <rect x="0" y="0" width="496" height="118" rx="18" fill="var(--navy)"/>

          <!-- Grid Medis Halus di Dalam Layar ECG -->
          <g stroke="#1E293B" stroke-width="1.5">
            <line x1="0" y1="39" x2="496" y2="39"/>
            <line x1="0" y1="79" x2="496" y2="79"/>
            <line x1="124" y1="0" x2="124" y2="118"/>
            <line x1="248" y1="0" x2="248" y2="118"/>
            <line x1="372" y1="0" x2="372" y2="118"/>
          </g>

          <!-- Kurva ECG Berulang (Periode 240px agar Loop Sempurna) -->
          <g clip-path="url(#ecgScreenClip)">
            <g class="ecg-wave-scroll">
              <path d="M 0 64 L 60 64 L 74 48 L 88 64 L 104 64 L 116 20 L 130 98 L 144 36 L 156 64 L 240 64 L 300 64 L 314 48 L 328 64 L 344 64 L 356 20 L 370 98 L 384 36 L 396 64 L 480 64 L 540 64 L 554 48 L 568 64 L 584 64 L 596 20 L 610 98 L 624 36 L 636 64 L 720 64 L 780 64 L 794 48 L 808 64 L 824 64 L 836 20 L 850 98 L 864 36 L 876 64 L 960 64" fill="none" stroke="var(--emerald)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>
        </g>

        <!-- C. TIGA KARTU METRIK BIOMETRIK BAWAH -->
        <g transform="translate(52, 534)">
          <rect x="0" y="0" width="152" height="84" rx="16" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>
          <circle cx="32" cy="42" r="14" fill="var(--coral-soft)"/>
          <circle cx="32" cy="42" r="6" fill="var(--coral)"/>
          <rect x="58" y="30" width="68" height="10" rx="5" fill="var(--navy)"/>
          <rect x="58" y="47" width="44" height="8" rx="4" fill="var(--slate)"/>

          <rect x="172" y="0" width="152" height="84" rx="16" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>
          <circle cx="204" cy="42" r="14" fill="var(--cyan-soft)"/>
          <circle cx="204" cy="42" r="6" fill="var(--cyan)"/>
          <rect x="230" y="30" width="68" height="10" rx="5" fill="var(--navy)"/>
          <rect x="230" y="47" width="44" height="8" rx="4" fill="var(--slate)"/>

          <rect x="344" y="0" width="152" height="84" rx="16" fill="#F8FAFC" stroke="var(--slate-light)" stroke-width="2.5"/>
          <circle cx="376" cy="42" r="14" fill="var(--emerald-soft)"/>
          <circle cx="376" cy="42" r="6" fill="var(--emerald)"/>
          <rect x="402" y="30" width="68" height="10" rx="5" fill="var(--navy)"/>
          <rect x="402" y="47" width="44" height="8" rx="4" fill="var(--slate)"/>
        </g>
      </g>

      <!-- =====================================================
           3. KARTU REKAM MEDIS & HASIL DIAGNOSTIK (SISI KANAN)
      ====================================================== -->
      <g transform="translate(1435, 495)">
        <g class="float-right">
          <rect x="10" y="12" width="270" height="235" rx="26" fill="#DCFCE7"/>
          <rect x="0" y="0" width="270" height="235" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Ikon Perisai Medis & Centang -->
          <g transform="translate(66, 66)">
            <circle cx="0" cy="0" r="36" fill="var(--emerald-soft)"/>
            <path d="M0 -24 L20 -15 V0 C20 12 11 21 0 25 C-11 21 -20 12 -20 0 V-15 Z" fill="var(--emerald)"/>
            <path d="M-8 0 L-2 6 L9 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Badge Pop-up Verifikasi -->
            <g transform="translate(24, -22)">
              <g class="health-check-pop">
                <circle cx="0" cy="0" r="15" fill="var(--blue)" stroke="#FFFFFF" stroke-width="3"/>
                <path d="M-5 0 L-1 4 L6 -4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>
          </g>

          <!-- Bar Info Hasil -->
          <rect x="120" y="40" width="118" height="14" rx="7" fill="var(--navy)"/>
          <rect x="120" y="64" width="76" height="11" rx="5.5" fill="var(--slate)"/>

          <!-- 2 Bar Indikator Vital Terisi -->
          <g transform="translate(28, 124)">
            <rect x="0" y="0" width="214" height="12" rx="6" fill="var(--slate-light)"/>
            <rect class="vital-bar-1" x="0" y="0" width="214" height="12" rx="6" fill="var(--blue-bright)" style="transform-origin: 0px 6px;"/>
          </g>

          <g transform="translate(28, 148)">
            <rect x="0" y="0" width="214" height="12" rx="6" fill="var(--slate-light)"/>
            <rect class="vital-bar-2" x="0" y="0" width="214" height="12" rx="6" fill="var(--blue-bright)" style="transform-origin: 0px 6px;"/>
          </g>

          <!-- Status Optimal Pill Bawah -->
          <rect class="status-optimal-pill" x="28" y="180" width="214" height="28" rx="14" fill="var(--slate-light)"/>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="575" cy="295" r="10" fill="var(--coral)"/>
      <circle cx="1355" cy="335" r="12" fill="var(--emerald)"/>
      <rect x="560" y="745" width="18" height="18" rx="5" transform="rotate(20 560 745)" fill="var(--cyan)"/>
    </svg>
  </div>

</body>
</html>
