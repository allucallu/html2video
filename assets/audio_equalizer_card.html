<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Single Item 01: Audio Equalizer Card (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --electric-purple: #C084FC;
      --neon-yellow: #FDE047;
      --cyber-cyan: #38BDF8;
      --hot-pink: #FB7185;
      --acid-lime: #A3E635;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Kartu Melayang & Miring Dinamis (6s) */
    .hero-card-float {
      animation: cardFloat 6s ease-in-out infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(-2.5deg); }
      50% { transform: translateY(-16px) rotate(-0.5deg); }
    }

    /* 2. Lima Batang Equalizer Bergerak Ritmis (Siklus 1.5s = 4x per loop) */
    .eq-bar-1 { animation: eqBounce1 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .eq-bar-2 { animation: eqBounce2 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .eq-bar-3 { animation: eqBounce3 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .eq-bar-4 { animation: eqBounce4 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .eq-bar-5 { animation: eqBounce5 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }

    @keyframes eqBounce1 {
      0%, 100% { transform: scaleY(0.38); }
      35% { transform: scaleY(0.92); }
      70% { transform: scaleY(0.55); }
    }
    @keyframes eqBounce2 {
      0%, 100% { transform: scaleY(0.85); }
      40% { transform: scaleY(0.32); }
      75% { transform: scaleY(1); }
    }
    @keyframes eqBounce3 {
      0%, 100% { transform: scaleY(0.52); }
      30% { transform: scaleY(1); }
      65% { transform: scaleY(0.42); }
    }
    @keyframes eqBounce4 {
      0%, 100% { transform: scaleY(0.95); }
      45% { transform: scaleY(0.45); }
      80% { transform: scaleY(0.88); }
    }
    @keyframes eqBounce5 {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(0.86); }
      85% { transform: scaleY(0.48); }
    }

    /* 3. Tombol Play Berdenyut Mengikuti Ketukan (1.5s) */
    .play-dot-pulse {
      animation: pulsePlay 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes pulsePlay {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.16); }
    }

    /* 4. Timeline Pemutar Berjalan Mulus (Siklus 3s = 2x per loop) */
    .track-progress {
      transform-origin: 0px 0px;
      animation: fillTrack 3s linear infinite;
    }
    @keyframes fillTrack {
      0% { transform: scaleX(0.12); }
      88% { transform: scaleX(1); }
      96%, 100% { transform: scaleX(0.12); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: KARTU AUDIO EQUALIZER (PUSAT)
      ====================================================== -->
      <g transform="translate(960, 540)">
        <g class="hero-card-float">
          <!-- Bayangan Keras Tanpa Blur (Hard Offset Shadow) -->
          <rect x="-242" y="-292" width="520" height="620" rx="28" fill="var(--ink)"/>

          <!-- Bodi Utama Kartu (Ungu Elektrik) -->
          <rect x="-260" y="-310" width="520" height="620" rx="28" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Header Bar Putih di Bagian Atas Kartu -->
          <path d="M-255 -282 C-255 -298 -242 -305 -232 -305 H232 C242 -305 255 -298 255 -282 V-232 H-255 Z" fill="var(--white)"/>
          <line x1="-260" y1="-232" x2="260" y2="-232" stroke="var(--ink)" stroke-width="9"/>

          <!-- Aksen Pill Hitam di Header -->
          <rect x="-215" y="-278" width="145" height="20" rx="10" fill="var(--ink)"/>
          <circle cx="212" cy="-268" r="10" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="4"/>

          <!-- Layar Viewport Putih di Tengah Kartu -->
          <rect x="-215" y="-185" width="430" height="335" rx="24" fill="var(--white)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Garis Dasar Spektrum Audio -->
          <line x1="-175" y1="104" x2="175" y2="104" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" opacity="0.2"/>

          <!-- 5 Batang Equalizer (Titik Poros Bawah y=102) -->
          <!-- Bar 1: Cyber Cyan -->
          <g transform="translate(-142, 102)">
            <rect class="eq-bar-1" x="-22" y="-215" width="44" height="215" rx="10" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>

          <!-- Bar 2: Neon Yellow -->
          <g transform="translate(-71, 102)">
            <rect class="eq-bar-2" x="-22" y="-235" width="44" height="235" rx="10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>

          <!-- Bar 3: Hot Pink -->
          <g transform="translate(0, 102)">
            <rect class="eq-bar-3" x="-22" y="-245" width="44" height="245" rx="10" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>

          <!-- Bar 4: Acid Lime -->
          <g transform="translate(71, 102)">
            <rect class="eq-bar-4" x="-22" y="-230" width="44" height="230" rx="10" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>

          <!-- Bar 5: Cyber Cyan -->
          <g transform="translate(142, 102)">
            <rect class="eq-bar-5" x="-22" y="-210" width="44" height="210" rx="10" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>

          <!-- Bar Kontrol Bawah Kuning Neon -->
          <rect x="-215" y="182" width="430" height="84" rx="22" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Tombol Play Lingkaran Putih di Kiri -->
          <g transform="translate(-165, 224)">
            <g class="play-dot-pulse">
              <circle cx="0" cy="0" r="24" fill="var(--white)" stroke="var(--ink)" stroke-width="6"/>
              <polygon points="-5,-9 10,0 -5,9" fill="var(--ink)"/>
            </g>
          </g>

          <!-- Track & Progress Bar Audio di Kanan -->
          <rect x="-118" y="213" width="295" height="22" rx="11" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(-112, 219)">
            <rect class="track-progress" x="0" y="0" width="283" height="10" rx="5" fill="var(--ink)"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
