<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Aspirations 03: Bullseye Goal Hit (Fixed Arrow Tip) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --cyber-cyan: #38BDF8;
      --hot-pink: #FB7185;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Papan Target Mengambang & Membal Saat Tertancap Panah (Siklus 3s = 2x per loop) */
    .target-recoil-wrap {
      animation: targetImpact 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes targetImpact {
      0%, 16%, 94%, 100% {
        transform: translate(0px, 0px) scale(1, 1) rotate(0deg);
      }
      22% {
        transform: translate(-18px, 18px) scale(0.92, 1.06) rotate(-4deg);
      }
      30% {
        transform: translate(8px, -8px) scale(1.04, 0.96) rotate(2deg);
      }
      38% {
        transform: translate(-3px, 3px) scale(0.99, 1.01) rotate(-1deg);
      }
      46%, 86% {
        transform: translate(0px, -6px) scale(1, 1) rotate(0deg);
      }
    }

    /* 2. Anak Panah Melesat Masuk & Menancap ke Dalam Papan (Siklus 3s) */
    .arrow-flight {
      animation: shootArrow 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootArrow {
      0%, 10% {
        transform: translate(320px, -320px) scale(0.85);
        opacity: 0;
      }
      13% {
        opacity: 1;
      }
      21% {
        /* Mata panah menembus masuk melewati titik pusat (0,0) */
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      25% {
        transform: translate(-5px, 5px) scale(1.02, 0.98);
      }
      32%, 86% {
        transform: translate(0px, -6px) scale(1);
        opacity: 1;
      }
      95%, 100% {
        transform: translate(0px, -6px) scale(0);
        opacity: 0;
      }
    }

    /* 3. Lubang Tusukan di Pusat Bullseye Muncul Saat Panah Menancap (Siklus 3s) */
    .puncture-slot {
      animation: showPuncture 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes showPuncture {
      0%, 19%, 94%, 100% {
        transform: translate(0px, 0px) scale(0);
        opacity: 0;
      }
      22% {
        transform: translate(-18px, 18px) scale(1.2);
        opacity: 1;
      }
      30% {
        transform: translate(8px, -8px) scale(0.95);
        opacity: 1;
      }
      46%, 86% {
        transform: translate(0px, -6px) scale(1);
        opacity: 1;
      }
    }

    /* 4. Getaran Ekor Bulu Panah Setelah Tumbukan (Siklus 3s) */
    .arrow-tail-wobble {
      animation: wobbleTail 3s ease-in-out infinite;
    }
    @keyframes wobbleTail {
      0%, 20%, 42%, 100% { transform: rotate(0deg); }
      24% { transform: rotate(-8deg); }
      28% { transform: rotate(6deg); }
      33% { transform: rotate(-3.5deg); }
      38% { transform: rotate(1.5deg); }
    }

    /* 5. Percikan Garis Komik di Titik Bullseye (Siklus 3s) */
    .bullseye-sparks {
      animation: popBullseyeSpark 3s ease-out infinite;
    }
    @keyframes popBullseyeSpark {
      0%, 19% { transform: scale(0.2); opacity: 0; }
      25% { transform: scale(1.05); opacity: 1; }
      48%, 100% { transform: scale(1.42); opacity: 0; }
    }

    /* 6. Bintang Kilau Sudut Berkedip Kontra-Ritme (Siklus 3s) */
    .sparkle-bl {
      animation: twinkleA 3s ease-in-out infinite;
    }
    .sparkle-tr {
      animation: twinkleB 3s ease-in-out infinite;
    }
    @keyframes twinkleA {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.45) rotate(45deg); }
    }
    @keyframes twinkleB {
      0%, 100% { transform: scale(0.45) rotate(-45deg); }
      50% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath Bidang Permukaan Papan: Menyembunyikan Ujung Mata Panah Saat Terbenam Masuk -->
        <clipPath id="boardEntryClip">
          <polygon points="-500,-500 650,-500 650,650"/>
        </clipPath>
      </defs>

      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: BULLSEYE GOAL HIT (PUSAT)
      ====================================================== -->
      <!-- Bintang Kilau Sudut Kiri Bawah -->
      <g transform="translate(625, 765)">
        <g class="sparkle-bl">
          <path d="M0 -42 C4 -11 11 -4 42 0 C11 4 4 11 0 42 C-4 11 -11 4 -42 0 C-11 -4 -4 -11 0 -42 Z" fill="var(--white)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Bintang Kilau Sudut Kanan Atas -->
      <g transform="translate(1285, 290)">
        <g class="sparkle-tr">
          <path d="M0 -44 C4 -12 12 -4 44 0 C12 4 4 12 0 44 C-4 12 -12 4 -44 0 C-12 -4 -4 -12 0 -44 Z" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- PUSAT PAPAN SASARAN & ANAK PANAH -->
      <g transform="translate(940, 555)">

        <!-- 1. PAPAN TARGET KONSENTRIS -->
        <g class="target-recoil-wrap">
          <!-- Kaki Penyangga Papan Target -->
          <g>
            <g transform="translate(-145, 205) rotate(24)">
              <rect x="-14" y="-10" width="38" height="92" rx="16" fill="var(--ink)"/>
              <rect x="-22" y="-18" width="38" height="92" rx="16" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="9"/>
            </g>
            <g transform="translate(145, 205) rotate(-24)">
              <rect x="-8" y="-10" width="38" height="92" rx="16" fill="var(--ink)"/>
              <rect x="-16" y="-18" width="38" height="92" rx="16" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="9"/>
            </g>
          </g>

          <!-- Hard Offset Shadow Papan Target -->
          <circle cx="20" cy="22" r="245" fill="var(--ink)"/>

          <!-- Cincin 1 (Cyber Cyan) -->
          <circle cx="0" cy="0" r="245" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="11"/>

          <!-- Cincin 2 (Putih Bersih) -->
          <circle cx="0" cy="0" r="184" fill="var(--white)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Cincin 3 (Hot Pink) -->
          <circle cx="0" cy="0" r="122" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Titik Pusat Bullseye (Kuning Neon) -->
          <circle cx="0" cy="0" r="58" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Aksen Kilau Lengkung -->
          <path d="M-175 -115 A210 210 0 0 1 -110 -178" fill="none" stroke="var(--white)" stroke-width="10" stroke-linecap="round"/>
        </g>

        <!-- 2. LUBANG TUSUKAN BERSIH DI TITIK MASUK BATANG PANAH -->
        <g class="puncture-slot">
          <g transform="rotate(-45)">
            <ellipse cx="0" cy="0" rx="6" ry="16" fill="var(--ink)"/>
          </g>
        </g>

        <!-- 3. PERCIKAN GARIS KOMIK SAAT PANAH MENANCAP -->
        <g class="bullseye-sparks" stroke="var(--ink)" stroke-width="8" stroke-linecap="round">
          <line x1="-65" y1="-45" x2="-105" y2="-75"/>
          <line x1="-82" y1="15" x2="-130" y2="25"/>
          <line x1="25" y1="68" x2="40" y2="115"/>
          <line x1="-30" y1="72" x2="-52" y2="118"/>
        </g>

        <!-- 4. ANAK PANAH GEOMETRIS (MATA PANAH TERBENAM SAAT MENANCAP) -->
        <g clip-path="url(#boardEntryClip)">
          <g class="arrow-flight">
            <g class="arrow-tail-wobble">
              <g transform="rotate(-45)">
                <!-- Hard Shadow Batang & Bulu Panah -->
                <g transform="translate(8, 12)">
                  <rect x="-4" y="-9" width="312" height="18" rx="9" fill="var(--ink)"/>
                  <polygon points="225,-9 275,-46 325,-46 290,-9" fill="var(--ink)"/>
                  <polygon points="225,9 275,46 325,46 290,9" fill="var(--ink)"/>
                </g>

                <!-- Bulu Ekor Panah Atas & Bawah (Acid Lime) -->
                <polygon points="225,-9 275,-46 325,-46 290,-9" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/>
                <polygon points="225,9 275,46 325,46 290,9" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/>

                <!-- Batang Utama Anak Panah (Putih berbingkai Hitam) -->
                <rect x="-4" y="-9" width="312" height="18" rx="9" fill="var(--white)" stroke="var(--ink)" stroke-width="8"/>

                <!-- Mata Panah Segitiga (Terlihat Utuh di Udara, Terbenam Rapi Saat Menancap) -->
                <polygon points="-42,0 4,-22 -4,0 4,22" fill="var(--ink)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
              </g>
            </g>
          </g>
        </g>

      </g>

    </svg>
  </div>

</body>
</html>
