<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity & Data Firewall - 6s Seamless Loop</title>
  <style>
    :root {
      /* Hitam Solid (#000000) - Ubah ke #FFFFFF atau #00FF00 sesuai kebutuhan */
      --bg-solid: #000000;
      --surface-dark: #0B1120;
      --surface-card: #111827;
      --border-slate: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --cyan: #38BDF8;
      --emerald: #10B981;
      --emerald-dark: #064E3B;
      --amber: #F59E0B;
      --coral: #F43F5E;
      --coral-dark: #4C0519;
      --slate: #64748B;
      --white: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua durasi sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Cincin Radar Pusat Berputar Berlawanan Arah (6s) */
    .radar-cw {
      transform-origin: 960px 540px;
      animation: spinCW 6s linear infinite;
    }
    .radar-ccw {
      transform-origin: 960px 540px;
      animation: spinCCW 6s linear infinite;
    }
    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    /* 2. Perisai Utama Bernapas Stabil (6s) */
    .shield-float {
      animation: floatShield 6s ease-in-out infinite;
    }
    @keyframes floatShield {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    /* 3. Aliran Garis Sirkuit (2s) */
    .circuit-flow {
      stroke-dasharray: 12 14;
      animation: dashStream 2s linear infinite;
    }
    @keyframes dashStream {
      from { stroke-dashoffset: 52; }
      to { stroke-dashoffset: 0; }
    }

    /* 4. Paket Ancaman Merah Tertahan di Perisai (3s) */
    .threat-packet {
      animation: blockThreat 3s cubic-bezier(0.55, 0, 0.45, 1) infinite;
    }
    @keyframes blockThreat {
      0% {
        transform: translate(0px, 0px) scale(0.6);
        opacity: 0;
      }
      15% {
        opacity: 1;
        transform: translate(60px, 25px) scale(1);
      }
      45% {
        opacity: 1;
        transform: translate(235px, 85px) scale(1);
      }
      55% {
        opacity: 0.9;
        transform: translate(210px, 75px) scale(1.25);
      }
      70%, 100% {
        opacity: 0;
        transform: translate(195px, 70px) scale(0.2);
      }
    }

    /* 5. Gelombang Benturan Firewall Saat Menahan Ancaman (3s) */
    .firewall-impact {
      transform-origin: 765px 495px;
      animation: impactWave 3s ease-out infinite;
    }
    @keyframes impactWave {
      0%, 42% {
        transform: scale(0.4);
        opacity: 0;
      }
      50% {
        transform: scale(1);
        opacity: 0.95;
      }
      85%, 100% {
        transform: scale(1.85);
        opacity: 0;
      }
    }

    /* 6. Paket Data Mentah Masuk ke Inti Enkripsi (3s) */
    .raw-packet {
      animation: enterCore 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes enterCore {
      0%, 10% {
        transform: translate(0px, 0px) scale(0.6);
        opacity: 0;
      }
      25% {
        opacity: 1;
        transform: translate(75px, -25px) scale(1);
      }
      52% {
        opacity: 1;
        transform: translate(295px, -85px) scale(0.85);
      }
      60%, 100% {
        opacity: 0;
        transform: translate(330px, -95px) scale(0.2);
      }
    }

    /* 7. Kilau Gembok Inti Saat Enkripsi Selesai (3s) */
    .core-lock-pulse {
      transform-origin: 960px 540px;
      animation: lockFlash 3s ease-in-out infinite;
    }
    @keyframes lockFlash {
      0%, 48%, 92%, 100% { transform: scale(1); }
      58%, 75% { transform: scale(1.12); }
    }

    /* 8. Paket Terenkripsi Hijau Keluar Menuju Vault Kanan (3s) */
    .encrypted-packet {
      animation: exitCore 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes exitCore {
      0%, 52% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      62% {
        opacity: 1;
        transform: translate(85px, 0px) scale(1);
      }
      90% {
        opacity: 1;
        transform: translate(310px, 0px) scale(1);
      }
      98%, 100% {
        opacity: 0;
        transform: translate(345px, 0px) scale(0.5);
      }
    }

    /* 9. Node Kiri & Vault Kanan Melayang Halus (6s) */
    .side-float-a { animation: bobSideA 6s ease-in-out infinite; }
    .side-float-b { animation: bobSideB 6s ease-in-out infinite; }

    @keyframes bobSideA {
      0%, 100% { transform: translateY(-10px); }
      50% { transform: translateY(12px); }
    }
    @keyframes bobSideB {
      0%, 100% { transform: translateY(12px); }
      50% { transform: translateY(-10px); }
    }

    /* 10. Indikator LED Server Berkedip Bergantian (2s) */
    .led-1 { animation: blinkLed 2s ease-in-out infinite 0s; }
    .led-2 { animation: blinkLed 2s ease-in-out infinite 0.5s; }
    .led-3 { animation: blinkLed 2s ease-in-out infinite 1s; }
    @keyframes blinkLed {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Glow Ambient Tengah -->
        <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
          <stop offset="55%" stop-color="#10B981" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Gradien Badan Perisai -->
        <linearGradient id="shieldBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E3A8A"/>
          <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
      </defs>

      <!-- Latar Cahaya Tengah -->
      <circle cx="960" cy="540" r="520" fill="url(#cyberGlow)"/>

      <!-- =====================================================
           CINCIN RADAR PEMINDAI PUSAT (BERPUTAR)
      ====================================================== -->
      <g class="radar-cw">
        <circle cx="960" cy="540" r="320" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="24 18"/>
        <circle cx="960" cy="220" r="8" fill="var(--cyan)"/>
        <circle cx="960" cy="860" r="8" fill="var(--blue-bright)"/>
      </g>

      <g class="radar-ccw">
        <circle cx="960" cy="540" r="265" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="10 16" opacity="0.65"/>
        <circle cx="695" cy="540" r="7" fill="var(--coral)"/>
        <circle cx="1225" cy="540" r="7" fill="var(--emerald)"/>
      </g>

      <!-- =====================================================
           JALUR SIRKUIT KONEKSI (KIRI -> TENGAH -> KANAN)
      ====================================================== -->
      <!-- Jalur Atas Kiri (Ancaman) -->
      <path d="M510 390 L630 390 L755 495" fill="none" stroke="#33101C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="circuit-flow" d="M510 390 L630 390 L755 495" fill="none" stroke="var(--coral)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Jalur Bawah Kiri (Data Mentah) -->
      <path d="M510 690 L630 690 L820 575" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="circuit-flow" d="M510 690 L630 690 L820 575" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Jalur Kanan (Data Terenkripsi ke Vault) -->
      <path d="M1115 540 L1410 540" fill="none" stroke="#064E3B" stroke-width="6" stroke-linecap="round"/>
      <path class="circuit-flow" d="M1115 540 L1410 540" fill="none" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round"/>

      <!-- =====================================================
           1. NODE SUMBER DATA KIRI (ATAS & BAWAH)
      ====================================================== -->
      <!-- Node Kiri Atas (Traffic Tidak Dikenal) -->
      <g transform="translate(260, 315)">
        <g class="side-float-a">
          <rect x="0" y="0" width="250" height="150" rx="22" fill="var(--surface-card)" stroke="#334155" stroke-width="3"/>
          <circle cx="56" cy="52" r="24" fill="var(--coral-dark)" stroke="var(--coral)" stroke-width="2.5"/>
          <!-- Simbol Peringatan Geometris -->
          <rect x="53" y="39" width="6" height="16" rx="3" fill="var(--coral)"/>
          <circle cx="56" cy="63" r="3.5" fill="var(--coral)"/>

          <rect x="96" y="40" width="115" height="11" rx="5.5" fill="#94A3B8"/>
          <rect x="96" y="60" width="75" height="9" rx="4.5" fill="#475569"/>

          <!-- Bar Paket Kiri -->
          <rect x="32" y="102" width="186" height="18" rx="9" fill="#1E293B"/>
          <rect x="36" y="106" width="84" height="10" rx="5" fill="var(--coral)"/>
        </g>
      </g>

      <!-- Node Kiri Bawah (Paket Data Mentah) -->
      <g transform="translate(260, 615)">
        <g class="side-float-b">
          <rect x="0" y="0" width="250" height="150" rx="22" fill="var(--surface-card)" stroke="#334155" stroke-width="3"/>
          <circle cx="56" cy="52" r="24" fill="#451A03" stroke="var(--amber)" stroke-width="2.5"/>
          <!-- Ikon Blok Data -->
          <rect x="45" y="41" width="10" height="10" rx="2" fill="var(--amber)"/>
          <rect x="58" y="41" width="10" height="10" rx="2" fill="var(--amber)"/>
          <rect x="45" y="54" width="10" height="10" rx="2" fill="var(--amber)"/>
          <rect x="58" y="54" width="10" height="10" rx="2" fill="var(--amber)" opacity="0.5"/>

          <rect x="96" y="40" width="115" height="11" rx="5.5" fill="#94A3B8"/>
          <rect x="96" y="60" width="75" height="9" rx="4.5" fill="#475569"/>

          <rect x="32" y="102" width="186" height="18" rx="9" fill="#1E293B"/>
          <rect x="36" y="106" width="120" height="10" rx="5" fill="var(--amber)"/>
        </g>
      </g>

      <!-- =====================================================
           2. PAKET BERGERAK & EFEK BENTURAN FIREWALL
      ====================================================== -->
      <!-- Gelombang Benturan Saat Ancaman Diblokir -->
      <circle class="firewall-impact" cx="765" cy="495" r="46" fill="none" stroke="var(--coral)" stroke-width="4"/>

      <!-- Paket Ancaman Merah (Dari Node Atas ke Perisai) -->
      <g transform="translate(520, 405)">
        <g class="threat-packet">
          <polygon points="0,-24 22,16 -22,16" fill="var(--coral)" stroke="#FFE4E6" stroke-width="3" stroke-linejoin="round"/>
          <rect x="-2.5" y="-10" width="5" height="12" rx="2.5" fill="#FFFFFF"/>
          <circle cx="0" cy="8" r="3" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Paket Mentah Kuning (Dari Node Bawah Masuk ke Perisai) -->
      <g transform="translate(520, 675)">
        <g class="raw-packet">
          <rect x="-20" y="-20" width="40" height="40" rx="10" fill="var(--amber)" stroke="#FEF3C7" stroke-width="3"/>
          <circle cx="0" cy="0" r="7" fill="#0F172A"/>
        </g>
      </g>

      <!-- Paket Terenkripsi Hijau (Keluar dari Perisai ke Vault Kanan) -->
      <g transform="translate(1070, 540)">
        <g class="encrypted-packet">
          <rect x="-24" y="-24" width="48" height="48" rx="14" fill="var(--emerald)" stroke="#D1FAE5" stroke-width="3.5"/>
          <path d="M-9 1 L-2 8 L11 -6" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- =====================================================
           3. FIREWALL SHIELD & ENCRYPTION CORE (TENGAH)
      ====================================================== -->
      <g class="shield-float">
        <g transform="translate(960, 540)">
          <!-- Lapisan Perisai Luar -->
          <path d="M0 -185 L155 -125 V10 C155 115 88 185 0 215 C-88 185 -155 115 -155 10 V-125 Z" fill="url(#shieldBodyGrad)" stroke="var(--blue-bright)" stroke-width="7" stroke-linejoin="round"/>

          <!-- Garis Kontur Dalam Perisai -->
          <path d="M0 -158 L130 -106 V8 C130 98 73 158 0 184 C-73 158 -130 98 -130 8 V-106 Z" fill="none" stroke="var(--cyan)" stroke-width="2.5" opacity="0.55" stroke-linejoin="round"/>

          <!-- Inti Gembok Keamanan (Tengah Perisai) -->
          <g class="core-lock-pulse" transform="translate(-960, -540)">
            <circle cx="960" cy="540" r="72" fill="#0F172A" stroke="var(--emerald)" stroke-width="4"/>
            <!-- Lengkungan Gembok -->
            <path d="M936 530 V512 C936 498 946 488 960 488 C974 488 984 498 984 512 V530" fill="none" stroke="var(--cyan)" stroke-width="9" stroke-linecap="round"/>
            <!-- Badan Gembok -->
            <rect x="924" y="528" width="72" height="56" rx="14" fill="var(--emerald)"/>
            <!-- Lubang Kunci -->
            <circle cx="960" cy="551" r="7" fill="#0F172A"/>
            <rect x="957" y="554" width="6" height="14" rx="3" fill="#0F172A"/>
          </g>
        </g>
      </g>

      <!-- =====================================================
           4. SECURE CLOUD VAULT / SERVER (KANAN)
      ====================================================== -->
      <g transform="translate(1410, 345)">
        <g class="side-float-a">
          <rect x="0" y="0" width="280" height="390" rx="28" fill="var(--surface-card)" stroke="var(--emerald)" stroke-width="4"/>

          <!-- Header Vault -->
          <circle cx="62" cy="64" r="28" fill="var(--emerald-dark)"/>
          <path d="M50 64 L58 72 L75 55" fill="none" stroke="var(--emerald)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="106" y="48" width="130" height="14" rx="7" fill="#FFFFFF"/>
          <rect x="106" y="70" width="85" height="10" rx="5" fill="var(--slate)"/>

          <line x1="28" y1="114" x2="252" y2="114" stroke="#1E293B" stroke-width="3"/>

          <!-- 3 Rak Server Terenkripsi -->
          <!-- Rak 1 -->
          <g transform="translate(28, 138)">
            <rect x="0" y="0" width="224" height="62" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
            <circle class="led-1" cx="28" cy="31" r="8" fill="var(--emerald)"/>
            <rect x="52" y="21" width="95" height="10" rx="5" fill="#94A3B8"/>
            <rect x="52" y="37" width="60" height="7" rx="3.5" fill="#475569"/>
            <rect x="172" y="21" width="34" height="20" rx="10" fill="var(--emerald-dark)"/>
          </g>

          <!-- Rak 2 -->
          <g transform="translate(28, 216)">
            <rect x="0" y="0" width="224" height="62" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
            <circle class="led-2" cx="28" cy="31" r="8" fill="var(--emerald)"/>
            <rect x="52" y="21" width="105" height="10" rx="5" fill="#94A3B8"/>
            <rect x="52" y="37" width="50" height="7" rx="3.5" fill="#475569"/>
            <rect x="172" y="21" width="34" height="20" rx="10" fill="var(--emerald-dark)"/>
          </g>

          <!-- Rak 3 -->
          <g transform="translate(28, 294)">
            <rect x="0" y="0" width="224" height="62" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
            <circle class="led-3" cx="28" cy="31" r="8" fill="var(--cyan)"/>
            <rect x="52" y="21" width="85" height="10" rx="5" fill="#94A3B8"/>
            <rect x="52" y="37" width="70" height="7" rx="3.5" fill="#475569"/>
            <rect x="172" y="21" width="34" height="20" rx="10" fill="#1E3A8A"/>
          </g>
        </g>
      </g>

      <!-- Partikel Geometris Minimalis -->
      <circle cx="660" cy="285" r="9" fill="var(--blue-bright)"/>
      <circle cx="1275" cy="335" r="11" fill="var(--emerald)"/>
      <rect x="1260" y="730" width="16" height="16" rx="4" transform="rotate(25 1260 730)" fill="var(--cyan)"/>
    </svg>
  </div>

</body>
</html>
