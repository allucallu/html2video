<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism 01: Retro OS Pop-Up & Cursor Loop - 6s Seamless</title>
  <style>
    :root {
      /* Ubah ke #FFFFFF atau #00FF00 jika butuh latar solid/chroma */
      --bg-base: #F6F2E9;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --electric-purple: #C084FC;
      --acid-lime: #A3E635;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Jendela Utama Bernapas Halus & Tegas (6s) */
    .main-win-bob {
      animation: winShift 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes winShift {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-4px, -6px); }
    }

    /* 2. Kubus 3D di Dalam Modul Ungu Melayang & Berdenyut (6s) */
    .cube-float {
      animation: cubeHover 6s ease-in-out infinite;
    }
    @keyframes cubeHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* 3. Progress Bar Retro OS Terisi Bertahap (Siklus 3s) */
    .retro-progress-fill {
      transform-origin: 0px 0px;
      animation: stepLoad 3s steps(8, end) infinite;
    }
    @keyframes stepLoad {
      0%, 8% { transform: scaleX(0.12); fill: var(--electric-purple); }
      42%, 86% { transform: scaleX(1); fill: var(--acid-lime); }
      95%, 100% { transform: scaleX(0.12); fill: var(--electric-purple); }
    }

    /* 4. Pop-Up Window Kiri Atas Muncul (Siklus 3s) */
    .popup-left {
      animation: popLeftWin 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popLeftWin {
      0%, 38%, 94%, 100% {
        transform: scale(0) rotate(-5deg);
        opacity: 0;
      }
      48%, 86% {
        transform: scale(1) rotate(-2deg);
        opacity: 1;
      }
    }

    /* 5. Pop-Up Window Kanan Bawah Muncul (Siklus 3s) */
    .popup-right {
      animation: popRightWin 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popRightWin {
      0%, 45%, 94%, 100% {
        transform: scale(0) rotate(5deg);
        opacity: 0;
      }
      55%, 86% {
        transform: scale(1) rotate(2deg);
        opacity: 1;
      }
    }

    /* 6. Kursor Piksel Bergerak & Mengklik Tombol Aksi (Siklus 3s) */
    .pixel-cursor {
      animation: cursorMoveClick 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes cursorMoveClick {
      0% {
        transform: translate(240px, 165px) scale(1);
        opacity: 0;
      }
      12% {
        transform: translate(195px, 125px) scale(1);
        opacity: 1;
      }
      28% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      35% {
        transform: translate(4px, 6px) scale(0.88);
        opacity: 1;
      }
      43% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      78% {
        transform: translate(-155px, -95px) scale(1);
        opacity: 1;
      }
      92%, 100% {
        transform: translate(-195px, -125px) scale(0.85);
        opacity: 0;
      }
    }

    /* 7. Efek Gelombang Klik & Tombol Tertekan (Siklus 3s) */
    .click-burst {
      animation: burstPing 3s ease-out infinite;
    }
    @keyframes burstPing {
      0%, 33% { transform: scale(0.2); opacity: 0; }
      37% { transform: scale(0.75); opacity: 1; }
      52%, 100% { transform: scale(1.45); opacity: 0; }
    }

    .brutal-btn-press {
      animation: pressBtn 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes pressBtn {
      0%, 30%, 43%, 100% {
        transform: translate(0px, 0px);
      }
      35% {
        transform: translate(8px, 8px);
      }
    }

    .brutal-btn-bg {
      animation: btnColorSwitch 3s ease-in-out infinite;
    }
    @keyframes btnColorSwitch {
      0%, 33%, 92%, 100% { fill: var(--cyber-cyan); }
      38%, 86% { fill: var(--acid-lime); }
    }

    /* 8. Stiker Bintang Geometris Berputar Presisi (6s) */
    .sticker-spin {
      animation: spinStep 6s steps(12, end) infinite;
    }
    @keyframes spinStep {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Pola Grid Latar Belakang Retro OS -->
        <pattern id="brutalGrid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.12"/>
        </pattern>
        <!-- Grid Mikro untuk Layar Kubus -->
        <pattern id="miniScreenGrid" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.15"/>
        </pattern>
      </defs>

      <!-- Latar Grid -->
      <rect width="1920" height="1080" fill="url(#brutalGrid)"/>

      <!-- =====================================================
           DEKORASI STIKER GEOMETRIS BRUTALIST
      ====================================================== -->
      <!-- Bintang Bergerigi Kiri Bawah -->
      <g transform="translate(310, 795)">
        <g class="sticker-spin">
          <polygon points="0,-64 17,-21 62,-21 26,8 40,54 0,26 -40,54 -26,8 -62,-21 -17,-21" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="14" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5"/>
        </g>
      </g>

      <!-- Badge Petir Kanan Atas -->
      <g transform="translate(1595, 255) rotate(10)">
        <rect x="10" y="10" width="104" height="104" rx="18" fill="var(--ink)"/>
        <rect x="0" y="0" width="104" height="104" rx="18" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6"/>
        <polygon points="58,16 30,56 50,56 43,88 74,46 54,46" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
      </g>

      <!-- =====================================================
           1. JENDELA RETRO OS UTAMA (PUSAT)
      ====================================================== -->
      <g transform="translate(560, 215)">
        <g class="main-win-bob">
          <!-- Bayangan Keras Tanpa Blur (Hard Offset Shadow) -->
          <rect x="18" y="18" width="800" height="580" rx="18" fill="var(--ink)"/>

          <!-- Bodi Utama Jendela -->
          <rect x="0" y="0" width="800" height="580" rx="18" fill="var(--white)" stroke="var(--ink)" stroke-width="7"/>

          <!-- Title Bar OS Kuning Neon -->
          <path d="M4 18 C4 10 10 4 18 4 H782 C790 4 796 10 796 18 V68 H4 Z" fill="var(--neon-yellow)"/>
          <line x1="0" y1="68" x2="800" y2="68" stroke="var(--ink)" stroke-width="7"/>

          <!-- Aksen Pill & Garis Bersih di Title Bar -->
          <rect x="28" y="24" width="140" height="20" rx="10" fill="var(--ink)"/>
          <line x1="188" y1="34" x2="615" y2="34" stroke="var(--ink)" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>

          <!-- 3 Tombol Kontrol Jendela (-, [], X) -->
          <g transform="translate(648, 16)">
            <rect x="0" y="0" width="36" height="36" rx="7" fill="var(--white)" stroke="var(--ink)" stroke-width="4.5"/>
            <line x1="10" y1="24" x2="26" y2="24" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

            <rect x="46" y="0" width="36" height="36" rx="7" fill="var(--white)" stroke="var(--ink)" stroke-width="4.5"/>
            <rect x="55" y="9" width="18" height="18" fill="none" stroke="var(--ink)" stroke-width="3.5"/>

            <rect x="92" y="0" width="36" height="36" rx="7" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="4.5"/>
            <path d="M102 10 L118 26 M118 10 L102 26" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- Konten Dalam Jendela Utama -->
          <!-- Kotak Visual Kiri: Modul 3D Isometric Cube di Atas Layar Grid -->
          <g transform="translate(48, 112)">
            <rect x="10" y="10" width="290" height="260" rx="16" fill="var(--ink)"/>
            <rect x="0" y="0" width="290" height="260" rx="16" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="6"/>

            <!-- Layar Dalam Putih dengan Grid Retro -->
            <rect x="24" y="24" width="242" height="212" rx="10" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
            <rect x="24" y="24" width="242" height="212" rx="10" fill="url(#miniScreenGrid)"/>

            <!-- Bayangan Lantai Kubus -->
            <ellipse cx="145" cy="196" rx="46" ry="12" fill="var(--ink)" opacity="0.2"/>

            <!-- Kubus 3D Geometris Melayang -->
            <g transform="translate(145, 132)">
              <g class="cube-float">
                <!-- Sisi Atas (Kuning Neon) -->
                <polygon points="0,-54 52,-26 0,2 -52,-26" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
                <!-- Sisi Kiri (Cyber Cyan) -->
                <polygon points="-52,-26 0,2 0,56 -52,28" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
                <!-- Sisi Kanan (Acid Lime) -->
                <polygon points="52,-26 0,2 0,56 52,28" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
              </g>
            </g>
          </g>

          <!-- Panel Info & Progress Bar Kanan -->
          <g transform="translate(382, 112)">
            <!-- Bar Judul Abstrak -->
            <rect x="0" y="12" width="345" height="24" rx="8" fill="var(--ink)"/>
            <rect x="0" y="54" width="250" height="18" rx="6" fill="#64748B"/>
            <rect x="0" y="86" width="305" height="18" rx="6" fill="#94A3B8"/>

            <!-- Retro Segmented Progress Bar -->
            <g transform="translate(0, 138)">
              <rect x="8" y="8" width="360" height="44" rx="10" fill="var(--ink)"/>
              <rect x="0" y="0" width="360" height="44" rx="10" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
              <g transform="translate(8, 8)">
                <rect class="retro-progress-fill" x="0" y="0" width="344" height="28" rx="5" fill="var(--electric-purple)"/>
              </g>
            </g>

            <!-- Tombol Interaktif Utama (Target Klik Kursor) -->
            <g transform="translate(0, 214)">
              <!-- Bayangan Statis Tombol -->
              <rect x="10" y="10" width="225" height="68" rx="14" fill="var(--ink)"/>
              <!-- Bodi Tombol yang Tertekan -->
              <g class="brutal-btn-press">
                <rect class="brutal-btn-bg" x="0" y="0" width="225" height="68" rx="14" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6"/>
                <!-- Ikon Centang Tebal di Dalam Tombol -->
                <path d="M86 35 L104 52 L140 18" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>
          </g>

          <!-- Footer Status Strip Bawah Jendela -->
          <g transform="translate(48, 442)">
            <rect x="0" y="0" width="704" height="84" rx="14" fill="#F1F5F9" stroke="var(--ink)" stroke-width="5"/>
            <circle cx="46" cy="42" r="18" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="4.5"/>
            <rect x="84" y="28" width="220" height="14" rx="5" fill="var(--ink)"/>
            <rect x="84" y="50" width="140" height="10" rx="4" fill="#64748B"/>
            <rect x="540" y="22" width="132" height="40" rx="10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4.5"/>
          </g>
        </g>
      </g>

      <!-- =====================================================
           2. POP-UP DIALOG SEKUNDER (MUNCUL SETELAH DIKLIK)
      ====================================================== -->
      <!-- Pop-Up Kiri Atas (Ungu Elektrik + Bintang) -->
      <g transform="translate(345, 225)">
        <g class="popup-left">
          <rect x="14" y="14" width="310" height="215" rx="16" fill="var(--ink)"/>
          <rect x="0" y="0" width="310" height="215" rx="16" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="6"/>
          <!-- Header Pop-Up -->
          <path d="M4 16 C4 9 9 4 16 4 H294 C301 4 306 9 306 16 V46 H4 Z" fill="var(--ink)"/>
          <circle cx="28" cy="25" r="7" fill="var(--hot-pink)"/>
          <circle cx="50" cy="25" r="7" fill="var(--neon-yellow)"/>
          <circle cx="72" cy="25" r="7" fill="var(--acid-lime)"/>

          <!-- Ikon Bintang Besar di Tengah -->
          <polygon points="155,70 169,101 202,105 177,127 185,160 155,142 125,160 133,127 108,105 141,101" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Pop-Up Kanan Bawah (Hijau Limau + Status Verified) -->
      <g transform="translate(1250, 585)">
        <g class="popup-right">
          <rect x="14" y="14" width="340" height="225" rx="16" fill="var(--ink)"/>
          <rect x="0" y="0" width="340" height="225" rx="16" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="6"/>
          <!-- Header Pop-Up -->
          <path d="M4 16 C4 9 9 4 16 4 H324 C331 4 336 9 336 16 V46 H4 Z" fill="var(--white)"/>
          <line x1="0" y1="46" x2="340" y2="46" stroke="var(--ink)" stroke-width="6"/>
          <rect x="298" y="12" width="22" height="22" rx="4" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="3.5"/>

          <!-- Konten Dialog Sukses -->
          <circle cx="92" cy="134" r="44" fill="var(--white)" stroke="var(--ink)" stroke-width="6"/>
          <path d="M72 135 L86 149 L114 121" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

          <rect x="158" y="104" width="144" height="18" rx="6" fill="var(--ink)"/>
          <rect x="158" y="134" width="104" height="14" rx="5" fill="var(--ink)" opacity="0.65"/>
          <rect x="158" y="162" width="124" height="26" rx="8" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4"/>
        </g>
      </g>

      <!-- =====================================================
           3. EFEK KLIK & KURSOR PANAH PIKSEL KLASIK
      ====================================================== -->
      <!-- Percikan Garis Klik di Sudut Tombol -->
      <g transform="translate(1062, 572)">
        <g class="click-burst" stroke="var(--ink)" stroke-width="5" stroke-linecap="round">
          <line x1="-22" y1="-22" x2="-36" y2="-36"/>
          <line x1="0" y1="-28" x2="0" y2="-46"/>
          <line x1="-28" y1="0" x2="-46" y2="0"/>
        </g>
      </g>

      <!-- Kursor Panah Piksel -->
      <g transform="translate(1068, 578)">
        <g class="pixel-cursor">
          <!-- Bayangan Kursor -->
          <polygon points="8,8 8,74 24,58 38,88 50,82 36,52 58,52" fill="var(--ink)"/>
          <!-- Bodi Kursor Putih Tebal -->
          <polygon points="0,0 0,66 16,50 30,80 42,74 28,44 50,44" fill="var(--white)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
