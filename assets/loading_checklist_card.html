<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Single Item 03: Loading & Checklist Card (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --cyber-cyan: #38BDF8;
      --hot-pink: #FB7185;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Kartu Melayang & Miring Dinamis (6s) */
    .hero-card-float {
      animation: cardFloat 6s ease-in-out infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(-2.5deg); }
      50% { transform: translateY(-16px) rotate(-0.5deg); }
    }

    /* 2. Cincin Putus-Putus Berputar Saat Loading (6s) */
    .loader-ring-spin {
      animation: spinStep 6s steps(24, end) infinite;
    }
    @keyframes spinStep {
      to { transform: rotate(360deg); }
    }

    /* 3. Stepped Progress Bar Terisi Bertahap (Siklus 3s = 2x per loop) */
    .step-bar-fill {
      transform-origin: 0px 0px;
      animation: fillStepped 3s steps(6, end) infinite;
    }
    @keyframes fillStepped {
      0%, 6% { transform: scaleX(0.14); fill: var(--electric-purple); }
      44%, 88% { transform: scaleX(1); fill: var(--acid-lime); }
      96%, 100% { transform: scaleX(0.14); fill: var(--electric-purple); }
    }

    /* 4. Lencana Lingkaran Centang Hijau Membal Saat 100% (Siklus 3s) */
    .complete-badge-pop {
      animation: popComplete 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popComplete {
      0%, 40%, 92%, 100% { transform: scale(0); opacity: 0; }
      48%, 86% { transform: scale(1); opacity: 1; }
    }

    /* 5. Percikan Garis Komik Saat Selesai (Siklus 3s) */
    .complete-sparks {
      animation: burstComplete 3s ease-out infinite;
    }
    @keyframes burstComplete {
      0%, 42% { transform: scale(0.4); opacity: 0; }
      49% { transform: scale(1); opacity: 1; }
      68%, 100% { transform: scale(1.38); opacity: 0; }
    }

    /* 6. Tiga Kotak Checklist Bawah Menyala Berurutan (Siklus 3s) */
    .chk-box-1 { animation: lightBox1 3s ease-in-out infinite; }
    .chk-box-2 { animation: lightBox2 3s ease-in-out infinite; }
    .chk-box-3 { animation: lightBox3 3s ease-in-out infinite; }

    @keyframes lightBox1 {
      0%, 10%, 94%, 100% { fill: var(--white); }
      16%, 88% { fill: var(--acid-lime); }
    }
    @keyframes lightBox2 {
      0%, 24%, 94%, 100% { fill: var(--white); }
      30%, 88% { fill: var(--acid-lime); }
    }
    @keyframes lightBox3 {
      0%, 38%, 94%, 100% { fill: var(--white); }
      44%, 88% { fill: var(--acid-lime); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: KARTU LOADING & CHECKLIST (PUSAT)
      ====================================================== -->
      <g transform="translate(960, 540)">
        <g class="hero-card-float">
          <!-- Bayangan Keras Tanpa Blur (Hard Offset Shadow) -->
          <rect x="-242" y="-292" width="520" height="620" rx="28" fill="var(--ink)"/>

          <!-- Bodi Utama Kartu (Kuning Neon) -->
          <rect x="-260" y="-310" width="520" height="620" rx="28" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="9"/>

          <!-- Header Bar Putih di Bagian Atas Kartu -->
          <path d="M-255 -282 C-255 -298 -242 -305 -232 -305 H232 C242 -305 255 -298 255 -282 V-232 H-255 Z" fill="var(--white)"/>
          <line x1="-260" y1="-232" x2="260" y2="-232" stroke="var(--ink)" stroke-width="9"/>

          <!-- Aksen Pill Hitam & Tombol Sudut di Header -->
          <rect x="-215" y="-278" width="145" height="20" rx="10" fill="var(--ink)"/>
          <circle cx="212" cy="-268" r="10" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="4"/>

          <!-- Layar Viewport Putih di Tengah Kartu -->
          <rect x="-215" y="-185" width="430" height="335" rx="24" fill="var(--white)" stroke="var(--ink)" stroke-width="8"/>

          <!-- AREA IKON PUSAT VIEWPORT (LOADER -> CHECKLIST BADGE) -->
          <g transform="translate(0, -48)">
            <!-- Cincin Putus-Putus Berputar (State Loading) -->
            <g class="loader-ring-spin">
              <circle cx="0" cy="0" r="68" fill="none" stroke="var(--ink)" stroke-width="8" stroke-dasharray="22 18" stroke-linecap="round"/>
            </g>
            <!-- Lingkaran Inti Putih -->
            <circle cx="0" cy="0" r="48" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="7"/>
            <!-- 3 Titik Loading Tengah -->
            <circle cx="-18" cy="0" r="6" fill="var(--ink)"/>
            <circle cx="0" cy="0" r="6" fill="var(--ink)"/>
            <circle cx="18" cy="0" r="6" fill="var(--ink)"/>

            <!-- Percikan Garis Komik Saat Selesai -->
            <g class="complete-sparks" stroke="var(--ink)" stroke-width="6" stroke-linecap="round">
              <line x1="-88" y1="-52" x2="-110" y2="-68"/>
              <line x1="88" y1="-52" x2="110" y2="-68"/>
              <line x1="-94" y1="44" x2="-116" y2="56"/>
              <line x1="94" y1="44" x2="116" y2="56"/>
            </g>

            <!-- Lencana Hijau Limau + Centang Tebal (Muncul Saat 100%) -->
            <g class="complete-badge-pop">
              <circle cx="6" cy="6" r="72" fill="var(--ink)"/>
              <circle cx="0" cy="0" r="72" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="8"/>
              <path d="M-28 2 L-8 22 L32 -20" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Stepped Progress Bar di Bagian Bawah Viewport -->
          <g transform="translate(-170, 62)">
            <rect x="6" y="6" width="340" height="44" rx="14" fill="var(--ink)"/>
            <rect x="0" y="0" width="340" height="44" rx="14" fill="var(--white)" stroke="var(--ink)" stroke-width="6"/>
            <g transform="translate(8, 8)">
              <rect class="step-bar-fill" x="0" y="0" width="324" height="28" rx="8" fill="var(--electric-purple)"/>
            </g>
          </g>

          <!-- Bar Kontrol Bawah (3 Indikator Checklist Selesai) -->
          <rect x="-215" y="182" width="430" height="84" rx="22" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="8"/>

          <!-- Item Checklist 1 -->
          <g transform="translate(-182, 206)">
            <rect class="chk-box-1" x="0" y="0" width="36" height="36" rx="10" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
            <path d="M10 18 L16 24 L27 12" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="46" y="12" width="52" height="12" rx="6" fill="var(--ink)"/>
          </g>

          <!-- Item Checklist 2 -->
          <g transform="translate(-54, 206)">
            <rect class="chk-box-2" x="0" y="0" width="36" height="36" rx="10" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
            <path d="M10 18 L16 24 L27 12" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="46" y="12" width="52" height="12" rx="6" fill="var(--ink)"/>
          </g>

          <!-- Item Checklist 3 -->
          <g transform="translate(74, 206)">
            <rect class="chk-box-3" x="0" y="0" width="36" height="36" rx="10" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
            <path d="M10 18 L16 24 L27 12" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="46" y="12" width="52" height="12" rx="6" fill="var(--ink)"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
