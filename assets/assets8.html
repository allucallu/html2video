<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Checkmark Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(847291);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom spline interpolation through hand-drawn waypoints with marker width variation (14-22px)
function buildHandDrawnSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn organic imperfection along the stroke
    const wobbleX = Math.sin(u * 32 + seedPhase) * 2.4 + Math.cos(u * 19 - seedPhase) * 1.5;
    const wobbleY = Math.cos(u * 36 + seedPhase) * 2.4 + Math.sin(u * 23 + seedPhase) * 1.5;

    // Marker pressure variation (14-22px): heavier near the checkmark vertex knee, tapering at tips
    const kneeBoost = Math.exp(-Math.pow((u - 0.30) / 0.14, 2)) * 0.35;
    const pressure = Math.min(1, 0.45 + 0.40 * Math.sin(u * TAU * 2.8 + seedPhase) + kneeBoost);
    let taper = 1.0;
    if (u < 0.04) taper = 0.68 + 0.32 * (u / 0.04);
    else if (u > 0.95) taper = 0.62 + 0.38 * ((1 - u) / 0.05);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + wobbleX,
      y: y + wobbleY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// 1. PRIMARY HERO WHITE MARKER CHECKMARK (Bold double-pass hand-drawn checkmark)
// Left arm starts at (-470, 55), plunges to bottom knee (-175, 365), sweeps up-right to (+515, -415)
const mainCheckWaypoints = [
  { x: -495, y: 78 },
  { x: -465, y: 45 },
  { x: -335, y: 195 },
  { x: -195, y: 358 },
  { x: -165, y: 372 }, // Sharp bottom vertex knee of the checkmark
  { x: -115, y: 305 },
  { x: 25,   y: 115 },
  { x: 195,  y: -95 },
  { x: 375,  y: -285 },
  { x: 525,  y: -425 },
  { x: 485,  y: -365 }  // Expressive hand-drawn marker flick at the top-right tip
];
const MAIN_CHECKMARK = buildHandDrawnSpline(mainCheckWaypoints, 220, 16, 22, 0, 0.3);

// 2. SECONDARY SKETCHED WHITE CHECKMARK STRAND (Creates an authentic sketchy double-line marker checkmark)
const sketchCheckWaypoints = [
  { x: -445, y: 18 },
  { x: -305, y: 168 },
  { x: -162, y: 325 }, // Slightly above the main vertex knee
  { x: -128, y: 278 },
  { x: 45,   y: 55 },
  { x: 235,  y: -165 },
  { x: 415,  y: -348 },
  { x: 555,  y: -455 }
];
const SKETCH_WHITE_CHECK = buildHandDrawnSpline(sketchCheckWaypoints, 160, 14, 19, 180, 2.1);

// 3. SECONDARY WARM YELLOW (#FFD93D) OFFSET ACCENT CHECKMARK (Follow-through highlight under the right wing)
const yellowCheckWaypoints = [
  { x: -425, y: 112 },
  { x: -290, y: 262 },
  { x: -148, y: 422 },
  { x: -95,  y: 365 },
  { x: 75,   y: 145 },
  { x: 265,  y: -75 },
  { x: 445,  y: -255 },
  { x: 565,  y: -365 }
];
const YELLOW_ACCENT_CHECK = buildHandDrawnSpline(yellowCheckWaypoints, 160, 15, 20, 310, 4.2);

// 4. SMALL HAND-DRAWN TICK MARKS BESIDE THE CHECKMARK (Curved splines so each tick mark has genuine marker character)
const BESIDE_TICKS = [
  // Prominent radiating tick marks beside the upper-right wing & tip
  {
    pts: buildHandDrawnSpline([
      { x: 585, y: -485 }, { x: 645, y: -535 }, { x: 715, y: -582 }
    ], 32, 16, 21, 400, 0.5),
    color: COLOR_YELLOW,
    phaseOff: 0.46
  },
  {
    pts: buildHandDrawnSpline([
      { x: 635, y: -395 }, { x: 715, y: -415 }, { x: 795, y: -428 }
    ], 32, 16, 21, 412, 1.2),
    color: COLOR_WHITE,
    phaseOff: 0.49
  },
  {
    pts: buildHandDrawnSpline([
      { x: 605, y: -285 }, { x: 682, y: -272 }, { x: 755, y: -252 }
    ], 32, 15, 20, 424, 2.0),
    color: COLOR_YELLOW,
    phaseOff: 0.52
  },
  {
    pts: buildHandDrawnSpline([
      { x: 445, y: -495 }, { x: 472, y: -568 }, { x: 505, y: -635 }
    ], 32, 15, 20, 436, 2.8),
    color: COLOR_WHITE,
    phaseOff: 0.44
  },
  // Small rhythmic tick marks beside the middle-right flank of the checkmark
  {
    pts: buildHandDrawnSpline([
      { x: 355, y: -65 }, { x: 432, y: -38 }, { x: 505, y: -8 }
    ], 28, 15, 20, 448, 3.5),
    color: COLOR_WHITE,
    phaseOff: 0.54
  },
  {
    pts: buildHandDrawnSpline([
      { x: 265, y: 65 }, { x: 338, y: 102 }, { x: 405, y: 142 }
    ], 28, 15, 19, 460, 4.1),
    color: COLOR_YELLOW,
    phaseOff: 0.57
  },
  // Small tick marks beside the left elbow & bottom vertex knee
  {
    pts: buildHandDrawnSpline([
      { x: -575, y: -15 }, { x: -648, y: -48 }, { x: -718, y: -78 }
    ], 28, 15, 20, 472, 1.7),
    color: COLOR_YELLOW,
    phaseOff: 0.42
  },
  {
    pts: buildHandDrawnSpline([
      { x: -585, y: 105 }, { x: -665, y: 118 }, { x: -742, y: 135 }
    ], 28, 15, 20, 482, 2.9),
    color: COLOR_WHITE,
    phaseOff: 0.45
  },
  {
    pts: buildHandDrawnSpline([
      { x: -235, y: 465 }, { x: -262, y: 538 }, { x: -288, y: 605 }
    ], 28, 15, 20, 492, 3.8),
    color: COLOR_WHITE,
    phaseOff: 0.50
  },
  {
    pts: buildHandDrawnSpline([
      { x: -95, y: 475 }, { x: -72, y: 548 }, { x: -45, y: 615 }
    ], 28, 15, 19, 500, 4.6),
    color: COLOR_YELLOW,
    phaseOff: 0.53
  }
];

// 5. AMBIENT MINI DOODLE ACCENTS (Secondary wave of small buddy-ticks, arcs & 4-stroke scribble stars)
const AMBIENT_DOODLES = [
  { x: -245, y: -165, ang: -0.65, len: 56, color: COLOR_YELLOW, phaseOff: 0.12, type: 'miniCheck', slot: 380 },
  { x: 545,  y: 95,   ang: -0.55, len: 52, color: COLOR_YELLOW, phaseOff: 0.22, type: 'miniCheck', slot: 388 },
  { x: -455, y: 345,  ang: 0.30,  len: 32, color: COLOR_YELLOW, phaseOff: 0.18, type: 'star',      slot: 395 },
  { x: 115,  y: -365, ang: 0.15,  len: 34, color: COLOR_WHITE,  phaseOff: 0.30, type: 'star',      slot: 402 },
  { x: 755,  y: -115, ang: 0.42,  len: 30, color: COLOR_WHITE,  phaseOff: 0.62, type: 'star',      slot: 408 }
];

// Progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.36]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.36, 0.62]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.62, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.36) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.36) };
  } else if (c < 0.62) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.62) / 0.34), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker stroke between [uStart, uEnd] with discrete 12fps line boil & elastic follow-through
function renderMarkerPath(pts, uStart, uEnd, color, boilStep, phase, flexScale) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Elastic whip follow-through along the long upper-right wing of the checkmark
    const wingWeight = p.u > 0.32 ? (p.u - 0.32) / 0.68 : 0;
    const whipX = Math.sin(TAU * (phase * 2 - p.u * 0.6)) * flexScale * wingWeight;
    const whipY = -Math.cos(TAU * (phase * 2 - p.u * 0.6)) * flexScale * wingWeight;

    return {
      x: p.x + bx + whipX,
      y: p.y + by + whipY,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// Render Ambient Mini Check-Ticks & Hand-Drawn Doodle Stars
function renderAmbientDoodles(phase, boilStep) {
  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < AMBIENT_DOODLES.length; i++) {
    const d = AMBIENT_DOODLES[i];
    const localC = (phase * 2 + d.phaseOff) % 1.0;
    const win = getDrawEraseWindow(localC);
    if (win.uEnd - win.uStart <= 0.02) continue;

    const bx = boilRowX[d.slot];
    const by = boilRowY[d.slot];
    const cx = d.x + bx;
    const cy = d.y + by;

    ctx.strokeStyle = d.color;

    if (d.type === 'miniCheck') {
      // Small companion V-tick mark beside the main checkmark
      ctx.lineWidth = 15;
      const p0 = { x: cx - 26, y: cy + 4 };
      const p1 = { x: cx - 6,  y: cy + 28 };
      const p2 = { x: cx + 42, y: cy - 34 };

      // Interpolate two-segment mini-tick over [uStart, uEnd]
      const poly = [p0, p1, p2];
      ctx.beginPath();
      const s0 = win.uStart * 2;
      const s1 = win.uEnd * 2;
      for (let seg = 0; seg < 2; seg++) {
        const a = Math.max(seg, Math.min(seg + 1, s0)) - seg;
        const b = Math.max(seg, Math.min(seg + 1, s1)) - seg;
        if (b > a) {
          const ptA = poly[seg];
          const ptB = poly[seg + 1];
          ctx.moveTo(ptA.x + (ptB.x - ptA.x) * a, ptA.y + (ptB.y - ptA.y) * a);
          ctx.lineTo(ptA.x + (ptB.x - ptA.x) * b, ptA.y + (ptB.y - ptA.y) * b);
        }
      }
      ctx.stroke();
    } else if (d.type === 'star') {
      const s = d.len;
      const axes = [0, Math.PI * 0.5, Math.PI * 0.25, Math.PI * 0.75];
      ctx.lineWidth = 14;
      for (let k = 0; k < 4; k++) {
        const a = d.ang + axes[k];
        const l0 = -s + win.uStart * (2 * s);
        const l1 = -s + win.uEnd * (2 * s);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * l0, cy + Math.sin(a) * l0);
        ctx.lineTo(cx + Math.cos(a) * l1, cy + Math.sin(a) * l1);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Primary Motion: Whole-checkmark springy squash & stretch, bounce, and tilt wobble (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const scaleX = 1.0 + 0.022 * sin2 - 0.010 * sin4;
  const scaleY = 1.0 - 0.022 * sin2 + 0.010 * sin4;
  const wobbleRot = 0.032 * sin1 + 0.018 * cos2;
  const bounceX = 10 * cos1;
  const bounceY = 16 * sin2;

  ctx.save();
  ctx.translate(CX + bounceX, CY + bounceY);
  ctx.rotate(wobbleRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 the Hero White Checkmark + its beside-ticks
  // are in their FULL held state, while the Secondary Sketch Line and Yellow Accent Checkmark overlap:
  const baseCycle = phase * 2;

  const winMainWhite   = getDrawEraseWindow(baseCycle + 0.50);
  const winSketchWhite = getDrawEraseWindow(baseCycle + 0.04);
  const winYellowCheck = getDrawEraseWindow(baseCycle + 0.26);

  // 1. Secondary Motion Layer: Sketchy Double-Line White Checkmark Strand
  renderMarkerPath(
    SKETCH_WHITE_CHECK,
    winSketchWhite.uStart,
    winSketchWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    11
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Offset Accent Checkmark
  renderMarkerPath(
    YELLOW_ACCENT_CHECK,
    winYellowCheck.uStart,
    winYellowCheck.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    13
  );

  // 3. Primary Motion Layer: Hero Bold White Marker Checkmark
  renderMarkerPath(
    MAIN_CHECKMARK,
    winMainWhite.uStart,
    winMainWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    10
  );

  // 4. Secondary Motion Layer: Small Hand-Drawn Tick Marks Beside the Checkmark
  for (let i = 0; i < BESIDE_TICKS.length; i++) {
    const tk = BESIDE_TICKS[i];
    const winTick = getDrawEraseWindow(baseCycle + tk.phaseOff);
    renderMarkerPath(
      tk.pts,
      winTick.uStart,
      winTick.uEnd,
      tk.color,
      boilStep,
      phase,
      6
    );
  }

  // 5. Ambient Motion Layer: Companion Mini-Ticks & Hand-Drawn Doodle Stars
  renderAmbientDoodles(phase, boilStep);

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
