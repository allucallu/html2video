<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Full Scene V2: Midnight Carnival & Ferris Wheel - 6s Loop</title>
  <style>
    :root {
      --sky-dark: #120E24;
      --sky-mid: #1C1638;
      --ground-dark: #191333;
      --ink: #0A0812;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--sky-dark);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Bianglala Berputar 360° & Kabin Tetap Tegak (6s linear) */
    .ferris-wheel-spin {
      animation: wheelTurn 6s linear infinite;
    }
    .cabin-counter-spin {
      animation: cabinStayUpright 6s linear infinite;
    }
    @keyframes wheelTurn {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes cabinStayUpright {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* 2. Lonceng Menara Tengah Malam Berayun Nyaring (Siklus 1.5s = 4x per loop) */
    .tower-bell-swing {
      animation: swingTowerBell 1.5s ease-in-out infinite;
    }
    @keyframes swingTowerBell {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(16deg); }
    }

    .bell-sound-wave {
      animation: waveBell 1.5s ease-out infinite;
    }
    @keyframes waveBell {
      0%, 15% { transform: scale(0.75); opacity: 0; }
      45%, 75% { transform: scale(1.08); opacity: 1; }
      95%, 100% { transform: scale(1.22); opacity: 0; }
    }

    /* 3. Tiga Kembang Api Mekar Bergantian di Langit (Siklus 3s = 2x per loop) */
    .fw-burst-a {
      animation: skyBurstA 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes skyBurstA {
      0%, 4% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      18% { transform: scale(1.1) rotate(10deg); opacity: 1; }
      46% { transform: scale(1) rotate(18deg); opacity: 1; }
      60%, 100% { transform: scale(1.22) rotate(25deg); opacity: 0; }
    }

    .fw-burst-b {
      animation: skyBurstB 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes skyBurstB {
      0%, 26% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      40% { transform: scale(1.12) rotate(-10deg); opacity: 1; }
      68% { transform: scale(1) rotate(-18deg); opacity: 1; }
      82%, 100% { transform: scale(1.22) rotate(-25deg); opacity: 0; }
    }

    .fw-burst-c {
      animation: skyBurstC 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes skyBurstC {
      0%, 48% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      62% { transform: scale(1.1) rotate(8deg); opacity: 1; }
      86% { transform: scale(1) rotate(15deg); opacity: 1; }
      97%, 100% { transform: scale(1.22) rotate(22deg); opacity: 0; }
    }

    /* 4. Lampu Hias Gantung Berkedip Bergantian (1.5s) */
    .bulb-odd { animation: bulbFlashA 1.5s steps(2, end) infinite; }
    .bulb-even { animation: bulbFlashB 1.5s steps(2, end) infinite; }
    @keyframes bulbFlashA {
      0%, 49% { fill: var(--neon-yellow); }
      50%, 100% { fill: var(--hot-pink); }
    }
    @keyframes bulbFlashB {
      0%, 49% { fill: var(--cyber-cyan); }
      50%, 100% { fill: var(--acid-lime); }
    }

    /* 5. Meriam Konfeti Kiri & Kanan Menembak (Siklus 3s) */
    .cannon-left-kick {
      animation: kickCannonL 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes kickCannonL {
      0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
      14% { transform: translate(-12px, 12px) scale(0.92, 1.06); }
      24% { transform: translate(12px, -12px) scale(1.06, 0.94); }
      38%, 90% { transform: translate(0px, 0px) scale(1, 1); }
    }

    .cannon-right-kick {
      animation: kickCannonR 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes kickCannonR {
      0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
      14% { transform: translate(12px, 12px) scale(0.92, 1.06); }
      24% { transform: translate(-12px, -12px) scale(1.06, 0.94); }
      38%, 90% { transform: translate(0px, 0px) scale(1, 1); }
    }

    .shot-left-1 {
      animation: flyShotL1 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes flyShotL1 {
      0%, 18% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      24% { opacity: 1; }
      55% { transform: translate(155px, -195px) scale(1.08) rotate(160deg); opacity: 1; }
      85% { transform: translate(185px, -145px) scale(1) rotate(240deg); opacity: 1; }
      96%, 100% { transform: translate(200px, -110px) scale(0) rotate(280deg); opacity: 0; }
    }

    .shot-right-1 {
      animation: flyShotR1 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes flyShotR1 {
      0%, 18% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      24% { opacity: 1; }
      55% { transform: translate(-155px, -195px) scale(1.08) rotate(-160deg); opacity: 1; }
      85% { transform: translate(-185px, -145px) scale(1) rotate(-240deg); opacity: 1; }
      96%, 100% { transform: translate(-200px, -110px) scale(0) rotate(-280deg); opacity: 0; }
    }

    /* 6. Hujan Konfeti Terus-Menerus di Seluruh Adegan (6s seamless) */
    .rain-layer-1 { animation: confettiRain1 6s linear infinite; }
    .rain-layer-2 { animation: confettiRain2 6s linear infinite; }
    @keyframes confettiRain1 {
      0% { transform: translateY(-100px) rotate(0deg); }
      100% { transform: translateY(1120px) rotate(360deg); }
    }
    @keyframes confettiRain2 {
      0% { transform: translateY(-220px) rotate(180deg); }
      100% { transform: translateY(1000px) rotate(-180deg); }
    }
  </style>
</head>

          <circle cx="0" cy="178" r="13" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="5"/>

          <polygon points="0,-46 13,-13 46,-13 20,7 30,40 0,20 -30,40 -20,7 -46,-13 -13,-13" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="6.5" stroke-linejoin="round"/>

            <line x1="39" y1="-39" x2="102" y2="-102"/>

            <line x1="-55" y1="0" x2="-145" y2="0"/>

          </g>
          <circle cx="0" cy="-165" r="12" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="4.5"/>
          <circle cx="116" cy="-116" r="12" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="4.5"/>
          <circle cx="165" cy="0" r="12" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="4.5"/>

        </g>
      </g>

      <!-- =====================================================
           3. UNTAIAN LAMPU HIAS GANTUNG (FESTOON LIGHTS) ATAS
      ====================================================== -->

        <!-- Kabel Lengkung Kiri & Kanan -->
        <path d="M -20 35 Q 480 165 960 45 Q 1440 165 1940 35" fill="none" stroke="var(--ink)" stroke-width="9"/>

        <!-- Deretan Bohlam Berkedip Bergantian -->

          <circle class="bulb-even" cx="310" cy="102" r="16"/>
          <circle class="bulb-odd" cx="480" cy="110" r="16"/>

      <!-- =====================================================

      <!-- =====================================================

      ====================================================== -->
      <!-- Tenda Karnaval Kiri -->
