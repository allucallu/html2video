<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow For More — Bespoke Vector Kinetic CTA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    object-fit: contain;
  }
</style>
</head>
<body>
<canvas id="stage" width="3840" height="2160"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // --- CLI & URL PARAMETERS ---
  const P = window.__cliParams || {};
  const BG = P.bg || 'black';
  const SEED = Number(P.seed) || 1;
  const VARIANT = Number(P.variant) || 0;

  const DURATION = 10;
  const FPS = 30;
  const TAU = Math.PI * 2;

  window.DURATION = DURATION;
  window.FPS = FPS;

  // --- SEEDED PRNG ---
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(SEED * 2654435761 + VARIANT * 1013904223 + 11);

  // --- PALETTE PRESETS (Overridable via P.palette) ---
  const PRESET_PALETTES = [
    // Variant 0: Imperial Gold & Crisp Ivory
    ['#FFFFFF', '#E6ECF5', '#FFB800', '#FFE484', '#8F5B00'],
    // Variant 1: Electric Cyan & Platinum
    ['#FFFFFF', '#DCEEFF', '#00E5FF', '#80F8FF', '#006B8F'],
    // Variant 2: Neon Magenta & Rose Gold
    ['#FFFFFF', '#F7DCEB', '#FF1E8A', '#FF85C2', '#8A0047'],
    // Variant 3: Emerald Mint & Silver
    ['#FFFFFF', '#DCF7EC', '#00E699', '#85FFCE', '#00754B'],
    // Variant 4: Solar Amber & Warm Cream
    ['#FFFFFF', '#FFF0DC', '#FF7A00', '#FFC278', '#8F3D00'],
    // Variant 5: Royal Violet & Ice Cyan
    ['#FFFFFF', '#E8E0FF', '#9D4EDD', '#E0AAFF', '#4A1575']
  ];

  let rawPal = PRESET_PALETTES[((VARIANT % PRESET_PALETTES.length) + PRESET_PALETTES.length) % PRESET_PALETTES.length];
  if (typeof P.palette === 'string' && P.palette.trim()) {
    const custom = P.palette.split(',').map(s => s.trim()).filter(Boolean);
    if (custom.length >= 2) {
      rawPal = [
        custom[0],
        custom[1 % custom.length],
        custom[2 % custom.length],
        custom[3 % custom.length],
        custom[4 % custom.length]
      ];
    }
  }

  function hexToRgb(hex) {
    let h = hex.replace('#', '').trim();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  const RGB = rawPal.map(hexToRgb);
  function rgba(idx, a) {
    const c = RGB[idx % RGB.length];
    const alpha = Math.max(0, Math.min(1, a));
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha.toFixed(4)})`;
  }

  // --- 100% PROPRIETARY ROUNDED GEOMETRIC VECTOR FONT (Zero External/OS Fonts, 100% Commercial-Free) ---
  const VECTOR_FONT = {
    'F': { w: 0.62, p: c => { c.m(0.56, 0); c.l(0.10, 0); c.l(0.10, 1); c.m(0.10, 0.49); c.l(0.46, 0.49); } },
    'O': { w: 0.84, p: c => { c.arc(0.42, 0.50, 0.34, 0.50, 0, TAU, false); } },
    'L': { w: 0.60, p: c => { c.m(0.10, 0); c.l(0.10, 1); c.l(0.54, 1); } },
    'W': { w: 1.02, p: c => { c.m(0.04, 0); c.l(0.25, 1); c.l(0.51, 0.28); c.l(0.77, 1); c.l(0.98, 0); } },
    'R': { w: 0.74, p: c => {
      c.m(0.10, 1); c.l(0.10, 0); c.l(0.41, 0);
      c.arc(0.41, 0.26, 0.24, 0.26, -Math.PI * 0.5, Math.PI * 0.5, false);
      c.l(0.10, 0.52);
      c.m(0.36, 0.52); c.l(0.66, 1);
    }},
    'M': { w: 0.94, p: c => { c.m(0.08, 1); c.l(0.08, 0); c.l(0.47, 0.66); c.l(0.86, 0); c.l(0.86, 1); } },
    'E': { w: 0.66, p: c => { c.m(0.58, 0); c.l(0.10, 0); c.l(0.10, 1); c.l(0.58, 1); c.m(0.10, 0.49); c.l(0.48, 0.49); } },
    ' ': { w: 0.36, p: () => {} }
  };

  function createGlyphPathHelper(ox, oy, scaleX, scaleY, slant) {
    const tx = (x, y) => ox + (x + (1 - y) * slant) * scaleX;
    const ty = (x, y) => oy + y * scaleY;
    return {
      m(x, y) { ctx.moveTo(tx(x, y), ty(x, y)); },
      l(x, y) { ctx.lineTo(tx(x, y), ty(x, y)); },
      b(x1, y1, x2, y2, x3, y3) {
        ctx.bezierCurveTo(tx(x1, y1), ty(x1, y1), tx(x2, y2), ty(x2, y2), tx(x3, y3), ty(x3, y3));
      },
      arc(cx, cy, rx, ry, a0, a1, ccw) {
        const steps = 28;
        let delta = a1 - a0;
        if (ccw && delta > 0) delta -= TAU;
        if (!ccw && delta < 0) delta += TAU;
        for (let i = 0; i <= steps; i++) {
          const a = a0 + (i / steps) * delta;
          const px = cx + Math.cos(a) * rx;
          const py = cy + Math.sin(a) * ry;
          if (i === 0) ctx.moveTo(tx(px, py), ty(px, py));
          else ctx.lineTo(tx(px, py), ty(px, py));
        }
      }
    };
  }

  function measureVectorText(str, capHeight, tracking) {
    let total = 0;
    for (let i = 0; i < str.length; i++) {
      const g = VECTOR_FONT[str[i]] || VECTOR_FONT[' '];
      total += g.w * capHeight;
      if (i < str.length - 1) total += tracking;
    }
    return total;
  }

  function drawVectorString(str, startX, centerY, capHeight, tracking, options) {
    const slant = options.slant || 0;
    const wavePhase = options.wavePhase || 0;
    const waveAmp = options.waveAmp || 0;
    const strokeW = Math.max(options.strokeW, capHeight * 0.165);
    const mainColorIdx = options.colorIdx;
    const glowColorIdx = options.glowColorIdx !== undefined ? options.glowColorIdx : mainColorIdx;
    const alpha = options.alpha !== undefined ? options.alpha : 1;

    let curX = startX;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = VECTOR_FONT[ch] || VECTOR_FONT[' '];
      const yWave = Math.sin(wavePhase - i * 0.52) * waveAmp;
      const topY = centerY - capHeight * 0.5 + yWave;

      if (ch !== ' ') {
        const helper = createGlyphPathHelper(curX, topY, capHeight, capHeight, slant);

        ctx.beginPath();
        g.p(helper);
        ctx.strokeStyle = rgba(glowColorIdx, alpha * 0.22);
        ctx.lineWidth = strokeW * 1.9;
        ctx.stroke();

        ctx.beginPath();
        g.p(helper);
        ctx.strokeStyle = rgba(mainColorIdx, alpha);
        ctx.lineWidth = strokeW;
        ctx.stroke();
      }

      curX += g.w * capHeight + tracking;
    }
  }

  // --- PRECOMPUTE ORBITING SPARKLES & PARTICLES ---
  const ORBIT_STARS = [];
  for (let i = 0; i < 28; i++) {
    ORBIT_STARS.push({
      baseAngle: (i / 28) * TAU + rng() * 0.12,
      rx: 0.34 + 0.06 * rng(),
      ry: 0.13 + 0.04 * rng(),
      speed: (i % 2 === 0) ? 1 : -1,
      size: 0.0022 + 0.0025 * rng(),
      twinkleFreq: 2 + (i % 4),
      twinklePhase: rng() * TAU,
      isFourPoint: (i % 3 === 0)
    });
  }

  function drawRadialGlow(x, y, r, colorIdx, alpha) {
    if (r <= 0.5 || alpha <= 0.002) return;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, rgba(colorIdx, alpha));
    grad.addColorStop(0.35, rgba(colorIdx, alpha * 0.45));
    grad.addColorStop(0.70, rgba(colorIdx, alpha * 0.12));
    grad.addColorStop(1, rgba(colorIdx, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function drawFourPointStar(x, y, radius, rot, colorIdx, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU;
      const na = ((i + 0.5) / 4) * TAU;
      const ox = Math.cos(a) * radius;
      const oy = Math.sin(a) * radius;
      const ix = Math.cos(na) * (radius * 0.24);
      const iy = Math.sin(na) * (radius * 0.24);
      if (i === 0) ctx.moveTo(ox, oy);
      else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.fillStyle = rgba(colorIdx, alpha);
    ctx.fill();
    ctx.restore();
  }

  // --- MAIN RENDER FUNCTION ---
  function renderFrame(t) {
    const W = canvas.width;
    const H = canvas.height;
    const S = Math.min(W, H);
    const cx = W * 0.5;
    const cy = H * 0.5;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    if (BG === 'alpha') {
      ctx.clearRect(0, 0, W, H);
    } else {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
    }

    const phase = (((t % DURATION) + DURATION) % DURATION) / DURATION;
    const p1 = TAU * 1 * phase;
    const p2 = TAU * 2 * phase;
    const p3 = TAU * 3 * phase;
    const p4 = TAU * 4 * phase;

    const u = S * 0.001; // 2.16px at 4K

    // 1. Ambient Backdrop Glow (fades strictly to 0 before edges)
    drawRadialGlow(cx, cy, S * 0.46, 4, 0.20 + 0.05 * Math.sin(p2));
    drawRadialGlow(cx - S * 0.18, cy, S * 0.24, 2, 0.14 + 0.06 * Math.cos(p2));

    ctx.save();
    ctx.translate(cx, cy);

    // Subtle harmonic breathing scale
    const breath = 1 + 0.014 * Math.sin(p1);
    ctx.scale(breath, breath);

    // 2. Scientific Celestial Construction Ellipses & Orbiting Sparkles
    ctx.save();
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    // Faint construction orbital track
    ctx.beginPath();
    ctx.ellipse(0, 0, S * 0.38, S * 0.155, 0, 0, TAU);
    ctx.strokeStyle = rgba(4, 0.22);
    ctx.lineWidth = u * 0.7;
    ctx.stroke();

    ctx.setLineDash([u * 3, u * 6]);
    ctx.beginPath();
    ctx.ellipse(0, 0, S * 0.405, S * 0.172, 0, 0, TAU);
    ctx.strokeStyle = rgba(1, 0.15);
    ctx.lineWidth = u * 0.6;
    ctx.stroke();
    ctx.setLineDash([]);

    for (let i = 0; i < ORBIT_STARS.length; i++) {
      const st = ORBIT_STARS[i];
      const ang = st.baseAngle + st.speed * p1;
      const px = Math.cos(ang) * st.rx * S;
      const py = Math.sin(ang) * st.ry * S;
      const tw = 0.5 + 0.5 * Math.sin(TAU * st.twinkleFreq * phase + st.twinklePhase);
      const rad = st.size * S * (0.65 + 0.55 * tw);

      drawRadialGlow(px, py, rad * 3.5, 2, 0.42 * tw);
      if (st.isFourPoint) {
        drawFourPointStar(px, py, rad * 2.2, p2 + i, 0, 0.55 + 0.45 * tw);
      } else {
        ctx.fillStyle = rgba(i % 2 === 0 ? 0 : 3, 0.5 + 0.5 * tw);
        ctx.beginPath();
        ctx.arc(px, py, rad * 0.8, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();

    // 3. Main Pill Container (Double-Wall Architectural Capsule)
    const pillW = S * 0.68;
    const pillH = S * 0.175;
    const pillR = pillH * 0.5;

    // Dark opaque interior chamber so background orbits never clutter the typography
    ctx.fillStyle = (BG === 'alpha') ? 'rgba(6, 5, 2, 0.90)' : '#050401';
    ctx.beginPath();
    ctx.roundRect(-pillW * 0.5, -pillH * 0.5, pillW, pillH, pillR);
    ctx.fill();

    // Inner recessed architectural border
    const inPad = u * 5.5;
    ctx.beginPath();
    ctx.roundRect(-pillW * 0.5 + inPad, -pillH * 0.5 + inPad, pillW - inPad * 2, pillH - inPad * 2, pillR - inPad);
    ctx.strokeStyle = rgba(4, 0.42);
    ctx.lineWidth = u * 0.9;
    ctx.stroke();

    // Outer Pill Border with Traveling Dual-Comet Gold Rim Light
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    const gradX = Math.cos(p2) * (pillW * 0.52);
    const gradY = Math.sin(p2) * (pillH * 0.52);
    const borderGrad = ctx.createLinearGradient(gradX, gradY, -gradX, -gradY);
    borderGrad.addColorStop(0, rgba(3, 0.98));
    borderGrad.addColorStop(0.28, rgba(2, 0.65));
    borderGrad.addColorStop(0.50, rgba(4, 0.25));
    borderGrad.addColorStop(0.72, rgba(2, 0.65));
    borderGrad.addColorStop(1, rgba(0, 0.98));

    // Outer glow pass
    ctx.beginPath();
    ctx.roundRect(-pillW * 0.5, -pillH * 0.5, pillW, pillH, pillR);
    ctx.strokeStyle = rgba(2, 0.25);
    ctx.lineWidth = u * 8.5;
    ctx.stroke();

    // Crisp rim pass
    ctx.beginPath();
    ctx.roundRect(-pillW * 0.5, -pillH * 0.5, pillW, pillH, pillR);
    ctx.strokeStyle = borderGrad;
    ctx.lineWidth = u * 2.8;
    ctx.stroke();

    // Corner telemetry tick marks outside the pill
    for (let side of [-1, 1]) {
      const arcAng = side === -1 ? Math.PI : 0;
      ctx.beginPath();
      ctx.arc(side * (pillW * 0.5 - pillR), 0, pillR + u * 8, arcAng - 0.55, arcAng + 0.55);
      ctx.strokeStyle = rgba(2, 0.48 + 0.25 * Math.sin(p2));
      ctx.lineWidth = u * 1.2;
      ctx.stroke();
    }

    // 4. Left Sacred-Geometry Follow (+) Emblem
    const badgeX = -pillW * 0.5 + pillR + u * 6;
    const badgeR = pillR * 0.68;

    ctx.save();
    ctx.translate(badgeX, 0);

    // Radial glow behind the + emblem
    drawRadialGlow(0, 0, badgeR * 2.1, 2, 0.48 + 0.22 * Math.sin(p2));

    // Counter-rotating outer Vernier ring (whole turn)
    ctx.save();
    ctx.rotate(-p1);
    ctx.setLineDash([u * 4, u * 5]);
    ctx.beginPath();
    ctx.arc(0, 0, badgeR * 1.18, 0, TAU);
    ctx.strokeStyle = rgba(3, 0.72);
    ctx.lineWidth = u * 1.4;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Rotating sacred-geometry 8-point star ring around badge
    ctx.save();
    ctx.rotate(p1);
    for (let sq = 0; sq < 2; sq++) {
      ctx.save();
      ctx.rotate(sq * Math.PI * 0.25);
      const rSq = badgeR * 0.96;
      ctx.strokeStyle = rgba(2, 0.45);
      ctx.lineWidth = u * 1.0;
      ctx.strokeRect(-rSq * 0.7, -rSq * 0.7, rSq * 1.4, rSq * 1.4);
      ctx.restore();
    }
    ctx.restore();

    // Glowing badge circle
    ctx.globalCompositeOperation = 'source-over';
    const badgeFill = ctx.createRadialGradient(-badgeR * 0.25, -badgeR * 0.25, 0, 0, 0, badgeR);
    badgeFill.addColorStop(0, rgba(3, 1));
    badgeFill.addColorStop(0.55, rgba(2, 1));
    badgeFill.addColorStop(1, rgba(4, 1));
    ctx.fillStyle = badgeFill;
    ctx.beginPath();
    ctx.arc(0, 0, badgeR * 0.86, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = rgba(0, 0.92);
    ctx.lineWidth = u * 1.8;
    ctx.stroke();

    // Precision Vector Plus (+) Symbol rotating by 180 deg (pi * 2 * phase)
    ctx.save();
    ctx.rotate(p1); // 1 full turn
    const arm = badgeR * 0.44;
    ctx.strokeStyle = '#050401';
    ctx.lineWidth = u * 7.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
    ctx.moveTo(0, -arm); ctx.lineTo(0, arm);
    ctx.stroke();

    // Crisp inner gold pin inside the +
    ctx.strokeStyle = rgba(0, 0.9);
    ctx.lineWidth = u * 1.8;
    ctx.beginPath();
    ctx.moveTo(-arm * 0.65, 0); ctx.lineTo(arm * 0.65, 0);
    ctx.moveTo(0, -arm * 0.65); ctx.lineTo(0, arm * 0.65);
    ctx.stroke();
    ctx.restore();

    ctx.restore();

    // 5. BESPOKE PROCEDURAL VECTOR TYPOGRAPHY: "FOLLOW" & "FOR MORE"
    if (BG === 'black') ctx.globalCompositeOperation = 'lighter';

    const textLeftX = badgeX + badgeR * 1.48;

    // Top Headline: "FOLLOW" (Bold Geometric Inline Vector Font)
    const followCapH = S * 0.056;
    const followTrack = S * 0.012;
    drawVectorString('FOLLOW', textLeftX, -pillH * 0.14, followCapH, followTrack, {
      strokeW: u * 6.4,
      colorIdx: 0,
      glowColorIdx: 2,
      wavePhase: p2,
      waveAmp: u * 2.6,
      inlineAccent: true,
      alpha: 0.98
    });

    // Bottom Sub-Headline: "FOR MORE" (Slanted Editorial Vector Font in Gold)
    const subCapH = S * 0.025;
    const subTrack = S * 0.0085;
    const subY = pillH * 0.25;
    const subWidth = measureVectorText('FOR MORE', subCapH, subTrack);

    drawVectorString('FOR MORE', textLeftX + u * 2, subY, subCapH, subTrack, {
      strokeW: u * 3.0,
      colorIdx: 3,
      glowColorIdx: 2,
      slant: 0.18,
      wavePhase: p2 - 0.6,
      waveAmp: u * 1.2,
      inlineAccent: false,
      alpha: 0.95
    });

    // 6. Dynamic Expanding Vector Arrow & Telemetry chevrons next to "FOR MORE"
    const arrowStartX = textLeftX + subWidth + S * 0.024;
    const arrowMaxEndX = pillW * 0.5 - pillR * 0.62;
    const arrowEndX = arrowStartX + (arrowMaxEndX - arrowStartX) * (0.72 + 0.28 * Math.sin(p2));

    // Glowing arrow shaft
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      ctx.moveTo(arrowStartX, subY);
      ctx.lineTo(arrowEndX, subY);
      ctx.strokeStyle = rgba(pass === 0 ? 2 : 0, pass === 0 ? 0.35 : 0.95);
      ctx.lineWidth = pass === 0 ? u * 6.5 : u * 2.4;
      ctx.stroke();
    }

    // Double Precision Chevron Head (>>)
    for (let c = 0; c < 2; c++) {
      const cxHead = arrowEndX - c * (u * 10);
      const chSize = u * 7.5;
      ctx.beginPath();
      ctx.moveTo(cxHead - chSize, subY - chSize * 0.85);
      ctx.lineTo(cxHead, subY);
      ctx.lineTo(cxHead - chSize, subY + chSize * 0.85);
      ctx.strokeStyle = rgba(c === 0 ? 0 : 2, c === 0 ? 0.98 : 0.72);
      ctx.lineWidth = u * 2.4;
      ctx.stroke();
    }

    // Traveling light pulse riding along the arrow shaft
    const pulsePos = arrowStartX + (arrowEndX - arrowStartX) * (((phase * 3) % 1 + 1) % 1);
    drawRadialGlow(pulsePos, subY, u * 9, 0, 0.85);

    ctx.restore();
  }

  window.renderFrame = renderFrame;
  window.renderAtTime = renderFrame;

  let startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    renderFrame((now - startTime) * 0.001);
    requestAnimationFrame(loop);
  }

  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
