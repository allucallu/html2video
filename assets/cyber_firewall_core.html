<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Firewall Gate & Encryption Core - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-light: #1E293B;
      --blue: #1D4ED8;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --cyan: #06B6D4;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --amber: #F59E0B;
      --coral: #F43F5E;
      --coral-soft: #FFF1F2;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Putaran Cincin Mekanisme Kunci Pusat (6s) */
    .tumbler-outer {
      transform-origin: 990px 540px;
      animation: rotateCW 6s linear infinite;
    }
    .tumbler-inner {
      transform-origin: 990px 540px;
      animation: rotateCCW 6s linear infinite;
    }
    @keyframes rotateCW { to { transform: rotate(360deg); } }
    @keyframes rotateCCW { to { transform: rotate(-360deg); } }

    /* 2. Dinding Laser Firewall Berdenyut (2s) */
    .firewall-beam {
      animation: beamPulse 2s ease-in-out infinite;
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.75; stroke-width: 6; }
      50% { opacity: 1; stroke-width: 9; }
    }

    /* 3. Paket Malware Merah Menabrak Dinding Laser (3s) */
    .malware-cube {
      animation: hitFirewall 3s cubic-bezier(0.55, 0, 0.45, 1) infinite;
    }
    @keyframes hitFirewall {
      0% {
        transform: translate(0px, 0px) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      18% {
        transform: translate(75px, 0px) rotate(45deg) scale(1);
        opacity: 1;
      }
      45% {
        transform: translate(235px, 0px) rotate(135deg) scale(1);
        opacity: 1;
      }
      55% {
        transform: translate(205px, -18px) rotate(160deg) scale(1.25);
        opacity: 0.9;
      }
      72%, 100% {
        transform: translate(185px, -30px) rotate(190deg) scale(0.1);
        opacity: 0;
      }
    }

    /* 4. Percikan Defleksi di Dinding Laser (3s) */
    .deflect-spark {
      transform-origin: 650px 420px;
      animation: sparkBurst 3s ease-out infinite;
    }
    @keyframes sparkBurst {
      0%, 42% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      80%, 100% { transform: scale(1.65); opacity: 0; }
    }

    /* 5. Paket Data Sah (Biru) Menembus Firewall ke Inti Enkripsi (3s) */
    .auth-data {
      animation: passGate 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes passGate {
      0%, 8% {
        transform: translate(0px, 0px) scale(0.7);
        opacity: 0;
      }
      22% {
        transform: translate(90px, 0px) scale(1);
        opacity: 1;
      }
      55% {
        transform: translate(485px, -120px) scale(0.85);
        opacity: 1;
      }
      64%, 100% {
        transform: translate(540px, -120px) scale(0.2);
        opacity: 0;
      }
    }

    /* 6. Denah Inti Enkripsi Saat Token Diproses (3s) */
    .core-chamber {
      transform-origin: 990px 540px;
      animation: coreActivate 3s ease-in-out infinite;
    }
    @keyframes coreActivate {
      0%, 50%, 92%, 100% { transform: scale(1); }
      60%, 78% { transform: scale(1.09); }
    }

    /* 7. Kunci Terenkripsi Hijau Meluncur ke Cloud Kanan (3s) */
    .encrypted-key-flow {
      animation: sendKey 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes sendKey {
      0%, 54% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      64% {
        transform: translate(80px, 0px) scale(1);
        opacity: 1;
      }
      90% {
        transform: translate(325px, 0px) scale(1);
        opacity: 1;
      }
      98%, 100% {
        transform: translate(365px, 0px) scale(0.5);
        opacity: 0;
      }
    }

    /* 8. Aliran Garis Jalur Data (2s) */
    .trace-line {
      stroke-dasharray: 10 12;
      animation: moveTrace 2s linear infinite;
    }
    @keyframes moveTrace {
      from { stroke-dashoffset: 44; }
      to { stroke-dashoffset: 0; }
    }

    /* 9. Gerakan Melayang Halus Modul Kiri & Kanan (6s) */
    .float-slow-up { animation: bobUp 6s ease-in-out infinite; }
    .float-slow-down { animation: bobDown 6s ease-in-out infinite; }

    @keyframes bobUp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes bobDown {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(0px); }
    }

    /* 10. Bar Indikator Keamanan Cloud (3s) */
    .cloud-status-bar {
      animation: statusGreen 3s ease-in-out infinite;
    }
    @keyframes statusGreen {
      0%, 55%, 95%, 100% { fill: var(--slate-light); }
      65%, 88% { fill: var(--emerald); }
    }
  </style>
</head>
<body>

  <div class="canvas">

      <line x1="1180" y1="540" x2="1465" y2="540" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round"/>

          <rect x="26" y="88" width="148" height="16" rx="8" fill="var(--blue-soft)"/>

      <g>

        <rect x="650" y="305" width="44" height="470" fill="url(#firewallField)"/>

        <rect x="632" y="285" width="36" height="24" rx="8" fill="var(--navy)"/>

        <!-- Garis Sinar Laser Utama -->
        <line class="firewall-beam" x1="650" y1="313" x2="650" y2="767" stroke="var(--blue-bright)" stroke-width="7" stroke-linecap="round"/>
        <line x1="650" y1="313" x2="650" y2="767" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

          <line x1="9" y1="0" x2="9" y2="5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

      <!-- =====================================================

      <g>
        <!-- Bayangan Lingkaran Brankas -->
        <circle cx="1002" cy="552" r="195" fill="#DBEAFE"/>
        
        <!-- Cincin Mekanis Luar (Berputar Searah Jarum Jam) -->
        <g class="tumbler-outer">
          <circle cx="990" cy="540" r="195" fill="#FFFFFF" stroke="var(--navy)" stroke-width="7"/>

          <rect x="982" y="345" width="16" height="22" rx="4" fill="var(--navy)"/>

          <rect x="795" y="532" width="22" height="16" rx="4" fill="var(--navy)"/>
          <rect x="1163" y="532" width="22" height="16" rx="4" fill="var(--navy)"/>

        <!-- Cincin Dalam (Berputar Berlawanan Arah Jarum Jam) -->
        <g class="tumbler-inner">
          <circle cx="990" cy="540" r="138" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="4"/>
          <circle cx="990" cy="540" r="118" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-dasharray="14 14"/>

      <!-- =====================================================

      ====================================================== -->

        <g class="float-slow-up">

          <!-- 2 Blok Database Terkunci -->
          <g transform="translate(28, 206)">
