<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Logistics & Route Tracking - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --blue: #1D4ED8;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --cyan: #0EA5E9;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --amber: #F59E0B;
      --coral: #F43F5E;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Garis Rute Aktif Tergambar Otomatis (Siklus 3s = 2x per loop) */
    .route-progress {
      stroke-dasharray: 1120;
      stroke-dashoffset: 1120;
      animation: drawRoute 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes drawRoute {
      0%, 8% {
        stroke-dashoffset: 1120;
        opacity: 1;
      }
      72%, 88% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      96%, 100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    /* 2. Pesawat Kargo Mengikuti Kurva Rute Secara Otomatis (Siklus 3s) */
    .cargo-plane {
      offset-path: path("M 490 660 C 680 310, 1240 310, 1430 660");
      offset-rotate: auto;
      animation: flyRoute 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes flyRoute {
      0% {
        offset-distance: 0%;
        transform: scale(0.4);
        opacity: 0;
      }
      12% {
        offset-distance: 4%;
        transform: scale(1);
        opacity: 1;
      }
      70% {
        offset-distance: 98%;
        transform: scale(1);
        opacity: 1;
      }
      82%, 100% {
        offset-distance: 100%;
        transform: scale(0.4);
        opacity: 0;
      }
    }

    /* 3. Gelombang Radar Pin Asal & Tujuan (Siklus 3s) */
    .ping-origin {
      transform-origin: 490px 660px;
      animation: radarPing 3s ease-out infinite;
    }
    .ping-dest {
      transform-origin: 1430px 660px;
      animation: radarPingDest 3s ease-out infinite;
    }
    @keyframes radarPing {
      0% { transform: scale(0.4); opacity: 0.95; }
      45%, 100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes radarPingDest {
      0%, 64% { transform: scale(0.4); opacity: 0; }
      72% { transform: scale(0.7); opacity: 0.95; }
      100% { transform: scale(2.3); opacity: 0; }
    }

    /* 4. Pin Tujuan Membal Saat Paket Tiba (Siklus 3s) */
    .dest-pin-bounce {
      transform-origin: 1430px 660px;
      animation: pinBounce 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes pinBounce {
      0%, 66%, 94%, 100% { transform: scale(1) translateY(0px); }
      76% { transform: scale(1.16) translateY(-12px); }
      86% { transform: scale(1.05) translateY(-4px); }
    }

    /* 5. Checkpoint Timeline di Kartu Kanan Menyala Berurutan (Siklus 3s) */
    .cp-node-1 { animation: cpActive 3s ease-in-out infinite 0.1s; }
    .cp-node-2 { animation: cpActive 3s ease-in-out infinite 0.5s; }
    .cp-node-3 { animation: cpActive 3s ease-in-out infinite 0.9s; }
    .cp-node-4 { animation: cpActiveGreen 3s ease-in-out infinite 1.4s; }

    @keyframes cpActive {
      0%, 15%, 92%, 100% { fill: var(--slate-light); }
      25%, 85% { fill: var(--blue-bright); }
    }
    @keyframes cpActiveGreen {
      0%, 45%, 92%, 100% { fill: var(--slate-light); }
      55%, 88% { fill: var(--emerald); }
    }

    /* 6. Status Badge Delivered di Kartu Kanan (Siklus 3s) */
    .delivered-pill {
      animation: badgeArrive 3s ease-in-out infinite;
    }
    @keyframes badgeArrive {
      0%, 65%, 94%, 100% { fill: var(--slate-light); }
      74%, 90% { fill: var(--emerald); }
    }

    /* 7. Kartu Telemetri Kiri & Kanan Melayang Halus (6s) */
    .card-float-a { animation: floatA 6s ease-in-out infinite; }
    .card-float-b { animation: floatB 6s ease-in-out infinite; }

    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(0px); }
    }

    /* 8. Orbit Satelit Navigasi Tipis (6s) */
    .globe-ring-spin {
      transform-origin: 960px 540px;
      animation: spinSlow 6s linear infinite;
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath Lingkaran Globe Pusat -->
        <clipPath id="globeClip">
          <circle cx="960" cy="540" r="390"/>
        </clipPath>

        <!-- Gradien Rute Pengiriman (Biru ke Hijau Zamrud) -->
        <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="55%" stop-color="#0EA5E9"/>
          <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
      </defs>

      <!-- =====================================================
           1. GLOBE KOORDINAT ABSTRAK (LATAR PUSAT)
      ====================================================== -->
      <!-- Lingkaran Orbit Luar Putus-Putus -->
      <g class="globe-ring-spin">
        <circle cx="960" cy="540" r="445" fill="none" stroke="var(--blue-border)" stroke-width="2.5" stroke-dasharray="12 16"/>
        <circle cx="960" cy="95" r="7" fill="var(--blue-bright)"/>
        <circle cx="960" cy="985" r="7" fill="var(--emerald)"/>
      </g>

      <!-- Lingkaran Dasar Globe -->
      <circle cx="960" cy="540" r="390" fill="var(--blue-soft)"/>

      <!-- Elemen Daratan & Garis Lintang/Bujur di Dalam Globe -->
      <g clip-path="url(#globeClip)">
        <!-- Bentuk Daratan Geometris Abstrak -->
        <path d="M580 340 Q670 310 730 370 T840 430 Q860 510 780 560 T670 670 Q590 640 570 540 Z" fill="#DBEAFE"/>
        <path d="M1070 290 Q1180 270 1260 350 T1350 480 Q1320 590 1220 620 T1110 710 Q1040 650 1050 520 T1070 290 Z" fill="#DBEAFE"/>
        <path d="M870 660 Q960 630 1030 690 T1060 820 Q950 860 860 790 Z" fill="#DBEAFE"/>

        <!-- Garis Meridian & Paralel Minimalis -->
        <ellipse cx="960" cy="540" rx="195" ry="390" fill="none" stroke="#BFDBFE" stroke-width="2"/>
        <line x1="960" y1="150" x2="960" y2="930" stroke="#BFDBFE" stroke-width="2"/>
        <line x1="570" y1="540" x2="1350" y2="540" stroke="#BFDBFE" stroke-width="2"/>
        <path d="M610 380 Q960 440 1310 380" fill="none" stroke="#BFDBFE" stroke-width="2"/>
        <path d="M610 700 Q960 640 1310 700" fill="none" stroke="#BFDBFE" stroke-width="2"/>
      </g>

      <!-- Garis Tepi Globe -->
      <circle cx="960" cy="540" r="390" fill="none" stroke="var(--blue-border)" stroke-width="3"/>

      <!-- =====================================================
           2. JALUR RUTE PENGIRIMAN & PESAWAT KARGO
      ====================================================== -->
      <!-- Jalur Dasar Putus-Putus -->
      <path d="M 490 660 C 680 310, 1240 310, 1430 660" fill="none" stroke="#CBD5E1" stroke-width="5" stroke-dasharray="10 12" stroke-linecap="round"/>

      <!-- Jalur Progres Aktif (Tergambar Mengikuti Pesawat) -->
      <path class="route-progress" d="M 490 660 C 680 310, 1240 310, 1430 660" fill="none" stroke="url(#routeGrad)" stroke-width="6" stroke-linecap="round"/>

      <!-- Gelombang Radar Pin Asal & Pin Tujuan -->
      <circle class="ping-origin" cx="490" cy="660" r="24" fill="none" stroke="var(--blue-bright)" stroke-width="4"/>
      <circle class="ping-dest" cx="1430" cy="660" r="24" fill="none" stroke="var(--emerald)" stroke-width="4"/>

      <!-- PIN ASAL (Kiri - Biru Kobalt) -->
      <g transform="translate(490, 660)">
        <ellipse cx="0" cy="4" rx="18" ry="7" fill="#93C5FD"/>
        <path d="M0 0 C-22 -26 -30 -42 -30 -56 A30 30 0 1 1 30 -56 C30 -42 22 -26 0 0 Z" fill="var(--blue)" stroke="var(--navy)" stroke-width="4.5" stroke-linejoin="round"/>
        <circle cx="0" cy="-56" r="11" fill="#FFFFFF"/>
      </g>

      <!-- PIN TUJUAN (Kanan - Hijau Zamrud) -->
      <g class="dest-pin-bounce">
        <g transform="translate(1430, 660)">
          <ellipse cx="0" cy="4" rx="18" ry="7" fill="#A7F3D0"/>
          <path d="M0 0 C-22 -26 -30 -42 -30 -56 A30 30 0 1 1 30 -56 C30 -42 22 -26 0 0 Z" fill="var(--emerald)" stroke="var(--navy)" stroke-width="4.5" stroke-linejoin="round"/>
          <!-- Centang Putih di Dalam Pin Tujuan -->
          <path d="M-9 -56 L-3 -50 L10 -63" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- PESAWAT KARGO GEOMETRIS (Hidung Menghadap Kanan +x) -->
      <g class="cargo-plane">
        <!-- Badge Lingkaran Pesawat -->
        <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>
        <!-- Siluet Pesawat Aerodinamis Menghadap Kanan (+x) -->
        <path d="M 17 0 C 17 -2.5 13 -3.5 9 -3.5 L 1 -3.5 L -5 -15 L -9 -15 L -5 -3.5 L -12 -3.5 L -16 -8 L -19 -8 L -17 0 L -19 8 L -16 8 L -12 3.5 L -5 3.5 L -9 15 L -5 15 L 1 3.5 L 9 3.5 C 13 3.5 17 2.5 17 0 Z" fill="var(--blue)"/>
      </g>

      <!-- =====================================================
           3. KARTU ORIGIN DISPATCH & PAKET ISOMETRIK (KIRI ATAS)
      ====================================================== -->
      <g transform="translate(215, 225)">
        <g class="card-float-a">
          <!-- Bayangan Kartu -->
          <rect x="12" y="14" width="290" height="205" rx="26" fill="#DBEAFE"/>
          <!-- Bodi Kartu -->
          <rect x="0" y="0" width="290" height="205" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Ikon Kotak Paket Kubus Geometris -->
          <g transform="translate(32, 30)">
            <rect x="0" y="0" width="76" height="76" rx="18" fill="#FEF3C7"/>
            <!-- Kubus Paket -->
            <polygon points="38,14 62,27 38,40 14,27" fill="#FBBF24" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="14,27 38,40 38,64 14,51" fill="#F59E0B" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="62,27 38,40 38,64 62,51" fill="#D97706" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
            <!-- Pita Segel Paket -->
            <line x1="26" y1="20.5" x2="50" y2="33.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
          </g>

          <!-- Bar Info Pengiriman -->
          <rect x="124" y="42" width="130" height="14" rx="7" fill="var(--navy)"/>
          <rect x="124" y="66" width="84" height="11" rx="5.5" fill="var(--slate)"/>
          <rect x="124" y="86" width="56" height="18" rx="9" fill="var(--blue-soft)"/>

          <!-- Garis Pemisah -->
          <line x1="32" y1="128" x2="258" y2="128" stroke="var(--slate-light)" stroke-width="3"/>

          <!-- Indikator Status Transit -->
          <circle cx="44" cy="162" r="10" fill="var(--blue)"/>
          <rect x="66" y="156" width="110" height="12" rx="6" fill="var(--navy)"/>
          <rect x="194" y="152" width="64" height="20" rx="10" fill="var(--blue-soft)"/>
        </g>
      </g>

      <!-- =====================================================
           4. KARTU LIVE TRACKING & CHECKPOINT (KANAN ATAS)
      ====================================================== -->
      <g transform="translate(1415, 225)">
        <g class="card-float-b">
          <!-- Bayangan Kartu -->
          <rect x="12" y="14" width="290" height="205" rx="26" fill="#DCFCE7"/>
          <!-- Bodi Kartu -->
          <rect x="0" y="0" width="290" height="205" rx="26" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Header Status Tracking -->
          <circle cx="56" cy="54" r="24" fill="var(--emerald-soft)"/>
          <path d="M46 54 L53 61 L67 47" fill="none" stroke="var(--emerald)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

          <rect x="94" y="40" width="115" height="13" rx="6.5" fill="var(--navy)"/>
          <rect class="delivered-pill" x="94" y="62" width="76" height="16" rx="8" fill="var(--slate-light)"/>

          <!-- Garis Timeline 4 Checkpoint -->
          <line x1="48" y1="124" x2="242" y2="124" stroke="var(--slate-light)" stroke-width="4" stroke-linecap="round"/>
          <circle class="cp-node-1" cx="48" cy="124" r="11" fill="var(--slate-light)" stroke="#FFFFFF" stroke-width="3"/>
          <circle class="cp-node-2" cx="112" cy="124" r="11" fill="var(--slate-light)" stroke="#FFFFFF" stroke-width="3"/>
          <circle class="cp-node-3" cx="176" cy="124" r="11" fill="var(--slate-light)" stroke="#FFFFFF" stroke-width="3"/>
          <circle class="cp-node-4" cx="242" cy="124" r="13" fill="var(--slate-light)" stroke="#FFFFFF" stroke-width="3"/>

          <!-- Bar Ringkasan Bawah -->
          <rect x="34" y="158" width="130" height="12" rx="6" fill="var(--slate-light)"/>
          <rect x="184" y="155" width="72" height="18" rx="9" fill="var(--emerald-soft)"/>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="350" cy="765" r="11" fill="var(--amber)"/>
      <circle cx="1585" cy="765" r="11" fill="var(--emerald)"/>
      <rect x="952" y="210" width="16" height="16" rx="4" transform="rotate(45 960 218)" fill="var(--cyan)"/>
    </svg>
  </div>

</body>
</html>
