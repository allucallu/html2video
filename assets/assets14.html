<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Rectangle Frame Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(748291);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom spline interpolation through hand-drawn waypoints with marker width variation (14-22px)
function buildRoughSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn organic edge tooth along the stroke
    const roughX = Math.sin(u * 48 + seedPhase) * 3.0 + Math.cos(u * 23 - seedPhase) * 2.0;
    const roughY = Math.cos(u * 44 + seedPhase) * 3.0 + Math.sin(u * 29 + seedPhase) * 2.0;

    // Marker pressure variation (14-22px)
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * 4.2 + seedPhase);
    let taper = 1.0;
    if (u < 0.03) taper = 0.68 + 0.32 * (u / 0.03);
    else if (u > 0.96) taper = 0.65 + 0.35 * ((1 - u) / 0.04);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + roughX,
      y: y + roughY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// ============================================================================
// 1. PRIMARY HERO WHITE RECTANGLE FRAME WITH UNEVEN ROUGH CORNERS
// Centered around (CX, CY), width ~1480 (-740..+740), height ~860 (-430..+430)
// Safe margins: >600px top/bottom, >1100px left/right
// ============================================================================
const mainRectWaypoints = [
  // Starts with an uneven rough overhang tail outside the Top-Left corner
  { x: -815, y: -412 },
  { x: -725, y: -428 },
  // Top edge (slightly wavy hand-drawn horizontal bar)
  { x: -380, y: -442 },
  { x: 15,   y: -425 },
  { x: 410,  y: -438 },
  { x: 745,  y: -422 },
  // Top-Right Uneven Rough Corner (overshoots right, cuts back with a jagged notch, then drops down)
  { x: 795,  y: -426 },
  { x: 728,  y: -385 },
  { x: 742,  y: -345 },
  // Right edge
  { x: 752,  y: -95 },
  { x: 735,  y: 165 },
  { x: 748,  y: 425 },
  // Bottom-Right Uneven Rough Corner (overshoots down, loops into a stepped crooked corner)
  { x: 755,  y: 478 },
  { x: 705,  y: 418 },
  { x: 665,  y: 438 },
  // Bottom edge
  { x: 325,  y: 448 },
  { x: -85,  y: 428 },
  { x: -465, y: 442 },
  { x: -735, y: 425 },
  // Bottom-Left Uneven Rough Corner (chiseled double-bend with outward spur)
  { x: -792, y: 432 },
  { x: -755, y: 375 },
  { x: -728, y: 345 },
  // Left edge heading up through Top-Left intersection
  { x: -745, y: 95 },
  { x: -728, y: -155 },
  { x: -742, y: -435 },
  // Top-Left vertical overshoot tail + rough return hook along top-left edge
  { x: -748, y: -498 },
  { x: -698, y: -412 },
  { x: -535, y: -405 }
];
const MAIN_WHITE_RECT = buildRoughSpline(mainRectWaypoints, 320, 16, 22, 0, 0.4);

// 2. SECONDARY SKETCHED WHITE DOUBLE-LINE FRAME (Rough loose second pass around the rectangle)
const sketchRectWaypoints = [
  { x: -712, y: -398 },
  { x: -245, y: -408 },
  { x: 265,  y: -402 },
  { x: 715,  y: -395 },
  { x: 768,  y: -362 }, // Uneven crooked top-right turn
  { x: 718,  y: -15 },
  { x: 712,  y: 402 },
  { x: 678,  y: 462 },  // Uneven crooked bottom-right turn
  { x: 185,  y: 408 },
  { x: -315, y: 412 },
  { x: -708, y: 398 },
  { x: -762, y: 365 },  // Uneven crooked bottom-left turn
  { x: -705, y: -35 },
  { x: -715, y: -405 },
  { x: -665, y: -458 }  // Uneven crooked top-left turn
];
const SKETCH_WHITE_RECT = buildRoughSpline(sketchRectWaypoints, 240, 14, 19, 170, 2.1);

// 3. SECONDARY WARM YELLOW (#FFD93D) OFFSET ROUGH RECTANGLE FRAME (Overlapping delayed follow-through)
const yellowRectWaypoints = [
  { x: -765, y: -452 },
  { x: -295, y: -465 },
  { x: 245,  y: -458 },
  { x: 768,  y: -448 },
  { x: 812,  y: -395 }, // Rough chamfered top-right corner
  { x: 775,  y: 25 },
  { x: 772,  y: 452 },
  { x: 715,  y: 492 },  // Rough chamfered bottom-right corner
  { x: 215,  y: 468 },
  { x: -295, y: 462 },
  { x: -762, y: 455 },
  { x: -808, y: 398 },  // Rough chamfered bottom-left corner
  { x: -768, y: -15 },
  { x: -762, y: -458 }
];
const YELLOW_ACCENT_RECT = buildRoughSpline(yellowRectWaypoints, 250, 15, 20, 310, 3.8);

// ============================================================================
// 4. ROUGH CORNER CROSS-HATCH BRACKETS & UNEVEN CORNER OVERHANG TICKS
// Emphasizes the uneven, hand-drawn rough corners of the rectangle frame
// ============================================================================
const CORNER_ACCENTS = [
  // Top-Left rough inner L-bracket & outer corner slash
  {
    pts: buildRoughSpline([
      { x: -675, y: -275 }, { x: -682, y: -368 }, { x: -565, y: -362 }
    ], 36, 15, 20, 410, 0.6),
    color: COLOR_YELLOW,
    phaseOff: 0.46
  },
  {
    pts: buildRoughSpline([
      { x: -835, y: -465 }, { x: -795, y: -505 }, { x: -745, y: -545 }
    ], 24, 15, 20, 420, 1.2),
    color: COLOR_WHITE,
    phaseOff: 0.49
  },
  // Top-Right rough inner L-bracket & outer corner ticks
  {
    pts: buildRoughSpline([
      { x: 565, y: -365 }, { x: 682, y: -372 }, { x: 675, y: -268 }
    ], 36, 15, 20, 430, 1.9),
    color: COLOR_YELLOW,
    phaseOff: 0.48
  },
  {
    pts: buildRoughSpline([
      { x: 765, y: -525 }, { x: 815, y: -485 }, { x: 855, y: -435 }
    ], 24, 15, 20, 440, 2.5),
    color: COLOR_YELLOW,
    phaseOff: 0.51
  },
  // Bottom-Right rough inner L-bracket & outer corner slash
  {
    pts: buildRoughSpline([
      { x: 678, y: 268 }, { x: 685, y: 368 }, { x: 568, y: 362 }
    ], 36, 15, 20, 450, 3.1),
    color: COLOR_YELLOW,
    phaseOff: 0.50
  },
  {
    pts: buildRoughSpline([
      { x: 845, y: 445 }, { x: 802, y: 495 }, { x: 752, y: 538 }
    ], 24, 15, 20, 460, 3.7),
    color: COLOR_WHITE,
    phaseOff: 0.53
  },
  // Bottom-Left rough inner L-bracket & outer corner slash
  {
    pts: buildRoughSpline([
      { x: -568, y: 362 }, { x: -682, y: 368 }, { x: -675, y: 268 }
    ], 36, 15, 20, 470, 4.3),
    color: COLOR_YELLOW,
    phaseOff: 0.52
  },
  {
    pts: buildRoughSpline([
      { x: -755, y: 535 }, { x: -805, y: 492 }, { x: -848, y: 442 }
    ], 24, 15, 20, 480, 4.9),
    color: COLOR_YELLOW,
    phaseOff: 0.55
  }
];

// Progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.36]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.36, 0.64]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.64, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.36) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.36) };
  } else if (c < 0.64) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.64) / 0.32), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker stroke between [uStart, uEnd] with discrete 12fps line boil & corner shear flex
function renderFrameStroke(pts, uStart, uEnd, color, boilStep, phase, flexAmp) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  // Periodic shear & corner-breathing harmonics (integer cycles per 10s loop)
  const shearX = Math.sin(TAU * phase * 2) * flexAmp;
  const shearY = Math.cos(TAU * phase * 2) * flexAmp;

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Subtle organic corner-flex distortion so the 4 corners breathe independently
    const normX = p.x / 750;
    const normY = p.y / 440;
    const fx = normY * shearX + normX * normY * 8 * Math.sin(TAU * phase * 4);
    const fy = normX * shearY - normX * normY * 8 * Math.cos(TAU * phase * 4);

    return {
      x: p.x + bx + fx,
      y: p.y + by + fy,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Whole-frame squash & stretch, gentle bounce, and rocking tilt wobble (integer harmonics k = 1, 2, 4)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const scaleX = 1.0 + 0.020 * sin2 - 0.008 * sin4;
  const scaleY = 1.0 - 0.020 * sin2 + 0.008 * sin4;
  const wobbleRot = 0.024 * sin1 + 0.014 * cos2;
  const shiftX = 10 * cos1;
  const shiftY = 14 * sin2;

  ctx.save();
  ctx.translate(CX + shiftX, CY + shiftY);
  ctx.rotate(wobbleRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 the Hero White Rectangle Frame + its corner accents
  // are in their FULL held state, while the Secondary Sketch Pass and Yellow Accent Frame overlap:
  const baseCycle = phase * 2;

  const winMainWhite   = getDrawEraseWindow(baseCycle + 0.50);
  const winSketchWhite = getDrawEraseWindow(baseCycle + 0.04);
  const winYellowRect  = getDrawEraseWindow(baseCycle + 0.24);

  // 1. Secondary Motion Layer: Sketchy Loose White Second-Pass Rectangle
  renderFrameStroke(
    SKETCH_WHITE_RECT,
    winSketchWhite.uStart,
    winSketchWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    12
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Offset Rough Rectangle Frame
  renderFrameStroke(
    YELLOW_ACCENT_RECT,
    winYellowRect.uStart,
    winYellowRect.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    14
  );

  // 3. Primary Motion Layer: Hero Bold White Marker Rectangle Frame with Uneven Rough Corners
  renderFrameStroke(
    MAIN_WHITE_RECT,
    winMainWhite.uStart,
    winMainWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    10
  );

  // 4. Ambient & Corner Detail Layer: Inner Rough Corner L-Brackets & Outer Corner Overhang Ticks
  for (let i = 0; i < CORNER_ACCENTS.length; i++) {
    const acc = CORNER_ACCENTS[i];
    const winAcc = getDrawEraseWindow(baseCycle + acc.phaseOff);
    renderFrameStroke(
      acc.pts,
      winAcc.uStart,
      winAcc.uEnd,
      acc.color,
      boilStep,
      phase,
      8
    );
  }

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
