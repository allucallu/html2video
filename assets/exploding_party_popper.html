<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism New Year 01: Exploding Party Popper (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Gerakan Recoil & Sentakan Tabung Terompet (Siklus 3s = 2x per loop) */
    .popper-recoil {
      animation: recoilSnap 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes recoilSnap {
      0%, 100% {
        transform: translate(0px, 0px) scale(1, 1) rotate(0deg);
      }
      16% {
        /* Tarik mundur & memampat sebelum meledak */
        transform: translate(-24px, 24px) scale(0.91, 1.07) rotate(-4deg);
      }
      26% {
        /* Sentak maju saat menembakkan konfeti */
        transform: translate(18px, -18px) scale(1.08, 0.93) rotate(3deg);
      }
      38% {
        transform: translate(-4px, 4px) scale(0.98, 1.02) rotate(-1deg);
      }
      50%, 92% {
        transform: translate(0px, 0px) scale(1, 1) rotate(0deg);
      }
    }

    /* 2. Garis Ledakan Komik di Mulut Tabung (Siklus 3s) */
    .muzzle-burst {
      animation: popMuzzle 3s ease-out infinite;
    }
    @keyframes popMuzzle {
      0%, 20% { transform: scale(0.2); opacity: 0; }
      27% { transform: scale(1.05); opacity: 1; }
      46%, 100% { transform: scale(1.42); opacity: 0; }
    }

    /* 3. Konfeti 1: Bintang Kuning Neon (Atas Tengah) */
    .conf-1 {
      animation: shootConf1 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootConf1 {
      0%, 21% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      25% { opacity: 1; }
      52% { transform: translate(75px, -285px) scale(1.08) rotate(140deg); opacity: 1; }
      82% { transform: translate(92px, -230px) scale(1) rotate(220deg); opacity: 1; }
      95%, 100% { transform: translate(100px, -195px) scale(0) rotate(260deg); opacity: 0; }
    }

    /* 4. Konfeti 2: Segitiga Cyber Cyan (Kanan Atas) */
    .conf-2 {
      animation: shootConf2 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootConf2 {
      0%, 22% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      26% { opacity: 1; }
      54% { transform: translate(235px, -225px) scale(1.05) rotate(-160deg); opacity: 1; }
      84% { transform: translate(265px, -165px) scale(1) rotate(-240deg); opacity: 1; }
      96%, 100% { transform: translate(280px, -130px) scale(0) rotate(-290deg); opacity: 0; }
    }

    /* 5. Konfeti 3: Bintang Acid Lime (Kanan Jauh) */
    .conf-3 {
      animation: shootConf3 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootConf3 {
      0%, 21% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      25% { opacity: 1; }
      52% { transform: translate(310px, -75px) scale(1.1) rotate(190deg); opacity: 1; }
      83% { transform: translate(335px, -15px) scale(1) rotate(280deg); opacity: 1; }
      95%, 100% { transform: translate(348px, 25px) scale(0) rotate(330deg); opacity: 0; }
    }

    /* 6. Konfeti 4: Lingkaran Hot Pink (Kiri Atas) */
    .conf-4 {
      animation: shootConf4 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootConf4 {
      0%, 23% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      27% { opacity: 1; }
      55% { transform: translate(-45px, -255px) scale(1.08); opacity: 1; }
      84% { transform: translate(-55px, -200px) scale(1); opacity: 1; }
      96%, 100% { transform: translate(-62px, -165px) scale(0); opacity: 0; }
    }

    /* 7. Konfeti 5: Kotak Miring Electric Purple (Kanan Bawah) */
    .conf-5 {
      animation: shootConf5 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootConf5 {
      0%, 22% { transform: translate(0px, 0px) scale(0) rotate(0deg); opacity: 0; }
      26% { opacity: 1; }
      54% { transform: translate(250px, 55px) scale(1.05) rotate(135deg); opacity: 1; }
      83% { transform: translate(272px, 115px) scale(1) rotate(210deg); opacity: 1; }
      95%, 100% { transform: translate(285px, 150px) scale(0) rotate(250deg); opacity: 0; }
    }

    /* 8. Pita Zig-Zag 1 (Hot Pink) */
    .ribbon-1 {
      animation: shootRibbon1 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootRibbon1 {
      0%, 21% { transform: translate(0px, 0px) scale(0) rotate(-20deg); opacity: 0; }
      26% { opacity: 1; }
      54% { transform: translate(155px, -185px) scale(1) rotate(25deg); opacity: 1; }
      84% { transform: translate(175px, -125px) scale(1) rotate(55deg); opacity: 1; }
      96%, 100% { transform: translate(185px, -90px) scale(0) rotate(75deg); opacity: 0; }
    }

    /* 9. Pita Zig-Zag 2 (Cyber Cyan) */
    .ribbon-2 {
      animation: shootRibbon2 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes shootRibbon2 {
      0%, 23% { transform: translate(0px, 0px) scale(0) rotate(15deg); opacity: 0; }
      27% { opacity: 1; }
      55% { transform: translate(15px, -165px) scale(1) rotate(-35deg); opacity: 1; }
      85% { transform: translate(5px, -110px) scale(1) rotate(-65deg); opacity: 1; }
      96%, 100% { transform: translate(0px, -75px) scale(0) rotate(-85deg); opacity: 0; }
    }

    /* 10. Bintang Kilau 4 Sudut di Sekitar Area */
    .sparkle-a {
      animation: twinkleA 3s ease-in-out infinite;
    }
    .sparkle-b {
      animation: twinkleB 3s ease-in-out infinite;
    }
    @keyframes twinkleA {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.4) rotate(45deg); }
    }
    @keyframes twinkleB {
      0%, 100% { transform: scale(0.4) rotate(-45deg); }
      50% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- ClipPath untuk Strip Diagonal di Dalam Kerucut -->
        <clipPath id="coneClip">
          <polygon points="-135,145 -35,-125 135,45"/>
        </clipPath>
      </defs>

      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO ITEM: EXPLODING BRUTALIST PARTY POPPER
      ====================================================== -->
      <!-- Bintang Kilau Sudut Kiri Atas -->
      <g transform="translate(680, 310)">
        <g class="sparkle-a">
          <path d="M0 -42 C4 -11 11 -4 42 0 C11 4 4 11 0 42 C-4 11 -11 4 -42 0 C-11 -4 -4 -11 0 -42 Z" fill="var(--white)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Bintang Kilau Sudut Kanan Bawah -->
      <g transform="translate(1275, 765)">
        <g class="sparkle-b">
          <path d="M0 -44 C4 -12 12 -4 44 0 C12 4 4 12 0 44 C-4 12 -12 4 -44 0 C-12 -4 -4 -12 0 -44 Z" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- PUSAT AKSI PARTY POPPER & KONFETI -->
      <g transform="translate(880, 610)">

        <!-- 1. KELOMPOK KONFETI & GARIS LEDAKAN (DARI MULUT TABUNG 50,-40) -->
        <g transform="translate(55, -45)">
          <!-- Garis Ledakan Komik Hitam Tebal -->
          <g class="muzzle-burst" stroke="var(--ink)" stroke-width="9" stroke-linecap="round">
            <line x1="-25" y1="-95" x2="-45" y2="-155"/>
            <line x1="45" y1="-85" x2="85" y2="-145"/>
            <line x1="95" y1="-35" x2="155" y2="-65"/>
            <line x1="105" y1="35" x2="165" y2="55"/>
          </g>

          <!-- Pita Zig-Zag 1 (Hot Pink) -->
          <g class="ribbon-1">
            <polyline points="-18,-32 10,-16 -12,4 16,20 -6,38" fill="none" stroke="var(--ink)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="-18,-32 10,-16 -12,4 16,20 -6,38" fill="none" stroke="var(--hot-pink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Pita Zig-Zag 2 (Cyber Cyan) -->
          <g class="ribbon-2">
            <polyline points="-16,-30 12,-14 -10,6 18,22 -4,40" fill="none" stroke="var(--ink)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="-16,-30 12,-14 -10,6 18,22 -4,40" fill="none" stroke="var(--cyber-cyan)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Konfeti 1: Bintang Kuning Neon -->
          <g class="conf-1">
            <polygon points="6,-36 16,-10 44,-10 22,6 30,34 6,17 -18,34 -10,6 -32,-10 -4,-10" fill="var(--ink)"/>
            <polygon points="0,-42 10,-16 38,-16 16,0 24,28 0,11 -24,28 -16,0 -38,-16 -10,-16" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="6.5" stroke-linejoin="round"/>
          </g>

          <!-- Konfeti 2: Segitiga Cyber Cyan -->
          <g class="conf-2">
            <polygon points="6,-28 38,26 -26,26" fill="var(--ink)"/>
            <polygon points="0,-34 32,20 -32,20" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6.5" stroke-linejoin="round"/>
          </g>

          <!-- Konfeti 3: Bintang Acid Lime -->
          <g class="conf-3">
            <polygon points="6,-34 15,-9 42,-9 21,6 29,32 6,16 -17,32 -9,6 -30,-9 -3,-9" fill="var(--ink)"/>
            <polygon points="0,-40 9,-15 36,-15 15,0 23,26 0,10 -23,26 -15,0 -36,-15 -9,-15" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="6.5" stroke-linejoin="round"/>
          </g>

          <!-- Konfeti 4: Lingkaran Hot Pink -->
          <g class="conf-4">
            <circle cx="6" cy="6" r="24" fill="var(--ink)"/>
            <circle cx="0" cy="0" r="24" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="6.5"/>
            <circle cx="-6" cy="-6" r="6" fill="var(--white)"/>
          </g>

          <!-- Konfeti 5: Kotak Miring Electric Purple -->
          <g class="conf-5">
            <rect x="-16" y="-16" width="44" height="44" rx="8" fill="var(--ink)"/>
            <rect x="-22" y="-22" width="44" height="44" rx="8" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="6.5"/>
          </g>
        </g>

        <!-- 2. BODI KERUCUT PARTY POPPER (RECOIL & SNAP) -->
        <g class="popper-recoil">
          <!-- Hard Offset Shadow Hitam -->
          <g transform="translate(16, 18)">
            <polygon points="-135,145 -35,-125 135,45" fill="var(--ink)" stroke="var(--ink)" stroke-width="11" stroke-linejoin="round"/>
          </g>

          <!-- Kerucut Utama Kuning Neon -->
          <polygon points="-135,145 -35,-125 135,45" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="11" stroke-linejoin="round"/>

          <!-- Strip Dekoratif Diagonal di Dalam Kerucut -->
          <g clip-path="url(#coneClip)">
            <line x1="-130" y1="35" x2="25" y2="190" stroke="var(--hot-pink)" stroke-width="28"/>
            <line x1="-130" y1="35" x2="25" y2="190" stroke="var(--ink)" stroke-width="8"/>

            <line x1="-85" y1="-25" x2="85" y2="145" stroke="var(--cyber-cyan)" stroke-width="28"/>
            <line x1="-85" y1="-25" x2="85" y2="145" stroke="var(--ink)" stroke-width="8"/>

            <line x1="-40" y1="-85" x2="145" y2="100" stroke="var(--acid-lime)" stroke-width="26"/>
            <line x1="-40" y1="-85" x2="145" y2="100" stroke="var(--ink)" stroke-width="8"/>
          </g>

          <!-- Bingkai Luar Kerucut Dipertegas -->
          <polygon points="-135,145 -35,-125 135,45" fill="none" stroke="var(--ink)" stroke-width="11" stroke-linejoin="round"/>

          <!-- Mulut Oval Terompet (Membuka ke Kanan Atas) -->
          <g transform="translate(50, -40) rotate(45)">
            <ellipse cx="0" cy="0" rx="120" ry="30" fill="var(--ink)" stroke="var(--ink)" stroke-width="10"/>
            <ellipse cx="0" cy="4" rx="102" ry="18" fill="var(--electric-purple)"/>
          </g>

          <!-- Tutup Pangkal Kerucut Bulat di Kiri Bawah -->
          <circle cx="-135" cy="145" r="18" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="8"/>
        </g>

      </g>

    </svg>
  </div>

</body>
</html>
