<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn On Notifications — Bespoke Vector Kinetic CTA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    object-fit: contain;
  }
</style>
</head>
<body>
<canvas id="stage" width="3840" height="2160"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // --- CLI & URL PARAMETERS ---
  const P = window.__cliParams || {};
  const BG = P.bg || 'black';
  const SEED = Number(P.seed) || 1;
  const VARIANT = Number(P.variant) || 0;

  const DURATION = 10;
  const FPS = 30;
  const TAU = Math.PI * 2;

  window.DURATION = DURATION;
  window.FPS = FPS;

  // --- PALETTE PRESETS ---
  const PRESET_PALETTES = [
    // Variant 0: Imperial Bell Gold, Champagne & Pure White
    ['#FFFFFF', '#F7EFE0', '#FFBE18', '#FFE57F', '#805300'],
    // Variant 1: Electric Cyan, Ice Blue & White
    ['#FFFFFF', '#E0F7FF', '#00E5FF', '#85F8FF', '#005B78'],
    // Variant 2: Neon Coral-Rose, Gold & White
    ['#FFFFFF', '#FFE2EB', '#FF2A6D', '#FFD000', '#7A0028'],
    // Variant 3: Emerald Mint, Lime & White
    ['#FFFFFF', '#E0FFF0', '#00E68A', '#B8FF66', '#006338'],
    // Variant 4: Solar Amber, Warm Gold & White
    ['#FFFFFF', '#FFEDE0', '#FF6D00', '#FFD180', '#7A3000'],
    // Variant 5: Royal Amethyst, Electric Pink & White
    ['#FFFFFF', '#F2E0FF', '#B347FF', '#FF80DF', '#4B0A80']
  ];

  let rawPal = PRESET_PALETTES[((VARIANT % PRESET_PALETTES.length) + PRESET_PALETTES.length) % PRESET_PALETTES.length];
  if (typeof P.palette === 'string' && P.palette.trim()) {
    const custom = P.palette.split(',').map(s => s.trim()).filter(Boolean);
    if (custom.length >= 2) {
      rawPal = [
        custom[0],
        custom[1 % custom.length],
        custom[2 % custom.length],
        custom[3 % custom.length],
        custom[4 % custom.length]
      ];
    }
  }

  function hexToRgb(hex) {
    let h = hex.replace('#', '').trim();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  const RGB = rawPal.map(hexToRgb);
  function rgba(idx, a) {
    const c = RGB[idx % RGB.length];
    const alpha = Math.max(0, Math.min(1, a));
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha.toFixed(4)})`;
  }

  // --- 100% PROPRIETARY ROUNDED GEOMETRIC VECTOR FONT (Zero External/OS Fonts, 100% Commercial-Free) ---
  const VECTOR_FONT = {
    'T': { w: 0.70, p: c => {
      c.m(0.04, 0); c.l(0.66, 0);
      c.m(0.35, 0); c.l(0.35, 1);
    }},
    'U': { w: 0.76, p: c => {
      c.m(0.10, 0); c.l(0.10, 0.64);
      c.arc(0.38, 0.64, 0.28, 0.36, Math.PI, 0, true);
      c.l(0.66, 0);
    }},
    'R': { w: 0.74, p: c => {
      c.m(0.10, 1); c.l(0.10, 0); c.l(0.41, 0);
      c.arc(0.41, 0.26, 0.24, 0.26, -Math.PI * 0.5, Math.PI * 0.5, false);
      c.l(0.10, 0.52);
      c.m(0.36, 0.52); c.l(0.66, 1);
    }},
    'N': { w: 0.78, p: c => {
      c.m(0.10, 1); c.l(0.10, 0); c.l(0.68, 1); c.l(0.68, 0);
    }},
    'O': { w: 0.84, p: c => { c.arc(0.42, 0.50, 0.34, 0.50, 0, TAU, false); } },
    'I': { w: 0.28, p: c => { c.m(0.14, 0); c.l(0.14, 1); } },
    'F': { w: 0.62, p: c => {
      c.m(0.56, 0); c.l(0.10, 0); c.l(0.10, 1);
      c.m(0.10, 0.49); c.l(0.46, 0.49);
    }},
    'C': { w: 0.76, p: c => { c.arc(0.42, 0.50, 0.34, 0.50, -Math.PI * 0.22, Math.PI * 0.22, true); } },
    'A': { w: 0.82, p: c => {
      c.m(0.06, 1); c.l(0.41, 0); c.l(0.76, 1);
      c.m(0.18, 0.65); c.l(0.64, 0.65);
    }},
    'S': { w: 0.70, p: c => {
      c.m(0.58, 0.18);
      c.b(0.52, -0.02, 0.10, -0.02, 0.10, 0.24);
      c.b(0.10, 0.49, 0.62, 0.49, 0.62, 0.76);
      c.b(0.62, 1.02, 0.16, 1.02, 0.08, 0.82);
    }},
    ' ': { w: 0.36, p: () => {} }
  };

  function createGlyphPathHelper(ox, oy, scaleX, scaleY) {
    const tx = x => ox + x * scaleX;
    const ty = y => oy + y * scaleY;
    return {
      m(x, y) { ctx.moveTo(tx(x), ty(y)); },
      l(x, y) { ctx.lineTo(tx(x), ty(y)); },
      b(x1, y1, x2, y2, x3, y3) {
        ctx.bezierCurveTo(tx(x1), ty(y1), tx(x2), ty(y2), tx(x3), ty(y3));
      },
      arc(cx, cy, rx, ry, a0, a1, ccw) {
        const steps = 28;
        let delta = a1 - a0;
        if (ccw && delta > 0) delta -= TAU;
        if (!ccw && delta < 0) delta += TAU;
        for (let i = 0; i <= steps; i++) {
          const a = a0 + (i / steps) * delta;
          const px = cx + Math.cos(a) * rx;
          const py = cy + Math.sin(a) * ry;
          if (i === 0) ctx.moveTo(tx(px), ty(py));
          else ctx.lineTo(tx(px), ty(py));
        }
      }
    };
  }

  function measureVectorText(str, capHeight, tracking) {
    let total = 0;
    for (let i = 0; i < str.length; i++) {
      const g = VECTOR_FONT[str[i]] || VECTOR_FONT[' '];
      total += g.w * capHeight;
      if (i < str.length - 1) total += tracking;
    }
    return total;
  }

  function drawVectorStringCentered(str, centerX, centerY, capHeight, tracking, options) {
    const totalW = measureVectorText(str, capHeight, tracking);
    let curX = centerX - totalW * 0.5;
    const wavePhase = options.wavePhase || 0;
    const waveAmp = options.waveAmp || 0;
    const strokeW = Math.max(options.strokeW, capHeight * 0.165);
    const mainColorStr = options.customColor || rgba(options.colorIdx || 0, options.alpha !== undefined ? options.alpha : 1);
    const glowColorIdx = options.glowColorIdx;
    const alpha = options.alpha !== undefined ? options.alpha : 1;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const g = VECTOR_FONT[ch] || VECTOR_FONT[' '];
      const yWave = Math.sin(wavePhase - i * 0.42) * waveAmp;
      const topY = centerY - capHeight * 0.5 + yWave;

      if (ch !== ' ') {
        const helper = createGlyphPathHelper(curX, topY, capHeight, capHeight);

        if (glowColorIdx !== undefined) {
          ctx.beginPath();
          g.p(helper);
          ctx.strokeStyle = rgba(glowColorIdx, alpha * 0.22);
          ctx.lineWidth = strokeW * 1.9;
          ctx.stroke();
        }

        ctx.beginPath();
        g.p(helper);
        ctx.strokeStyle = mainColorStr;
        ctx.lineWidth = strokeW;
        ctx.stroke();
      }

      curX += g.w * capHeight + tracking;
    }
  }

  function drawRadialGlow(x, y, r, colorIdx, alpha) {
    if (r <= 0.5 || alpha <= 0.002) return;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, rgba(colorIdx, alpha));
    grad.addColorStop(0.35, rgba(colorIdx, alpha * 0.45));
    grad.addColorStop(0.70, rgba(colorIdx, alpha * 0.12));
    grad.addColorStop(1, rgba(colorIdx, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  // Sculpted Architectural Vector Bell with Clapper & Engraved Harmonic Bands
  function drawArchitecturalBell(bellR, swingAngle, u, isBlackBg) {
    ctx.save();
    ctx.rotate(swingAngle);

    // 1. Swinging Pendulum Clapper (lags/overshoots with secondary harmonic inertia)
    const clapperX = Math.sin(swingAngle * 2.1) * (bellR * 0.26);
    const clapperY = bellR * 0.88;
    const clapperR = bellR * 0.20;

    drawRadialGlow(clapperX, clapperY, clapperR * 2.6, 2, 0.75);
    ctx.fillStyle = rgba(3, 1);
    ctx.beginPath();
    ctx.arc(clapperX, clapperY, clapperR, 0, TAU);
    ctx.fill();
    ctx.lineWidth = u * 1.8;
    ctx.strokeStyle = rgba(0, 0.9);
    ctx.stroke();

    // 2. Top Suspension Crown Ring
    ctx.beginPath();
    ctx.arc(0, -bellR * 0.92, bellR * 0.18, 0, TAU);
    ctx.strokeStyle = rgba(2, 0.95);
    ctx.lineWidth = u * 3.8;
    ctx.stroke();

    // 3. Bell Main Body Dome & Flared Lip (Cubic Bezier Profile)
    const buildBellPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, -bellR * 0.78);
      ctx.bezierCurveTo(
        bellR * 0.62, -bellR * 0.78,
        bellR * 0.70, -bellR * 0.12,
        bellR * 0.78, bellR * 0.44
      );
      ctx.lineTo(bellR * 0.98, bellR * 0.70);
      ctx.quadraticCurveTo(0, bellR * 0.80, -bellR * 0.98, bellR * 0.70);
      ctx.lineTo(-bellR * 0.78, bellR * 0.44);
      ctx.bezierCurveTo(
        -bellR * 0.70, -bellR * 0.12,
        -bellR * 0.62, -bellR * 0.78,
        0, -bellR * 0.78
      );
      ctx.closePath();
    };

    // Rich Metallic Gold Gradient Fill
    ctx.globalCompositeOperation = 'source-over';
    const bellGrad = ctx.createLinearGradient(-bellR * 0.85, -bellR * 0.6, bellR * 0.85, bellR * 0.7);
    bellGrad.addColorStop(0, rgba(3, 0.98));
    bellGrad.addColorStop(0.35, rgba(2, 0.98));
    bellGrad.addColorStop(0.75, rgba(4, 0.95));
    bellGrad.addColorStop(1, rgba(2, 0.98));

    buildBellPath();
    ctx.fillStyle = bellGrad;
    ctx.fill();

    if (isBlackBg) ctx.globalCompositeOperation = 'lighter';

    // Outer glow & crisp rim around Bell
    buildBellPath();
    ctx.strokeStyle = rgba(2, 0.35);
    ctx.lineWidth = u * 8.5;
    ctx.stroke();

    buildBellPath();
    ctx.strokeStyle = rgba(0, 0.95);
    ctx.lineWidth = u * 2.4;
    ctx.stroke();

    // Engraved ornamental acoustic bands across the bell dome
    ctx.beginPath();
    ctx.moveTo(-bellR * 0.66, bellR * 0.38);
    ctx.quadraticCurveTo(0, bellR * 0.46, bellR * 0.66, bellR * 0.38);
    ctx.moveTo(-bellR * 0.52, -bellR * 0.22);
    ctx.quadraticCurveTo(0, -bellR * 0.16, bellR * 0.52, -bellR * 0.22);
    ctx.strokeStyle = rgba(0, 0.65);
    ctx.lineWidth = u * 1.4;
    ctx.stroke();

    ctx.restore();
  }

  // --- MAIN RENDER FUNCTION ---
  function renderFrame(t) {
    const W = canvas.width;
    const H = canvas.height;
    const S = Math.min(W, H);
    const cx = W * 0.5;
    const cy = H * 0.5;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    const isBlackBg = (BG === 'black');
    if (!isBlackBg) {
      ctx.clearRect(0, 0, W, H);
    } else {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
    }

    const phase = (((t % DURATION) + DURATION) % DURATION) / DURATION;
    const p1 = TAU * 1 * phase;
    const p2 = TAU * 2 * phase;
    const p6 = TAU * 6 * phase;
    const u = S * 0.001; // 2.16px at 4K

    // Bell swing envelope: peaks at phase = 0.50 (thumbnail!) and smoothly hits 0 at phase = 0 and 1
    const ringEnvelope = Math.sin(phase * Math.PI);
    const swingAngle = Math.sin(p6) * 0.30 * ringEnvelope;

    // 1. Ambient Backdrop Glow
    drawRadialGlow(cx, cy - S * 0.04, S * 0.46, 4, 0.20 + 0.08 * ringEnvelope);

    ctx.save();
    ctx.translate(cx, cy);

    // 2. Top Center Vector Bell, Sacred Geometry Halo & Concentric Acoustic Waves
    const bellY = -S * 0.145;
    const bellR = S * 0.056;

    ctx.save();
    ctx.translate(0, bellY);

    drawRadialGlow(0, 0, bellR * 2.8, 2, 0.32 + 0.28 * ringEnvelope);

    // Faint rotating sacred-geometry astrolabe ring behind the bell
    ctx.save();
    ctx.rotate(p1);
    ctx.setLineDash([u * 3.5, u * 5.5]);
    ctx.beginPath();
    ctx.arc(0, 0, bellR * 1.48, 0, TAU);
    ctx.strokeStyle = rgba(1, 0.24);
    ctx.lineWidth = u * 0.9;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Propagating Acoustic Soundwave Arcs (Left & Right)
    if (isBlackBg) ctx.globalCompositeOperation = 'lighter';
    for (let w = 0; w < 3; w++) {
      const waveProg = ((phase * 3 + w / 3) % 1 + 1) % 1;
      const waveRad = bellR * (1.35 + waveProg * 1.65);
      const waveAlpha = Math.sin(waveProg * Math.PI) * (0.28 + 0.72 * ringEnvelope);
      const arcSpan = 0.58 + 0.12 * waveProg;

      for (let side of [-1, 1]) {
        const baseAng = side === 1 ? 0 : Math.PI;

        // Glow pass
        ctx.beginPath();
        ctx.arc(0, 0, waveRad, baseAng - arcSpan, baseAng + arcSpan);
        ctx.strokeStyle = rgba(2, waveAlpha * 0.38);
        ctx.lineWidth = u * (9.5 * (1 - waveProg * 0.45));
        ctx.lineCap = 'round';
        ctx.stroke();

        // Crisp core arc
        ctx.beginPath();
        ctx.arc(0, 0, waveRad, baseAng - arcSpan, baseAng + arcSpan);
        ctx.strokeStyle = rgba(w === 0 ? 0 : 3, waveAlpha * 0.95);
        ctx.lineWidth = u * (3.2 * (1 - waveProg * 0.45));
        ctx.stroke();
      }
    }

    drawArchitecturalBell(bellR, swingAngle, u, isBlackBg);
    ctx.restore();

    // 3. Middle Pill Badge: Bespoke Vector "TURN ON"
    const pillW = S * 0.245;
    const pillH = S * 0.048;
    const pillY = S * 0.015;
    const pillR = pillH * 0.5;

    ctx.save();
    drawRadialGlow(0, pillY, pillW * 0.75, 2, 0.35 + 0.15 * Math.sin(p2));

    // Gold Capsule Fill
    ctx.globalCompositeOperation = 'source-over';
    const pillGrad = ctx.createLinearGradient(-pillW * 0.5, pillY, pillW * 0.5, pillY);
    pillGrad.addColorStop(0, rgba(2, 1));
    pillGrad.addColorStop(0.5, rgba(3, 1));
    pillGrad.addColorStop(1, rgba(2, 1));

    ctx.fillStyle = pillGrad;
    ctx.beginPath();
    ctx.roundRect(-pillW * 0.5, pillY - pillH * 0.5, pillW, pillH, pillR);
    ctx.fill();

    ctx.strokeStyle = rgba(0, 0.92);
    ctx.lineWidth = u * 1.6;
    ctx.stroke();

    // Flanking horizontal telemetry lines on left & right of "TURN ON" pill
    for (let side of [-1, 1]) {
      const lx0 = side * (pillW * 0.5 + S * 0.018);
      const lx1 = side * (pillW * 0.5 + S * (0.11 + 0.015 * Math.sin(p2)));
      ctx.beginPath();
      ctx.moveTo(lx0, pillY);
      ctx.lineTo(lx1, pillY);
      ctx.strokeStyle = rgba(2, 0.55);
      ctx.lineWidth = u * 1.4;
      ctx.stroke();

      ctx.fillStyle = rgba(0, 0.9);
      ctx.beginPath();
      ctx.arc(lx1, pillY, u * 2.5, 0, TAU);
      ctx.fill();
    }

    // Bespoke Vector "TURN ON" inside the Gold Pill (Dark Engraved Stroke)
    const turnCapH = S * 0.024;
    const turnTrack = S * 0.0065;
    drawVectorStringCentered('TURN ON', 0, pillY, turnCapH, turnTrack, {
      strokeW: u * 3.6,
      customColor: '#060400',
      wavePhase: 0,
      waveAmp: 0,
      alpha: 1
    });
    ctx.restore();

    // 4. Main Headline: BESPOKE VECTOR TYPOGRAPHY "NOTIFICATIONS"
    ctx.save();
    if (isBlackBg) ctx.globalCompositeOperation = 'lighter';

    const mainWord = 'NOTIFICATIONS';
    const mainCapH = S * 0.058;
    const mainTrack = S * 0.0105;
    const mainY = S * 0.125;

    drawVectorStringCentered(mainWord, 0, mainY, mainCapH, mainTrack, {
      strokeW: u * 6.2,
      colorIdx: 0,
      glowColorIdx: 2,
      inlineIdx: 3,
      wavePhase: p2,
      waveAmp: u * 2.8,
      alpha: 0.98
    });

    // Bottom Harmonic Underline & Sliding Focal Diamond
    const lineW = measureVectorText(mainWord, mainCapH, mainTrack) * 0.92;
    const underY = mainY + mainCapH * 0.82;

    ctx.beginPath();
    ctx.moveTo(-lineW * 0.5, underY);
    ctx.lineTo(lineW * 0.5, underY);
    ctx.strokeStyle = rgba(4, 0.45);
    ctx.lineWidth = u * 1.2;
    ctx.stroke();

    const scanX = Math.sin(p1) * (lineW * 0.38);
    const activeSpan = lineW * 0.14;
    ctx.beginPath();
    ctx.moveTo(scanX - activeSpan, underY);
    ctx.lineTo(scanX + activeSpan, underY);
    ctx.strokeStyle = rgba(2, 0.95);
    ctx.lineWidth = u * 2.6;
    ctx.stroke();

    drawRadialGlow(scanX, underY, u * 12, 3, 0.90);
    ctx.restore();

    ctx.restore();
  }

  window.renderFrame = renderFrame;
  window.renderAtTime = renderFrame;

  let startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    renderFrame((now - startTime) * 0.001);
    requestAnimationFrame(loop);
  }

  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
