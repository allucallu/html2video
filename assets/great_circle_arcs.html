<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4K Orthographic Globe — Great Circle Arcs (Swiss Editorial)</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="3840" height="2160"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // =========================================================================
    // 1. KONFIGURASI 4K & DETERMINISTIC LOOP
    // =========================================================================
    const WIDTH = 3840;
    const HEIGHT = 2160;
    const CX = WIDTH / 2;   // 1920
    const CY = HEIGHT / 2;  // 1080
    const RADIUS = 760;     // Radius bola dunia presisi di bingkai 4K

    const FPS = 60;
    const DURATION_SEC = 16; // 1 rotasi penuh 360° = 16 detik (960 frame)
    const TOTAL_FRAMES = FPS * DURATION_SEC;

    // Kemiringan aksial tampilan (18°N menghadap kamera agar rute global optimal)
    const TILT_LAT = -18;
    const DEG2RAD = Math.PI / 180;

    // Proyeksi D3 untuk Sisi Depan & Sisi Belakang (Back-Face X-Ray)
    const frontProj = d3.geoOrthographic()
      .scale(RADIUS)
      .translate([CX, CY])
      .clipAngle(90);

    const backProj = d3.geoOrthographic()
      .scale(RADIUS)
      .translate([CX, CY])
      .clipAngle(90);

    const frontPath = d3.geoPath(frontProj, ctx);
    const backPath = d3.geoPath(backProj, ctx);

    const graticuleMajor = d3.geoGraticule().step([30, 30])();
    const graticuleMinor = d3.geoGraticule().step([15, 15])();
    const equatorGeo = {
      type: 'LineString',
      coordinates: d3.range(-180, 181, 2).map((lon) => [lon, 0])
    };

    // =========================================================================
    // 2. DATA HUB GLOBAL & KORIDOR GREAT CIRCLE
    // =========================================================================
    const HUBS = {
      NYC: { name: 'NYC', lon: -74.00, lat: 40.71 },
      LAX: { name: 'LAX', lon: -118.24, lat: 34.05 },
      GRU: { name: 'GRU', lon: -46.63, lat: -23.55 },
      LON: { name: 'LON', lon: -0.12, lat: 51.50 },
      FRA: { name: 'FRA', lon: 8.68, lat: 50.11 },
      IST: { name: 'IST', lon: 28.97, lat: 41.00 },
      JNB: { name: 'JNB', lon: 28.04, lat: -26.20 },
      DXB: { name: 'DXB', lon: 55.27, lat: 25.20 },
      BOM: { name: 'BOM', lon: 72.87, lat: 19.07 },
      SIN: { name: 'SIN', lon: 103.81, lat: 1.35 },
      JKT: { name: 'JKT', lon: 106.84, lat: -6.20 },
      HKG: { name: 'HKG', lon: 114.16, lat: 22.31 },
      TYO: { name: 'TYO', lon: 139.69, lat: 35.68 },
      SYD: { name: 'SYD', lon: 151.20, lat: -33.86 }
    };

    // Daftar Rute [Asal, Tujuan, Siklus per Rotasi (Integer agar Seamless), Phase Offset]
    const ROUTE_DEFS = [
      ['NYC', 'LON', 3, 0.00],
      ['LON', 'DXB', 3, 0.14],
      ['DXB', 'SIN', 3, 0.28],
      ['SIN', 'TYO', 3, 0.42],
      ['TYO', 'LAX', 2, 0.08],
      ['LAX', 'NYC', 4, 0.55],
      ['NYC', 'GRU', 3, 0.22],
      ['LON', 'JNB', 2, 0.65],
      ['FRA', 'HKG', 2, 0.35],
      ['DXB', 'BOM', 4, 0.72],
      ['BOM', 'SIN', 4, 0.18],
      ['JKT', 'SYD', 3, 0.50],
      ['SIN', 'SYD', 3, 0.85],
      ['TYO', 'SYD', 2, 0.40],
      ['IST', 'DXB', 4, 0.10],
      ['FRA', 'NYC', 3, 0.60],
      ['HKG', 'TYO', 4, 0.30],
      ['GRU', 'JNB', 2, 0.78]
    ];

    // Pre-kalkulasi sampel titik geodesik untuk performa 60 FPS mulus di 4K
    const ARC_SAMPLES = 72;
    const ROUTES = ROUTE_DEFS.map(([fromKey, toKey, cycles, phase]) => {
      const a = HUBS[fromKey];
      const b = HUBS[toKey];
      const interp = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
      const distRad = d3.geoDistance([a.lon, a.lat], [b.lon, b.lat]);
      // Ketinggian lengkungan proporsional terhadap jarak rute
      const maxAlt = 0.045 + (distRad / Math.PI) * 0.22;

      const points = [];
      for (let i = 0; i <= ARC_SAMPLES; i++) {
        const t = i / ARC_SAMPLES;
        const [lon, lat] = interp(t);
        const alt = 1 + maxAlt * Math.sin(Math.PI * t);
        points.push({ lon, lat, alt, t });
      }

      return { from: a, to: b, cycles, phase, distRad, points };
    });

    // Data Geometri Peta
    let landGeo = null;
    let bordersGeo = null;
    window.mapReady = false;

    // =========================================================================
    // 3. MATEMATIKA PROYEKSI 3D ORTOGRAFIS (SINKRON 100% DENGAN D3)
    // =========================================================================
    function project3D(lonDeg, latDeg, alt, rotLonDeg, rotLatDeg) {
      const lon = (lonDeg + rotLonDeg) * DEG2RAD;
      const lat = latDeg * DEG2RAD;
      const phi = rotLatDeg * DEG2RAD;

      const cosLat = Math.cos(lat);
      const x0 = cosLat * Math.sin(lon);
      const y0 = Math.sin(lat);
      const z0 = cosLat * Math.cos(lon);

      const cosPhi = Math.cos(phi);
      const sinPhi = Math.sin(phi);

      const y1 = y0 * cosPhi + z0 * sinPhi;
      const z1 = z0 * cosPhi - y0 * sinPhi;

      const x = x0 * alt;
      const y = y1 * alt;
      const z = z1 * alt;

      // Terlihat jika di belahan depan (z >= 0) ATAU melengkung di luar siluet bola (x²+y² >= 1)
      const visible = z >= 0 || (x * x + y * y) >= 0.998;

      return {
        sx: CX + x * RADIUS,
        sy: CY - y * RADIUS,
        z,
        visible
      };
    }

    // =========================================================================
    // 4. LAPISAN VISUAL
    // =========================================================================

    // Lapisan 1: Instrumen Busur Derajat Luar & Marka Registrasi
    function drawProtractorRing(rotLon) {
      ctx.save();

      // Lingkaran Orbit Tipis Luar
      const outerR1 = RADIUS + 34;
      const outerR2 = RADIUS + 92;

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(CX, CY, outerR1, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.setLineDash([4, 10]);
      ctx.beginPath();
      ctx.arc(CX, CY, outerR2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Skala Ticks Derajat 360° (Setiap 2°, 10°, 30°)
      for (let deg = 0; deg < 360; deg += 2) {
        const rad = (deg - 90) * DEG2RAD;
        const isMajor = deg % 30 === 0;
        const isMid = deg % 10 === 0;

        const rStart = outerR1;
        const rEnd = isMajor ? outerR1 + 26 : isMid ? outerR1 + 15 : outerR1 + 7;

        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(rad) * rStart, CY + Math.sin(rad) * rStart);
        ctx.lineTo(CX + Math.cos(rad) * rEnd, CY + Math.sin(rad) * rEnd);
        ctx.strokeStyle = isMajor
          ? 'rgba(255, 255, 255, 0.75)'
          : isMid
            ? 'rgba(255, 255, 255, 0.35)'
            : 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = isMajor ? 2.2 : 1.4;
        ctx.stroke();

        // Label Derajat Monospace pada Kelipatan 30°
        if (isMajor) {
          const labelR = outerR1 + 52;
          const lx = CX + Math.cos(rad) * labelR;
          const ly = CY + Math.sin(rad) * labelR;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.font = '500 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${String(deg).padStart(3, '0')}°`, lx, ly);
        }
      }

      // Garis Sumbu Kardinal Halus (Utara-Selatan & Timur-Barat)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      // Kiri & Kanan
      ctx.moveTo(CX - outerR2 - 140, CY);
      ctx.lineTo(CX - outerR2 - 20, CY);
      ctx.moveTo(CX + outerR2 + 20, CY);
      ctx.lineTo(CX + outerR2 + 140, CY);
      // Atas & Bawah
      ctx.moveTo(CX, CY - outerR2 - 70);
      ctx.lineTo(CX, CY - outerR2 - 15);
      ctx.moveTo(CX, CY + outerR2 + 15);
      ctx.lineTo(CX, CY + outerR2 + 70);
      ctx.stroke();

      // Indikator Segitiga Meridian Atas (Penunjuk Rotasi)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(CX, CY - outerR1 + 4);
      ctx.lineTo(CX - 7, CY - outerR1 - 10);
      ctx.lineTo(CX + 7, CY - outerR1 - 10);
      ctx.closePath();
      ctx.fill();

      // Marka Sudut Bingkai Editorial (Registration Crosshairs)
      const padX = 140;
      const padY = 120;
      const mark = 26;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.lineWidth = 2;
      [
        [padX, padY, 1, 1],
        [WIDTH - padX, padY, -1, 1],
        [padX, HEIGHT - padY, 1, -1],
        [WIDTH - padX, HEIGHT - padY, -1, -1]
      ].forEach(([x, y, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y + dy * mark);
        ctx.lineTo(x, y);
        ctx.lineTo(x + dx * mark, y);
        ctx.stroke();
      });

      ctx.restore();
    }

    // Lapisan 2: Sisi Belakang Bola Dunia (Back-Face X-Ray untuk Kedalaman 3D)
    function drawBackHemisphere(rotLon) {
      backProj.rotate([rotLon + 180, -TILT_LAT, 0]);

      ctx.save();
      // Cerminkan secara horizontal terhadap pusat CX agar sejajar sempurna dilihat menembus bola
      ctx.translate(CX, 0);
      ctx.scale(-1, 1);
      ctx.translate(-CX, 0);

      // Grid Sisi Belakang (Sangat Halus)
      ctx.beginPath();
      backPath(graticuleMajor);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Siluet Garis Pantai Sisi Belakang
      if (landGeo) {
        ctx.beginPath();
        backPath(landGeo);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.085)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // Lapisan 3: Sisi Depan Bola Dunia (Grid, Daratan, & Rim Cahaya)
    function drawFrontHemisphere(rotLon) {
      frontProj.rotate([rotLon, TILT_LAT, 0]);

      ctx.save();

      // Pendar Tepi Atmosfer Monokrom Halus (Luma-Safe di dalam bola)
      const rimGrad = ctx.createRadialGradient(CX, CY, RADIUS * 0.72, CX, CY, RADIUS);
      rimGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      rimGrad.addColorStop(0.85, 'rgba(255, 255, 255, 0.03)');
      rimGrad.addColorStop(1, 'rgba(255, 255, 255, 0.13)');

      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = rimGrad;
      ctx.fill();

      // Grid Minor (15°)
      ctx.beginPath();
      frontPath(graticuleMinor);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.075)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Grid Mayor (30°)
      ctx.beginPath();
      frontPath(graticuleMajor);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // Garis Ekuator (Putus-putus Tegas)
      ctx.save();
      ctx.setLineDash([8, 10]);
      ctx.beginPath();
      frontPath(equatorGeo);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();

      // Daratan Natural Earth & Batas Negara
      if (landGeo) {
        ctx.beginPath();
        frontPath(landGeo);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
        ctx.fill();

        if (bordersGeo) {
          ctx.beginPath();
          frontPath(bordersGeo);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        ctx.beginPath();
        frontPath(landGeo);
        ctx.strokeStyle = '#DCDCDC';
        ctx.lineWidth = 2.1;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // Garis Cakrawala Utama Bola Dunia (Crisp White Limb)
      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.6;
      ctx.stroke();

      ctx.restore();
    }

    // Lapisan 4: Busur Great Circle 3D Berelevasi & Paket Cahaya Bergerak
    function drawGreatCircleArcs(rotLon, progress) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ROUTES.forEach((route) => {
        const projected = route.points.map((pt) =>
          project3D(pt.lon, pt.lat, pt.alt, rotLon, TILT_LAT)
        );

        // 1. Gambar Jalur Dasar Busur (Putus-putus Halus, Terpotong Akurat di Belakang Bola)
        ctx.save();
        ctx.setLineDash([5, 9]);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        let drawing = false;
        for (let i = 0; i < projected.length; i++) {
          const p = projected[i];
          if (p.visible) {
            if (!drawing) {
              ctx.moveTo(p.sx, p.sy);
              drawing = true;
            } else {
              ctx.lineTo(p.sx, p.sy);
            }
          } else {
            drawing = false;
          }
        }
        ctx.stroke();
        ctx.restore();

        // 2. Animasi Paket Cahaya (Comet Pulse) — Deterministik & Seamless
        const headT = (progress * route.cycles + route.phase) % 1;
        const tailLength = 0.26;

        for (let i = 1; i < projected.length; i++) {
          const p0 = projected[i - 1];
          const p1 = projected[i];
          if (!p0.visible || !p1.visible) continue;

          const segT = i / ARC_SAMPLES;
          const distBehindHead = headT - segT;

          if (distBehindHead >= 0 && distBehindHead <= tailLength) {
            // Intensitas memudar halus dari kepala (1.0) ke ujung ekor (0.0)
            const intensity = Math.pow(1 - distBehindHead / tailLength, 1.8);

            // Outer Glow Tipis
            ctx.beginPath();
            ctx.moveTo(p0.sx, p0.sy);
            ctx.lineTo(p1.sx, p1.sy);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.22 * intensity})`;
            ctx.lineWidth = 11 * intensity;
            ctx.stroke();

            // Inti Garis Tajam
            ctx.beginPath();
            ctx.moveTo(p0.sx, p0.sy);
            ctx.lineTo(p1.sx, p1.sy);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.95 * intensity})`;
            ctx.lineWidth = 3.2 * (0.4 + 0.6 * intensity);
            ctx.stroke();
          }
        }

        // 3. Titik Kepala Paket Data (Bright Node)
        const headIdx = Math.min(ARC_SAMPLES, Math.floor(headT * ARC_SAMPLES));
        const headPt = projected[headIdx];
        if (headPt && headPt.visible) {
          const glow = ctx.createRadialGradient(headPt.sx, headPt.sy, 0, headPt.sx, headPt.sy, 16);
          glow.addColorStop(0, 'rgba(255, 255, 255, 1)');
          glow.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
          glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(headPt.sx, headPt.sy, 16, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(headPt.sx, headPt.sy, 4.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Cincin Ping Halus di Titik Tujuan Saat Paket Tiba (headT < 0.18)
        if (headT < 0.18) {
          const destPt = projected[ARC_SAMPLES];
          if (destPt && destPt.z > 0.08) {
            const pingProgress = headT / 0.18;
            const pingR = 8 + pingProgress * 34;
            const pingAlpha = (1 - pingProgress) * 0.75 * Math.min(1, destPt.z * 3);

            ctx.strokeStyle = `rgba(255, 255, 255, ${pingAlpha})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(destPt.sx, destPt.sy, pingR, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      });

      ctx.restore();
    }

    // Lapisan 5: Titik Hub Global & Label Kode IATA Minimalis
    function drawHubs(rotLon) {
      ctx.save();

      Object.values(HUBS).forEach((hub) => {
        const pt = project3D(hub.lon, hub.lat, 1.0, rotLon, TILT_LAT);
        // Hanya tampilkan jika berada di belahan depan (z > 0.05)
        if (pt.z <= 0.05) return;

        // Opasitas memudar mulus saat mendekati tepi cakrawala
        const edgeFade = Math.min(1, (pt.z - 0.05) / 0.25);

        // Reticle Kotak Kecil
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.75 * edgeFade})`;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(pt.sx - 6, pt.sy - 6, 12, 12);

        // Titik Inti Hub
        ctx.fillStyle = `rgba(255, 255, 255, ${edgeFade})`;
        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Label Kode Hub (Hanya jika cukup menghadap kamera agar tidak bertumpuk)
        if (pt.z > 0.22) {
          const textAlpha = Math.min(1, (pt.z - 0.22) / 0.25);
          ctx.font = '600 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
          ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * textAlpha})`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(hub.name, pt.sx + 14, pt.sy - 1);
        }
      });

      ctx.restore();
    }

    // Lapisan 6: Telemetri 4 Sudut Bergaya Swiss Editorial
    function drawTelemetryHUD(rotLon, progress) {
      const marginX = 185;
      const topY = 175;
      const bottomY = HEIGHT - 155;

      // Hitung Bujur Pusat yang sedang menghadap kamera
      let centerLon = ((-rotLon % 360) + 540) % 360 - 180;
      const lonLabel = centerLon >= 0
        ? `${centerLon.toFixed(1).padStart(5, '0')}°E`
        : `${Math.abs(centerLon).toFixed(1).padStart(5, '0')}°W`;

      ctx.save();

      // --- KIRI ATAS: Judul & Spesifikasi Proyeksi ---
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 36px "Helvetica Neue", "Inter", Arial, sans-serif';
      ctx.fillText('ORTHOGRAPHIC GLOBE', marginX, topY);

      ctx.fillStyle = '#777777';
      ctx.font = '500 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('GREAT CIRCLE CORRIDORS  //  WGS84', marginX, topY + 38);

      // Garis Aksen Tipis
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(marginX, topY + 56, 84, 3);

      // --- KANAN ATAS: Koordinat Pusat Real-Time ---
      ctx.textAlign = 'right';
      ctx.fillStyle = '#777777';
      ctx.font = '500 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('CENTER SUB-POINT', WIDTH - marginX, topY - 4);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 32px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`${Math.abs(TILT_LAT).toFixed(1)}°N  ${lonLabel}`, WIDTH - marginX, topY + 36);

      ctx.fillStyle = '#666666';
      ctx.font = '500 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('INCLINATION -18.0°   •   AZIMUTH 000.0°', WIDTH - marginX, topY + 72);

      // --- KIRI BAWAH: Status Jaringan & Legenda ---
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`ACTIVE NETWORK: ${Object.keys(HUBS).length} HUBS  /  ${ROUTES.length} GEODESIC ARCS`, marginX, bottomY - 28);

      ctx.fillStyle = '#777777';
      ctx.font = '500 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('PROJECTION: AZIMUTHAL ORTHOGRAPHIC  •  BACK-FACE WIREFRAME ENABLED', marginX, bottomY + 8);

      // --- KANAN BAWAH: Fase Rotasi 360° & Progress Bar ---
      const rotDeg = (progress * 360).toFixed(1).padStart(5, '0');
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 26px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`ROTATION ${rotDeg}° / 360.0°`, WIDTH - marginX, bottomY - 22);

      const barW = 420;
      const barH = 6;
      const barX = WIDTH - marginX - barW;
      const barY = bottomY - 2;

      ctx.fillStyle = '#222222';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(barX, barY, barW * progress, barH);

      ctx.restore();
    }

    // =========================================================================
    // 5. FUNGSI RENDER DETERMINISTIK & LOOP
    // =========================================================================
    function render(progress) {
      // Latar Belakang Hitam Murni (#000000 - Luma Safe)
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Rotasi Bumi alami dari Barat ke Timur (+360° per siklus)
      const rotLon = progress * 360;

      drawProtractorRing(rotLon);
      drawBackHemisphere(rotLon);
      drawFrontHemisphere(rotLon);
      drawGreatCircleArcs(rotLon, progress);
      drawHubs(rotLon);
      drawTelemetryHUD(rotLon, progress);
    }

    // Hook Global untuk Render Frame-by-Frame (Playwright / FFmpeg / Remotion)
    window.renderFrame = function (frameIndex, totalFrames = TOTAL_FRAMES) {
      const progress = (frameIndex % totalFrames) / totalFrames;
      render(progress);
    };

    // Muat Data Peta Natural Earth 110m
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then((res) => res.json())
      .then((world) => {
        landGeo = topojson.feature(world, world.objects.land);
        bordersGeo = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
        window.mapReady = true;

        // Preview Real-Time 60 FPS
        let startTime = null;
        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsedSec = (timestamp - startTime) / 1000;
          const progress = (elapsedSec % DURATION_SEC) / DURATION_SEC;

          render(progress);
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      });
  </script>
</body>
</html>
