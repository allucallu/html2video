<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4K Planispheric Astrolabe — Celestial Meridian Rings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="3840" height="2160"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // =========================================================================
    // 1. KONFIGURASI 4K & PARAMETER ASTROLAB DETERMINISTIK
    // =========================================================================
    const WIDTH = 3840;
    const HEIGHT = 2160;
    const CX = WIDTH / 2;   // 1920
    const CY = HEIGHT / 2;  // 1080

    const FPS = 60;
    const DURATION_SEC = 24; // 1 siklus 24 jam sidereal = 24 detik (1440 frame @ 60fps)
    const TOTAL_FRAMES = FPS * DURATION_SEC;

    const TWO_PI = Math.PI * 2;
    const DEG2RAD = Math.PI / 180;

    // Konstanta Astronomis Astrolab (Proyeksi Stereografis dari Kutub Selatan)
    const OBLIQUITY = 23.44;
    const OBS_LAT = 35.0; // Lintang Pengamat (35°N memberikan lengkungan almucantar ideal)

    // Skala Radius Instrumen di Kanvas 4K
    const R_TYMPAN = 670;       // Radius Tropik Capricornus (Batas Plat Dalam)
    const R_LIMB_IN = 690;      // Cincin Dalam Limb (Skala Derajat)
    const R_LIMB_MID = 760;     // Cincin Tengah Limb (Skala 24H Right Ascension)
    const R_LIMB_OUT = 835;     // Cincin Luar Mater
    const R_VERNIER = 880;      // Cincin Vernier Berlawanan Arah

    // Proyeksi Stereografis Radius untuk Deklinasi tertentu: r(dec) = R_EQ * tan((90 - dec) / 2)
    const TAN_CAP = Math.tan(((90 + OBLIQUITY) / 2) * DEG2RAD);
    const R_EQUATOR = R_TYMPAN / TAN_CAP; // ~440px (Ekuator Langit)
    const R_CANCER = R_EQUATOR * Math.tan(((90 - OBLIQUITY) / 2) * DEG2RAD); // ~289px

    // Geometri Cincin Ekliptika Eksentris (Menyinggung Tropik Cancer di atas & Capricornus di bawah)
    const ECLIPTIC_R = (R_TYMPAN + R_CANCER) / 2;
    const ECLIPTIC_OFFSET = (R_TYMPAN - R_CANCER) / 2; // Pergeseran pusat ekliptika

    // 10 Bintang Navigasi Utama pada Rete [Nama, Right Ascension (jam), Deklinasi (derajat)]
    const NAV_STARS = [
      { name: 'SIRIUS', ra: 6.75, dec: -16.7 },
      { name: 'VEGA', ra: 18.61, dec: 38.8 },
      { name: 'ARCTURUS', ra: 14.26, dec: 19.2 },
      { name: 'CAPELLA', ra: 5.27, dec: 46.0 },
      { name: 'RIGEL', ra: 5.24, dec: -8.2 },
      { name: 'PROCYON', ra: 7.65, dec: 5.2 },
      { name: 'BETELGEUSE', ra: 5.91, dec: 7.4 },
      { name: 'ALTAIR', ra: 19.84, dec: 8.9 },
      { name: 'ALDEBARAN', ra: 4.59, dec: 16.5 },
      { name: 'SPICA', ra: 13.42, dec: -11.2 }
    ];

    // =========================================================================
    // 2. UTILITAS PROYEKSI STEREOGRAFIS
    // =========================================================================
    function decToRadius(decDeg) {
      return R_EQUATOR * Math.tan(((90 - decDeg) / 2) * DEG2RAD);
    }

    // Hitung Lingkaran Almucantar (Ketinggian h° di atas cakrawala pada lintang phi)
    function getAlmucantarCircle(altDeg, latDeg) {
      const phi = latDeg * DEG2RAD;
      const h = altDeg * DEG2RAD;
      // Titik ekstrem utara & selatan lingkaran ketinggian pada meridian
      const decNorth = Math.PI / 2 - (phi - h); // jarak zenith utara
      const decSouth = Math.PI / 2 + (phi + h); // jarak zenith selatan

      const yN = -R_EQUATOR * Math.tan(((90 - (latDeg + (90 - altDeg))) / 2) * DEG2RAD);
      const yS = R_EQUATOR * Math.tan(((90 - (latDeg - (90 - altDeg))) / 2) * DEG2RAD);

      // Rumus proyeksi stereografis eksak untuk lingkaran ketinggian h pada lintang phi:
      const denom = Math.sin(phi) + Math.sin(h);
      if (Math.abs(denom) < 1e-4) return null;

      const cyOffset = -R_EQUATOR * (Math.cos(phi) / denom);
      const radius = R_EQUATOR * (Math.cos(h) / Math.abs(denom));
      return { cy: CY + cyOffset, r: radius };
    }

    // =========================================================================
    // 3. LAPISAN VISUAL ASTROLAB
    // =========================================================================

    // Lapisan 1: Bingkai Registrasi & Cincin Vernier Luar (Berputar Berlawanan Arah -1x)
    function drawOuterVernierRing(progress) {
      const rotCCW = -progress * TWO_PI;

      ctx.save();

      // Marka Sudut Bingkai Editorial (4 Sudut Kanvas 4K)
      const padX = 140;
      const padY = 120;
      const mark = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      [
        [padX, padY, 1, 1],
        [WIDTH - padX, padY, -1, 1],
        [padX, HEIGHT - padY, 1, -1],
        [WIDTH - padX, HEIGHT - padY, -1, -1]
      ].forEach(([x, y, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y + dy * mark);
        ctx.lineTo(x, y);
        ctx.lineTo(x + dx * mark, y);
        ctx.stroke();
      });

      // Sumbu Kardinal Horizontal & Vertikal di Luar Instrumen
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(CX - R_VERNIER - 210, CY);
      ctx.lineTo(CX - R_VERNIER - 30, CY);
      ctx.moveTo(CX + R_VERNIER + 30, CY);
      ctx.lineTo(CX + R_VERNIER + 210, CY);
      ctx.moveTo(CX, CY - R_VERNIER - 80);
      ctx.lineTo(CX, CY - R_VERNIER - 24);
      ctx.moveTo(CX, CY + R_VERNIER + 24);
      ctx.lineTo(CX, CY + R_VERNIER + 80);
      ctx.stroke();

      // Cincin Vernier Luar (Berputar -360° per siklus)
      ctx.translate(CX, CY);
      ctx.rotate(rotCCW);

      ctx.save();
      ctx.setLineDash([6, 12]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, 0, R_VERNIER, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      // 4 Sektor Skala Nonius (Vernier Arcs) di Keliling Cincin Luar
      for (let q = 0; q < 4; q++) {
        const baseA = q * (Math.PI / 2);
        const span = 18 * DEG2RAD;

        // Busur Braket Vernier
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.arc(0, 0, R_VERNIER, baseA - span, baseA + span);
        ctx.stroke();

        // Ticks Vernier Presisi (11 Garis)
        for (let t = -5; t <= 5; t++) {
          const a = baseA + t * (3.2 * DEG2RAD);
          const len = t === 0 ? 22 : Math.abs(t) === 5 ? 16 : 10;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (R_VERNIER - len), Math.sin(a) * (R_VERNIER - len));
          ctx.lineTo(Math.cos(a) * (R_VERNIER + 4), Math.sin(a) * (R_VERNIER + 4));
          ctx.strokeStyle = t === 0 ? '#FFFFFF' : 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = t === 0 ? 2.4 : 1.5;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // Lapisan 2: Mater & Limb Statis (Skala 360° Azimut & 24 Jam Sidereal)
    function drawMaterLimb() {
      ctx.save();

      // Cincin Konsentris Limb
      [
        { r: R_TYMPAN, color: 'rgba(255, 255, 255, 0.35)', w: 2.0 },
        { r: R_LIMB_IN, color: 'rgba(255, 255, 255, 0.22)', w: 1.5 },
        { r: R_LIMB_MID, color: 'rgba(255, 255, 255, 0.28)', w: 1.8 },
        { r: R_LIMB_OUT, color: 'rgba(255, 255, 255, 0.55)', w: 2.4 }
      ].forEach(({ r, color, w }) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.arc(CX, CY, r, 0, TWO_PI);
        ctx.stroke();
      });

      // Skala Derajat Presisi pada Cincin Limb Dalam (360°: setiap 1°, 5°, 15°)
      for (let deg = 0; deg < 360; deg += 1) {
        const rad = (deg - 90) * DEG2RAD;
        const isMajor = deg % 15 === 0;
        const isFive = deg % 5 === 0;

        const r0 = R_LIMB_IN;
        const r1 = isMajor ? R_LIMB_MID : isFive ? R_LIMB_IN + 24 : R_LIMB_IN + 12;

        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(rad) * r0, CY + Math.sin(rad) * r0);
        ctx.lineTo(CX + Math.cos(rad) * r1, CY + Math.sin(rad) * r1);
        ctx.strokeStyle = isMajor
          ? 'rgba(255, 255, 255, 0.65)'
          : isFive
            ? 'rgba(255, 255, 255, 0.32)'
            : 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = isMajor ? 1.8 : 1.3;
        ctx.stroke();
      }

      // Label 24 Jam Sidereal (00H - 23H) di Cincin Limb Luar
      ctx.font = '600 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let h = 0; h < 24; h++) {
        const rad = (h * 15 - 90) * DEG2RAD;
        const rText = (R_LIMB_MID + R_LIMB_OUT) / 2;
        const tx = CX + Math.cos(rad) * rText;
        const ty = CY + Math.sin(rad) * rText;

        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(rad + Math.PI / 2);
        ctx.fillStyle = h % 6 === 0 ? '#FFFFFF' : 'rgba(255, 255, 255, 0.58)';
        ctx.fillText(`${String(h).padStart(2, '0')}H`, 0, 0);
        ctx.restore();

        // Pembatas Jam Halus pada Cincin Luar
        const divRad = ((h + 0.5) * 15 - 90) * DEG2RAD;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(divRad) * R_LIMB_MID, CY + Math.sin(divRad) * R_LIMB_MID);
        ctx.lineTo(CX + Math.cos(divRad) * R_LIMB_OUT, CY + Math.sin(divRad) * R_LIMB_OUT);
        ctx.stroke();
      }

      // Indikator Segitiga Meridian Atas (Zenith / Midheaven)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(CX, CY - R_LIMB_OUT - 4);
      ctx.lineTo(CX - 9, CY - R_LIMB_OUT - 22);
      ctx.lineTo(CX + 9, CY - R_LIMB_OUT - 22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // Lapisan 3: Tympan (Plat Proyeksi Stereografis: Ekuator, Tropik, & Almucantars)
    function drawTympanPlate() {
      ctx.save();

      // Klip ketat di dalam lingkaran Tropik Capricornus
      ctx.beginPath();
      ctx.arc(CX, CY, R_TYMPAN, 0, TWO_PI);
      ctx.clip();

      // Garis Meridian Utama (Utara-Selatan) & Garis Timur-Barat
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(CX, CY - R_TYMPAN);
      ctx.lineTo(CX, CY + R_TYMPAN);
      ctx.moveTo(CX - R_TYMPAN, CY);
      ctx.lineTo(CX + R_TYMPAN, CY);
      ctx.stroke();

      // Lingkaran Ekuator Langit (0° DEC) & Tropik Cancer (+23.44° DEC)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(CX, CY, R_EQUATOR, 0, TWO_PI);
      ctx.stroke();

      ctx.save();
      ctx.setLineDash([5, 9]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(CX, CY, R_CANCER, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      // Busur Almucantar (Lingkaran Ketinggian dari Horizon 0° hingga 80° setiap 10°)
      for (let alt = 0; alt <= 80; alt += 10) {
        const alm = getAlmucantarCircle(alt, OBS_LAT);
        if (!alm) continue;

        const isHorizon = alt === 0;
        ctx.beginPath();
        ctx.arc(CX, alm.cy, alm.r, 0, TWO_PI);
        ctx.strokeStyle = isHorizon
          ? 'rgba(255, 255, 255, 0.55)'
          : alt % 30 === 0
            ? 'rgba(255, 255, 255, 0.20)'
            : 'rgba(255, 255, 255, 0.095)';
        ctx.lineWidth = isHorizon ? 2.4 : 1.4;
        ctx.stroke();
      }

      // Titik Zenith Pengamat (90° Ketinggian pada Lintang 35°N)
      const zenithY = CY - decToRadius(OBS_LAT);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(CX - 10, zenithY);
      ctx.lineTo(CX + 10, zenithY);
      ctx.moveTo(CX, zenithY - 10);
      ctx.lineTo(CX, zenithY + 10);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
      ctx.font = '500 15px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('ZENITH 35°N', CX + 16, zenithY);

      ctx.restore();
    }

    // Lapisan 4: Rete Berputar (+1x CW) — Cincin Ekliptika Eksentris & Jarum Bintang
    function drawRotatingRete(progress) {
      const rotCW = progress * TWO_PI;

      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(rotCW);

      // 1. Cincin Ekliptika Eksentris Ganda (Jalur Matahari Tahunan)
      const ecCY = ECLIPTIC_OFFSET; // Pusat bergeser ke bawah (Capricornus)
      const ecOuter = ECLIPTIC_R;
      const ecInner = ECLIPTIC_R - 46;

      // Isi transparan gelap sangat halus untuk memisahkan Rete dari Tympan di bawahnya
      ctx.beginPath();
      ctx.arc(0, ecCY, ecOuter, 0, TWO_PI);
      ctx.arc(0, ecCY, ecInner, 0, TWO_PI, true);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.045)';
      ctx.fill();

      // Garis Cincin Luar & Dalam Ekliptika (Crisp White)
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(0, ecCY, ecOuter, 0, TWO_PI);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, ecCY, ecInner, 0, TWO_PI);
      ctx.stroke();

      // 12 Pembagian Sektor Ekliptika (30° per sektor) + Ticks 5°
      for (let deg = 0; deg < 360; deg += 5) {
        const rad = (deg - 90) * DEG2RAD;
        const isSign = deg % 30 === 0;
        const rStart = isSign ? ecInner : ecOuter - 14;

        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * rStart, ecCY + Math.sin(rad) * rStart);
        ctx.lineTo(Math.cos(rad) * ecOuter, ecCY + Math.sin(rad) * ecOuter);
        ctx.strokeStyle = isSign ? '#FFFFFF' : 'rgba(255, 255, 255, 0.42)';
        ctx.lineWidth = isSign ? 2.0 : 1.3;
        ctx.stroke();

        // Label Derajat Bujur Ekliptika pada Setiap Sektor 30°
        if (isSign) {
          const midRad = ((deg + 15) - 90) * DEG2RAD;
          const rLbl = (ecInner + ecOuter) / 2;
          const lx = Math.cos(midRad) * rLbl;
          const ly = ecCY + Math.sin(midRad) * rLbl;

          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(midRad + Math.PI / 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.font = '600 17px "SF Mono", "JetBrains Mono", "Consolas", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${String(deg).padStart(3, '0')}°`, 0, 0);
          ctx.restore();
        }
      }

      // 2. Penyangga Struktural Rete (Jembatan Geometris Minimalis)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.36)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, -R_TYMPAN);
      ctx.lineTo(0, -R_CANCER);
      ctx.moveTo(0, R_CANCER);
      ctx.lineTo(0, R_TYMPAN);
      ctx.stroke();

      // 3. Jarum Penunjuk Bintang Navigasi (Star Pointers)
      NAV_STARS.forEach((star) => {
        const r = decToRadius(star.dec);
        if (r > R_TYMPAN - 12) return;

        // Konversi Right Ascension (0-24h) ke sudut radian
        const angle = (star.ra * 15 - 90) * DEG2RAD;
        const sx = Math.cos(angle) * r;
        const sy = Math.sin(angle) * r;

        // Garis penghubung tipis dari bintang menuju cincin ekliptika/pusat
        const dx = sx;
        const dy = sy - ecCY;
        const distToEc = Math.hypot(dx, dy);
        const anchorX = (dx / distToEc) * ecInner;
        const anchorY = ecCY + (dy / distToEc) * ecInner;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(anchorX, anchorY);
        ctx.lineTo(sx, sy);
        ctx.stroke();

        // Reticle Berlian pada Posisi Bintang
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.0;
        ctx.fillRect(-5.5, -5.5, 11, 11);
        ctx.strokeRect(-5.5, -5.5, 11, 11);
        ctx.restore();

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(sx, sy, 2.2, 0, TWO_PI);
        ctx.fill();

        // Label Nama Bintang (Selalu menghadap arah radial bersih)
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.font = '500 14px "SF Mono", "JetBrains Mono", "Consolas", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(star.name, 14, 0);
        ctx.restore();
      });

      ctx.restore();
    }

    // Lapisan 5: Penggaris Bidik (Rule / Alidade) Berputar Berlawanan Arah (-1x CCW)
    function drawCounterRotatingRule(progress) {
      const ruleAngle = -progress * TWO_PI - Math.PI / 4;

      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(ruleAngle);

      // Lengan Penggaris Bidik Utama (Membentang Penuh hingga Tepi Limb)
      const len = R_LIMB_OUT + 18;

      // Garis Penggaris Kembar (Slotted Sighting Bar)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.stroke();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.stroke();

      // Garis Skala Deklinasi di Sepanjang Penggaris (Setiap 15° DEC)
      for (let dec = -15; dec <= 75; dec += 15) {
        const r = decToRadius(dec);
        if (r > R_TYMPAN) continue;
        const tickH = dec === 0 ? 16 : 9;
        ctx.strokeStyle = dec === 0 ? '#FFFFFF' : 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = dec === 0 ? 2.2 : 1.5;
        ctx.beginPath();
        ctx.moveTo(r, -tickH);
        ctx.lineTo(r, tickH);
        ctx.moveTo(-r, -tickH);
        ctx.lineTo(-r, tickH);
        ctx.stroke();
      }

      // Ujung Penunjuk Presisi (Fiducial Pointer Tips)
      [-1, 1].forEach((dir) => {
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(dir * (len + 14), 0);
        ctx.lineTo(dir * (len - 12), -9);
        ctx.lineTo(dir * (len - 12), 9);
        ctx.closePath();
        ctx.fill();
      });

      // Poros Tengah (Central Pin / Horse)
      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, TWO_PI);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, TWO_PI);
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, TWO_PI);
      ctx.fill();

      ctx.restore();
    }

    // Lapisan 6: Sub-Dial Fase Bulan Geometris (Siklus Sinodik Penuh 0 -> 1)
    function drawLunarPhaseDial(cx, cy, r, phase) {
      // phase: 0.0 = New Moon, 0.25 = First Quarter, 0.5 = Full Moon, 0.75 = Last Quarter
      ctx.save();

      // Bingkai Cincin Skala Sub-Dial Bulan
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 18, 0, TWO_PI);
      ctx.stroke();

      // 8 Ticks Fase Utama di sekeliling Sub-Dial
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r + 14), cy + Math.sin(a) * (r + 14));
        ctx.lineTo(cx + Math.cos(a) * (r + 22), cy + Math.sin(a) * (r + 22));
        ctx.strokeStyle = i % 2 === 0 ? '#FFFFFF' : 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }

      // Lingkaran Dasar Bulan (Sisi Gelap)
      ctx.fillStyle = '#080808';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.fill();

      // Geometri Bagian Terang Bulan Menggunakan Busur + Terminator Elips
      const cosPhase = Math.cos(phase * TWO_PI); // 1 (New) -> 0 (Quarter) -> -1 (Full) -> 0 -> 1
      const rx = Math.abs(cosPhase) * r;
      const isWaxing = phase < 0.5;

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.clip();

      // Setengah Lingkaran Sisi Terang (Kanan saat Waxing, Kiri saat Waning)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      if (isWaxing) {
        ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2, false);
      } else {
        ctx.arc(cx, cy, r, Math.PI / 2, (3 * Math.PI) / 2, false);
      }
      ctx.closePath();
      ctx.fill();

      // Elips Terminator (Menutup atau Membuka Setengah Lingkaran)
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(0.5, rx), r, 0, 0, TWO_PI);
      // Jika fase < 0.25 atau > 0.75 (Sabit/Crescent), elips berwarna gelap (memotong cahaya)
      // Jika 0.25 <= fase <= 0.75 (Cembung/Gibbous), elips berwarna putih (menambah cahaya)
      ctx.fillStyle = cosPhase > 0 ? '#080808' : '#FFFFFF';
      ctx.fill();

      ctx.restore();

      // Garis Cakrawala Bulan Tajam
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.stroke();

      ctx.restore();
    }

    // Lapisan 7: Telemetri 4 Sudut Bergaya Swiss Editorial
    function drawTelemetryHUD(progress) {
      const marginX = 185;
      const topY = 175;
      const bottomY = HEIGHT - 155;

      // Hitung Waktu Sidereal Lokal (LST 00:00:00 - 24:00:00)
      const totalSec = Math.floor(progress * 86400) % 86400;
      const lstH = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const lstM = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const lstS = String(totalSec % 60).padStart(2, '0');

      // Hitung Iluminasi Bulan (0% -> 100% -> 0%)
      const illum = ((1 - Math.cos(progress * TWO_PI)) / 2) * 100;
      const phaseName =
        progress < 0.06 || progress >= 0.94 ? 'NEW MOON' :
        progress < 0.22 ? 'WAXING CRESCENT' :
        progress < 0.28 ? 'FIRST QUARTER' :
        progress < 0.44 ? 'WAXING GIBBOUS' :
        progress < 0.56 ? 'FULL MOON' :
        progress < 0.72 ? 'WANING GIBBOUS' :
        progress < 0.78 ? 'LAST QUARTER' : 'WANING CRESCENT';

      ctx.save();

      // --- KIRI ATAS: Judul & Spesifikasi Instrumen ---
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 36px "Helvetica Neue", "Inter", Arial, sans-serif';
      ctx.fillText('PLANISPHERIC ASTROLABE', marginX, topY);

      ctx.fillStyle = '#777777';
      ctx.font = '500 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('CELESTIAL MERIDIAN DIAL  •  STEREOGRAPHIC J2000', marginX, topY + 38);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(marginX, topY + 56, 84, 3);

      // --- KANAN ATAS: Local Sidereal Time & Sub-Dial Fase Bulan ---
      ctx.textAlign = 'right';
      ctx.fillStyle = '#777777';
      ctx.font = '500 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('LOCAL SIDEREAL TIME (LST)', WIDTH - marginX, topY - 8);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 36px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`${lstH}:${lstM}:${lstS}`, WIDTH - marginX, topY + 34);

      ctx.fillStyle = '#888888';
      ctx.font = '500 19px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`LAT +${OBS_LAT.toFixed(1)}°N   |   OBLIQUITY ${OBLIQUITY}°`, WIDTH - marginX, topY + 68);

      // Sub-Dial Fase Bulan di Bawah Telemetri Kanan Atas
      const moonR = 44;
      const moonCX = WIDTH - marginX - moonR - 18;
      const moonCY = topY + 158;
      drawLunarPhaseDial(moonCX, moonCY, moonR, progress);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(phaseName, moonCX - moonR - 36, moonCY - 8);

      ctx.fillStyle = '#777777';
      ctx.font = '500 18px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`ILLUMINATION ${illum.toFixed(1)}%`, moonCX - moonR - 36, moonCY + 18);

      // --- KIRI BAWAH: Status Mekanika Cincin ---
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 22px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('RETE ECLIPTIC: +1.0x CW   |   RULE / VERNIER: -1.0x CCW', marginX, bottomY - 28);

      ctx.fillStyle = '#777777';
      ctx.font = '500 20px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText('TYMPAN GRID: ALMUCANTARS 10°  •  10 NAVIGATIONAL STAR POINTERS', marginX, bottomY + 8);

      // --- KANAN BAWAH: Sudut Jam & Progress Bar Siklus 24H ---
      const raDeg = (progress * 360).toFixed(1).padStart(5, '0');
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 26px "SF Mono", "JetBrains Mono", "Consolas", monospace';
      ctx.fillText(`MERIDIAN RA ${raDeg}° / 360.0°`, WIDTH - marginX, bottomY - 22);

      const barW = 420;
      const barH = 6;
      const barX = WIDTH - marginX - barW;
      const barY = bottomY - 2;

      ctx.fillStyle = '#222222';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(barX, barY, barW * progress, barH);

      ctx.restore();
    }

    // =========================================================================
    // 4. FUNGSI RENDER DETERMINISTIK & LOOP
    // =========================================================================
    function render(progress) {
      // Latar Belakang Hitam Murni (#000000 - Luma Safe)
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawOuterVernierRing(progress);
      drawTympanPlate();
      drawMaterLimb();
      drawRotatingRete(progress);
      drawCounterRotatingRule(progress);
      drawTelemetryHUD(progress);
    }

    window.assetReady = true;

    // Hook Global untuk Ekspor Frame-by-Frame (Playwright / FFmpeg / Remotion)
    window.renderFrame = function (frameIndex, totalFrames = TOTAL_FRAMES) {
      const progress = (frameIndex % totalFrames) / totalFrames;
      render(progress);
    };

    // Preview Real-Time 60 FPS di Browser
    let startTime = null;
    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsedSec = (timestamp - startTime) / 1000;
      const progress = (elapsedSec % DURATION_SEC) / DURATION_SEC;

      render(progress);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
