<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ornamental Ketupat Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Seeded deterministic PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(774931);
const SPARKLES = [];
const NUM_SPARKLES = 72;

for (let i = 0; i < NUM_SPARKLES; i++) {
  const angleSpread = rand() * TAU;
  const distX = 140 + rand() * 680;
  const distY = 120 + rand() * 720;
  SPARKLES.push({
    baseX: CX + Math.cos(angleSpread) * distX * (0.65 + 0.35 * rand()),
    baseY: CY + Math.sin(angleSpread) * distY,
    orbitRx: 18 + rand() * 42,
    orbitRy: 22 + rand() * 55,
    freqX: 1 + Math.floor(rand() * 2),
    freqY: 1 + Math.floor(rand() * 2),
    dir: rand() > 0.5 ? 1 : -1,
    phaseOffset: rand(),
    twinkleFreq: 1 + Math.floor(rand() * 3),
    size: 4 + rand() * 14,
    isStar: rand() > 0.35,
    colorType: rand() > 0.3 ? 'gold' : (rand() > 0.45 ? 'amber' : 'emerald')
  });
}

// Draw 4-point or 8-point glossy sparkle star
function drawSparkleStar(x, y, outerR, innerR, rot, alpha, mainColor, coreColor) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

  // Soft radial halo
  const haloR = outerR * 2.2;
  const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
  halo.addColorStop(0, mainColor);
  halo.addColorStop(0.35, mainColor.replace('1)', '0.35)'));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, haloR, 0, TAU);
  ctx.fill();

  // Main 4-point diamond flare
  ctx.fillStyle = coreColor;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const r = (i % 2 === 0) ? outerR : innerR;
    const a = (i * Math.PI) / 4;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // Secondary 45-degree smaller spikes
  ctx.rotate(Math.PI / 4);
  ctx.globalAlpha *= 0.65;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const r = (i % 2 === 0) ? outerR * 0.55 : innerR * 0.7;
    const a = (i * Math.PI) / 4;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// Helper for multi-pass glossy gold stroke
function strokeGoldRim(pathFn, width, glowAlpha) {
  if (glowAlpha > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(255, 190, 50, ${glowAlpha * 0.35})`;
    ctx.lineWidth = width + 10;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    pathFn();
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.strokeStyle = '#4A2B03';
  ctx.lineWidth = width;
  pathFn();
  ctx.stroke();

  ctx.strokeStyle = '#E8A829';
  ctx.lineWidth = width * 0.66;
  pathFn();
  ctx.stroke();

  ctx.strokeStyle = '#FFF5C8';
  ctx.lineWidth = width * 0.26;
  pathFn();
  ctx.stroke();
  ctx.restore();
}

// Draw an ornate hanging ribbon (janur leaf / silk tail) with multi-wave delay
function drawFlowingRibbon(startX, startY, length, baseWidth, baseAngle, phase, waveOffset, isEmerald, curlSide) {
  const segments = 28;
  const leftPts = [];
  const rightPts = [];
  const spinePts = [];

  for (let i = 0; i <= segments; i++) {
    const u = i / segments; // 0 at top root, 1 at tip
    const dist = u * length;

    // Traveling harmonic wave with phase lag down the ribbon
    const w1 = Math.sin(TAU * (phase * 1 - u * 0.45) + waveOffset) * (38 * Math.pow(u, 1.4));
    const w2 = Math.sin(TAU * (phase * 2 - u * 0.75) + waveOffset * 1.7) * (16 * Math.pow(u, 1.6));
    const curl = curlSide * Math.pow(u, 2.2) * 55;

    const localX = w1 + w2 + curl;
    const localY = dist;

    // Rotate by baseAngle
    const cosA = Math.cos(baseAngle);
    const sinA = Math.sin(baseAngle);
    const rx = startX + localX * cosA - localY * sinA;
    const ry = startY + localX * sinA + localY * cosA;

    spinePts.push({ x: rx, y: ry, u });
  }

  for (let i = 0; i <= segments; i++) {
    const p = spinePts[i];
    const pPrev = spinePts[Math.max(0, i - 1)];
    const pNext = spinePts[Math.min(segments, i + 1)];
    const tx = pNext.x - pPrev.x;
    const ty = pNext.y - pPrev.y;
    const len = Math.hypot(tx, ty) || 1;
    const nx = -ty / len;
    const ny = tx / len;

    // Taper profile: swells slightly in middle, tapers to ornate point or V-notch
    const u = p.u;
    const swell = Math.sin(u * Math.PI * 0.85) * 0.35 + (1 - u * 0.78);
    // Perspective twist modulation
    const twist = 0.72 + 0.28 * Math.cos(TAU * (phase * 1 - u * 0.5) + waveOffset);
    const halfW = baseWidth * 0.5 * swell * twist;

    leftPts.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
    rightPts.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });
  }

  // Construct closed ribbon path with V-notched janur tip
  const tipSpine = spinePts[segments - 2];
  const buildPath = () => {
    ctx.beginPath();
    ctx.moveTo(leftPts[0].x, leftPts[0].y);
    for (let i = 1; i <= segments; i++) {
      ctx.lineTo(leftPts[i].x, leftPts[i].y);
    }
    // Swallowtail V-notch characteristic of cut janur ribbon
    ctx.lineTo(tipSpine.x, tipSpine.y);
    for (let i = segments; i >= 0; i--) {
      ctx.lineTo(rightPts[i].x, rightPts[i].y);
    }
    ctx.closePath();
  };

  // Fill with glossy gradient
  const grad = ctx.createLinearGradient(startX, startY, spinePts[segments].x, spinePts[segments].y);
  if (isEmerald) {
    grad.addColorStop(0.0, '#022E17');
    grad.addColorStop(0.25, '#077A3F');
    grad.addColorStop(0.55, '#19D977');
    grad.addColorStop(0.8, '#088746');
    grad.addColorStop(1.0, '#02381B');
  } else {
    grad.addColorStop(0.0, '#592300');
    grad.addColorStop(0.28, '#C95B05');
    grad.addColorStop(0.58, '#FFB838');
    grad.addColorStop(0.82, '#E07008');
    grad.addColorStop(1.0, '#612200');
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
  ctx.shadowBlur = 18;
  buildPath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Center leaf midrib vein in bright gold
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(spinePts[0].x, spinePts[0].y);
  for (let i = 1; i <= segments - 2; i++) {
    ctx.lineTo(spinePts[i].x, spinePts[i].y);
  }
  ctx.strokeStyle = isEmerald ? 'rgba(255, 232, 145, 0.65)' : 'rgba(255, 248, 210, 0.75)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();

  // Gold trimmed edges
  strokeGoldRim(buildPath, 5.5, 0.4);
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Primary & Secondary Harmonic Motion Parameters (Pure functions of integer cycles)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin3 = Math.sin(TAU * phase * 3);

  // Anchor point of the hanging ornament (well inside top safe margin)
  const anchorX = CX;
  const anchorY = 235 + 10 * sin2;

  // Upper cord angle (Primary pendulum swing)
  const cordAngle = 0.085 * sin1 + 0.022 * cos2;
  const cordLen = 305;

  // Top vertex of the Ketupat body
  const topVertexX = anchorX - Math.sin(cordAngle) * cordLen;
  const topVertexY = anchorY + Math.cos(cordAngle) * cordLen;

  // Ketupat body tilt (Secondary overlapping swing with slight phase lag)
  const bodyLagSin1 = Math.sin(TAU * (phase * 1 - 0.07));
  const bodyLagSin2 = Math.sin(TAU * (phase * 2 - 0.12));
  const bodyAngle = 0.115 * bodyLagSin1 + 0.032 * bodyLagSin2;

  // Subtle vertical squash & stretch breathing as it swings through bottom dead center
  const stretchY = 1.0 + 0.018 * cos2;
  const stretchX = 1.0 - 0.014 * cos2;

  // Center of the Ketupat diamond
  const ketupatRadius = 355;
  const bodyCenterX = topVertexX - Math.sin(bodyAngle) * (ketupatRadius * stretchY);
  const bodyCenterY = topVertexY + Math.cos(bodyAngle) * (ketupatRadius * stretchY);

  // 1. CONTAINED AMBIENT GLOW (Strictly fades to #000000 well inside canvas bounds)
  const glowPulse = 0.5 + 0.5 * sin2;
  const mainGlow = ctx.createRadialGradient(bodyCenterX, bodyCenterY + 60, 40, bodyCenterX, bodyCenterY + 60, 760);
  mainGlow.addColorStop(0.0, `rgba(245, 180, 40, ${0.20 + 0.05 * glowPulse})`);
  mainGlow.addColorStop(0.32, `rgba(12, 135, 68, ${0.12 + 0.03 * (1 - glowPulse)})`);
  mainGlow.addColorStop(0.62, `rgba(210, 95, 10, ${0.06 + 0.02 * glowPulse})`);
  mainGlow.addColorStop(0.85, 'rgba(3, 40, 18, 0.015)');
  mainGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = mainGlow;
  ctx.beginPath();
  ctx.arc(bodyCenterX, bodyCenterY + 60, 760, 0, TAU);
  ctx.fill();

  // Top hanger soft halo
  const topGlow = ctx.createRadialGradient(anchorX, anchorY, 10, anchorX, anchorY, 210);
  topGlow.addColorStop(0.0, 'rgba(255, 200, 70, 0.18)');
  topGlow.addColorStop(0.5, 'rgba(180, 90, 10, 0.05)');
  topGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = topGlow;
  ctx.beginPath();
  ctx.arc(anchorX, anchorY, 210, 0, TAU);
  ctx.fill();

  // 2. BRAIDED HANGING CORD & JEWEL BEADS (Between Anchor and Ketupat Top Vertex)
  ctx.save();
  // Braided dual janur stems wrapping around each other
  const braidSteps = 24;
  for (let strand = 0; strand < 2; strand++) {
    ctx.beginPath();
    for (let i = 0; i <= braidSteps; i++) {
      const u = i / braidSteps;
      const bx = anchorX + (topVertexX - anchorX) * u;
      const by = anchorY + (topVertexY - anchorY) * u;
      const perpX = Math.cos(cordAngle);
      const perpY = Math.sin(cordAngle);
      const weaveOffset = Math.sin(u * Math.PI * 5 + strand * Math.PI) * 14;
      const px = bx + perpX * weaveOffset;
      const py = by + perpY * weaveOffset;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = strand === 0 ? '#12B862' : '#E59E1C';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.strokeStyle = '#FFF2BD';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // Ornamental gold & amber beads along the hanging cord
  const beadPositions = [0.25, 0.5, 0.74];
  beadPositions.forEach((u, idx) => {
    const bx = anchorX + (topVertexX - anchorX) * u;
    const by = anchorY + (topVertexY - anchorY) * u;
    const rBead = (idx === 1) ? 22 : 16;
    const bGrad = ctx.createRadialGradient(bx - 5, by - 5, 2, bx, by, rBead);
    if (idx === 1) {
      bGrad.addColorStop(0, '#FFFFFF');
      bGrad.addColorStop(0.3, '#FFB732');
      bGrad.addColorStop(0.75, '#B84A00');
      bGrad.addColorStop(1, '#471800');
    } else {
      bGrad.addColorStop(0, '#FFF7D6');
      bGrad.addColorStop(0.4, '#E8A825');
      bGrad.addColorStop(1, '#5E3804');
    }
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(bx, by, rBead, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#FFF1BA';
    ctx.lineWidth = 3;
    ctx.stroke();
  });
  ctx.restore();

  // 3. TOP ORNAMENTAL CELESTIAL HANGER / CRESCENT CLASP (Centered at anchorX, anchorY)
  ctx.save();
  ctx.translate(anchorX, anchorY);
  ctx.rotate(cordAngle * 0.35);

  // Upward crescent horns holding the cord
  const crescentPath = () => {
    ctx.beginPath();
    ctx.arc(0, -8, 52, 0.15 * Math.PI, 0.85 * Math.PI, false);
    ctx.arc(0, -24, 44, 0.82 * Math.PI, 0.18 * Math.PI, true);
    ctx.closePath();
  };
  const crescGrad = ctx.createLinearGradient(-50, -40, 50, 40);
  crescGrad.addColorStop(0, '#8A5608');
  crescGrad.addColorStop(0.5, '#FFE484');
  crescGrad.addColorStop(1, '#9E6208');
  crescentPath();
  ctx.fillStyle = crescGrad;
  ctx.fill();
  strokeGoldRim(crescentPath, 5, 0.5);

  // 8-Pointed Star Finial Medallion at the anchor
  const hangerStarPath = () => {
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i * TAU) / 16 - Math.PI / 2;
      const r = (i % 2 === 0) ? 46 : 22;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  };
  const hStarGrad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 46);
  hStarGrad.addColorStop(0, '#FFF8DC');
  hStarGrad.addColorStop(0.4, '#F0AE2C');
  hStarGrad.addColorStop(0.85, '#8C5205');
  hStarGrad.addColorStop(1, '#3D2000');
  hangerStarPath();
  ctx.fillStyle = hStarGrad;
  ctx.fill();
  strokeGoldRim(hangerStarPath, 5, 0.6);

  // Emerald cabochon center in hanger
  const hGemGrad = ctx.createRadialGradient(-4, -4, 1, 0, 0, 16);
  hGemGrad.addColorStop(0, '#9EFFCC');
  hGemGrad.addColorStop(0.45, '#0FB861');
  hGemGrad.addColorStop(1, '#02381A');
  ctx.fillStyle = hGemGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#FFF4C2';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();

  // 4. SECONDARY FLOWING JANUR RIBBON TAILS & TASSELS (Drawn behind the main ketupat body)
  const bottomVertexX = bodyCenterX - Math.sin(bodyAngle) * (ketupatRadius * stretchY);
  const bottomVertexY = bodyCenterY + Math.cos(bodyAngle) * (ketupatRadius * stretchY);
  const leftVertexX = bodyCenterX - Math.cos(bodyAngle) * (ketupatRadius * stretchX);
  const leftVertexY = bodyCenterY - Math.sin(bodyAngle) * (ketupatRadius * stretchX);
  const rightVertexX = bodyCenterX + Math.cos(bodyAngle) * (ketupatRadius * stretchX);
  const rightVertexY = bodyCenterY + Math.sin(bodyAngle) * (ketupatRadius * stretchX);

  // Side decorative looped janur ears at left and right corners
  [-1, 1].forEach((side) => {
    const vx = side === -1 ? leftVertexX : rightVertexX;
    const vy = side === -1 ? leftVertexY : rightVertexY;
    const earSwing = 0.14 * Math.sin(TAU * (phase * 2 - 0.18) + side);
    ctx.save();
    ctx.translate(vx, vy);
    ctx.rotate(bodyAngle + side * (Math.PI / 4) + earSwing);

    const loopPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(side * 95, -55, side * 125, 45, 0, 32);
      ctx.closePath();
    };
    const earGrad = ctx.createLinearGradient(0, -30, side * 100, 30);
    earGrad.addColorStop(0, '#044A25');
    earGrad.addColorStop(0.5, '#1CE37D');
    earGrad.addColorStop(1, '#066E37');
    loopPath();
    ctx.fillStyle = earGrad;
    ctx.fill();
    strokeGoldRim(loopPath, 5, 0.35);
    ctx.restore();
  });

  // Four main hanging ribbons from the bottom corner of the ketupat
  // Outer left warm amber silk ribbon
  drawFlowingRibbon(
    bottomVertexX - 18, bottomVertexY - 12,
    430, 42, bodyAngle + 0.16, phase, 0.65, false, -1.1
  );
  // Outer right warm amber silk ribbon
  drawFlowingRibbon(
    bottomVertexX + 18, bottomVertexY - 12,
    410, 40, bodyAngle - 0.15, phase, 2.15, false, 1.1
  );
  // Main left emerald janur leaf tail
  drawFlowingRibbon(
    bottomVertexX - 8, bottomVertexY - 5,
    520, 62, bodyAngle + 0.06, phase, 0.0, true, -0.45
  );
  // Main right emerald janur leaf tail
  drawFlowingRibbon(
    bottomVertexX + 8, bottomVertexY - 5,
    495, 58, bodyAngle - 0.07, phase, 1.35, true, 0.5
  );

  // Central Royal Golden Tassel & Star Charm dangling between the ribbons
  const tasselLagAngle = bodyAngle + 0.18 * Math.sin(TAU * (phase * 1 - 0.18)) + 0.06 * Math.sin(TAU * (phase * 2 - 0.25));
  const charmDist = 165;
  const charmX = bottomVertexX - Math.sin(tasselLagAngle) * charmDist;
  const charmY = bottomVertexY + Math.cos(tasselLagAngle) * charmDist;

  // Golden chain to charm
  strokeGoldRim(() => {
    ctx.beginPath();
    ctx.moveTo(bottomVertexX, bottomVertexY);
    ctx.lineTo(charmX, charmY);
  }, 7, 0.5);

  ctx.save();
  ctx.translate(charmX, charmY);
  ctx.rotate(tasselLagAngle);

  // Swaying golden silk fringe threads under the charm
  const numFringe = 13;
  for (let i = 0; i < numFringe; i++) {
    const fRatio = (i / (numFringe - 1)) - 0.5;
    const fSpread = fRatio * 48;
    const fWave = Math.sin(TAU * (phase * 2 - 0.3) + i * 0.45) * 14;
    const fLen = 145 - Math.abs(fRatio) * 35;

    ctx.beginPath();
    ctx.moveTo(fRatio * 18, 22);
    ctx.quadraticCurveTo(fSpread * 0.6 + fWave * 0.5, 22 + fLen * 0.5, fSpread + fWave, 22 + fLen);
    ctx.strokeStyle = (i % 2 === 0) ? '#FFE27A' : '#E0921B';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Tiny glowing gold drop at tip of each fringe thread
    ctx.fillStyle = '#FFF5C8';
    ctx.beginPath();
    ctx.arc(fSpread + fWave, 22 + fLen, 3.5, 0, TAU);
    ctx.fill();
  }

  // Hanging Amber Teardrop & Star Medallion
  const charmPath = () => {
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i * TAU) / 16;
      const r = (i % 2 === 0) ? 38 : 19;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  };
  const charmGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, 38);
  charmGrad.addColorStop(0, '#FFF8DB');
  charmGrad.addColorStop(0.4, '#FFB02E');
  charmGrad.addColorStop(0.85, '#9E4700');
  charmGrad.addColorStop(1, '#3D1500');
  charmPath();
  ctx.fillStyle = charmGrad;
  ctx.fill();
  strokeGoldRim(charmPath, 4.5, 0.5);

  // Center white-gold jewel on charm
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, TAU);
  ctx.fill();
  ctx.restore();

  // 5. MAIN WOVEN KETUPAT BODY (3D-Shaded Plump Diamond with Interlocking 6x6 Anyaman Weave)
  ctx.save();
  ctx.translate(bodyCenterX, bodyCenterY);
  ctx.rotate(bodyAngle);
  ctx.scale(stretchX, stretchY);

  const N = 6; // 6x6 woven strips
  const halfDiag = ketupatRadius;
  const squareSide = halfDiag * Math.SQRT2;
  const halfSide = squareSide / 2;

  // Helper: map grid coordinates (u, v) in [-1, 1]x[-1, 1] to puffed 3D-like ketupat pillow coordinates
  function mapKetupatGrid(u, v) {
    // Rotate (-1..1, -1..1) by 45 degrees so corners are at Top, Right, Bottom, Left
    const rx = (u - v) * 0.5 * halfDiag;
    const ry = (u + v) * 0.5 * halfDiag;
    // Pillow puff distortion (bulges outward smoothly in the center and along mid-edges)
    const rNorm = Math.min(1, Math.hypot(u, v) / Math.SQRT2);
    const puff = 1.0 + 0.14 * Math.cos(rNorm * Math.PI * 0.5);
    return { x: rx * puff, y: ry * puff };
  }

  // Draw outer scalloped fold bumps along the 4 edges (where woven strips wrap around the rim)
  for (let side = 0; side < 4; side++) {
    for (let k = 0; k < N; k++) {
      const t0 = -1 + (2 * k) / N;
      const t1 = -1 + (2 * (k + 1)) / N;
      const tMid = (t0 + t1) * 0.5;

      let pA, pB, pMid;
      if (side === 0) { // Top-Right edge: v = -1, u in [-1, 1]
        pA = mapKetupatGrid(t0, -1);
        pB = mapKetupatGrid(t1, -1);
        pMid = mapKetupatGrid(tMid, -1.09);
      } else if (side === 1) { // Bottom-Right edge: u = 1, v in [-1, 1]
        pA = mapKetupatGrid(1, t0);
        pB = mapKetupatGrid(1, t1);
        pMid = mapKetupatGrid(1.09, tMid);
      } else if (side === 2) { // Bottom-Left edge: v = 1, u in [-1, 1]
        pA = mapKetupatGrid(t1, 1);
        pB = mapKetupatGrid(t0, 1);
        pMid = mapKetupatGrid(tMid, 1.09);
      } else { // Top-Left edge: u = -1, v in [-1, 1]
        pA = mapKetupatGrid(-1, t1);
        pB = mapKetupatGrid(-1, t0);
        pMid = mapKetupatGrid(-1.09, tMid);
      }

      const foldPath = () => {
        ctx.beginPath();
        ctx.moveTo(pA.x, pA.y);
        ctx.quadraticCurveTo(pMid.x, pMid.y, pB.x, pB.y);
        ctx.closePath();
      };
      const isGoldFold = (k + side) % 2 === 0;
      ctx.fillStyle = isGoldFold ? '#D9941A' : '#088243';
      foldPath();
      ctx.fill();
      strokeGoldRim(foldPath, 4.5, 0.25);
    }
  }

  // Base dark silhouette backing behind the weave
  ctx.beginPath();
  const cTop = mapKetupatGrid(-1, -1);
  const cRight = mapKetupatGrid(1, -1);
  const cBottom = mapKetupatGrid(1, 1);
  const cLeft = mapKetupatGrid(-1, 1);
  ctx.moveTo(cTop.x, cTop.y);
  ctx.lineTo(cRight.x, cRight.y);
  ctx.lineTo(cBottom.x, cBottom.y);
  ctx.lineTo(cLeft.x, cLeft.y);
  ctx.closePath();
  ctx.fillStyle = '#011208';
  ctx.fill();

  // Simulated light source sweeping across the 3D pillow surface
  const lightPosX = -110 + 180 * sin1;
  const lightPosY = -130 + 70 * cos2;

  // Draw the 6x6 Woven Cells (Anyaman Interlaced Plaiting)
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const u0 = -1 + (2 * i) / N;
      const u1 = -1 + (2 * (i + 1)) / N;
      const v0 = -1 + (2 * j) / N;
      const v1 = -1 + (2 * (j + 1)) / N;

      // Inset slightly for rich bevel gap between woven ribbons
      const pad = 0.012;
      const p00 = mapKetupatGrid(u0 + pad, v0 + pad);
      const p10 = mapKetupatGrid(u1 - pad, v0 + pad);
      const p11 = mapKetupatGrid(u1 - pad, v1 - pad);
      const p01 = mapKetupatGrid(u0 + pad, v1 - pad);

      const cellCenterX = (p00.x + p10.x + p11.x + p01.x) * 0.25;
      const cellCenterY = (p00.y + p10.y + p11.y + p01.y) * 0.25;

      // Determine whether the U-ribbon (Emerald Green) or V-ribbon (Gold/Amber) is on top
      const isEmeraldOver = (i + j) % 2 === 0;

      // Compute 3D pillow illumination & specular highlight for this facet
      const distToLight = Math.hypot(cellCenterX - lightPosX, cellCenterY - lightPosY);
      const sphericalShade = Math.max(0.15, 1.0 - distToLight / 560);
      const specGlint = Math.pow(Math.max(0, 1.0 - distToLight / 340), 4.0);

      // Cell polygon path
      const cellPath = () => {
        ctx.beginPath();
        ctx.moveTo(p00.x, p00.y);
        ctx.lineTo(p10.x, p10.y);
        ctx.lineTo(p11.x, p11.y);
        ctx.lineTo(p01.x, p01.y);
        ctx.closePath();
      };

      // Gradient aligned with the ribbon's weave direction
      let cellGrad;
      if (isEmeraldOver) {
        // U-strip runs along V (top-left to bottom-right)
        cellGrad = ctx.createLinearGradient(p00.x, p00.y, p11.x, p11.y);
        const hi = Math.min(255, Math.floor(140 + sphericalShade * 105));
        cellGrad.addColorStop(0.0, '#02361A');
        cellGrad.addColorStop(0.25, '#088243');
        cellGrad.addColorStop(0.52, `rgb(${Math.floor(25 + specGlint * 190)}, ${hi}, ${Math.floor(95 + specGlint * 120)})`);
        cellGrad.addColorStop(0.8, '#066B36');
        cellGrad.addColorStop(1.0, '#012411');
      } else {
        // V-strip runs along U (top-right to bottom-left)
        cellGrad = ctx.createLinearGradient(p10.x, p10.y, p01.x, p01.y);
        const hiG = Math.min(255, Math.floor(175 + sphericalShade * 75));
        cellGrad.addColorStop(0.0, '#592802');
        cellGrad.addColorStop(0.25, '#D48210');
        cellGrad.addColorStop(0.52, `rgb(255, ${hiG}, ${Math.floor(85 + specGlint * 160)})`);
        cellGrad.addColorStop(0.8, '#B86206');
        cellGrad.addColorStop(1.0, '#421B00');
      }

      // Fill woven cell with drop shadow for deep over-under 3D relief
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 12;
      cellPath();
      ctx.fillStyle = cellGrad;
      ctx.fill();
      ctx.restore();

      // Delicate leaf-vein striations or gold brocade diamond inside each cell
      ctx.save();
      cellPath();
      ctx.clip();

      if (isEmeraldOver) {
        // Fine parallel leaf veins along the emerald janur strip
        ctx.strokeStyle = `rgba(160, 255, 205, ${0.18 + 0.25 * sphericalShade})`;
        ctx.lineWidth = 2;
        for (let s = 1; s <= 3; s++) {
          const f = s / 4;
          const sx = p00.x + (p10.x - p00.x) * f;
          const sy = p00.y + (p10.y - p00.y) * f;
          const ex = p01.x + (p11.x - p01.x) * f;
          const ey = p01.y + (p11.y - p01.y) * f;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(ex, ey);
          ctx.stroke();
        }
      } else {
        // Ornamental embossed golden diamond motif on the gold/amber strips
        const mx0 = (p00.x + p10.x) * 0.5;
        const my0 = (p00.y + p10.y) * 0.5;
        const mx1 = (p10.x + p11.x) * 0.5;
        const my1 = (p10.y + p11.y) * 0.5;
        const mx2 = (p11.x + p01.x) * 0.5;
        const my2 = (p11.y + p01.y) * 0.5;
        const mx3 = (p01.x + p00.x) * 0.5;
        const my3 = (p01.y + p00.y) * 0.5;

        ctx.strokeStyle = `rgba(255, 248, 200, ${0.35 + 0.35 * sphericalShade})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo((mx0 + cellCenterX) * 0.5, (my0 + cellCenterY) * 0.5);
        ctx.lineTo((mx1 + cellCenterX) * 0.5, (my1 + cellCenterY) * 0.5);
        ctx.lineTo((mx2 + cellCenterX) * 0.5, (my2 + cellCenterY) * 0.5);
        ctx.lineTo((mx3 + cellCenterX) * 0.5, (my3 + cellCenterY) * 0.5);
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = `rgba(255, 250, 220, ${0.5 + 0.4 * specGlint})`;
        ctx.beginPath();
        ctx.arc(cellCenterX, cellCenterY, 3.5, 0, TAU);
        ctx.fill();
      }
      ctx.restore();

      // Glossy gold wire trim along each woven strip edge
      ctx.strokeStyle = isEmeraldOver
        ? `rgba(250, 210, 100, ${0.55 + 0.35 * sphericalShade})`
        : `rgba(255, 242, 185, ${0.65 + 0.35 * sphericalShade})`;
      ctx.lineWidth = 3;
      cellPath();
      ctx.stroke();
    }
  }

  // Central Royal Medallion Inlay at the heart of the Ketupat
  ctx.save();
  const centerMedallionPath = () => {
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i * TAU) / 16;
      const r = (i % 2 === 0) ? 74 : 42;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  };
  const medGrad = ctx.createRadialGradient(-10, -10, 4, 0, 0, 74);
  medGrad.addColorStop(0.0, '#FFF9DF');
  medGrad.addColorStop(0.35, '#F5B638');
  medGrad.addColorStop(0.75, '#9E5405');
  medGrad.addColorStop(1.0, '#3D1B00');

  ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
  ctx.shadowBlur = 18;
  centerMedallionPath();
  ctx.fillStyle = medGrad;
  ctx.fill();
  ctx.shadowBlur = 0;
  strokeGoldRim(centerMedallionPath, 6, 0.65);

  // Inner Emerald Star Jewel at center of Medallion
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = (i * TAU) / 16 + Math.PI / 16;
    const r = (i % 2 === 0) ? 44 : 20;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const innerGemGrad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 44);
  innerGemGrad.addColorStop(0, '#A8FFCE');
  innerGemGrad.addColorStop(0.4, '#10C467');
  innerGemGrad.addColorStop(0.85, '#04572B');
  innerGemGrad.addColorStop(1, '#012410');
  ctx.fillStyle = innerGemGrad;
  ctx.fill();
  ctx.strokeStyle = '#FFF2BD';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Warm Amber & White Diamond Core
  const coreCab = ctx.createRadialGradient(-3, -3, 1, 0, 0, 15);
  coreCab.addColorStop(0, '#FFFFFF');
  coreCab.addColorStop(0.45, '#FFB732');
  coreCab.addColorStop(1, '#7A2E00');
  ctx.fillStyle = coreCab;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Starburst glint on center medallion
  const centerSpark = 0.65 + 0.35 * sin3;
  drawSparkleStar(-4, -4, 34 * centerSpark, 7 * centerSpark, 0, 0.9, 'rgba(255,220,100,1)', '#FFFFFF');
  ctx.restore();

  // 4 Ornamental Gold Filigree Corner Caps (Top, Right, Bottom, Left vertices of the Ketupat)
  const corners = [
    { pt: cTop, ang: -Math.PI / 2 },
    { pt: cRight, ang: 0 },
    { pt: cBottom, ang: Math.PI / 2 },
    { pt: cLeft, ang: Math.PI }
  ];
  corners.forEach((c) => {
    ctx.save();
    ctx.translate(c.pt.x, c.pt.y);
    ctx.rotate(c.ang);

    const capPath = () => {
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.quadraticCurveTo(0, -18, -32, -26);
      ctx.quadraticCurveTo(-18, 0, -32, 26);
      ctx.quadraticCurveTo(0, 18, 28, 0);
      ctx.closePath();
    };
    const capGrad = ctx.createLinearGradient(-30, -25, 28, 25);
    capGrad.addColorStop(0, '#784604');
    capGrad.addColorStop(0.5, '#FFE88F');
    capGrad.addColorStop(1, '#9E5E08');
    capPath();
    ctx.fillStyle = capGrad;
    ctx.fill();
    strokeGoldRim(capPath, 5, 0.5);

    // Small amber jewel in each corner cap
    ctx.fillStyle = '#FF981A';
    ctx.beginPath();
    ctx.arc(-6, 0, 7, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#FFF5C8';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  });

  ctx.restore(); // End Ketupat Body transform

  // 6. AMBIENT GOLDEN SPARKLES & ORBITING LIGHT MOTES (Deterministic & Seamless)
  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  for (let i = 0; i < NUM_SPARKLES; i++) {
    const s = SPARKLES[i];

    // Closed periodic Lissajous/elliptical drift with integer frequencies
    const px = s.baseX + Math.cos(TAU * (phase * s.freqX * s.dir + s.phaseOffset)) * s.orbitRx;
    const py = s.baseY + Math.sin(TAU * (phase * s.freqY + s.phaseOffset)) * s.orbitRy;

    const twinkle = Math.pow(0.5 + 0.5 * Math.sin(TAU * (phase * s.twinkleFreq + s.phaseOffset)), 2.2);
    const rot = TAU * phase * s.dir + s.phaseOffset * TAU;

    let mainCol, coreCol;
    if (s.colorType === 'gold') {
      mainCol = 'rgba(255, 205, 65, 1)';
      coreCol = '#FFFDF2';
    } else if (s.colorType === 'amber') {
      mainCol = 'rgba(255, 135, 25, 1)';
      coreCol = '#FFEAC2';
    } else {
      mainCol = 'rgba(35, 235, 130, 1)';
      coreCol = '#E5FFF0';
    }

    if (s.isStar) {
      drawSparkleStar(px, py, s.size * (0.6 + 0.6 * twinkle), s.size * 0.16, rot, twinkle * 0.95, mainCol, coreCol);
    } else {
      const rMote = s.size * 1.1;
      const g = ctx.createRadialGradient(px, py, 0, px, py, rMote);
      g.addColorStop(0, coreCol);
      g.addColorStop(0.35, mainCol.replace('1)', `${twinkle * 0.85})`));
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, rMote, 0, TAU);
      ctx.fill();
    }
  }

  ctx.restore();
};

// Interactive playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
