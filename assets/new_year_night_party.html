<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Full Scene: New Year Night Party - 6s Seamless Loop</title>
  <style>
    :root {
      --sky-night: #141026;
      --sky-mid: #1E173B;
      --building-dark: #251E47;
      --building-deep: #1B1536;
      --ink: #0B0914;
      --neon-yellow: #FDE047;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --acid-lime: #A3E635;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--sky-night);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Sorotan Lampu Panggung Menyapu Langit (6s) */
    .spotlight-left {
      animation: sweepLeft 6s ease-in-out infinite;
    }
    .spotlight-right {
      animation: sweepRight 6s ease-in-out infinite;
    }
    @keyframes sweepLeft {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes sweepRight {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-14deg); }
    }

    /* 2. untaian Bendera Pesta & Awan Bergoyang Halus (6s) */
    .bunting-sway-l { animation: swayFlagL 6s ease-in-out infinite; }
    .bunting-sway-r { animation: swayFlagR 6s ease-in-out infinite; }
    @keyframes swayFlagL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes swayFlagR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.5deg); }
    }

    .cloud-drift-1 { animation: driftA 6s ease-in-out infinite; }
    .cloud-drift-2 { animation: driftB 6s ease-in-out infinite; }
    @keyframes driftA {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(22px); }
    }
    @keyframes driftB {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-22px); }
    }

    /* 3. Tiga Kembang Api Mekar Bergantian di Langit (Siklus 3s) */
    .fw-sky-1 {
      animation: burstSky1 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstSky1 {
      0%, 4% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      18% { transform: scale(1.1) rotate(10deg); opacity: 1; }
      45% { transform: scale(1) rotate(18deg); opacity: 1; }
      60%, 100% { transform: scale(1.22) rotate(25deg); opacity: 0; }
    }

    .fw-sky-2 {
      animation: burstSky2 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstSky2 {
      0%, 26% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      40% { transform: scale(1.12) rotate(-10deg); opacity: 1; }
      68% { transform: scale(1) rotate(-18deg); opacity: 1; }
      82%, 100% { transform: scale(1.22) rotate(-25deg); opacity: 0; }
    }

    .fw-sky-3 {
      animation: burstSky3 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes burstSky3 {
      0%, 48% { transform: scale(0.1) rotate(0deg); opacity: 0; }
      62% { transform: scale(1.1) rotate(8deg); opacity: 1; }
      86% { transform: scale(1) rotate(15deg); opacity: 1; }
      97%, 100% { transform: scale(1.22) rotate(22deg); opacity: 0; }
    }

    /* 4. Botol Perayaan Meletupkan Gabus & Busa (Siklus 3s) */
    .bottle-pop-bounce {
      animation: bottleKick 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes bottleKick {
      0%, 100% { transform: translateY(0px) rotate(-14deg) scale(1, 1); }
      14% { transform: translateY(10px) rotate(-18deg) scale(1.06, 0.92); }
      24% { transform: translateY(-16px) rotate(-10deg) scale(0.95, 1.07); }
      38%, 90% { transform: translateY(0px) rotate(-14deg) scale(1, 1); }
    }

    .cork-fly {
      animation: flyCork 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes flyCork {
      0%, 18% { transform: translate(0px, 0px) rotate(0deg) scale(1); opacity: 1; }
      24% { transform: translate(45px, -110px) rotate(95deg) scale(1.1); opacity: 1; }
      55% { transform: translate(115px, -210px) rotate(240deg) scale(1); opacity: 1; }
      82% { transform: translate(145px, -155px) rotate(330deg) scale(0.9); opacity: 1; }
      95%, 100% { transform: translate(160px, -110px) rotate(380deg) scale(0); opacity: 0; }
    }

    .foam-burst {
      animation: burstFoam 3s ease-out infinite;
    }
    @keyframes burstFoam {
      0%, 18% { transform: scale(0.1); opacity: 0; }
      26% { transform: scale(1.08); opacity: 1; }
      52% { transform: scale(1.25); opacity: 0.9; }
      72%, 100% { transform: scale(1.4); opacity: 0; }
    }

    /* 5. Gelas Pesta Bersulang di Kanan Panggung (Siklus 3s) */
    .toast-l {
      animation: clinkLeft 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .toast-r {
      animation: clinkRight 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes clinkLeft {
      0%, 100% { transform: rotate(-8deg); }
      24% { transform: rotate(-20deg) translateX(-8px); }
      36% { transform: rotate(12deg) translateX(10px); }
      50%, 86% { transform: rotate(4deg) translateX(4px); }
    }
    @keyframes clinkRight {
      0%, 100% { transform: rotate(8deg); }
      24% { transform: rotate(20deg) translateX(8px); }
      36% { transform: rotate(-12deg) translateX(-10px); }
      50%, 86% { transform: rotate(-4deg) translateX(-4px); }
    }

    /* 6. Speaker Panggung Berdenyut Mengikuti Ketukan (1.5s = 4x per loop) */
    .speaker-woofer {
      animation: bassBump 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes bassBump {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.16); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.12); }
    }

    /* 7. Jendela Gedung Kota Berkedip Bergantian (3s) */
    .win-blink-1 { animation: blinkWin 3s steps(2, end) infinite 0s; }
    .win-blink-2 { animation: blinkWin 3s steps(2, end) infinite 1.5s; }
    @keyframes blinkWin {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    /* 8. Hujan Konfeti Terus-Menerus di Seluruh Layar (6s seamless) */
    .confetti-fall-1 { animation: fallLoop1 6s linear infinite; }
    .confetti-fall-2 { animation: fallLoop2 6s linear infinite; }
    @keyframes fallLoop1 {
      0% { transform: translateY(-120px) rotate(0deg); }
      100% { transform: translateY(1120px) rotate(360deg); }
    }
    @keyframes fallLoop2 {
      0% { transform: translateY(-240px) rotate(180deg); }
      100% { transform: translateY(1000px) rotate(-180deg); }
    }
  </style>
</head>
<body>
