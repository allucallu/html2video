<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 Halloween Ghosts Pack (4K Stock Footage Asset)</title>
  <style>
    :root {
      --bg-ui: rgba(14, 16, 22, 0.92);
      --border-ui: rgba(255, 255, 255, 0.14);
      --accent: #58a6ff;
      --accent-ok: #2ea043;
      --accent-err: #f85149;
      --text-main: #e6edf3;
      --text-dim: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    /* Wrapper menjaga rasio 16:9 persis seperti canvas agar overlay nomor UI sejajar sempurna */
    #stage-wrap {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background-color: #000000;
    }

    /* Overlay Nomor Galeri Bentuk di DOM UI (TIDAK digambar ke Canvas) */
    #gallery-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ghost-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(12, 16, 24, 0.78);
      border: 1px solid rgba(180, 220, 255, 0.28);
      color: #d8ecff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .ghost-badge .num {
      color: #58a6ff;
      font-weight: 700;
      margin-right: 4px;
    }

    /* Panel Kontrol Utama (di luar canvas, bisa disembunyikan dengan tombol H) */
    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    body.ui-hidden #ui-root,
    body.ui-hidden #gallery-labels {
      display: none !important;
    }

    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 310px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .pill {
      background: var(--bg-ui);
      border: 1px solid var(--border-ui);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .badge-stage {
      background: rgba(88, 166, 255, 0.18);
      border: 1px solid rgba(88, 166, 255, 0.45);
      color: #9ecbff;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    #fps-display {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #7ee787;
    }

    #side-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 288px;
      max-height: calc(100vh - 92px);
      overflow-y: auto;
      background: var(--bg-ui);
      border: 1px solid var(--border-ui);
      border-radius: 10px;
      padding: 14px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border-ui);
      padding-bottom: 6px;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-main);
    }

    .control-val {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    select, input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-ui);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-ui);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button.primary {
      background: rgba(88, 166, 255, 0.22);
      border-color: rgba(88, 166, 255, 0.55);
      color: #cae8ff;
    }

    button.primary:hover {
      background: rgba(88, 166, 255, 0.34);
    }

    #loop-result {
      font-size: 11px;
      line-height: 1.45;
      padding: 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-ui);
      display: none;
      font-variant-numeric: tabular-nums;
    }

    #loop-result.pass {
      display: block;
      border-color: var(--accent-ok);
      color: #7ee787;
    }

    #loop-result.fail {
      display: block;
      border-color: var(--accent-err);
      color: #ffa198;
    }

    #bottom-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: var(--bg-ui);
      border: 1px solid var(--border-ui);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    #time-readout {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      min-width: 110px;
      color: var(--text-dim);
    }

    #scrubber {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <canvas id="stage" width="3840" height="2160"></canvas>
      <div id="gallery-labels"></div>
    </div>
  </div>

  <div id="ui-root">
    <div id="top-bar">
      <div class="pill">
        <span class="badge-stage" id="mode-badge">TAHAP 1: GALERI BENTUK</span>
        <span>15 Halloween Ghosts Pack</span>
      </div>
      <div class="pill">
        <span>FPS: <strong id="fps-display">--</strong></span>
        <span>|</span>
        <span>Res Internal: <strong id="res-display">1920x1080</strong></span>
        <span>|</span>
        <span>Tekan <strong>H</strong> sembunyikan UI</span>
      </div>
    </div>

    <div id="side-panel">
      <div class="panel-title">Mode & Kualitas Preview</div>

      <div class="control-row">
        <div class="control-header">
          <label for="sel-quality">Skala Kualitas Preview</label>
        </div>
        <select id="sel-quality">
          <option value="4k">4K UHD (3840 × 2160)</option>
          <option value="1080p" selected>1080p Full HD (1920 × 1080)</option>
          <option value="720p">720p HD (1280 × 720)</option>
        </select>
      </div>

      <div class="control-row">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="chk-badges" checked />
          <span>Tampilkan Nomor Bentuk di UI (1–15)</span>
        </label>
      </div>

      <div class="panel-title">Preset Studio</div>
      <div class="control-row">
        <select id="sel-preset" style="width:100%;background:rgba(88,166,255,0.12);border-color:rgba(88,166,255,0.4);color:#d8ecff;">
          <option value="">-- Parameter Kustom / Default --</option>
        </select>
      </div>

      <div class="panel-title">Parameter Aset (asset.params)</div>
      <div id="params-container" style="display:flex;flex-direction:column;gap:10px;"></div>

      <div class="panel-title">Verifikasi & Ekspor Frame</div>
      <div class="btn-group">
        <button id="btn-check-loop" class="primary" style="flex:1;">Cek Loop (t=0 vs durasi)</button>
        <button id="btn-save-png" style="flex:1;">Simpan Frame PNG (4K)</button>
      </div>
      <div id="loop-result"></div>
    </div>

    <div id="bottom-bar">
      <button id="btn-play" class="primary" style="min-width:74px;">Play</button>
      <input type="range" id="scrubber" min="0" max="12" step="0.001" value="0" />
      <div id="time-readout">t = 0.00s / 12.00s</div>
      <label for="sel-speed" style="font-size:12px;color:var(--text-dim);">Speed:</label>
      <select id="sel-speed" style="width:74px;">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
      </select>
    </div>
  </div>

    /* =========================================================================
     * [RNG] — Generator Angka Acak Deterministik (Mulberry32)
     * ========================================================================= */
    function mulberry32(seed) {
      let a = (seed >>> 0) + 0x6d2b79f5;
      return function nextRandom() {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /* =========================================================================
     * [DRAW HELPERS] — Interpolasi Kurva Cubic Bezier & Penggambaran Glow/Lubang
     * ========================================================================= */

    /**
     * Menghitung koordinat pusat sel grid (5 baris × 3 kolom) dalam koordinat desain 1920×1080.
     */
    function getGridCellPosition(row, col) {
      const usableW = DESIGN_WIDTH - GRID_MARGIN_X * 2;
      const usableH = DESIGN_HEIGHT - GRID_MARGIN_TOP - GRID_MARGIN_BOTTOM;
      const x = GRID_MARGIN_X + (col / (GRID_COLS - 1)) * usableW;
      const y = GRID_MARGIN_TOP + (row / (GRID_ROWS - 1)) * usableH;
      return { x, y };
    }

    /**
     * Menggambar kurva tertutup Cubic Bezier yang halus dari array simpul [x, y, tension].
     * Menggunakan konversi Catmull-Rom ke Cubic Bezier agar tidak ada sudut patah
     * kecuali pada simpul dengan tension rendah (gigi, ujung robekan).
     */
    function traceSmoothClosedSpline(ctx, points) {
      const n = points.length;
      if (n < 3) return;

      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < n; i++) {
        const p0 = points[(i - 1 + n) % n];
        const p1 = points[i];
        const p2 = points[(i + 1) % n];
        const p3 = points[(i + 2) % n];

        const t1 = p1.tension !== undefined ? p1.tension : 0.5;
        const t2 = p2.tension !== undefined ? p2.tension : 0.5;

        const cp1x = p1.x + ((p2.x - p0.x) * t1) / 3;
        const cp1y = p1.y + ((p2.y - p0.y) * t1) / 3;
        const cp2x = p2.x - ((p3.x - p1.x) * t2) / 3;
        const cp2y = p2.y - ((p3.y - p1.y) * t2) / 3;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
      ctx.closePath();
    }

    /**
     * Menambahkan subpath lubang mata atau mulut ke path aktif (untuk fill-rule evenodd).
     */
    function addCutoutSubpath(ctx, hole, blinkScaleY) {
      if (!hole) return;
      const sy = blinkScaleY !== undefined ? blinkScaleY : 1.0;

      if (hole.type === "ellipse") {
        const ry = Math.max(1.2, hole.ry * sy);
        ctx.ellipse(hole.x, hole.y, hole.rx, ry, hole.rot || 0, 0, TAU_FULL);
        ctx.closePath();
      } else if (hole.type === "poly" && hole.points) {
        let cy = 0;
        for (let i = 0; i < hole.points.length; i++) {
          cy += hole.points[i][1];
        }
        cy /= hole.points.length;

        const pts = hole.points.map((pt) => ({
          x: pt[0],
          y: cy + (pt[1] - cy) * sy,
          tension: pt[2] !== undefined ? pt[2] : 0.35,
        }));
        traceSmoothClosedSpline(ctx, pts);
      }
    }

    /**
     * Menggambar partikel wisp (asap/cahaya kecil) deterministik untuk satu hantu.
     */
    function drawGhostWisps(ctx, ghostSeedProps, p, wispCount, themeObj, glowIntensity) {
      if (wispCount <= 0) return;
      const [wr, wg, wb] = themeObj.wispRgb;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      for (let i = 0; i < wispCount; i++) {
        const wispSpec = ghostSeedProps.wisps[i];
        if (!wispSpec) break;

        // Fase lokal partikel sepanjang siklus (integer speed agar 100% seamless loop)
        const localPhase = (p * wispSpec.cycles + wispSpec.phaseOffset) % 1;
        // Amplop muncul-memudar halus sin(pi * localPhase)^2 -> bernilai tepat 0 di 0 dan 1
        const env = Math.sin(Math.PI * localPhase);
        const alpha = env * env * wispSpec.maxAlpha * Math.min(1.4, glowIntensity);
        if (alpha <= 0.003) continue;

        const riseY = wispSpec.startY - localPhase * wispSpec.riseDistance;
        const swayX =
          wispSpec.startX +
          Math.sin(localPhase * TAU_FULL * wispSpec.swayCycles + wispSpec.swayPhase) *
            wispSpec.swayAmp;
        const radius = wispSpec.baseRadius * (0.55 + 0.65 * env);

        // Gambar titik wisp berlapis tanpa shadowBlur (2 lapis lingkaran konsentris)
        ctx.fillStyle = `rgba(${wr}, ${wg}, ${wb}, ${(alpha * 0.32).toFixed(4)})`;
        ctx.beginPath();
        ctx.arc(swayX, riseY, radius * 2.1, 0, TAU_FULL);
        ctx.fill();

        ctx.fillStyle = `rgba(${wr}, ${wg}, ${wb}, ${alpha.toFixed(4)})`;
        ctx.beginPath();
        ctx.arc(swayX, riseY, radius, 0, TAU_FULL);
        ctx.fill();
      }

      ctx.restore();
    }

    /**
     * Menggambar satu hantu lengkap:
     * 1. Clip lubang mata & mulut agar glow tidak mengotori bagian dalam mata/mulut (#000000 murni).
     * 2. Glow berlapis dengan stroke membesar dan alpha mengecil dalam mode 'lighter'.
     * 3. Isi tubuh hantu dengan gradasi radial halus (#ffffff -> #e9f4ff -> tepi) memakai fill("evenodd").
     */
    function drawSingleGhost(ctx, ghost, deformedPoints, animState, themeObj, glowIntensity) {
      const [gr, gg, gb] = themeObj.glowRgb;
      const totalGlow = glowIntensity * animState.glowPulse;

      ctx.save();
      ctx.translate(animState.x, animState.y);
      ctx.rotate(animState.rotation);
      ctx.scale(animState.scale, animState.scale);

      // 1. Buat evenodd clip region di luar lubang mata & mulut agar lubang tetap #000000 murni
      ctx.save();
      ctx.beginPath();
      ctx.rect(-180, -180, 360, 360);
      for (let i = 0; i < ghost.eyes.length; i++) {
        addCutoutSubpath(ctx, ghost.eyes[i], animState.blinkScaleY);
      }
      if (ghost.mouth) {
        addCutoutSubpath(ctx, ghost.mouth, 1.0);
      }
      ctx.clip("evenodd");

      // 2. Gambar Glow Berlapis (mode 'lighter', tanpa shadowBlur / ctx.filter)
      ctx.globalCompositeOperation = "lighter";
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      ctx.beginPath();
      traceSmoothClosedSpline(ctx, deformedPoints);

      for (let i = 0; i < GLOW_RING_FACTORS.length; i++) {
        const ring = GLOW_RING_FACTORS[i];
        const ringAlpha = Math.min(1, ring.alpha * totalGlow);
        if (ringAlpha <= 0.001) continue;
        ctx.lineWidth = ring.width;
        ctx.strokeStyle = `rgba(${gr}, ${gg}, ${gb}, ${ringAlpha.toFixed(4)})`;
        ctx.stroke();
      }
      ctx.restore();

      // 3. Gambar Tubuh Utama + Lubang Mata & Mulut (fill-rule: evenodd)
      ctx.beginPath();
      traceSmoothClosedSpline(ctx, deformedPoints);
      for (let i = 0; i < ghost.eyes.length; i++) {
        addCutoutSubpath(ctx, ghost.eyes[i], animState.blinkScaleY);
      }
      if (ghost.mouth) {
        addCutoutSubpath(ctx, ghost.mouth, 1.0);
      }

      const bodyGrad = ctx.createRadialGradient(0, -24, 8, 0, 6, 92);
      bodyGrad.addColorStop(0.0, themeObj.core);
      bodyGrad.addColorStop(0.62, themeObj.mid);
      bodyGrad.addColorStop(1.0, themeObj.edge);

      ctx.fillStyle = bodyGrad;
      ctx.fill("evenodd");

      ctx.restore();
    }

    /* =========================================================================
     * [ANIMATION] — Perhitungan Deterministik Posisi, Deformasi Ekor, Kedip, & Wisp
     * ========================================================================= */

    /**
     * Membangun tabel parameter acak deterministik per hantu dari params.seed.
     */
    function buildDeterministicGhostTable(seed) {
      const rand = mulberry32(seed);
      const table = [];

      for (let i = 0; i < GHOSTS.length; i++) {
        const g = GHOSTS[i];
        const basePos = getGridCellPosition(g.row, g.col);

        // Frekuensi wajib INTEGER terhadap siklus agar t=0 dan t=duration 100% identik
        const bobFreq = 1 + (i % 3); // 1, 2, atau 3 siklus per durasi
        const bobAmp = 9 + rand() * 11; // 9..20 px desain
        const bobPhase = rand() * TAU_FULL;

        const swayFreq = 1 + ((i + 1) % 2); // 1 atau 2 siklus
        const swayAmpX = 4 + rand() * 7;
        const rotAmp = (1.6 + rand() * 1.4) * (Math.PI / 180); // ±3 derajat
        const swayPhase = rand() * TAU_FULL;

        const tailFreq = 2 + (i % 3); // 2, 3, atau 4 siklus gelombang ekor
        const tailAmpX = 6 + rand() * 6;
        const tailAmpY = 3.5 + rand() * 4;
        const tailPhase = rand() * TAU_FULL;

        const glowFreq = 1 + (i % 2);
        const glowPhase = rand() * TAU_FULL;

        // Waktu kedip 1 kali per siklus (0.08 .. 0.92 agar tidak tepat di batas sambungan 0/1)
        const blinkCenterP = 0.08 + rand() * 0.84;

        // Parameter mode "drift" (wrap-around horizontal mulus dengan kecepatan integer)
        const driftCycles = 1 + (i % 2); // 1 atau 2 kali lintasan penuh per siklus
        const driftDir = i % 2 === 0 ? 1 : -1;
        const driftStartX = rand() * DESIGN_WIDTH;
        const driftBaseY = 120 + ((i * 61 + rand() * 40) % (DESIGN_HEIGHT - 240));
        const driftScale = 0.58 + rand() * 0.36;

        // Data partikel wisp deterministik (maksimum 80 per hantu)
        const wisps = [];
        for (let w = 0; w < 80; w++) {
          wisps.push({
            startX: (rand() - 0.5) * 90,
            startY: (rand() - 0.35) * 95,
            riseDistance: 32 + rand() * 54,
            cycles: 1 + Math.floor(rand() * 3), // Integer: 1, 2, atau 3
            phaseOffset: rand(),
            swayCycles: 1 + Math.floor(rand() * 2),
            swayPhase: rand() * TAU_FULL,
            swayAmp: 4 + rand() * 10,
            baseRadius: 1.4 + rand() * 2.4,
            maxAlpha: 0.28 + rand() * 0.45,
          });
        }

        table.push({
          gridX: basePos.x,
          gridY: basePos.y,
          bobFreq,
          bobAmp,
          bobPhase,
          swayFreq,
          swayAmpX,
          rotAmp,
          swayPhase,
          tailFreq,
          tailAmpX,
          tailAmpY,
          tailPhase,
          glowFreq,
          glowPhase,
          blinkCenterP,
          driftCycles,
          driftDir,
          driftStartX,
          driftBaseY,
          driftScale,
          wisps,
        });
      }

      return table;
    }

    /**
     * Menghitung state transformasi dan deformasi titik kontur hantu ke-i pada fase loop p in [0, 1).
     */
    function evaluateGhostAtPhase(ghost, spec, p, params) {
      const isGallery = params.mode === "gallery";
      const tau = p * TAU_FULL;

      if (isGallery) {
        const pts = ghost.contour.map((c) => ({
          x: c[0],
          y: c[1],
          tension: c[2],
        }));
        return {
          animState: {
            x: spec.gridX,
            y: spec.gridY,
            rotation: 0,
            scale: 0.86,
            blinkScaleY: 1.0,
            glowPulse: 1.0,
          },
          deformedPoints: pts,
        };
      }

      // 1. Posisi dasar berdasarkan layout ("grid" vs "drift")
      let baseX = spec.gridX;
      let baseY = spec.gridY;
      let baseScale = 0.86;

      if (params.layout === "drift") {
        // Wrap-around dengan margin aman agar hantu tidak terpotong kasar saat melintas tepi
        const loopSpan = DESIGN_WIDTH + 320;
        const rawX =
          spec.driftStartX + spec.driftDir * spec.driftCycles * p * loopSpan;
        const wrappedX = ((rawX % loopSpan) + loopSpan) % loopSpan;
        baseX = wrappedX - 160;
        baseY = spec.driftBaseY;
        baseScale = spec.driftScale;
      }

      // 2. Melayang vertikal & goyang rotasi/horizontal (frekuensi integer)
      const dy = Math.sin(spec.bobFreq * tau + spec.bobPhase) * spec.bobAmp;
      const dx = Math.cos(spec.swayFreq * tau + spec.swayPhase) * spec.swayAmpX;
      const rotation = Math.sin(spec.swayFreq * tau + spec.swayPhase) * spec.rotAmp;

      // 3. Kedip mata 1 kali per siklus
      const blinkDist = Math.abs(p - spec.blinkCenterP);
      const blinkWindow = 0.022;
      let blinkScaleY = 1.0;
      if (blinkDist < blinkWindow) {
        const normB = blinkDist / blinkWindow;
        const closeFactor = Math.cos(normB * (Math.PI / 2));
        blinkScaleY = 1.0 - 0.88 * (closeFactor * closeFactor);
      }

      // 4. Denyut intensitas glow
      const glowPulse =
        0.86 + 0.22 * Math.sin(spec.glowFreq * tau + spec.glowPhase);

      // 5. Deformasi titik ekor/ujung bawah
      const deformedPoints = ghost.contour.map((c) => {
        const cx = c[0];
        const cy = c[1];
        const tension = c[2];
        const weight = c[3] || 0;
        const localPhase = c[4] || 0;

        if (weight <= 0.001) {
          return { x: cx, y: cy, tension };
        }

        const waveAngle = spec.tailFreq * tau + spec.tailPhase + localPhase;
        const ox = Math.sin(waveAngle) * spec.tailAmpX * weight;
        const oy = Math.cos(waveAngle) * spec.tailAmpY * weight;

        return {
          x: cx + ox,
          y: cy + oy,
          tension,
        };
      });

      return {
        animState: {
          x: baseX + dx,
          y: baseY + dy,
          rotation,
          scale: baseScale,
          blinkScaleY,
          glowPulse,
        },
        deformedPoints,
      };
    }

    /* =========================================================================
     * [CONTRACT] — Kontrak Aset Utama (window.asset & window.__assetReady)
     * ========================================================================= */
    let activeCtx = null;
    let cachedSeed = null;
    let cachedGhostTable = null;

    window.__assetReady = false;

    window.asset = {
      meta: {
        width: INTERNAL_4K_WIDTH,
        height: INTERNAL_4K_HEIGHT,
        fps: DEFAULT_FPS,
        duration: DEFAULT_DURATION,
      },
      params: {
        mode: "gallery", // Default Tahap 1: "Galeri Bentuk" (ubah ke "animate" untuk Tahap 2)
        layout: "grid",
        theme: "ghost-white",
        bg: "black", // "black" (solid #000000) atau "alpha" (transparan)
        seed: 42026,
        duration: DEFAULT_DURATION,
        ghostCount: 15,
        glowIntensity: 1.0,
        wispCount: 48,
      },
      setup: async (ctx) => {
        activeCtx = ctx;
        if (typeof window !== "undefined" && window.__cliParams) {
          Object.assign(window.asset.params, window.__cliParams);
        }
        cachedSeed = window.asset.params.seed;
        cachedGhostTable = buildDeterministicGhostTable(cachedSeed);
        window.__assetReady = true;
      },
      applyParams: () => {
        cachedSeed = window.asset.params.seed;
        cachedGhostTable = buildDeterministicGhostTable(cachedSeed);
      },
      render: (t) => {
        if (!activeCtx) return;
        const ctx = activeCtx;
        const params = window.asset.params;

        // Sinkronisasi durasi meta & tabel RNG jika seed berubah
        const duration = Math.max(0.1, Number(params.duration) || DEFAULT_DURATION);
        window.asset.meta.duration = duration;

        if (cachedSeed !== params.seed || !cachedGhostTable) {
          cachedSeed = params.seed;
          cachedGhostTable = buildDeterministicGhostTable(cachedSeed);
        }

        const canvas = ctx.canvas;
        const cw = canvas.width;
        const ch = canvas.height;

        // 1. Bersihkan frame sesuai mode latar belakang (black solid #000000 atau transparent alpha)
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        if (params.bg === "alpha") {
          ctx.clearRect(0, 0, cw, ch);
        } else {
          ctx.globalAlpha = 1.0;
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, cw, ch);
        }

        // 2. Skala sistem koordinat desain (1920x1080) ke ukuran internal canvas (mis. 2x pada 3840x2160)
        const scaleX = cw / DESIGN_WIDTH;
        const scaleY = ch / DESIGN_HEIGHT;
        ctx.scale(scaleX, scaleY);

        // 3. Hitung fase loop p in [0, 1) secara deterministik; t=0 dan t=duration menghasilkan p=0
        const rawMod = ((t % duration) + duration) % duration;
        const p = rawMod / duration;

        const themeObj = COLOR_THEMES[params.theme] || COLOR_THEMES["ghost-white"];
        const count = Math.max(1, Math.min(GHOSTS.length, Math.floor(params.ghostCount)));
        const glowIntensity = Number(params.glowIntensity) || 1.0;
        const wispCount = params.mode === "gallery" ? 0 : Math.floor(params.wispCount || 0);

        for (let i = 0; i < count; i++) {
          const ghost = GHOSTS[i];
          const spec = cachedGhostTable[i];
          const { animState, deformedPoints } = evaluateGhostAtPhase(
            ghost,
            spec,
            p,
            params
          );

          // Gambar wisp di sekitar hantu (hanya pada mode animasi)
          if (wispCount > 0) {
            ctx.save();
            ctx.translate(animState.x, animState.y);
            ctx.scale(animState.scale, animState.scale);
            drawGhostWisps(ctx, spec, p, wispCount, themeObj, glowIntensity);
            ctx.restore();
          }

          // Gambar tubuh hantu + glow berlapis + lubang mata/mulut evenodd
          drawSingleGhost(ctx, ghost, deformedPoints, animState, themeObj, glowIntensity);
        }

        ctx.restore();
      },
    };

    /* =========================================================================
     * [PREVIEW UI] — Pemutar Preview, Generator Panel Parameter, Cek Loop & Ekspor PNG
     * ========================================================================= */
    (async function initPreviewApp() {
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: true });

      const galleryLabelsEl = document.getElementById("gallery-labels");
      const paramsContainer = document.getElementById("params-container");
      const btnPlay = document.getElementById("btn-play");
      const scrubber = document.getElementById("scrubber");
      const timeReadout = document.getElementById("time-readout");
      const selSpeed = document.getElementById("sel-speed");
      const selQuality = document.getElementById("sel-quality");
      const chkBadges = document.getElementById("chk-badges");
      const fpsDisplay = document.getElementById("fps-display");
      const resDisplay = document.getElementById("res-display");
      const modeBadge = document.getElementById("mode-badge");
      const btnCheckLoop = document.getElementById("btn-check-loop");
      const btnSavePng = document.getElementById("btn-save-png");
      const loopResultEl = document.getElementById("loop-result");
      const stageWrap = document.getElementById("stage-wrap");

      let isPlaying = true;
      let currentTime = 0;
      let playbackSpeed = 1.0;
      let lastPerfNow = performance.now();
      let fpsFrames = 0;
      let fpsLastSample = performance.now();

      function updateStageBackground() {
        if (!stageWrap) return;
        if (window.asset.params.bg === "alpha") {
          stageWrap.style.background = "repeating-conic-gradient(#1c1f26 0% 25%, #0e1117 0% 50%) 50% / 24px 24px";
        } else {
          stageWrap.style.background = "#000000";
        }
      }

      // Set default preview quality ke 1080p agar ringan di laptop biasa (4K dipakai saat dipilih / ekspor PNG)
      function applyPreviewQuality(q) {
        if (q === "4k") {
          canvas.width = 3840;
          canvas.height = 2160;
        } else if (q === "720p") {
          canvas.width = 1280;
          canvas.height = 720;
        } else {
          canvas.width = 1920;
          canvas.height = 1080;
        }
        resDisplay.textContent = `${canvas.width}×${canvas.height}`;
        window.asset.render(currentTime);
      }

      // Buat badge nomor kecil di UI (bukan di kanvas) untuk ke-15 hantu
      function renderGalleryBadges() {
        galleryLabelsEl.innerHTML = "";
        const showBadges =
          chkBadges.checked &&
          window.asset.params.layout === "grid";
        galleryLabelsEl.style.display = showBadges ? "block" : "none";
        if (!showBadges) return;

        const count = Math.max(1, Math.min(GHOSTS.length, Math.floor(window.asset.params.ghostCount)));
        for (let i = 0; i < count; i++) {
          const g = GHOSTS[i];
          const pos = getGridCellPosition(g.row, g.col);
          // Tempatkan badge sedikit di bawah tiap siluet hantu
          const leftPct = (pos.x / DESIGN_WIDTH) * 100;
          const topPct = ((pos.y + 82) / DESIGN_HEIGHT) * 100;

          const badge = document.createElement("div");
          badge.className = "ghost-badge";
          badge.style.left = `${leftPct.toFixed(2)}%`;
          badge.style.top = `${topPct.toFixed(2)}%`;
          badge.innerHTML = `<span class="num">#${String(g.id).padStart(2, "0")}</span>${g.name}`;
          galleryLabelsEl.appendChild(badge);
        }
      }

      function updateModeHeader() {
        if (window.asset.params.mode === "gallery") {
          modeBadge.textContent = "TAHAP 1: GALERI BENTUK";
        } else {
          modeBadge.textContent = "TAHAP 2: ANIMASI AKTIF";
        }
        renderGalleryBadges();
      }

      // Generate UI parameter otomatis dari window.asset.params & PARAM_SCHEMA
      function buildParamsUI() {
        paramsContainer.innerHTML = "";
        const params = window.asset.params;

        Object.keys(PARAM_SCHEMA).forEach((key) => {
          const schema = PARAM_SCHEMA[key];
          const row = document.createElement("div");
          row.className = "control-row";

          const header = document.createElement("div");
          header.className = "control-header";

          const lbl = document.createElement("label");
          lbl.textContent = schema.label;
          header.appendChild(lbl);

          const valSpan = document.createElement("span");
          valSpan.className = "control-val";
          if (schema.type === "range") {
            valSpan.textContent = params[key];
            header.appendChild(valSpan);
          }
          row.appendChild(header);

          if (schema.type === "select") {
            const sel = document.createElement("select");
            schema.options.forEach((opt) => {
              const o = document.createElement("option");
              o.value = opt.value;
              o.textContent = opt.label;
              if (String(params[key]) === String(opt.value)) o.selected = true;
              sel.appendChild(o);
            });
            sel.addEventListener("change", () => {
              params[key] = sel.value;
              updateModeHeader();
              if (key === "bg") updateStageBackground();
              window.asset.render(currentTime);
            });
            row.appendChild(sel);
          } else if (schema.type === "range") {
            const inp = document.createElement("input");
            inp.type = "range";
            inp.min = schema.min;
            inp.max = schema.max;
            inp.step = schema.step;
            inp.value = params[key];
            inp.addEventListener("input", () => {
              params[key] = Number(inp.value);
              valSpan.textContent = params[key];
              if (key === "duration") {
                scrubber.max = params.duration;
                if (currentTime > params.duration) currentTime = 0;
              }
              if (key === "ghostCount") {
                renderGalleryBadges();
              }
              window.asset.render(currentTime);
            });
            row.appendChild(inp);
          } else if (schema.type === "number") {
            const inp = document.createElement("input");
            inp.type = "number";
            inp.min = schema.min;
            inp.max = schema.max;
            inp.step = schema.step;
            inp.value = params[key];
            inp.addEventListener("change", () => {
              params[key] = Number(inp.value) || 1;
              window.asset.render(currentTime);
            });
            row.appendChild(inp);
          }

          paramsContainer.appendChild(row);
        });
      }

      // Verifikasi bawaan: Tombol "Cek Loop" (bandingkan piksel frame t=0 vs t=duration)
      function runLoopVerification() {
        const wasPlaying = isPlaying;
        isPlaying = false;
        btnPlay.textContent = "Play";

        const dur = window.asset.params.duration;
        const w = canvas.width;
        const h = canvas.height;

        window.asset.render(0);
        const data0 = ctx.getImageData(0, 0, w, h).data;

        window.asset.render(dur);
        const dataEnd = ctx.getImageData(0, 0, w, h).data;

        let diffPixels = 0;
        let maxChannelDiff = 0;
        let totalAbsDiff = 0;
        const totalPixels = w * h;

        for (let i = 0; i < data0.length; i += 4) {
          const dr = Math.abs(data0[i] - dataEnd[i]);
          const dg = Math.abs(data0[i + 1] - dataEnd[i + 1]);
          const db = Math.abs(data0[i + 2] - dataEnd[i + 2]);
          const m = Math.max(dr, dg, db);
          if (m > 0) {
            diffPixels++;
            totalAbsDiff += dr + dg + db;
            if (m > maxChannelDiff) maxChannelDiff = m;
          }
        }

        // Cek kemurnian piksel sudut luar (harus tepat rgb(0,0,0) jika black solid, atau alpha 0 jika transparan)
        const isAlpha = window.asset.params.bg === "alpha";
        const cornerAlphaSum = data0[3] + data0[(w - 1) * 4 + 3];
        const cornerRgbSum =
          data0[0] + data0[1] + data0[2] +
          data0[(w - 1) * 4] + data0[(w - 1) * 4 + 1] + data0[(w - 1) * 4 + 2];
        const cornerClean = isAlpha ? cornerAlphaSum === 0 : cornerRgbSum === 0;

        const meanDiff = totalAbsDiff / (totalPixels * 3);
        const passed = diffPixels === 0 && cornerClean;

        loopResultEl.className = passed ? "pass" : "fail";
        loopResultEl.innerHTML =
          `<strong>Status Cek Loop: ${passed ? "LULUS (100% Identik)" : "GAGAL"}</strong><br/>` +
          `Latar: <strong>${isAlpha ? "Transparan (Alpha)" : "Black Solid (#000000)"}</strong><br/>` +
          `Selisih Piksel (t=0 vs t=${dur}s): <strong>${diffPixels} px</strong> dari ${totalPixels.toLocaleString()} px<br/>` +
          `Maks Selisih Kanal: <strong>${maxChannelDiff}</strong> | MAE: <strong>${meanDiff.toFixed(6)}</strong><br/>` +
          `Piksel Tepi Luar: <strong>${isAlpha ? "Alpha " + data0[3] : "RGB(" + data0[0] + "," + data0[1] + "," + data0[2] + ")"}</strong>`;

        window.asset.render(currentTime);
        if (wasPlaying) {
          isPlaying = true;
          btnPlay.textContent = "Pause";
          lastPerfNow = performance.now();
        }
      }

      // Ekspor Frame PNG Ukuran Penuh 4K (3840x2160)
      function saveFull4KFramePng() {
        const prevW = canvas.width;
        const prevH = canvas.height;

        canvas.width = INTERNAL_4K_WIDTH;
        canvas.height = INTERNAL_4K_HEIGHT;
        window.asset.render(currentTime);

        canvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `ghost-pack-4k-${window.asset.params.mode}-${window.asset.params.bg}-t${currentTime.toFixed(2)}s.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
          }
          canvas.width = prevW;
          canvas.height = prevH;
          window.asset.render(currentTime);
        }, "image/png");
      }

      // Inisialisasi Kontrak Aset
      await window.asset.setup(ctx);
      buildParamsUI();
      updateStageBackground();
      applyPreviewQuality(selQuality.value);
      updateModeHeader();

      // Kontrol Preset Studio Terintegrasi
      const selPreset = document.getElementById("sel-preset");
      async function loadPresetFile(presetPath) {
        if (!presetPath) return;
        try {
          const res = await fetch("/" + presetPath.replace(/^\/+/, ""));
          if (!res.ok) return;
          const data = await res.json();
          const p = { ...(data.params || {}) };
          if (data.bg) p.bg = data.bg;
          Object.assign(window.asset.params, p);
          if (typeof window.asset.applyParams === "function") {
            window.asset.applyParams();
          }
          buildParamsUI();
          updateStageBackground();
          updateModeHeader();
          window.asset.render(currentTime);
        } catch (err) {
          console.warn("[Preset] Gagal memuat:", err);
        }
      }

      if (typeof fetch !== "undefined") {
        fetch("/api/presets")
          .then((r) => (r.ok ? r.json() : []))
          .then((presetsList) => {
            presetsList.forEach((pr) => {
              const opt = document.createElement("option");
              opt.value = pr.file;
              opt.textContent = `${pr.name} (${pr.bg === "alpha" ? "Alpha" : "Black"})`;
              selPreset.appendChild(opt);
            });
            const urlQueryPreset = new URLSearchParams(window.location.search).get("preset");
            if (urlQueryPreset) selPreset.value = urlQueryPreset;
          })
          .catch(() => {});
      }

      const initialPreset = new URLSearchParams(window.location.search).get("preset");
      if (initialPreset) {
        await loadPresetFile(initialPreset);
      }

      selPreset.addEventListener("change", async () => {
        if (selPreset.value) {
          const newUrl = new URL(window.location);
          newUrl.searchParams.set("preset", selPreset.value);
          window.history.replaceState({}, "", newUrl);
          await loadPresetFile(selPreset.value);
        } else {
          const newUrl = new URL(window.location);
          newUrl.searchParams.delete("preset");
          window.history.replaceState({}, "", newUrl);
          location.reload();
        }
      });

      // Event Listeners UI
      btnPlay.addEventListener("click", () => {
        isPlaying = !isPlaying;
        btnPlay.textContent = isPlaying ? "Pause" : "Play";
        lastPerfNow = performance.now();
      });

      scrubber.addEventListener("input", () => {
        currentTime = Number(scrubber.value);
        timeReadout.textContent = `t = ${currentTime.toFixed(2)}s / ${window.asset.params.duration.toFixed(2)}s`;
        window.asset.render(currentTime);
      });

      selSpeed.addEventListener("change", () => {
        playbackSpeed = Number(selSpeed.value) || 1.0;
      });

      selQuality.addEventListener("change", () => {
        applyPreviewQuality(selQuality.value);
      });

      chkBadges.addEventListener("change", () => {
        renderGalleryBadges();
      });

      btnCheckLoop.addEventListener("click", runLoopVerification);
      btnSavePng.addEventListener("click", saveFull4KFramePng);

      window.addEventListener("keydown", (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
        if (e.key === "h" || e.key === "H") {
          document.body.classList.toggle("ui-hidden");
        } else if (e.key === " ") {
          e.preventDefault();
          btnPlay.click();
        }
      });

      // Loop Pemutar Preview (performance.now HANYA dipakai di sini untuk menggerakkan t)
      btnPlay.textContent = "Pause";
      function tick(now) {
        fpsFrames++;
        if (now - fpsLastSample >= 500) {
          const fps = Math.round((fpsFrames * 1000) / (now - fpsLastSample));
          fpsDisplay.textContent = String(fps);
          fpsFrames = 0;
          fpsLastSample = now;
        }

        if (isPlaying) {
          const dt = (now - lastPerfNow) / 1000;
          const dur = window.asset.params.duration;
          currentTime = (currentTime + dt * playbackSpeed) % dur;
          scrubber.value = currentTime.toFixed(3);
          timeReadout.textContent = `t = ${currentTime.toFixed(2)}s / ${dur.toFixed(2)}s`;
          window.asset.render(currentTime);
        }
        lastPerfNow = now;
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
