<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce & Instant Checkout - 6s Seamless Loop</title>
  <style>
    :root {
      /* Putih Solid (#FFFFFF) - Ubah ke #000000 atau #00FF00 sesuai kebutuhan */
      --bg-solid: #FFFFFF;
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --blue-soft: #EFF6FF;
      --blue-border: #BFDBFE;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-soft: #ECFDF5;
      --emerald-border: #A7F3D0;
      --amber: #F59E0B;
      --amber-bright: #FBBF24;
      --amber-soft: #FEF3C7;
      --coral: #F43F5E;
      --coral-soft: #FFF1F2;
      --slate: #94A3B8;
      --slate-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Kartu Katalog Kiri & Status Kanan Melayang Halus (6s) */
    .float-a { animation: bobA 6s ease-in-out infinite; }
    .float-b { animation: bobB 6s ease-in-out infinite; }

    @keyframes bobA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes bobB {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(0px); }
    }

    /* 2. Produk 1 & 2 Melompat Masuk ke Keranjang Tengah (Siklus 3s) */
    .item-drop-1 {
      animation: arcItem1 3s cubic-bezier(0.34, 1.35, 0.64, 1) infinite;
    }
    @keyframes arcItem1 {
      0% {
        transform: translate(0px, 0px) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      10% {
        transform: translate(60px, -65px) scale(1) rotate(15deg);
        opacity: 1;
      }
      28% {
        transform: translate(435px, 65px) scale(1) rotate(0deg);
        opacity: 1;
      }
      36%, 100% {
        transform: translate(435px, 95px) scale(0.2) rotate(0deg);
        opacity: 0;
      }
    }

    .item-drop-2 {
      animation: arcItem2 3s cubic-bezier(0.34, 1.35, 0.64, 1) infinite;
    }
    @keyframes arcItem2 {
      0%, 12% {
        transform: translate(0px, 0px) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      22% {
        transform: translate(75px, -110px) scale(1) rotate(-15deg);
        opacity: 1;
      }
      40% {
        transform: translate(465px, -185px) scale(1) rotate(0deg);
        opacity: 1;
      }
      48%, 100% {
        transform: translate(465px, -155px) scale(0.2) rotate(0deg);
        opacity: 0;
      }
    }

    /* 3. Keranjang Belanja Membal Saat Produk Masuk (Siklus 3s) */
    .cart-bounce {
      animation: bounceCart 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes bounceCart {
      0%, 24%, 36%, 48%, 100% { transform: scale(1, 1) translateY(0px); }
      29% { transform: scale(1.08, 0.92) translateY(8px); }
      41% { transform: scale(1.1, 0.9) translateY(10px); }
    }

    /* 4. Tombol Instant Checkout Terisi & Menyala Hijau (Siklus 3s) */
    .checkout-fill {
      transform-origin: 0px 0px;
      animation: fillPayBtn 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes fillPayBtn {
      0%, 35% { transform: scaleX(0.08); fill: var(--blue-bright); }
      52%, 88% { transform: scaleX(1); fill: var(--emerald); }
      96%, 100% { transform: scaleX(0.08); fill: var(--blue-bright); }
    }

    .pay-check-pop {
      animation: popPayBadge 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popPayBadge {
      0%, 46%, 94%, 100% { transform: scale(0); opacity: 0; }
      56%, 86% { transform: scale(1); opacity: 1; }
    }

    /* 5. Lintasan Conveyor Belt Bergerak (2s) */
    .conveyor-track {
      stroke-dasharray: 18 18;
      animation: rollBelt 2s linear infinite;
    }
    @keyframes rollBelt {
      from { stroke-dashoffset: 72; }
      to { stroke-dashoffset: 0; }
    }

    /* 6. Kotak Paket Bersegel Meluncur di Conveyor Belt (Siklus 3s) */
    .parcel-slide {
      animation: shipParcel 3s cubic-bezier(0.55, 0, 0.45, 1) infinite;
    }
    @keyframes shipParcel {
      0%, 50% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      58% {
        transform: translate(25px, 0px) scale(1);
        opacity: 1;
      }
      86% {
        transform: translate(265px, 0px) scale(1);
        opacity: 1;
      }
      95%, 100% {
        transform: translate(295px, 0px) scale(0.4);
        opacity: 0;
      }
    }

    /* 7. Indikator Order Ready di Kartu Kanan Menyala (Siklus 3s) */
    .order-ready-pill {
      animation: readyGlow 3s ease-in-out infinite;
    }
    @keyframes readyGlow {
      0%, 82%, 98%, 100% { fill: var(--slate-light); }
      88%, 95% { fill: var(--emerald); }
    }

    /* 8. Aliran Garis Koneksi Kiri (2s) */
    .arc-guide {
      stroke-dasharray: 10 12;
      animation: dashArc 2s linear infinite;
    }
    @keyframes dashArc {
      from { stroke-dashoffset: 44; }
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- =====================================================
           DEKORASI LATAR BELAKANG EDITORIAL
      ====================================================== -->
      <circle cx="960" cy="540" r="430" fill="var(--blue-soft)" opacity="0.55"/>
      <circle cx="960" cy="540" r="430" fill="none" stroke="var(--blue-border)" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="960" cy="540" r="310" fill="none" stroke="#DBEAFE" stroke-width="2"/>

      <!-- Kurva Panduan Produk Masuk ke Keranjang -->
      <path class="arc-guide" d="M475 345 Q690 250 885 405" fill="none" stroke="#FECDD3" stroke-width="4" stroke-linecap="round"/>
      <path class="arc-guide" d="M475 635 Q690 500 915 415" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>

      <!-- =====================================================
           1. KATALOG PRODUK KIRI (2 KARTU ITEM)
      ====================================================== -->
      <!-- Kartu Produk 1 (Kiri Atas) -->
      <g transform="translate(225, 255)">
        <g class="float-a">
          <rect x="10" y="12" width="250" height="175" rx="24" fill="#FFE4E6"/>
          <rect x="0" y="0" width="250" height="175" rx="24" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Thumbnail Produk 1 -->
          <rect x="24" y="24" width="84" height="84" rx="18" fill="var(--coral-soft)"/>
          <circle cx="66" cy="66" r="24" fill="var(--coral)" stroke="var(--navy)" stroke-width="3.5"/>
          <circle cx="66" cy="66" r="8" fill="#FFFFFF"/>

          <!-- Bar Detail Harga & Nama Produk -->
          <rect x="124" y="34" width="96" height="13" rx="6.5" fill="var(--navy)"/>
          <rect x="124" y="57" width="64" height="10" rx="5" fill="var(--slate)"/>
          <rect x="124" y="79" width="54" height="22" rx="11" fill="var(--coral-soft)"/>

          <!-- Tombol Add (+) -->
          <rect x="24" y="124" width="202" height="28" rx="14" fill="var(--blue-soft)"/>
          <circle cx="44" cy="138" r="9" fill="var(--blue)"/>
          <path d="M40 138 H48 M44 134 V142" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="64" y="133" width="90" height="10" rx="5" fill="var(--blue)"/>
        </g>
      </g>

      <!-- Kartu Produk 2 (Kiri Bawah) -->
      <g transform="translate(225, 545)">
        <g class="float-b">
          <rect x="10" y="12" width="250" height="175" rx="24" fill="#FEF3C7"/>
          <rect x="0" y="0" width="250" height="175" rx="24" fill="#FFFFFF" stroke="var(--navy)" stroke-width="4.5"/>

          <!-- Thumbnail Produk 2 -->
          <rect x="24" y="24" width="84" height="84" rx="18" fill="var(--amber-soft)"/>
          <rect x="44" y="44" width="44" height="44" rx="12" fill="var(--amber)" stroke="var(--navy)" stroke-width="3.5"/>
          <circle cx="66" cy="66" r="8" fill="#FFFFFF"/>

          <!-- Bar Detail Harga & Nama Produk -->
          <rect x="124" y="34" width="96" height="13" rx="6.5" fill="var(--navy)"/>
          <rect x="124" y="57" width="64" height="10" rx="5" fill="var(--slate)"/>
          <rect x="124" y="79" width="54" height="22" rx="11" fill="var(--amber-soft)"/>

          <!-- Tombol Add (+) -->
          <rect x="24" y="124" width="202" height="28" rx="14" fill="var(--blue-soft)"/>
          <circle cx="44" cy="138" r="9" fill="var(--blue)"/>
          <path d="M40 138 H48 M44 134 V142" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="64" y="133" width="90" height="10" rx="5" fill="var(--blue)"/>
        </g>
      </g>

      <!-- =====================================================
           2. PRODUK TERBANG MASUK KE KERANJANG (ANIMATED TOKENS)
      ====================================================== -->
      <!-- Token Produk 1 (Coral) -->
      <g transform="translate(460, 340)">
        <g class="item-drop-1">
          <circle cx="0" cy="0" r="24" fill="var(--coral)" stroke="var(--navy)" stroke-width="4"/>
          <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Token Produk 2 (Amber) -->
      <g transform="translate(460, 620)">
        <g class="item-drop-2">
          <rect x="-22" y="-22" width="44" height="44" rx="12" fill="var(--amber)" stroke="var(--navy)" stroke-width="4"/>
          <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- =====================================================
           3. SMART CART & INSTANT CHECKOUT HUB (PUSAT)
      ====================================================== -->
      <g transform="translate(745, 235)">
        <!-- Bayangan Window Checkout -->
        <rect x="14" y="16" width="370" height="460" rx="34" fill="#DBEAFE"/>
        <!-- Bodi Utama Window Checkout -->
        <rect x="0" y="0" width="370" height="460" rx="32" fill="#FFFFFF" stroke="var(--navy)" stroke-width="6"/>

        <!-- Top Bar Window -->
        <circle cx="38" cy="34" r="7" fill="var(--coral)"/>
        <circle cx="60" cy="34" r="7" fill="var(--amber-bright)"/>
        <circle cx="82" cy="34" r="7" fill="var(--emerald)"/>
        <rect x="240" y="27" width="96" height="14" rx="7" fill="var(--slate-light)"/>

        <line x1="0" y1="64" x2="370" y2="64" stroke="var(--slate-light)" stroke-width="3"/>

        <!-- Area Keranjang Belanja (Tengah Window) -->
        <rect x="34" y="92" width="302" height="215" rx="24" fill="var(--blue-soft)"/>

        <!-- Ikon Keranjang Belanja Geometris (Membal Saat Item Masuk) -->
        <g transform="translate(185, 205)">
          <g class="cart-bounce">
            <!-- Gagang & Kerangka Keranjang -->
            <path d="M-72 -48 H-48 L-30 28 H52 L68 -26 H-38" fill="none" stroke="var(--navy)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Badan Keranjang Biru -->
            <polygon points="-36,-22 62,-22 48,22 -26,22" fill="var(--blue)"/>
            <!-- Garis Kisi Keranjang -->
            <line x1="-8" y1="-12" x2="-4" y2="12" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
            <line x1="14" y1="-12" x2="14" y2="12" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
            <line x1="36" y1="-12" x2="32" y2="12" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
            <!-- Roda Keranjang -->
            <circle cx="-22" cy="46" r="12" fill="var(--navy)"/>
            <circle cx="-22" cy="46" r="4" fill="#FFFFFF"/>
            <circle cx="44" cy="46" r="12" fill="var(--navy)"/>
            <circle cx="44" cy="46" r="4" fill="#FFFFFF"/>
          </g>
        </g>

        <!-- Ringkasan Subtotal -->
        <rect x="38" y="332" width="120" height="13" rx="6.5" fill="var(--slate)"/>
        <rect x="242" y="330" width="90" height="16" rx="8" fill="var(--navy)"/>

        <!-- Tombol Instant Checkout (Track + Fill Animasi) -->
        <g transform="translate(34, 370)">
          <rect x="0" y="0" width="302" height="58" rx="29" fill="var(--slate-light)"/>
          <rect class="checkout-fill" x="0" y="0" width="302" height="58" rx="29" fill="var(--blue-bright)"/>
          <!-- Bar Label di Dalam Tombol -->
          <rect x="96" y="23" width="110" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
        </g>

        <!-- Lencana Centang Sukses Checkout (Sudut Kanan Atas Window) -->
        <g transform="translate(345, 35)">
          <g class="pay-check-pop">
            <circle cx="0" cy="0" r="34" fill="var(--emerald)" stroke="var(--navy)" stroke-width="5"/>
            <path d="M-13 1 L-4 10 L14 -9" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <!-- =====================================================
           4. CONVEYOR BELT & PAKET BERSEGEL (BAWAH -> KANAN)
      ====================================================== -->
      <!-- Lintasan Conveyor Belt -->
      <g transform="translate(960, 795)">
        <!-- Rangka Conveyor -->
        <rect x="0" y="0" width="520" height="44" rx="22" fill="var(--navy)"/>
        <!-- Sabuk Berjalan (Putus-Putus Bergerak) -->
        <line class="conveyor-track" x1="28" y1="22" x2="492" y2="22" stroke="var(--cyan)" stroke-width="6" stroke-linecap="round"/>
        <!-- Roda Penggerak Kiri & Kanan -->
        <circle cx="24" cy="22" r="10" fill="var(--slate)"/>
        <circle cx="496" cy="22" r="10" fill="var(--slate)"/>
      </g>

      <!-- Kotak Paket Bersegel Meluncur di Atas Conveyor -->
      <g transform="translate(1065, 695)">
        <g class="parcel-slide">
          <!-- Kotak Kardus Geometris -->
          <rect x="0" y="0" width="96" height="92" rx="16" fill="var(--amber-bright)" stroke="var(--navy)" stroke-width="4.5"/>
          <!-- Tutup Atas Paket -->
          <path d="M0 24 H96" stroke="var(--navy)" stroke-width="4"/>
          <!-- Pita Segel Vertikal -->
          <rect x="38" y="0" width="20" height="92" fill="#FEF3C7"/>
          <rect x="38" y="0" width="20" height="92" fill="none" stroke="var(--navy)" stroke-width="3"/>
          <!-- Lencana Segel Hijau di Paket -->
          <circle cx="76" cy="70" r="16" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M70 70 L74 74 L82 66" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- =====================================================
           5. MODUL ORDER DISPATCHED / READY (KANAN)
      ====================================================== -->
      <g transform="translate(1425, 495)">
        <g class="float-a">
          <rect x="12" y="14" width="275" height="295" rx="28" fill="#DCFCE7"/>
          <rect x="0" y="0" width="275" height="295" rx="28" fill="#FFFFFF" stroke="var(--navy)" stroke-width="5"/>

          <!-- Ikon Paket Selesai Dikemas -->
          <rect x="28" y="28" width="219" height="125" rx="20" fill="var(--emerald-soft)"/>
          <g transform="translate(97, 50)">
            <rect x="0" y="0" width="80" height="76" rx="14" fill="var(--emerald)" stroke="var(--navy)" stroke-width="4"/>
            <line x1="0" y1="22" x2="80" y2="22" stroke="var(--navy)" stroke-width="3.5"/>
            <path d="M26 48 L36 58 L55 39" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- Indikator Status Pengiriman -->
          <rect x="32" y="176" width="135" height="14" rx="7" fill="var(--navy)"/>
          <rect x="32" y="200" width="85" height="10" rx="5" fill="var(--slate)"/>

          <!-- Pill Status Order Ready -->
          <rect class="order-ready-pill" x="32" y="232" width="210" height="32" rx="16" fill="var(--slate-light)"/>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="620" cy="215" r="10" fill="var(--coral)"/>
      <circle cx="1275" cy="340" r="12" fill="var(--emerald)"/>
      <rect x="1255" y="450" width="18" height="18" rx="5" transform="rotate(20 1255 450)" fill="var(--amber-bright)"/>
    </svg>
  </div>

</body>
</html>
