<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile One-Tap Checkout & Fulfillment - 6s Seamless Loop</title>
  <style>
    :root {
      /* Hitam Solid (#000000) - Ubah ke #FFFFFF atau #00FF00 sesuai kebutuhan */
      --bg-solid: #000000;
      --surface-dark: #0B1120;
      --surface-card: #111827;
      --border-slate: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --cyan: #38BDF8;
      --violet: #8B5CF6;
      --emerald: #10B981;
      --emerald-dark: #064E3B;
      --amber: #F59E0B;
      --amber-bright: #FBBF24;
      --coral: #FB7185;
      --slate: #64748B;
      --white: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua durasi sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Smartphone Kiri & Kartu Dispatch Kanan Melayang Halus (6s) */
    .phone-bob { animation: bobA 6s ease-in-out infinite; }
    .dispatch-bob { animation: bobB 6s ease-in-out infinite; }

    @keyframes bobA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes bobB {
      0%, 100% { transform: translateY(-14px); }
      50% { transform: translateY(0px); }
    }

    /* 2. Tombol "One-Tap Buy" di Layar HP Berdenyut (Siklus 3s) */
    .tap-btn-pulse {
      animation: btnTap 3s ease-in-out infinite;
    }
    @keyframes btnTap {
      0%, 100% { transform: scale(1); fill: var(--blue-bright); }
      14% { transform: scale(0.92); fill: var(--cyan); }
      26%, 85% { transform: scale(1); fill: var(--emerald); }
    }

    .tap-ripple {
      animation: rippleTap 3s ease-out infinite;
    }
    @keyframes rippleTap {
      0%, 10% { transform: scale(0.4); opacity: 0; }
      18% { transform: scale(1); opacity: 0.9; }
      45%, 100% { transform: scale(1.9); opacity: 0; }
    }

    /* 3. Aliran Garis Sirkuit (2s) */
    .flow-trace {
      stroke-dasharray: 12 14;
      animation: dashMove 2s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 52; }
      to { stroke-dashoffset: 0; }
    }

    /* 4. Item Produk Meluncur dari Ponsel ke Stasiun Pusat (Siklus 3s) */
    .product-orb {
      animation: sendProduct 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes sendProduct {
      0%, 14% {
        transform: translate(0px, 0px) scale(0.4);
        opacity: 0;
      }
      24% {
        transform: translate(65px, -30px) scale(1);
        opacity: 1;
      }
      48% {
        transform: translate(235px, 0px) scale(1);
        opacity: 1;
      }
      56%, 100% {
        transform: translate(275px, 0px) scale(0.2);
        opacity: 0;
      }
    }

    /* 5. Cincin Pembayaran & Pengemasan di Pusat Berputar & Terisi (6s & 3s) */
    .hub-ring-spin {
      transform-origin: 960px 540px;
      animation: spinCW 6s linear infinite;
    }
    @keyframes spinCW { to { transform: rotate(360deg); } }

    .pay-progress-arc {
      stroke-dasharray: 1005;
      stroke-dashoffset: 1005;
      transform-origin: 960px 540px;
      transform: rotate(-90deg);
      animation: fillPayArc 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes fillPayArc {
      0%, 20% { stroke-dashoffset: 1005; stroke: var(--blue-bright); }
      52%, 88% { stroke-dashoffset: 0; stroke: var(--emerald); }
      98%, 100% { stroke-dashoffset: 1005; stroke: var(--blue-bright); }
    }

    /* 6. Kotak Paket di Pusat Membal Saat Disegel (Siklus 3s) */
    .center-parcel-pop {
      animation: sealParcel 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes sealParcel {
      0%, 48%, 94%, 100% { transform: scale(1); }
      58% { transform: scale(1.15); }
      74% { transform: scale(1.06); }
    }

    /* 7. Paket Bersegel Meluncur ke Kartu Pengiriman Kanan (Siklus 3s) */
    .dispatched-parcel {
      animation: shootParcel 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes shootParcel {
      0%, 56% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      66% {
        transform: translate(75px, 0px) scale(1);
        opacity: 1;
      }
      90% {
        transform: translate(235px, 0px) scale(1);
        opacity: 1;
      }
      98%, 100% {
        transform: translate(275px, 0px) scale(0.3);
        opacity: 0;
      }
    }

    /* 8. Indikator Armada & Rute Pengiriman Kanan Aktif (Siklus 3s) */
    .route-bar-fill {
      transform-origin: 0px 0px;
      animation: fillDelivery 3s ease-in-out infinite;
    }
    @keyframes fillDelivery {
      0%, 72%, 98%, 100% { transform: scaleX(0.2); fill: var(--blue-bright); }
      84%, 94% { transform: scaleX(1); fill: var(--emerald); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Glow Ambient Tengah -->
        <radialGradient id="shopGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2563EB" stop-opacity="0.24"/>
          <stop offset="55%" stop-color="#10B981" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- ClipPath Presisi untuk Layar Ponsel -->
        <clipPath id="phoneScreenClip">
          <rect x="16" y="16" width="288" height="588" rx="34"/>
        </clipPath>
      </defs>

      <!-- Cahaya Latar Tengah -->
      <circle cx="960" cy="540" r="530" fill="url(#shopGlow)"/>

      <!-- =====================================================
           JALUR KONEKSI ALUR BELANJA (KIRI -> TENGAH -> KANAN)
      ====================================================== -->
      <!-- Jalur Ponsel ke Fulfillment Hub -->
      <line x1="540" y1="540" x2="775" y2="540" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
      <line class="flow-trace" x1="540" y1="540" x2="775" y2="540" stroke="var(--cyan)" stroke-width="4" stroke-linecap="round"/>

      <!-- Jalur Fulfillment Hub ke Express Dispatch -->
      <line x1="1145" y1="540" x2="1380" y2="540" stroke="#064E3B" stroke-width="6" stroke-linecap="round"/>
      <line class="flow-trace" x1="1145" y1="540" x2="1380" y2="540" stroke="var(--emerald)" stroke-width="4" stroke-linecap="round"/>

      <!-- =====================================================
           1. MOBILE STOREFRONT & ONE-TAP BUY (SISI KIRI)
      ====================================================== -->
      <g transform="translate(220, 230)">
        <g class="phone-bob">
          <!-- Bodi Luar Smartphone -->
          <rect x="0" y="0" width="320" height="620" rx="46" fill="var(--surface-dark)" stroke="var(--blue-bright)" stroke-width="6"/>

          <!-- Isi Layar Ponsel Terpotong Rapi -->
          <g clip-path="url(#phoneScreenClip)">
            <rect x="16" y="16" width="288" height="588" fill="#0F172A"/>

            <!-- Kartu Produk Utama di Layar -->
            <rect x="38" y="68" width="244" height="260" rx="26" fill="#1E293B"/>
            
            <!-- Visual Produk Geometris (Headphone / Gadget Abstrak) -->
            <circle cx="160" cy="185" r="68" fill="#0F172A" stroke="#334155" stroke-width="3"/>
            <rect x="128" y="153" width="64" height="64" rx="18" fill="var(--coral)" stroke="#FFFFFF" stroke-width="3.5"/>
            <circle cx="160" cy="185" r="14" fill="#FFFFFF"/>

            <!-- Badge Harga Kuning -->
            <rect x="204" y="86" width="62" height="28" rx="14" fill="var(--amber-bright)"/>
            <rect x="218" y="96" width="34" height="8" rx="4" fill="#0F172A"/>

            <!-- Bar Judul & Deskripsi Produk -->
            <rect x="42" y="354" width="165" height="16" rx="8" fill="#F8FAFC"/>
            <rect x="42" y="382" width="115" height="12" rx="6" fill="var(--slate)"/>

            <!-- Rating Bintang Geometris -->
            <g fill="var(--amber-bright)" transform="translate(42, 412)">
              <circle cx="8" cy="8" r="7"/>
              <circle cx="28" cy="8" r="7"/>
              <circle cx="48" cy="8" r="7"/>
              <circle cx="68" cy="8" r="7"/>
              <circle cx="88" cy="8" r="7"/>
            </g>

            <!-- Tombol One-Tap Buy (Bawah Layar) -->
            <g transform="translate(38, 465)">
              <rect class="tap-btn-pulse" x="0" y="0" width="244" height="64" rx="32" fill="var(--blue-bright)" style="transform-origin: 122px 32px;"/>
              <!-- Ikon Keranjang Mini & Label -->
              <circle cx="44" cy="32" r="16" fill="#FFFFFF" opacity="0.22"/>
              <path d="M38 32 L43 37 L51 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="74" y="25" width="115" height="14" rx="7" fill="#FFFFFF"/>
            </g>

            <!-- Gelombang Sentuhan Jari pada Tombol -->
            <g transform="translate(160, 497)">
              <circle class="tap-ripple" cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
            </g>
          </g>

          <!-- Dynamic Island -->
          <rect x="110" y="30" width="100" height="20" rx="10" fill="#000000"/>
        </g>
      </g>

      <!-- =====================================================
           2. ITEM & PAKET BERGERAK SEPANJANG JALUR
      ====================================================== -->
      <!-- Token Produk dari Ponsel ke Stasiun Pusat -->
      <g transform="translate(530, 540)">
        <g class="product-orb">
          <rect x="-20" y="-20" width="40" height="40" rx="12" fill="var(--coral)" stroke="#FFFFFF" stroke-width="3.5"/>
          <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Token Paket Bersegel dari Pusat ke Express Dispatch -->
      <g transform="translate(1140, 540)">
        <g class="dispatched-parcel">
          <rect x="-24" y="-22" width="48" height="44" rx="12" fill="var(--amber-bright)" stroke="#FFFFFF" stroke-width="3.5"/>
          <rect x="-6" y="-22" width="12" height="44" fill="#FEF3C7"/>
          <circle cx="16" cy="14" r="10" fill="var(--emerald)"/>
        </g>
      </g>

      <!-- =====================================================
           3. FULFILLMENT & AUTO-PACKAGING HUB (PUSAT)
      ====================================================== -->
      <g>
        <!-- Cincin Orbit Putus-Putus Luar -->
        <g class="hub-ring-spin">
          <circle cx="960" cy="540" r="225" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="18 16"/>
          <circle cx="960" cy="315" r="7" fill="var(--cyan)"/>
          <circle cx="960" cy="765" r="7" fill="var(--emerald)"/>
        </g>

        <!-- Casing Utama Hub -->
        <circle cx="960" cy="540" r="185" fill="var(--surface-dark)" stroke="#1E293B" stroke-width="6"/>

        <!-- Track Cincin Pembayaran -->
        <circle cx="960" cy="540" r="160" fill="none" stroke="#1E293B" stroke-width="14"/>

        <!-- Cincin Progres Verifikasi Pembayaran (Keliling r=160 -> ~1005) -->
        <circle class="pay-progress-arc" cx="960" cy="540" r="160" fill="none" stroke="var(--blue-bright)" stroke-width="14" stroke-linecap="round"/>

        <!-- Inti Tengah Pengemasan Paket -->
        <circle cx="960" cy="540" r="126" fill="var(--surface-card)" stroke="#334155" stroke-width="3"/>

        <!-- Kotak Paket Geometris di Tengah -->
        <g transform="translate(960, 540)">
          <g class="center-parcel-pop">
            <!-- Bodi Kotak Kardus -->
            <rect x="-56" y="-50" width="112" height="100" rx="18" fill="var(--amber)" stroke="var(--amber-bright)" stroke-width="4"/>
            <!-- Garis Tutup Kotak -->
            <line x1="-56" y1="-22" x2="56" y2="-22" stroke="#78350F" stroke-width="4"/>
            <!-- Pita Segel Vertikal -->
            <rect x="-12" y="-50" width="24" height="100" fill="#FEF3C7"/>
            <!-- Lencana Centang Verifikasi Paket -->
            <circle cx="38" cy="34" r="22" fill="var(--emerald)" stroke="#0F172A" stroke-width="4"/>
            <path d="M30 34 L36 40 L47 29" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <!-- =====================================================
           4. EXPRESS DISPATCH & TRACKING CARD (SISI KANAN)
      ====================================================== -->
      <g transform="translate(1380, 355)">
        <g class="dispatch-bob">
          <rect x="0" y="0" width="300" height="370" rx="30" fill="var(--surface-card)" stroke="var(--emerald)" stroke-width="4"/>

          <!-- Ilustrasi Armada Ekspres Geometris (Atas) -->
          <rect x="28" y="28" width="244" height="145" rx="22" fill="#0F172A"/>
          <g transform="translate(72, 62)">
            <!-- Bodi Kargo Truk -->
            <rect x="0" y="0" width="96" height="64" rx="12" fill="var(--emerald)"/>
            <path d="M36 32 L45 41 L62 24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Kabin Depan Truk -->
            <path d="M102 18 H134 C144 18 152 26 152 36 V64 H102 Z" fill="var(--blue-bright)"/>
            <rect x="114" y="26" width="26" height="18" rx="5" fill="#DBEAFE"/>
            <!-- Roda Truk -->
            <circle cx="32" cy="68" r="14" fill="#1E293B" stroke="#F8FAFC" stroke-width="4"/>
            <circle cx="126" cy="68" r="14" fill="#1E293B" stroke="#F8FAFC" stroke-width="4"/>
          </g>

          <!-- Garis Pemisah -->
          <line x1="32" y1="202" x2="268" y2="202" stroke="#1E293B" stroke-width="3"/>

          <!-- Detail Resi & Status Pengiriman -->
          <rect x="34" y="228" width="145" height="15" rx="7.5" fill="#F8FAFC"/>
          <rect x="34" y="254" width="95" height="11" rx="5.5" fill="var(--slate)"/>

          <!-- Progress Bar Rute Pengantaran -->
          <g transform="translate(34, 294)">
            <rect x="0" y="0" width="232" height="28" rx="14" fill="#0F172A"/>
            <rect class="route-bar-fill" x="6" y="6" width="220" height="16" rx="8" fill="var(--blue-bright)"/>
          </g>
        </g>
      </g>

      <!-- Aksen Partikel Geometris Minimalis -->
      <circle cx="655" cy="320" r="10" fill="var(--coral)"/>
      <circle cx="1265" cy="320" r="11" fill="var(--emerald)"/>
      <rect x="1255" y="735" width="16" height="16" rx="4" transform="rotate(20 1255 735)" fill="var(--amber-bright)"/>
    </svg>
  </div>

</body>
</html>
