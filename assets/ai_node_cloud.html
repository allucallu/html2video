<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Node & Cloud Processing - 6s Seamless Loop</title>
  <style>
    :root {
      /* Hitam Solid (#000000) - Ubah ke #FFFFFF atau #00FF00 sesuai kebutuhan */
      --bg-solid: #000000;
      --surface-dark: #0B1120;
      --surface-card: #111827;
      --border-slate: #1E293B;
      --blue: #2563EB;
      --blue-bright: #3B82F6;
      --cyan: #38BDF8;
      --violet: #8B5CF6;
      --emerald: #10B981;
      --emerald-dark: #064E3B;
      --amber: #F59E0B;
      --slate: #64748B;
      --white: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-solid);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-solid);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 2s
    ===================================================== */

    /* 1. Cincin Orbit Neural Pusat (6s) */
    .neural-ring-cw {
      transform-origin: 960px 540px;
      animation: spinCW 6s linear infinite;
    }
    .neural-ring-ccw {
      transform-origin: 960px 540px;
      animation: spinCCW 6s linear infinite;
    }
    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    /* 2. Aliran Pulsa Jalur Sirkuit PCB (2s) */
    .pcb-stream {
      stroke-dasharray: 14 14;
      animation: flowPulse 2s linear infinite;
    }
    @keyframes flowPulse {
      from { stroke-dashoffset: 56; }
      to { stroke-dashoffset: 0; }
    }

    /* 3. Paket Input Atas (Dokumen -> AI Core, Siklus 3s) */
    .packet-in-top {
      animation: moveInTop 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes moveInTop {
      0% {
        transform: translate(0px, 0px) scale(0.5);
        opacity: 0;
      }
      18% {
        transform: translate(85px, 0px) scale(1);
        opacity: 1;
      }
      48% {
        transform: translate(295px, 130px) scale(0.85);
        opacity: 1;
      }
      56%, 100% {
        transform: translate(335px, 130px) scale(0.2);
        opacity: 0;
      }
    }

    /* 4. Paket Input Bawah (Database -> AI Core, Siklus 3s) */
    .packet-in-bot {
      animation: moveInBot 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes moveInBot {
      0%, 6% {
        transform: translate(0px, 0px) scale(0.5);
        opacity: 0;
      }
      22% {
        transform: translate(85px, 0px) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate(295px, -130px) scale(0.85);
        opacity: 1;
      }
      58%, 100% {
        transform: translate(335px, -130px) scale(0.2);
        opacity: 0;
      }
    }

    /* 5. Denyut Inti Prosesor & AI Spark Saat Komputasi (3s) */
    .ai-spark-pulse {
      transform-origin: 960px 540px;
      animation: sparkCompute 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes sparkCompute {
      0%, 46%, 92%, 100% { transform: scale(1) rotate(0deg); }
      58% { transform: scale(1.22) rotate(15deg); }
      74% { transform: scale(1.12) rotate(0deg); }
    }

    .core-ripple {
      transform-origin: 960px 540px;
      animation: rippleOut 3s ease-out infinite;
    }
    @keyframes rippleOut {
      0%, 48% { transform: scale(0.75); opacity: 0; }
      58% { transform: scale(1.05); opacity: 0.85; }
      95%, 100% { transform: scale(1.55); opacity: 0; }
    }

    /* 6. Paket Output Atas (AI Core -> Analitik, Siklus 3s) */
    .packet-out-top {
      animation: moveOutTop 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes moveOutTop {
      0%, 52% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      62% {
        transform: translate(85px, -45px) scale(1);
        opacity: 1;
      }
      88% {
        transform: translate(295px, -130px) scale(1);
        opacity: 1;
      }
      96%, 100% {
        transform: translate(335px, -130px) scale(0.5);
        opacity: 0;
      }
    }

    /* 7. Paket Output Bawah (AI Core -> Otomasi Cloud, Siklus 3s) */
    .packet-out-bot {
      animation: moveOutBot 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes moveOutBot {
      0%, 54% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      64% {
        transform: translate(85px, 45px) scale(1);
        opacity: 1;
      }
      90% {
        transform: translate(295px, 130px) scale(1);
        opacity: 1;
      }
      98%, 100% {
        transform: translate(335px, 130px) scale(0.5);
        opacity: 0;
      }
    }

    /* 8. Gerakan Melayang Modul Samping (6s) */
    .node-bob-a { animation: bobA 6s ease-in-out infinite; }
    .node-bob-b { animation: bobB 6s ease-in-out infinite; }

    @keyframes bobA {
      0%, 100% { transform: translateY(-10px); }
      50% { transform: translateY(10px); }
    }
    @keyframes bobB {
      0%, 100% { transform: translateY(10px); }
      50% { transform: translateY(-10px); }
    }

    /* 9. Grafik Output Atas & Roda Gigi Output Bawah */
    .out-bar-1 { transform-origin: 48px 132px; animation: barPop 3s ease-in-out infinite 0s; }
    .out-bar-2 { transform-origin: 86px 132px; animation: barPop 3s ease-in-out infinite 0.15s; }
    .out-bar-3 { transform-origin: 124px 132px; animation: barPop 3s ease-in-out infinite 0.3s; }
    .out-bar-4 { transform-origin: 162px 132px; animation: barPop 3s ease-in-out infinite 0.45s; }

    @keyframes barPop {
      0%, 100% { transform: scaleY(0.55); }
      65%, 85% { transform: scaleY(1); }
    }

    .gear-spin {
      transform-origin: 58px 62px;
      animation: spinGear 6s linear infinite;
    }
    @keyframes spinGear {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Glow Ambient Tengah -->
        <radialGradient id="aiAmbient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.26"/>
          <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Gradien Chip Prosesor AI -->
        <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E3A8A"/>
          <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
      </defs>

      <!-- Cahaya Latar Tengah -->
      <circle cx="960" cy="540" r="540" fill="url(#aiAmbient)"/>

      <!-- =====================================================
           CINCIN ORBIT NEURAL PUSAT
      ====================================================== -->
      <g class="neural-ring-cw">
        <circle cx="960" cy="540" r="285" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="18 16"/>
        <circle cx="960" cy="255" r="7" fill="var(--cyan)"/>
        <circle cx="960" cy="825" r="7" fill="var(--violet)"/>
      </g>

      <g class="neural-ring-ccw">
        <circle cx="960" cy="540" r="235" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="8 14" opacity="0.6"/>
      </g>

      <!-- =====================================================
           JALUR SIRKUIT PCB (KIRI -> TENGAH -> KANAN)
      ====================================================== -->
      <!-- Input Atas (Dokumen -> AI Core) -->
      <path d="M475 375 L615 375 L735 505 L810 505" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="pcb-stream" d="M475 375 L615 375 L735 505 L810 505" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Input Bawah (Database -> AI Core) -->
      <path d="M475 705 L615 705 L735 575 L810 575" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="pcb-stream" d="M475 705 L615 705 L735 575 L810 575" fill="none" stroke="var(--cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Output Atas (AI Core -> Analitik) -->
      <path d="M1110 505 L1185 505 L1305 375 L1445 375" fill="none" stroke="#064E3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="pcb-stream" d="M1110 505 L1185 505 L1305 375 L1445 375" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Output Bawah (AI Core -> Otomasi Cloud) -->
      <path d="M1110 575 L1185 575 L1305 705 L1445 705" fill="none" stroke="#064E3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="pcb-stream" d="M1110 575 L1185 575 L1305 705 L1445 705" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- =====================================================
           1. NODE INPUT KIRI (DOKUMEN & DATABASE)
      ====================================================== -->
      <!-- Input Atas: Dokumen Terstruktur -->
      <g transform="translate(235, 290)">
        <g class="node-bob-a">
          <rect x="0" y="0" width="240" height="170" rx="24" fill="var(--surface-card)" stroke="#334155" stroke-width="3.5"/>
          <!-- Ikon Dokumen -->
          <rect x="28" y="30" width="54" height="64" rx="10" fill="#451A03" stroke="var(--amber)" stroke-width="2.5"/>
          <line x1="41" y1="48" x2="69" y2="48" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>
          <line x1="41" y1="62" x2="69" y2="62" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>
          <line x1="41" y1="76" x2="57" y2="76" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>

          <!-- Bar Metadata -->
          <rect x="100" y="42" width="108" height="12" rx="6" fill="#F8FAFC"/>
          <rect x="100" y="64" width="72" height="10" rx="5" fill="var(--slate)"/>

          <!-- Progress Track -->
          <rect x="28" y="120" width="184" height="18" rx="9" fill="#0F172A"/>
          <rect x="33" y="125" width="110" height="8" rx="4" fill="var(--amber)"/>
        </g>
      </g>

      <!-- Input Bawah: Raw Database -->
      <g transform="translate(235, 620)">
        <g class="node-bob-b">
          <rect x="0" y="0" width="240" height="170" rx="24" fill="var(--surface-card)" stroke="#334155" stroke-width="3.5"/>
          <!-- Ikon Silinder Database -->
          <g transform="translate(28, 32)">
            <rect x="0" y="10" width="54" height="48" rx="8" fill="#083344" stroke="var(--cyan)" stroke-width="2.5"/>
            <ellipse cx="27" cy="12" rx="27" ry="10" fill="#0E7490" stroke="var(--cyan)" stroke-width="2.5"/>
            <path d="M0 30 Q27 40 54 30" fill="none" stroke="var(--cyan)" stroke-width="2.5"/>
          </g>

          <rect x="100" y="42" width="108" height="12" rx="6" fill="#F8FAFC"/>
          <rect x="100" y="64" width="72" height="10" rx="5" fill="var(--slate)"/>

          <rect x="28" y="120" width="184" height="18" rx="9" fill="#0F172A"/>
          <rect x="33" y="125" width="135" height="8" rx="4" fill="var(--cyan)"/>
        </g>
      </g>

      <!-- =====================================================
           2. PAKET DATA BERGERAK SEPANJANG JALUR
      ====================================================== -->
      <!-- Paket Input Atas -->
      <g transform="translate(485, 375)">
        <g class="packet-in-top">
          <rect x="-16" y="-16" width="32" height="32" rx="8" fill="var(--amber)" stroke="#FFFFFF" stroke-width="3"/>
        </g>
      </g>

      <!-- Paket Input Bawah -->
      <g transform="translate(485, 705)">
        <g class="packet-in-bot">
          <circle cx="0" cy="0" r="16" fill="var(--cyan)" stroke="#FFFFFF" stroke-width="3"/>
        </g>
      </g>

      <!-- Paket Output Atas -->
      <g transform="translate(1100, 505)">
        <g class="packet-out-top">
          <rect x="-18" y="-18" width="36" height="36" rx="10" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M-7 0 L-2 5 L8 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Paket Output Bawah -->
      <g transform="translate(1100, 575)">
        <g class="packet-out-bot">
          <rect x="-18" y="-18" width="36" height="36" rx="10" fill="var(--emerald)" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M-7 0 L-2 5 L8 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- =====================================================
           3. AI NEURAL PROCESSOR CORE (TENGAH)
      ====================================================== -->
      <g>
        <!-- Gelombang Ekspansi Komputasi -->
        <circle class="core-ripple" cx="960" cy="540" r="165" fill="none" stroke="var(--cyan)" stroke-width="3.5"/>

        <!-- Pin Kaki Chip (Atas, Bawah, Kiri, Kanan) -->
        <g fill="var(--blue-bright)">
          <!-- Atas -->
          <rect x="875" y="362" width="14" height="28" rx="4"/>
          <rect x="915" y="362" width="14" height="28" rx="4"/>
          <rect x="953" y="362" width="14" height="28" rx="4"/>
          <rect x="991" y="362" width="14" height="28" rx="4"/>
          <rect x="1031" y="362" width="14" height="28" rx="4"/>
          <!-- Bawah -->
          <rect x="875" y="690" width="14" height="28" rx="4"/>
          <rect x="915" y="690" width="14" height="28" rx="4"/>
          <rect x="953" y="690" width="14" height="28" rx="4"/>
          <rect x="991" y="690" width="14" height="28" rx="4"/>
          <rect x="1031" y="690" width="14" height="28" rx="4"/>
          <!-- Kiri -->
          <rect x="782" y="455" width="28" height="14" rx="4"/>
          <rect x="782" y="498" width="28" height="14" rx="4"/>
          <rect x="782" y="568" width="28" height="14" rx="4"/>
          <rect x="782" y="611" width="28" height="14" rx="4"/>
          <!-- Kanan -->
          <rect x="1110" y="455" width="28" height="14" rx="4"/>
          <rect x="1110" y="498" width="28" height="14" rx="4"/>
          <rect x="1110" y="568" width="28" height="14" rx="4"/>
          <rect x="1110" y="611" width="28" height="14" rx="4"/>
        </g>

        <!-- Bodi Utama Prosesor AI -->
        <rect x="810" y="390" width="300" height="300" rx="42" fill="url(#chipGrad)" stroke="var(--blue-bright)" stroke-width="6"/>
        <rect x="832" y="412" width="256" height="256" rx="28" fill="none" stroke="#1E293B" stroke-width="3"/>

        <!-- Inti Lingkaran AI Spark -->
        <circle cx="960" cy="540" r="82" fill="#0B1120" stroke="var(--cyan)" stroke-width="4"/>

        <!-- Simbol AI Spark (Bintang 4 Sudut Presisi) -->
        <g class="ai-spark-pulse">
          <path d="M960 482 C964 518 982 536 1018 540 C982 544 964 562 960 598 C956 562 938 544 902 540 C938 536 956 518 960 482 Z" fill="var(--cyan)"/>
          <circle cx="998" cy="502" r="7" fill="var(--emerald)"/>
        </g>
      </g>

      <!-- =====================================================
           4. NODE OUTPUT KANAN (ANALITIK & CLOUD AUTOMATION)
      ====================================================== -->
      <!-- Output Atas: Smart Analytics -->
      <g transform="translate(1445, 290)">
        <g class="node-bob-b">
          <rect x="0" y="0" width="240" height="170" rx="24" fill="var(--surface-card)" stroke="var(--emerald)" stroke-width="3.5"/>
          
          <!-- Header -->
          <circle cx="46" cy="44" r="18" fill="var(--emerald-dark)"/>
          <path d="M39 44 L44 49 L54 39" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="78" y="34" width="124" height="11" rx="5.5" fill="#F8FAFC"/>
          <rect x="78" y="52" width="76" height="8" rx="4" fill="var(--slate)"/>

          <!-- Grafik Batang Otomatis -->
          <rect class="out-bar-1" x="36" y="102" width="24" height="36" rx="6" fill="var(--blue)"/>
          <rect class="out-bar-2" x="74" y="92" width="24" height="46" rx="6" fill="var(--blue-bright)"/>
          <rect class="out-bar-3" x="112" y="84" width="24" height="54" rx="6" fill="var(--cyan)"/>
          <rect class="out-bar-4" x="150" y="76" width="24" height="62" rx="6" fill="var(--emerald)"/>
          <line x1="28" y1="142" x2="212" y2="142" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Output Bawah: Cloud Automation -->
      <g transform="translate(1445, 620)">
        <g class="node-bob-a">
          <rect x="0" y="0" width="240" height="170" rx="24" fill="var(--surface-card)" stroke="var(--emerald)" stroke-width="3.5"/>
          
          <!-- Roda Gigi Berputar (Titik Poros 58, 62) -->
          <circle cx="58" cy="62" r="28" fill="var(--emerald-dark)"/>
          <g class="gear-spin">
            <circle cx="58" cy="62" r="13" fill="none" stroke="var(--emerald)" stroke-width="5"/>
            <rect x="55" y="42" width="6" height="6" rx="1.5" fill="var(--emerald)"/>
            <rect x="55" y="76" width="6" height="6" rx="1.5" fill="var(--emerald)"/>
            <rect x="38" y="59" width="6" height="6" rx="1.5" fill="var(--emerald)"/>
            <rect x="72" y="59" width="6" height="6" rx="1.5" fill="var(--emerald)"/>
          </g>

          <rect x="102" y="48" width="106" height="12" rx="6" fill="#F8FAFC"/>
          <rect x="102" y="68" width="68" height="9" rx="4.5" fill="var(--slate)"/>

          <!-- Status Aktif -->
          <rect x="28" y="116" width="184" height="22" rx="11" fill="var(--emerald-dark)"/>
          <circle cx="46" cy="127" r="5" fill="var(--emerald)"/>
          <rect x="62" y="123" width="90" height="8" rx="4" fill="var(--emerald)"/>
        </g>
      </g>

      <!-- Aksen Titik Geometris -->
      <circle cx="660" cy="270" r="9" fill="var(--amber)"/>
      <circle cx="660" cy="810" r="9" fill="var(--cyan)"/>
      <circle cx="1260" cy="270" r="9" fill="var(--emerald)"/>
      <circle cx="1260" cy="810" r="9" fill="var(--emerald)"/>
    </svg>
  </div>

</body>
</html>
