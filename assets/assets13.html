<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Spiral Scribble Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(639182);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Generate an organic hand-drawn marker spiral path
function createHandDrawnSpiral(config) {
  const {
    numPoints,
    turns,
    startRadius,
    endRadius,
    startAngle,
    radialWobble,
    ellipseX,
    ellipseY,
    tiltAngle,
    minW,
    maxW,
    boilOffset,
    seedPhase
  } = config;

  // Low-frequency hand-drawn radial imperfections so coils feel genuinely sketched by hand
  const harmonics = [];
  for (let h = 1; h <= 8; h++) {
    harmonics.push({
      freq: h * 0.55 + (rand() - 0.5) * 0.2,
      ampR: (rand() - 0.5) * radialWobble * (1.15 / Math.sqrt(h)),
      ampT: (rand() - 0.5) * 11 * (1.0 / h),
      phase: rand() * TAU
    });
  }

  const pts = [];
  const totalTheta = turns * TAU;
  const cosTilt = Math.cos(tiltAngle);
  const sinTilt = Math.sin(tiltAngle);

  for (let i = 0; i <= numPoints; i++) {
    const u = i / numPoints; // 0 at inner center start, 1 at outer tip
    const theta = startAngle + u * totalTheta;

    // Slight non-linear radial spacing (tighter in the center, opening up toward the outer coils)
    const rBase = startRadius + (endRadius - startRadius) * Math.pow(u, 0.92);

    let dr = 0;
    let dt = 0;
    const wobbleScale = 0.25 + 0.75 * u;
    for (let h = 0; h < harmonics.length; h++) {
      const hm = harmonics[h];
      dr += Math.sin(theta * hm.freq + hm.phase) * hm.ampR * wobbleScale;
      dt += Math.cos(theta * hm.freq + hm.phase) * hm.ampT * wobbleScale;
    }

    // Expressive outward flick at the outer end tail (u > 0.94)
    if (u > 0.94) {
      const s = (u - 0.94) / 0.06;
      dr += s * s * 38;
    }

    const r = Math.max(4, rBase + dr);
    const lx = Math.cos(theta) * r * ellipseX - Math.sin(theta) * dt;
    const ly = Math.sin(theta) * r * ellipseY + Math.cos(theta) * dt;

    const x = lx * cosTilt - ly * sinTilt;
    const y = lx * sinTilt + ly * cosTilt;

    // Marker nib width variation (14-22px)
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * turns * 1.3 + seedPhase);
    let taper = 1.0;
    if (u < 0.03) taper = 0.68 + 0.32 * (u / 0.03);
    else if (u > 0.96) taper = 0.60 + 0.40 * ((1 - u) / 0.04);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x,
      y,
      u,
      r,
      theta,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// ============================================================================
// 1. PRIMARY HERO WHITE MARKER SPIRAL SCRIBBLE (4.65 turns, R = 14 -> 535 px)
// Safe margins: outer radius <= 690px around (1920, 1080)
// ============================================================================
const PRIMARY_WHITE_SPIRAL = createHandDrawnSpiral({
  numPoints: 340,
  turns: 4.65,
  startRadius: 14,
  endRadius: 535,
  startAngle: -Math.PI * 0.4,
  radialWobble: 28,
  ellipseX: 1.04,
  ellipseY: 0.96,
  tiltAngle: -0.15,
  minW: 16,
  maxW: 22,
  boilOffset: 0,
  seedPhase: 0.5
});

// 2. SECONDARY SKETCHY WHITE DOUBLE-STRAND SPIRAL (Loose outer/inner companion scribble)
const SKETCH_WHITE_SPIRAL = createHandDrawnSpiral({
  numPoints: 240,
  turns: 3.25,
  startRadius: 65,
  endRadius: 515,
  startAngle: Math.PI * 0.55,
  radialWobble: 34,
  ellipseX: 0.97,
  ellipseY: 1.03,
  tiltAngle: 0.22,
  minW: 14,
  maxW: 19,
  boilOffset: 180,
  seedPhase: 2.1
});

// 3. SECONDARY WARM YELLOW (#FFD93D) INTERLEAVED ACCENT SPIRAL (3.85 turns nestled between the white coils)
const YELLOW_ACCENT_SPIRAL = createHandDrawnSpiral({
  numPoints: 280,
  turns: 3.85,
  startRadius: 38,
  endRadius: 485,
  startAngle: Math.PI * 0.6,
  radialWobble: 26,
  ellipseX: 1.03,
  ellipseY: 0.97,
  tiltAngle: -0.15,
  minW: 15,
  maxW: 20,
  boilOffset: 310,
  seedPhase: 3.8
});

// 4. AMBIENT OUTER SWIRL ARCS, TANGENTIAL MOTION TICKS & DOODLE STARS
const AMBIENT_SWIRL_TICKS = [];
const NUM_OUTER_TICKS = 10;

for (let i = 0; i < NUM_OUTER_TICKS; i++) {
  const baseA = (i * TAU) / NUM_OUTER_TICKS + 0.18;
  const dist = 605 + (i % 2) * 38;
  const arcSpan = 0.26;
  const numSegs = 24;
  const pts = [];

  for (let k = 0; k <= numSegs; k++) {
    const u = k / numSegs;
    const a = baseA + u * arcSpan;
    const r = dist + u * 26 + Math.sin(u * 12 + i) * 3;
    pts.push({
      x: Math.cos(a) * r,
      y: Math.sin(a) * r,
      u,
      r,
      theta: a,
      width: 15 + 4 * Math.sin(u * Math.PI),
      boilSlot: (420 + i * 8 + k) % NUM_BOIL_SLOTS
    });
  }

  AMBIENT_SWIRL_TICKS.push({
    pts,
    color: (i % 2 === 0) ? COLOR_YELLOW : COLOR_WHITE,
    phaseOff: 0.44 + (i % 3) * 0.04
  });
}

// Progressive Draw-On (Center Outward) -> Hold -> Erase from Start (Center Outward)
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.38]: Draws itself progressively from center start to outer end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.38, 0.62]: Holds full spiral (uStart = 0, uEnd = 1)
// - c in [0.62, 0.96]: Erases from the center start toward the outer tip (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.38) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.38) };
  } else if (c < 0.62) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.62) / 0.34), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker spiral stroke between [uStart, uEnd] with discrete 12fps line boil
// and elastic spring-coil wind/unwind torsional flex
function renderSpiralStroke(pts, uStart, uEnd, color, boilStep, phase, twistAmp) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Differential spring-coil wind/unwind rotation & radial breathing (integer cycles per loop)
    const coilTwist = twistAmp * (1.0 - 0.65 * p.u) * Math.sin(TAU * (phase * 2 - p.u * 0.5));
    const radialPulse = 1.0 + 0.028 * Math.cos(TAU * (phase * 2 - p.u * 0.8));

    const cosT = Math.cos(coilTwist);
    const sinT = Math.sin(coilTwist);
    const rx = (p.x * cosT - p.y * sinT) * radialPulse;
    const ry = (p.x * sinT + p.y * cosT) * radialPulse;

    return {
      x: rx + bx,
      y: ry + by,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing inner start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing outer end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Whole-spiral squash & stretch, gentle wobble, and breathing (integer harmonics k = 1, 2, 4)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const scaleX = 1.0 + 0.022 * sin2 - 0.010 * sin4;
  const scaleY = 1.0 - 0.022 * sin2 + 0.010 * sin4;
  const wholeRot = 0.08 * sin1 + 0.04 * cos2;
  const shiftX = 10 * cos1;
  const shiftY = 12 * sin2;

  ctx.save();
  ctx.translate(CX + shiftX, CY + shiftY);
  ctx.rotate(wholeRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 the Primary White Spiral Scribble
  // is in its FULL held state, while the Secondary Sketch Spiral and Yellow Accent Spiral overlap:
  const baseCycle = phase * 2;

  const winPrimaryWhite = getDrawEraseWindow(baseCycle + 0.50);
  const winSketchWhite  = getDrawEraseWindow(baseCycle + 0.04);
  const winYellowSpiral = getDrawEraseWindow(baseCycle + 0.24);

  // 1. Secondary Motion Layer: Sketchy Companion White Spiral
  renderSpiralStroke(
    SKETCH_WHITE_SPIRAL,
    winSketchWhite.uStart,
    winSketchWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    0.11
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Interleaved Accent Spiral
  renderSpiralStroke(
    YELLOW_ACCENT_SPIRAL,
    winYellowSpiral.uStart,
    winYellowSpiral.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    -0.12
  );

  // 3. Primary Motion Layer: Hero Bold White Marker Spiral Scribble
  renderSpiralStroke(
    PRIMARY_WHITE_SPIRAL,
    winPrimaryWhite.uStart,
    winPrimaryWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    0.09
  );

  // 4. Ambient Motion Layer: Outer Tangential Swirl Ticks & Motion Arcs
  for (let i = 0; i < AMBIENT_SWIRL_TICKS.length; i++) {
    const tk = AMBIENT_SWIRL_TICKS[i];
    const winTick = getDrawEraseWindow(baseCycle + tk.phaseOff);
    renderSpiralStroke(
      tk.pts,
      winTick.uStart,
      winTick.uEnd,
      tk.color,
      boilStep,
      phase,
      0.06
    );
  }

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
