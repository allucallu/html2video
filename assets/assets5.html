<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Scribble Circle Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Palette (Matte, NO glow, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete Line Boil: 12 steps per second * 10 seconds = 120 integer steps per loop
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120 steps

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(739281);

// Precompute a bank of seeded line-boil offsets (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_OFFSETS_X = [];
const BOIL_OFFSETS_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rowX = new Float32Array(NUM_BOIL_SLOTS);
  const rowY = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const ang = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2 to 4.2 px discrete boil offset
    rowX[i] = Math.cos(ang) * mag;
    rowY[i] = Math.sin(ang) * mag;
  }
  BOIL_OFFSETS_X.push(rowX);
  BOIL_OFFSETS_Y.push(rowY);
}

// Generate a hand-drawn multi-loop marker scribble circle path
// Each scribble path has vertices with organic hand-wobble, radial drift between loops,
// and pressure-based marker width between 14px and 22px.
function createScribbleLoopPath(config) {
  const {
    numPoints,
    turns,
    baseRadius,
    radialWobble,
    ellipseRatioX,
    ellipseRatioY,
    startAngle,
    tiltAngle,
    minWidth,
    maxWidth,
    boilSlotOffset
  } = config;

  // Generate low-frequency hand-drawn radial imperfections per control harmonic
  const harmonics = [];
  for (let h = 1; h <= 9; h++) {
    harmonics.push({
      freq: h * 0.5 + (rand() - 0.5) * 0.25,
      ampR: (rand() - 0.5) * radialWobble * (1.2 / Math.sqrt(h)),
      ampT: (rand() - 0.5) * 14 * (1.0 / h),
      phase: rand() * TAU
    });
  }

  const pts = [];
  const totalAngle = turns * TAU;
  const cosTilt = Math.cos(tiltAngle);
  const sinTilt = Math.sin(tiltAngle);

  for (let i = 0; i <= numPoints; i++) {
    const u = i / numPoints; // 0 to 1 along the full multi-turn stroke
    const theta = startAngle + u * totalAngle;

    // Organic hand-drawn radial deviation across the multiple revolutions
    let dr = 0;
    let dt = 0;
    for (let h = 0; h < harmonics.length; h++) {
      const hm = harmonics[h];
      dr += Math.sin(theta * hm.freq + hm.phase) * hm.ampR;
      dt += Math.cos(theta * hm.freq + hm.phase) * hm.ampT;
    }

    // Natural lead-in tail at start (u < 0.06) and flicked overshoot tail at end (u > 0.93)
    let tailOffsetR = 0;
    if (u < 0.06) {
      const s = (0.06 - u) / 0.06;
      tailOffsetR = -s * s * 42;
    } else if (u > 0.93) {
      const s = (u - 0.93) / 0.07;
      tailOffsetR = s * s * 54;
    }

    const r = baseRadius + dr + tailOffsetR;
    const localX = Math.cos(theta) * r * ellipseRatioX + Math.cos(theta + 1.57) * dt;
    const localY = Math.sin(theta) * r * ellipseRatioY + Math.sin(theta + 1.57) * dt;

    const x = localX * cosTilt - localY * sinTilt;
    const y = localX * sinTilt + localY * cosTilt;

    // Marker pressure variation (14px to 22px, tapering slightly at the very start/end tips)
    const pressureWave = 0.5 + 0.5 * Math.sin(u * TAU * turns * 1.5 + config.seedPhase);
    let tipTaper = 1.0;
    if (u < 0.03) tipTaper = 0.65 + 0.35 * (u / 0.03);
    else if (u > 0.96) tipTaper = 0.60 + 0.40 * ((1 - u) / 0.04);

    const width = (minWidth + (maxWidth - minWidth) * pressureWave) * tipTaper;

    pts.push({
      x,
      y,
      u,
      width,
      boilSlot: (boilSlotOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// Precompute 3 Layered Marker Scribble Circle Paths:
// 1. Primary Hero White Marker Scribble (3.4 revolutions, bold 15-22px stroke)
const PRIMARY_SCRIBBLE = createScribbleLoopPath({
  numPoints: 260,
  turns: 3.35,
  baseRadius: 485,
  radialWobble: 58,
  ellipseRatioX: 1.05,
  ellipseRatioY: 0.96,
  startAngle: -Math.PI * 0.65,
  tiltAngle: -0.14,
  minWidth: 15,
  maxWidth: 22,
  boilSlotOffset: 0,
  seedPhase: 0.4
});

// 2. Secondary Outer White Loose Scribble Loop (2.4 revolutions, 14-20px stroke)
const SECONDARY_WHITE_SCRIBBLE = createScribbleLoopPath({
  numPoints: 200,
  turns: 2.45,
  baseRadius: 530,
  radialWobble: 66,
  ellipseRatioX: 0.97,
  ellipseRatioY: 1.04,
  startAngle: Math.PI * 0.25,
  tiltAngle: 0.22,
  minWidth: 14,
  maxWidth: 20,
  boilSlotOffset: 150,
  seedPhase: 2.1
});

// 3. Accent Warm Yellow (#FFD93D) Marker Scribble Loop (2.2 revolutions, 14-19px stroke)
const ACCENT_YELLOW_SCRIBBLE = createScribbleLoopPath({
  numPoints: 190,
  turns: 2.25,
  baseRadius: 455,
  radialWobble: 52,
  ellipseRatioX: 1.03,
  ellipseRatioY: 0.95,
  startAngle: Math.PI * 0.85,
  tiltAngle: -0.28,
  minWidth: 14,
  maxWidth: 19,
  boilSlotOffset: 310,
  seedPhase: 4.3
});

// Precompute Ambient Hand-Drawn Marker Emphasis Ticks, Motion Arcs & Little Doodle Stars around the Circle
const AMBIENT_DOODLES = [];
const numTicks = 12;
for (let i = 0; i < numTicks; i++) {
  const ang = (i / numTicks) * TAU + (rand() - 0.5) * 0.18;
  const isStar = (i % 3 === 0);
  const isArc = (i % 3 === 1);
  const dist = isArc ? (625 + rand() * 35) : (645 + rand() * 55);

  AMBIENT_DOODLES.push({
    angle: ang,
    dist,
    type: isStar ? 'star' : (isArc ? 'arc' : 'rays'),
    color: (i % 2 === 0) ? COLOR_WHITE : COLOR_YELLOW,
    phaseOffset: (i / numTicks),
    boilSlot: (420 + i * 6) % NUM_BOIL_SLOTS,
    size: 28 + rand() * 14
  });
}

// Compute progressive Draw-On -> Hold -> Erase-from-Start window [uStart, uEnd] in [0, 1]
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.42]: Draws on progressively from start (uStart = 0, uEnd: 0 -> 1)
// - c in [0.42, 0.58]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.58, 0.96]: Erases from the start of the stroke toward the end (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief empty reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  // Smooth S-curve helper for natural hand-drawing acceleration/deceleration
  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.42) {
    const prog = smoothStep(c / 0.42);
    return { uStart: 0.0, uEnd: prog };
  } else if (c < 0.58) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    const prog = smoothStep((c - 0.58) / 0.38);
    return { uStart: prog, uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial hand-drawn marker scribble path between [uStart, uEnd] with discrete 12fps line boil
function renderMarkerScribble(pts, uStart, uEnd, color, boilStep) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_OFFSETS_X[boilStep];
  const boilRowY = BOIL_OFFSETS_Y[boilStep];

  // Helper to get boiled vertex position (smoothed across adjacent vertices so stroke stays cohesive)
  function getBoiledPoint(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    const bx = (boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25);
    const by = (boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25);

    return { x: p.x + bx, y: p.y + by, width: p.width };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Draw in batches of 5 segments to support authentic marker width variation (14-22px)
  const batchSize = 5;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let bp = getBoiledPoint(j);

      // Sub-segment interpolation at exact start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const bpNext = getBoiledPoint(j + 1);
        bp = {
          x: bp.x + (bpNext.x - bp.x) * frac,
          y: bp.y + (bpNext.y - bp.y) * frac
        };
      }
      // Sub-segment interpolation at exact end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const bpPrev = getBoiledPoint(j - 1);
        bp = {
          x: bpPrev.x + (bp.x - bpPrev.x) * frac,
          y: bpPrev.y + (bp.y - bpPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(bp.x, bp.y);
      else ctx.lineTo(bp.x, bp.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// Render Ambient Hand-Drawn Marker Doodles (Emphasis Rays, Motion Arcs, Little Scribble Cross-Stars)
function renderAmbientDoodles(phase, boilStep) {
  const boilRowX = BOIL_OFFSETS_X[boilStep];
  const boilRowY = BOIL_OFFSETS_Y[boilStep];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < AMBIENT_DOODLES.length; i++) {
    const d = AMBIENT_DOODLES[i];
    // Each ambient doodle repeats 2 cycles per 10s loop with its own phase offset
    const localC = (phase * 2 + d.phaseOffset) % 1.0;
    const win = getDrawEraseWindow(localC);
    const span = win.uEnd - win.uStart;
    if (span <= 0.02) continue;

    const bx = boilRowX[d.boilSlot];
    const by = boilRowY[d.boilSlot];
    const cx = Math.cos(d.angle) * d.dist + bx;
    const cy = Math.sin(d.angle) * d.dist + by;

    ctx.strokeStyle = d.color;
    ctx.lineWidth = 15;

    if (d.type === 'rays') {
      // 3 little radiating marker emphasis dashes outside the scribble circle
      for (let r = -1; r <= 1; r++) {
        const rayAng = d.angle + r * 0.09;
        const r0 = d.dist - 12 + win.uStart * 44;
        const r1 = d.dist - 12 + win.uEnd * 44;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rayAng) * r0 + bx, Math.sin(rayAng) * r0 + by);
        ctx.lineTo(Math.cos(rayAng) * r1 + bx, Math.sin(rayAng) * r1 + by);
        ctx.stroke();
      }
    } else if (d.type === 'arc') {
      // Short concentric hand-drawn motion bracket arc outside the scribble rim
      const arcSpan = 0.22;
      const a0 = d.angle - arcSpan * 0.5 + win.uStart * arcSpan;
      const a1 = d.angle - arcSpan * 0.5 + win.uEnd * arcSpan;
      ctx.beginPath();
      ctx.arc(bx, by, d.dist, a0, a1);
      ctx.stroke();
    } else if (d.type === 'star') {
      // Hand-drawn 4-stroke scribble asterisk/star
      const s = d.size;
      const axes = [0, Math.PI * 0.5, Math.PI * 0.25, Math.PI * 0.75];
      for (let k = 0; k < 4; k++) {
        const a = d.angle + axes[k];
        const l0 = -s + win.uStart * (2 * s);
        const l1 = -s + win.uEnd * (2 * s);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * l0, cy + Math.sin(a) * l0);
        ctx.lineTo(cx + Math.cos(a) * l1, cy + Math.sin(a) * l1);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12 steps-per-second Line Boil index (integer step in [0, 119])
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Primary Motion: Whole-doodle organic breathing, squash & stretch, and subtle rocking tilt
  // Using integer harmonic cycles (k = 1, 2, 4)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);
  const sin4 = Math.sin(TAU * phase * 4);

  const squashX = 1.0 + 0.022 * sin2 - 0.010 * sin4;
  const stretchY = 1.0 - 0.022 * sin2 + 0.010 * sin4;
  const bodyWobbleRot = 0.045 * sin1 + 0.025 * cos2;
  const centerShiftX = 12 * cos1;
  const centerShiftY = 14 * sin2;

  ctx.save();
  ctx.translate(CX + centerShiftX, CY + centerShiftY);
  ctx.rotate(bodyWobbleRot);
  ctx.scale(squashX, stretchY);

  // 2 Complete Draw-On -> Hold -> Erase-from-Start Cycles per 10-second loop (k = 2)
  // Staggered phase offsets between the primary, secondary, and yellow accent scribble loops:
  // - Primary White Scribble has offset 0.50 so at phase=0 and phase=1 it is in its FULL held state,
  //   then erases from start, redraws itself progressively, and returns to full held state at phase=1!
  // - Secondary Outer White Scribble has offset 0.00 (empty at phase=0/1, draws on as Primary un-draws,
  //   creating dynamic overlapping chase action!).
  // - Accent Warm Yellow Scribble has offset 0.22 (overlapping follow-through in #FFD93D).
  const cycleBase = phase * 2;

  const winSecondaryWhite = getDrawEraseWindow(cycleBase + 0.00);
  const winAccentYellow   = getDrawEraseWindow(cycleBase + 0.22);
  const winPrimaryWhite   = getDrawEraseWindow(cycleBase + 0.50);

  // 1. Secondary Motion Layer: Outer Loose White Marker Scribble Loop
  renderMarkerScribble(
    SECONDARY_WHITE_SCRIBBLE,
    winSecondaryWhite.uStart,
    winSecondaryWhite.uEnd,
    COLOR_WHITE,
    boilStep
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Marker Accent Scribble Loop
  renderMarkerScribble(
    ACCENT_YELLOW_SCRIBBLE,
    winAccentYellow.uStart,
    winAccentYellow.uEnd,
    COLOR_YELLOW,
    boilStep
  );

  // 3. Primary Motion Layer: Main Bold White Marker Scribble Circle
  renderMarkerScribble(
    PRIMARY_SCRIBBLE,
    winPrimaryWhite.uStart,
    winPrimaryWhite.uEnd,
    COLOR_WHITE,
    boilStep
  );

  // 4. Ambient Motion Layer: Hand-Drawn Marker Emphasis Ticks, Arcs & Doodle Stars
  renderAmbientDoodles(phase, boilStep);

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
