<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism Single Sticker 02: Starburst Discount Badge (Green Screen) - 6s Loop</title>
  <style>
    :root {
      --bg-base: #00FF00;
      --ink: #111111;
      --hot-pink: #FB7185;
      --neon-yellow: #FDE047;
      --acid-lime: #A3E635;
      --cyber-cyan: #38BDF8;
      --electric-purple: #C084FC;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s, 1.5s
    ===================================================== */

    /* 1. Stiker Utama Melayang & Membal Ritmis (Siklus 3s = 2x per loop) */
    .sticker-bounce-wrap {
      animation: badgeBounce 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0px) scale(1) rotate(-4deg); }
      25% { transform: translateY(-18px) scale(1.08) rotate(3deg); }
      50% { transform: translateY(4px) scale(0.95) rotate(-2deg); }
      75% { transform: translateY(-12px) scale(1.05) rotate(2deg); }
    }

    /* 2. Bintang Bergerigi 12 Sudut Berputar Patah-Patah (6s) */
    .starburst-step-spin {
      animation: stepSpin 6s steps(12, end) infinite;
    }
    @keyframes stepSpin {
      to { transform: rotate(360deg); }
    }

    /* 3. Lingkaran Inti & Simbol % Berdenyut Kontra-Ritme (Siklus 1.5s = 4x per loop) */
    .core-percent-pop {
      animation: corePop 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes corePop {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.13); }
    }

    /* 4. Percikan Garis Komik & Bintang Aksen (Siklus 3s) */
    .comic-rays-pulse {
      animation: raysPulse 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes raysPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.9; }
      25% { transform: scale(1.14); opacity: 1; }
      50% { transform: scale(0.88); opacity: 0.75; }
      75% { transform: scale(1.1); opacity: 1; }
    }

    .mini-star-1 {
      animation: twinkleA 3s ease-in-out infinite;
    }
    .mini-star-2 {
      animation: twinkleB 3s ease-in-out infinite;
    }
    @keyframes twinkleA {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.45) rotate(45deg); }
    }
    @keyframes twinkleB {
      0%, 100% { transform: scale(0.45) rotate(-45deg); }
      50% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <!-- Latar Green Screen Murni -->
      <rect width="1920" height="1080" fill="var(--bg-base)"/>

      <!-- =====================================================
           SINGLE HERO STICKER: STARBURST DISCOUNT BADGE (%)
      ====================================================== -->
      <g transform="translate(960, 540)">
        <!-- Garis Ledakan Komik di Sekitar Stiker -->
        <g class="comic-rays-pulse" stroke="var(--ink)" stroke-width="9" stroke-linecap="round">
          <line x1="-295" y1="-195" x2="-350" y2="-230"/>
          <line x1="-325" y1="0" x2="-385" y2="0"/>
          <line x1="-295" y1="195" x2="-350" y2="230"/>

          <line x1="295" y1="-195" x2="350" y2="-230"/>
          <line x1="325" y1="0" x2="385" y2="0"/>
          <line x1="295" y1="195" x2="350" y2="230"/>
        </g>

        <!-- Bintang Kilau Kiri Bawah (Cyber Cyan) -->
        <g transform="translate(-310, 245)">
          <g class="mini-star-1">
            <path d="M0 -42 C4 -11 11 -4 42 0 C11 4 4 11 0 42 C-4 11 -11 4 -42 0 C-11 -4 -4 -11 0 -42 Z" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- Bintang Kilau Kanan Atas (Acid Lime) -->
        <g transform="translate(315, -240)">
          <g class="mini-star-2">
            <path d="M0 -46 C4 -12 12 -4 46 0 C12 4 4 12 0 46 C-4 12 -12 4 -46 0 C-12 -4 -4 -12 0 -46 Z" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- Bodi Utama Stiker -->
        <g class="sticker-bounce-wrap">
          <!-- Bintang Bergerigi 12 Sudut + Hard Offset Shadow -->
          <g class="starburst-step-spin">
            <!-- Hard Offset Shadow Hitam -->
            <g transform="translate(18, 20)">
              <polygon points="0,-275 56,-192 156,-224 152,-120 252,-88 192,0 252,88 152,120 156,224 56,192 0,275 -56,192 -156,224 -152,120 -252,88 -192,0 -252,-88 -152,-120 -156,-224 -56,-192" fill="var(--ink)"/>
            </g>

            <!-- Bintang Utama Hot Pink -->
            <polygon points="0,-275 56,-192 156,-224 152,-120 252,-88 192,0 252,88 152,120 156,224 56,192 0,275 -56,192 -156,224 -152,120 -252,88 -192,0 -252,-88 -152,-120 -156,-224 -56,-192" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="11" stroke-linejoin="round"/>
          </g>

          <!-- Lingkaran Inti Kuning Neon & Simbol Persen (%) Geometris -->
          <g class="core-percent-pop">
            <!-- Hard Shadow Lingkaran Dalam -->
            <circle cx="8" cy="10" r="142" fill="var(--ink)"/>
            <!-- Lingkaran Kuning Neon -->
            <circle cx="0" cy="0" r="142" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="10"/>

            <!-- Garis Diagonal Simbol Persen (%) -->
            <line x1="-54" y1="58" x2="54" y2="-58" stroke="var(--ink)" stroke-width="24" stroke-linecap="round"/>

            <!-- Lingkaran Atas Kiri (%) -->
            <circle cx="-46" cy="-42" r="28" fill="var(--white)" stroke="var(--ink)" stroke-width="11"/>

            <!-- Lingkaran Bawah Kanan (%) -->
            <circle cx="46" cy="42" r="28" fill="var(--white)" stroke="var(--ink)" stroke-width="11"/>

            <!-- Aksen Kilau Putih Melengkung -->
            <path d="M-92 -68 A112 112 0 0 1 -46 -102" fill="none" stroke="var(--white)" stroke-width="9" stroke-linecap="round"/>
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
