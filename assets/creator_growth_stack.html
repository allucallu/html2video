<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism 02: Creator Economy & Social Growth Stack - 6s Loop</title>
  <style>
    :root {
      /* Ubah ke #FFFFFF atau #00FF00 jika butuh latar solid/chroma */
      --bg-base: #F6F2E9;
      --ink: #111111;
      --neon-yellow: #FDE047;
      --electric-purple: #C084FC;
      --acid-lime: #A3E635;
      --hot-pink: #FB7185;
      --cyber-cyan: #38BDF8;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas {
      width: 100vw;
      max-width: 1920px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* =====================================================
       MASTER SEAMLESS LOOP (6 DETIK)
       Semua siklus sinkron: 6s, 3s
    ===================================================== */

    /* 1. Kartu Samping Melayang Kaku (6s) */
    .card-bob-left { animation: bobLeft 6s ease-in-out infinite; }
    .card-bob-right { animation: bobRight 6s ease-in-out infinite; }

    @keyframes bobLeft {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(-1deg); }
    }
    @keyframes bobRight {
      0%, 100% { transform: translateY(-12px) rotate(3deg); }
      50% { transform: translateY(0px) rotate(1deg); }
    }

    /* 2. Kursor Piksel Mengklik Tombol Play di Tengah (Siklus 3s) */
    .cursor-action {
      animation: clickPlayCursor 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes clickPlayCursor {
      0% {
        transform: translate(230px, 190px) scale(1);
        opacity: 0;
      }
      14% {
        transform: translate(180px, 145px) scale(1);
        opacity: 1;
      }
      28% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      35% {
        transform: translate(5px, 6px) scale(0.86);
        opacity: 1;
      }
      43% {
        transform: translate(0px, 0px) scale(1);
        opacity: 1;
      }
      78% {
        transform: translate(-185px, 140px) scale(1);
        opacity: 1;
      }
      92%, 100% {
        transform: translate(-225px, 175px) scale(0.85);
        opacity: 0;
      }
    }

    /* 3. Tombol Play Tertekan & Membal Saat Diklik (Siklus 3s) */
    .play-btn-press {
      animation: pressPlay 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes pressPlay {
      0%, 30%, 44%, 100% { transform: translate(0px, 0px) scale(1); }
      35% { transform: translate(7px, 7px) scale(0.93); }
      40% { transform: translate(-2px, -2px) scale(1.06); }
    }

    /* 4. Timeline Video Berjalan Otomatis (Siklus 3s) */
    .video-timeline-fill {
      transform-origin: 0px 0px;
      animation: scrubVideo 3s linear infinite;
    }
    @keyframes scrubVideo {
      0%, 34% { transform: scaleX(0.08); }
      88% { transform: scaleX(1); }
      96%, 100% { transform: scaleX(0.08); }
    }

    /* 5. Reaksi Hati & Lonceng Berdering di Kartu Kiri (Siklus 3s) */
    .heart-pop {
      animation: popHeart 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes popHeart {
      0%, 36%, 94%, 100% { transform: scale(1); }
      45% { transform: scale(1.26); }
      55% { transform: scale(1.08); }
    }

    .bell-ring {
      animation: ringBell 3s ease-in-out infinite;
    }
    @keyframes ringBell {
      0%, 38%, 68%, 100% { transform: rotate(0deg); }
      43% { transform: rotate(18deg); }
      48% { transform: rotate(-16deg); }
      53% { transform: rotate(12deg); }
      58% { transform: rotate(-8deg); }
    }

    /* 6. Koin Dolar ($) Melompat Keluar dari Kartu Monetisasi Kanan (Siklus 3s) */
    .coin-launch-1 {
      animation: jumpCoin1 3s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
    }
    @keyframes jumpCoin1 {
      0%, 38% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      48% {
        transform: translate(-35px, -115px) scale(1.05);
        opacity: 1;
      }
      76% {
        transform: translate(-65px, -175px) scale(1);
        opacity: 1;
      }
      88%, 100% {
        transform: translate(-80px, -210px) scale(0.4);
        opacity: 0;
      }
    }

    .coin-launch-2 {
      animation: jumpCoin2 3s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
    }
    @keyframes jumpCoin2 {
      0%, 44% {
        transform: translate(0px, 0px) scale(0.3);
        opacity: 0;
      }
      54% {
        transform: translate(40px, -105px) scale(1.05);
        opacity: 1;
      }
      80% {
        transform: translate(75px, -160px) scale(1);
        opacity: 1;
      }
      92%, 100% {
        transform: translate(90px, -195px) scale(0.4);
        opacity: 0;
      }
    }

    /* 7. Grafik Pertumbuhan di Kartu Kanan Naik Berurutan (Siklus 3s) */
    .rev-bar-1 { animation: growBar 3s ease-in-out infinite 0.35s; }
    .rev-bar-2 { animation: growBar 3s ease-in-out infinite 0.45s; }
    .rev-bar-3 { animation: growBar 3s ease-in-out infinite 0.55s; }

    @keyframes growBar {
      0%, 35%, 95%, 100% { transform: scaleY(0.45); }
      55%, 86% { transform: scaleY(1); }
    }

    /* 8. Stiker Bintang Sudut Berputar (6s) */
    .sticker-spin {
      animation: spinStep 6s steps(12, end) infinite;
    }
    @keyframes spinStep {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="canvas">
    <svg viewBox="0 0 1920 1080" width="100%" height="100%">
      <defs>
        <!-- Pola Grid Latar Belakang -->
        <pattern id="creatorGrid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.12"/>
        </pattern>
      </defs>

      <!-- Latar Grid -->
      <rect width="1920" height="1080" fill="url(#creatorGrid)"/>

      <!-- =====================================================
           DEKORASI STIKER GEOMETRIS BRUTALIST
      ====================================================== -->
      <!-- Stiker Bintang Kiri Atas -->
      <g transform="translate(275, 225)">
        <g class="sticker-spin">
          <polygon points="0,-54 14,-18 52,-18 22,7 33,45 0,22 -33,45 -22,7 -52,-18 -14,-18" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5.5" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="11" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="4.5"/>
        </g>
      </g>

      <!-- Stiker Segitiga Kanan Bawah -->
      <g transform="translate(1640, 835) rotate(14)">
        <polygon points="8,-38 48,34 -32,34" fill="var(--ink)"/>
        <polygon points="0,-46 40,26 -40,26" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="5.5" stroke-linejoin="round"/>
      </g>

      <!-- =====================================================
           1. JENDELA CREATOR MEDIA PLAYER UTAMA (PUSAT)
      ====================================================== -->
      <g transform="translate(610, 210)">
        <!-- Bayangan Keras (Hard Offset Shadow) -->
        <rect x="18" y="18" width="700" height="620" rx="20" fill="var(--ink)"/>

        <!-- Bodi Utama Jendela -->
        <rect x="0" y="0" width="700" height="620" rx="20" fill="var(--white)" stroke="var(--ink)" stroke-width="7"/>

        <!-- Title Bar Pink Neon -->
        <path d="M4 20 C4 11 11 4 20 4 H680 C689 4 696 11 696 20 V68 H4 Z" fill="var(--hot-pink)"/>
        <line x1="0" y1="68" x2="700" y2="68" stroke="var(--ink)" stroke-width="7"/>

        <!-- Kontrol Jendela Kiri (3 Lingkaran) -->
        <circle cx="36" cy="36" r="10" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="68" cy="36" r="10" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="100" cy="36" r="10" fill="var(--white)" stroke="var(--ink)" stroke-width="4"/>

        <!-- Pill Live Indicator di Title Bar -->
        <rect x="546" y="21" width="120" height="30" rx="15" fill="var(--white)" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="568" cy="36" r="7" fill="var(--hot-pink)"/>
        <rect x="584" y="31" width="62" height="10" rx="5" fill="var(--ink)"/>

        <!-- Layar Viewport Pemutar Video -->
        <g transform="translate(42, 102)">
          <rect x="10" y="10" width="616" height="340" rx="16" fill="var(--ink)"/>
          <rect x="0" y="0" width="616" height="340" rx="16" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="6"/>

          <!-- Garis Latar Diagonal Geometris di Dalam Layar -->
          <g stroke="var(--white)" stroke-width="4" opacity="0.35">
            <line x1="36" y1="36" x2="120" y2="36"/>
            <line x1="36" y1="54" x2="88" y2="54"/>
            <circle cx="556" cy="52" r="18" fill="none"/>
          </g>

          <!-- Tombol PLAY Utama (Tengah Layar) -->
          <g transform="translate(308, 170)">
            <!-- Bayangan Statis Tombol Play -->
            <rect x="-62" y="-54" width="136" height="120" rx="24" fill="var(--ink)"/>
            <!-- Bodi Tombol Play Kuning Neon -->
            <g class="play-btn-press">
              <rect x="-68" y="-60" width="136" height="120" rx="24" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="6"/>
              <polygon points="-16,-28 30,0 -16,28" fill="var(--ink)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
            </g>
          </g>
        </g>

        <!-- Timeline Scrubber Bar -->
        <g transform="translate(42, 476)">
          <rect x="0" y="0" width="616" height="26" rx="13" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(6, 6)">
            <rect class="video-timeline-fill" x="0" y="0" width="604" height="14" rx="7" fill="var(--acid-lime)"/>
          </g>
        </g>

        <!-- Bar Interaksi Kreator Bawah (Like, Share, Monetize) -->
        <g transform="translate(42, 526)">
          <!-- Tombol Like -->
          <rect x="6" y="6" width="130" height="54" rx="14" fill="var(--ink)"/>
          <rect x="0" y="0" width="130" height="54" rx="14" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="5"/>
          <path d="M42 36 C38 32 26 23 26 16 C26 11 30 8 34 8 C38 8 40 10 42 13 C44 10 46 8 50 8 C54 8 58 11 58 16 C58 23 46 32 42 36 Z" fill="var(--white)" stroke="var(--ink)" stroke-width="3.5"/>
          <rect x="70" y="22" width="40" height="10" rx="5" fill="var(--ink)"/>

          <!-- Tombol Subscribe / Bell -->
          <rect x="158" y="6" width="150" height="54" rx="14" fill="var(--ink)"/>
          <rect x="152" y="0" width="150" height="54" rx="14" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5"/>
          <circle cx="184" cy="27" r="12" fill="var(--ink)"/>
          <rect x="208" y="21" width="72" height="12" rx="6" fill="var(--ink)"/>

          <!-- Tombol Boost / Monetize Kanan -->
          <rect x="466" y="6" width="150" height="54" rx="14" fill="var(--ink)"/>
          <rect x="460" y="0" width="150" height="54" rx="14" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="5"/>
          <rect x="488" y="21" width="94" height="12" rx="6" fill="var(--ink)"/>
        </g>
      </g>

      <!-- =====================================================
           2. KARTU INTERAKSI & NOTIFIKASI (SISI KIRI)
      ====================================================== -->
      <g transform="translate(210, 415)">
        <g class="card-bob-left">
          <rect x="14" y="14" width="320" height="310" rx="18" fill="var(--ink)"/>
          <rect x="0" y="0" width="320" height="310" rx="18" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="6"/>

          <!-- Header Kartu -->
          <path d="M4 18 C4 10 10 4 18 4 H302 C310 4 316 10 316 18 V48 H4 Z" fill="var(--ink)"/>
          <circle cx="28" cy="26" r="7" fill="var(--neon-yellow)"/>
          <circle cx="50" cy="26" r="7" fill="var(--hot-pink)"/>

          <!-- Kotak Ikon Hati (Kiri) -->
          <rect x="28" y="76" width="122" height="122" rx="16" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(89, 140)">
            <g class="heart-pop">
              <path d="M0 24 C-8 16 -34 -2 -34 -18 C-34 -29 -25 -37 -14 -37 C-7 -37 -2 -33 0 -28 C2 -33 7 -37 14 -37 C25 -37 34 -29 34 -18 C34 -2 8 16 0 24 Z" fill="var(--hot-pink)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
            </g>
          </g>

          <!-- Kotak Ikon Lonceng Notifikasi (Kanan) -->
          <rect x="170" y="76" width="122" height="122" rx="16" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(231, 134)">
            <g class="bell-ring">
              <!-- Kubah Lonceng -->
              <path d="M-24 14 H24 L19 4 V-8 C19 -19 11 -27 0 -27 C-11 -27 -19 -19 -19 -8 V4 Z" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4.5" stroke-linejoin="round"/>
              <circle cx="0" cy="-31" r="5" fill="var(--ink)"/>
              <path d="M-7 16 A7 7 0 0 0 7 16" fill="var(--ink)"/>
            </g>
          </g>

          <!-- Bar Statistik Engagement Bawah -->
          <rect x="28" y="224" width="264" height="56" rx="12" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <circle cx="58" cy="252" r="12" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="3.5"/>
          <rect x="84" y="245" width="176" height="14" rx="7" fill="var(--ink)"/>
        </g>
      </g>

      <!-- =====================================================
           3. KARTU MONETISASI & KOIN DOLAR (SISI KANAN)
      ====================================================== -->
      <g transform="translate(1390, 355)">
        <g class="card-bob-right">
          <rect x="14" y="14" width="320" height="330" rx="18" fill="var(--ink)"/>
          <rect x="0" y="0" width="320" height="330" rx="18" fill="var(--acid-lime)" stroke="var(--ink)" stroke-width="6"/>

          <!-- Header Kartu -->
          <path d="M4 18 C4 10 10 4 18 4 H302 C310 4 316 10 316 18 V48 H4 Z" fill="var(--white)"/>
          <line x1="0" y1="48" x2="320" y2="48" stroke="var(--ink)" stroke-width="6"/>
          <rect x="24" y="18" width="96" height="14" rx="7" fill="var(--ink)"/>

          <!-- Area Grafik Batang Pertumbuhan Pendapatan -->
          <rect x="28" y="74" width="264" height="150" rx="14" fill="var(--white)" stroke="var(--ink)" stroke-width="5"/>
          <g transform="translate(64, 200)">
            <rect class="rev-bar-1" x="0" y="-65" width="42" height="65" rx="8" fill="var(--cyber-cyan)" stroke="var(--ink)" stroke-width="4.5"/>
          </g>
          <g transform="translate(138, 200)">
            <rect class="rev-bar-2" x="0" y="-88" width="42" height="88" rx="8" fill="var(--electric-purple)" stroke="var(--ink)" stroke-width="4.5"/>
          </g>
          <g transform="translate(212, 200)">
            <rect class="rev-bar-3" x="0" y="-110" width="42" height="110" rx="8" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="4.5"/>
          </g>

          <!-- Pill Ringkasan Bawah -->
          <rect x="28" y="246" width="264" height="56" rx="14" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5"/>
          <circle cx="60" cy="274" r="14" fill="var(--white)" stroke="var(--ink)" stroke-width="4"/>
          <rect x="88" y="267" width="174" height="14" rx="7" fill="var(--ink)"/>
        </g>
      </g>

      <!-- =====================================================
           4. KOIN DOLAR ($) MELOMPAT KELUAR (MONETIZATION POP)
      ====================================================== -->
      <!-- Koin 1 -->
      <g transform="translate(1520, 385)">
        <g class="coin-launch-1">
          <circle cx="5" cy="5" r="32" fill="var(--ink)"/>
          <circle cx="0" cy="0" r="32" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5.5"/>
          <!-- Simbol Dolar ($) Geometris -->
          <path d="M8 -10 C8 -15 -8 -15 -8 -8 C-8 0 8 -1 8 8 C8 15 -8 15 -8 10 M0 -18 V18" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Koin 2 -->
      <g transform="translate(1585, 395)">
        <g class="coin-launch-2">
          <circle cx="5" cy="5" r="28" fill="var(--ink)"/>
          <circle cx="0" cy="0" r="28" fill="var(--neon-yellow)" stroke="var(--ink)" stroke-width="5"/>
          <path d="M7 -9 C7 -13 -7 -13 -7 -7 C-7 0 7 -1 7 7 C7 13 -7 13 -7 9 M0 -15 V15" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- =====================================================
           5. KURSOR PANAH PIKSEL INTERAKTIF
      ====================================================== -->
      <g transform="translate(970, 505)">
        <g class="cursor-action">
          <polygon points="8,8 8,74 24,58 38,88 50,82 36,52 58,52" fill="var(--ink)"/>
          <polygon points="0,0 0,66 16,50 30,80 42,74 28,44 50,44" fill="var(--white)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
