<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4K Seamless Ghost Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <!-- True 4K UHD (3840x2160) Internal Rendering Canvas -->
  <canvas id="canvas4k" width="3840" height="2160"></canvas>

  <script>
    /**
     * 4K UHD (3840x2160) Seamless Loop Animation
     * Recreating the comic/ink illustration ghost with backwards snapback cap,
     * cheek cross-scar, deep cel-shaded drapery folds, and periodic wave physics.
     */
    const canvas = document.getElementById('canvas4k');
    const ctx = canvas.getContext('2d', { alpha: true });

    const W = 3840;
    const H = 2160;
    const LOOP_SECONDS = 4.0; // 100% mathematically seamless 4.0s periodic cycle

    // Helper: Evaluate cubic bezier point at t
    function cubicPoint(p0x, p0y, p1x, p1y, p2x, p2y, p3x, p3y, t) {
      const mt = 1 - t;
      const mt2 = mt * mt;
      const t2 = t * t;
      const a = mt2 * mt;
      const b = 3 * mt2 * t;
      const c = 3 * mt * t2;
      const d = t2 * t;
      return {
        x: a * p0x + b * p1x + c * p2x + d * p3x,
        y: a * p0y + b * p1y + c * p2y + d * p3y
      };
    }

    // Helper: Draw comic hatch lines along a region for authentic ink texture
    function drawHatchLines(ctx, lines, color, lineWidth) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        ctx.moveTo(l[0], l[1]);
        if (l.length === 6) {
          ctx.quadraticCurveTo(l[2], l[3], l[4], l[5]);
        } else {
          ctx.lineTo(l[2], l[3]);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    /**
     * Builds the complete ghost body & cap paths for a given seamless phase angle `theta` in [0, 2*PI).
     */
    function renderGhostFrame(theta) {
      // 1. Clear frame sesuai mode background (black solid atau transparent alpha)
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const isAlpha = window.asset && window.asset.params && window.asset.params.bg === 'alpha';
      if (isAlpha) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Skala dari resolusi desain 3840x2160 ke canvas.width / canvas.height
      const scaleX = canvas.width / W;
      const scaleY = canvas.height / H;
      ctx.scale(scaleX, scaleY);

      // 2. Primary Periodic Motion (Float, Sway, Tilt)
      const hoverY = Math.sin(theta) * 52;
      const swayX = Math.cos(theta) * 18;
      const bodyTilt = Math.sin(theta - 0.55) * 0.028; // Subtle pendulum rotation
      const breathe = Math.sin(theta - 0.3);

      // Delayed wave phases from top of sheet to bottom hem (traveling cloth wave)
      const wMid = Math.sin(theta - 0.85);
      const wLow = Math.sin(theta - 1.55);
      const wTip = Math.sin(theta - 2.15);
      const wRipple2 = Math.cos(theta - 1.25);

      // Delayed secondary motion for the cap & brim
      const brimFlex = Math.sin(theta - 0.75) * 12;
      const headTurnX = Math.cos(theta - 0.4) * 8;
      const headNodY = Math.sin(theta - 0.35) * 7;

      // Smooth periodic blink centered around theta = 3.6 rad (zero at 0 and 2*PI)
      const blinkWave = (1 - Math.cos(theta - 3.6)) * 0.5; // [0, 1]
      const blinkAmount = Math.pow(blinkWave, 28); // Sharp natural blink once per loop
      const eyeScaleY = 1 - 0.92 * blinkAmount;

      ctx.save();
      // Center of the character in 3840x2160 space
      ctx.translate(W * 0.5 + swayX, H * 0.50 + hoverY);
      ctx.rotate(bodyTilt);
      // Scale factor so the character fills the 4K vertical frame cleanly with breathing room
      const S = 1.62;
      ctx.scale(S, S);

      // =========================================================================
      // DYNAMIC CLOTH CONTROL POINTS (Local coordinates roughly -500..+500, -560..+560)
      // =========================================================================
      // Neck / Head-Sheet attachment points
      const leftTempleX = -172;
      const leftTempleY = -235;
      const rightTempleX = 212;
      const rightTempleY = -278;

      // 1. Far-Left Flare Tip (Pointed left wing of the sheet)
      const pLeftTipX = -435 + wLow * 26 - breathe * 8;
      const pLeftTipY = 308 + wTip * 18 - wMid * 10;

      // 2. Valley 1 (Underneath the far-left wing, curling inward)
      const pVal1X = -206 + wLow * 22;
      const pVal1Y = 352 + wTip * 14;

      // 3. Lobe 2 (Lower-left U-shaped rounded fold)
      const pLobe2LeftX = -194 + wTip * 28;
      const pLobe2LeftY = 476 + wLow * 16;
      const pLobe2RightX = -48 + wTip * 26;
      const pLobe2RightY = 486 + wLow * 18;

      // 4. Valley 2 (Deep central-left arch between Lobe 2 and Lobe 3)
      const pVal2X = 6 + wLow * 20;
      const pVal2Y = 378 - wTip * 12;

      // 5. Lobe 3 (Lowest, largest central-right draping fold)
      const pLobe3LeftX = 148 + wTip * 25;
      const pLobe3LeftY = 528 + wLow * 22;
      const pLobe3RightX = 248 + wTip * 24;
      const pLobe3RightY = 516 + wLow * 20;

      // 6. Lobe 4 (Broad bottom-right sweeping fold)
      const pLobe4BotX = 354 + wLow * 22;
      const pLobe4BotY = 468 + wTip * 18;
      const pLobe4OuterX = 466 + wMid * 26 + breathe * 10;
      const pLobe4OuterY = 278 + wLow * 20;

      // 7. Upper-Right Sleeve Flare (Rightmost mid-body fold)
      const pRightSleeveX = 462 + wMid * 22;
      const pRightSleeveY = 82 + wLow * 15;
      const pRightTuckX = 398 + wMid * 18;
      const pRightTuckY = 148 + wLow * 14;

      // =========================================================================
      // HELPER TO TRACE FULL OUTER SILHOUETTE (For crisp white sticker rim on #000)
      // =========================================================================
      function traceSheetAndUnderside() {
        // Under-hem dark pockets + main sheet combined path
        ctx.moveTo(leftTempleX, leftTempleY);
        // Left edge sweeping down to far-left pointed tip
        ctx.bezierCurveTo(
          -196 + wMid * 8, -30,
          -235 + wLow * 18, 175,
          pLeftTipX, pLeftTipY
        );
        // Bottom edge of far-left wing into underside curve
        ctx.bezierCurveTo(
          pLeftTipX + 75, pLeftTipY + 42,
          pVal1X - 95, pVal1Y + 86,
          pLobe2LeftX, pLobe2LeftY
        );
        // Bottom of Lobe 2
        ctx.bezierCurveTo(
          pLobe2LeftX + 35, pLobe2LeftY + 55,
          pLobe2RightX - 25, pLobe2RightY + 40,
          pLobe2RightX, pLobe2RightY
        );
        // Arch through Valley 2 into Lobe 3
        ctx.bezierCurveTo(
          pVal2X - 18, pVal2Y + 45,
          pVal2X + 42, pVal2Y + 30,
          pLobe3LeftX, pLobe3LeftY
        );
        // Bottom of Lobe 3 (lowest fold)
        ctx.bezierCurveTo(
          pLobe3LeftX + 32, pLobe3LeftY + 38,
          pLobe3RightX - 18, pLobe3RightY + 34,
          pLobe3RightX, pLobe3RightY
        );
        // Transition from Lobe 3 to Lobe 4 bottom-right
        ctx.bezierCurveTo(
          pLobe3RightX + 42, pLobe3RightY + 26,
          pLobe4BotX - 30, pLobe4BotY + 32,
          pLobe4BotX, pLobe4BotY
        );
        // Sweeping up from Lobe 4 bottom to Lobe 4 outer corner
        ctx.bezierCurveTo(
          pLobe4BotX + 38, pLobe4BotY - 82,
          pLobe4OuterX + 26, pLobe4OuterY + 35,
          pLobe4OuterX, pLobe4OuterY
        );
        // Up to the right sleeve tuck
        ctx.bezierCurveTo(
          pLobe4OuterX - 18, pLobe4OuterY - 38,
          pRightTuckX + 28, pRightTuckY + 32,
          pRightTuckX + 22, pRightTuckY
        );
        // Right sleeve pocket outer lip
        ctx.bezierCurveTo(
          pRightSleeveX + 18, pRightSleeveY + 44,
          pRightSleeveX + 14, pRightSleeveY + 12,
          pRightSleeveX, pRightSleeveY
        );
        // Right upper torso edge up to right cap temple
        ctx.bezierCurveTo(
          375 + wMid * 10, -45,
          285, -165,
          rightTempleX, rightTempleY
        );
        ctx.closePath();
      }

      function traceCapSilhouette() {
        const bTipX = -384 - brimFlex * 0.5;
        const bTipY = -126 + brimFlex;
        // Start from left side under brim
        ctx.moveTo(-172, -142 + brimFlex * 0.35);
        // Bottom edge of brim out to left tip
        ctx.bezierCurveTo(
          -275, -96 + brimFlex * 0.8,
          bTipX + 10, bTipY + 42,
          bTipX, bTipY
        );
        // Upper edge of brim curving back to left crown
        ctx.bezierCurveTo(
          bTipX - 6, bTipY - 42,
          -292, -238 + brimFlex * 0.4,
          -244, -274
        );
        // Left crown dome up to top button
        ctx.bezierCurveTo(
          -262, -395,
          -186, -498,
          -72, -526
        );
        // Top button (squatchee) dome
        ctx.bezierCurveTo(
          -74, -552,
          -16, -555,
          -12, -528
        );
        // Right crown dome down to right cap band edge
        ctx.bezierCurveTo(
          112, -514,
          208, -412,
          224, -288
        );
        // Right cap band corner
        ctx.bezierCurveTo(
          234, -276,
          226, -262,
          210, -268
        );
        ctx.closePath();
      }

      // =========================================================================
      // LAYER 0: CRISP WHITE RIM CONTOUR SO BLACK INK POPS AGAINST #000000
      // =========================================================================
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // Subtle outer glow for 4K cinema polish
      ctx.shadowColor = 'rgba(255, 255, 255, 0.38)';
      ctx.shadowBlur = 22;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 30;
      ctx.beginPath();
      traceSheetAndUnderside();
      traceCapSilhouette();
      ctx.stroke();

      // Solid razor-sharp white rim around the outer black ink line
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 27;
      ctx.beginPath();
      traceSheetAndUnderside();
      traceCapSilhouette();
      ctx.stroke();
      ctx.restore();

      // =========================================================================
      // LAYER 1: UNDERSIDE DARK INNER SHEET POCKETS (Back-facing cloth folds)
      // =========================================================================
      // 1A. Far-Left & Lobe 2 Underside Pocket
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pLeftTipX, pLeftTipY);
      ctx.bezierCurveTo(
        pLeftTipX + 75, pLeftTipY + 42,
        pVal1X - 95, pVal1Y + 86,
        pLobe2LeftX, pLobe2LeftY
      );
      ctx.bezierCurveTo(
        pLobe2LeftX + 35, pLobe2LeftY + 55,
        pLobe2RightX - 25, pLobe2RightY + 40,
        pLobe2RightX, pLobe2RightY
      );
      ctx.lineTo(pVal2X, pVal2Y);
      ctx.lineTo(pLeftTipX + 90, pLeftTipY - 40);
      ctx.closePath();

      const gradUnderLeft = ctx.createLinearGradient(pLeftTipX, pLeftTipY, pLobe2RightX, pLobe2RightY);
      gradUnderLeft.addColorStop(0, '#141517');
      gradUnderLeft.addColorStop(0.35, '#5e6268');
      gradUnderLeft.addColorStop(0.65, '#1e2023');
      gradUnderLeft.addColorStop(1, '#585c62');
      ctx.fillStyle = gradUnderLeft;
      ctx.fill();

      // Inner dark shadow wedges inside Left Underside
      ctx.fillStyle = '#121315';
      ctx.beginPath();
      ctx.moveTo(pLeftTipX + 8, pLeftTipY + 4);
      ctx.bezierCurveTo(
        pLeftTipX + 75, pLeftTipY + 34,
        pVal1X - 65, pVal1Y + 25,
        pVal1X - 15, pVal1Y + 12
      );
      ctx.lineTo(pLeftTipX + 120, pLeftTipY - 10);
      ctx.closePath();
      ctx.fill();

      // Comic contour hatching inside the left under-pocket
      ctx.clip();
      const hatchUnderLeft = [];
      for (let i = 0; i < 14; i++) {
        const hx = pVal1X - 85 + i * 16;
        const hy = pVal1Y - 10 + i * 7;
        hatchUnderLeft.push([hx, hy, hx - 12, hy + 45, hx - 22, hy + 82]);
      }
      drawHatchLines(ctx, hatchUnderLeft, 'rgba(18, 19, 21, 0.55)', 2.8);
      ctx.restore();

      // 1B. Central & Right Underside Pockets (Under Valley 2, Lobe 3, and Lobe 4)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pLobe2RightX - 10, pLobe2RightY - 15);
      ctx.bezierCurveTo(
        pVal2X - 18, pVal2Y + 45,
        pVal2X + 42, pVal2Y + 30,
        pLobe3LeftX, pLobe3LeftY
      );
      ctx.bezierCurveTo(
        pLobe3LeftX + 32, pLobe3LeftY + 38,
        pLobe3RightX - 18, pLobe3RightY + 34,
        pLobe3RightX, pLobe3RightY
      );
      ctx.bezierCurveTo(
        pLobe3RightX + 42, pLobe3RightY + 26,
        pLobe4BotX - 30, pLobe4BotY + 32,
        pLobe4BotX, pLobe4BotY
      );
      ctx.lineTo(pVal2X, pVal2Y - 40);
      ctx.closePath();

      const gradUnderMid = ctx.createLinearGradient(pVal2X, pVal2Y, pLobe4BotX, pLobe4BotY);
      gradUnderMid.addColorStop(0, '#101113');
      gradUnderMid.addColorStop(0.32, '#5a5e64');
      gradUnderMid.addColorStop(0.68, '#141618');
      gradUnderMid.addColorStop(1, '#4c5056');
      ctx.fillStyle = gradUnderMid;
      ctx.fill();

      ctx.clip();
      const hatchUnderMid = [];
      for (let i = 0; i < 16; i++) {
        const hx = pVal2X - 20 + i * 20;
        const hy = pVal2Y + 10 + (i % 3) * 8;
        hatchUnderMid.push([hx, hy, hx + 8, hy + 55, hx + 18, hy + 110]);
      }
      drawHatchLines(ctx, hatchUnderMid, 'rgba(15, 16, 18, 0.6)', 2.8);
      ctx.restore();

      // 1C. Upper-Right Sleeve Tuck Dark Inner Pocket
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pRightSleeveX, pRightSleeveY);
      ctx.bezierCurveTo(
        pRightSleeveX + 14, pRightSleeveY + 12,
        pRightSleeveX + 18, pRightSleeveY + 44,
        pRightTuckX + 20, pRightTuckY + 8
      );
      ctx.lineTo(pRightTuckX - 25, pRightTuckY - 25);
      ctx.closePath();
      const gradSleevePocket = ctx.createLinearGradient(
        pRightSleeveX, pRightSleeveY,
        pRightTuckX, pRightTuckY + 15
      );
      gradSleevePocket.addColorStop(0, '#5a5e64');
      gradSleevePocket.addColorStop(0.55, '#151719');
      gradSleevePocket.addColorStop(1, '#0c0d0e');
      ctx.fillStyle = gradSleevePocket;
      ctx.fill();
      ctx.restore();

      // =========================================================================
      // LAYER 2: MAIN FRONT WHITE SHEET BODY & DRAPERY FOLDS
      // =========================================================================
      function traceMainFrontSheet() {
        ctx.moveTo(leftTempleX, leftTempleY);
        // Left outer contour down to Far-Left Tip
        ctx.bezierCurveTo(
          -196 + wMid * 8, -30,
          -235 + wLow * 18, 175,
          pLeftTipX, pLeftTipY
        );
        // Front bottom hem wave 1: Far-Left Tip arching up to Valley 1
        ctx.bezierCurveTo(
          pLeftTipX + 92, pLeftTipY + 12,
          pVal1X - 75, pVal1Y - 12,
          pVal1X, pVal1Y
        );
        // Hem wave 2: From Valley 1 curling down around Lobe 2
        ctx.bezierCurveTo(
          pVal1X + 42, pVal1Y + 24,
          pLobe2LeftX - 18, pLobe2LeftY - 48,
          pLobe2LeftX, pLobe2LeftY
        );
        // Bottom loop of Lobe 2 up into Crease 1 / Valley 2
        ctx.bezierCurveTo(
          pLobe2LeftX + 12, pLobe2LeftY - 52,
          pVal1X + 92, pVal1Y + 8,
          pVal1X + 98, pVal1Y - 38
        );
        // Down the right side of Lobe 2 front lip
        ctx.bezierCurveTo(
          pVal1X + 115, pVal1Y + 25,
          pLobe2RightX - 10, pLobe2RightY - 62,
          pLobe2RightX, pLobe2RightY
        );
        // Up into Valley 2 arch
        ctx.bezierCurveTo(
          pLobe2RightX + 18, pLobe2RightY - 48,
          pVal2X - 24, pVal2Y - 12,
          pVal2X, pVal2Y
        );
        // Sweeping down from Valley 2 to the bottom of central Lobe 3
        ctx.bezierCurveTo(
          pVal2X + 35, pVal2Y + 18,
          pLobe3LeftX - 36, pLobe3LeftY - 22,
          pLobe3LeftX, pLobe3LeftY
        );
        // Curling up into the deep central fold pocket between Lobe 3 and Lobe 4
        ctx.bezierCurveTo(
          pLobe3LeftX + 26, pLobe3LeftY + 12,
          pLobe3RightX - 42, pLobe3RightY - 95,
          pLobe3RightX - 38, pLobe3RightY - 125
        );
        // Coming back down the right rim of the central fold pocket to Lobe 3/4 base
        ctx.bezierCurveTo(
          pLobe3RightX + 8, pLobe3RightY - 60,
          pLobe3RightX + 18, pLobe3RightY - 8,
          pLobe3RightX, pLobe3RightY
        );
        // Sweeping down-right and then smoothly up along Lobe 4's wide front hem
        ctx.bezierCurveTo(
          pLobe3RightX + 55, pLobe3RightY - 12,
          pLobe4BotX - 22, pLobe4BotY + 14,
          pLobe4BotX, pLobe4BotY
        );
        ctx.bezierCurveTo(
          pLobe4BotX + 38, pLobe4BotY - 82,
          pLobe4OuterX + 26, pLobe4OuterY + 35,
          pLobe4OuterX, pLobe4OuterY
        );
        // Up along the lower-right fold crease toward the chest
        ctx.bezierCurveTo(
          pLobe4OuterX - 45, pLobe4OuterY - 75,
          pRightTuckX - 22, pRightTuckY + 10,
          pRightTuckX, pRightTuckY
        );
        // Out to the upper-right sleeve tip
        ctx.bezierCurveTo(
          pRightTuckX + 22, pRightTuckY - 18,
          pRightSleeveX - 18, pRightSleeveY + 14,
          pRightSleeveX, pRightSleeveY
        );
        // Rightmost outer edge up to the cap's right temple
        ctx.bezierCurveTo(
          375 + wMid * 10, -45,
          285, -165,
          rightTempleX, rightTempleY
        );
        ctx.closePath();
      }

      ctx.save();
      ctx.beginPath();
      traceMainFrontSheet();
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // Clip to the front white sheet so all cel-shaded grey folds stay razor-sharp inside
      ctx.clip();

      // -----------------------------------------------------------------------
      // CEL-SHADED GREY FOLDS & SOFT GRADIENT SHADOWS ON THE SHEET
      // -----------------------------------------------------------------------

      // A. Left Edge & Far-Left Wing Shading
      ctx.beginPath();
      ctx.moveTo(-175, -230);
      ctx.bezierCurveTo(-195, -20, -235 + wLow * 16, 175, pLeftTipX, pLeftTipY);
      ctx.bezierCurveTo(
        pLeftTipX + 95, pLeftTipY + 8,
        pVal1X - 40, pVal1Y - 15,
        pVal1X + 10, pVal1Y - 18
      );
      ctx.bezierCurveTo(
        -135 + wMid * 12, 195,
        -132 + wMid * 8, -25,
        -132, -210
      );
      ctx.closePath();
      const gradLeftEdge = ctx.createLinearGradient(-290, 60, -115, 60);
      gradLeftEdge.addColorStop(0, '#969aa0');
      gradLeftEdge.addColorStop(0.55, '#c8ccd2');
      gradLeftEdge.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradLeftEdge;
      ctx.fill();

      // Darker cel-shadow wedge right under the cap brim on the left neck
      ctx.beginPath();
      ctx.moveTo(-185, -235);
      ctx.bezierCurveTo(-195, -120, -195, -40, -182, 45);
      ctx.bezierCurveTo(-155, -20, -142, -135, -128, -225);
      ctx.closePath();
      const gradUnderBrimNeck = ctx.createLinearGradient(-190, -210, -130, -60);
      gradUnderBrimNeck.addColorStop(0, '#55585e');
      gradUnderBrimNeck.addColorStop(0.5, '#92969c');
      gradUnderBrimNeck.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradUnderBrimNeck;
      ctx.fill();

      // B. Left-Center Cylinder Fold (Lobe 2 Shaded Column)
      ctx.beginPath();
      ctx.moveTo(-108 + wMid * 6, -15);
      ctx.bezierCurveTo(
        -75 + wMid * 14, 155,
        pVal1X + 85, pVal1Y - 120,
        pLobe2RightX, pLobe2RightY
      );
      ctx.lineTo(pLobe2LeftX - 15, pLobe2LeftY + 10);
      ctx.bezierCurveTo(
        pVal1X + 10, pVal1Y - 60,
        -148 + wMid * 10, 165,
        -108 + wMid * 6, -15
      );
      ctx.closePath();
      const gradLobe2 = ctx.createLinearGradient(
        -140 + wMid * 10, 120,
        pLobe2RightX + 10, 460
      );
      gradLobe2.addColorStop(0, 'rgba(210, 214, 220, 0)');
      gradLobe2.addColorStop(0.28, '#aeb2b8');
      gradLobe2.addColorStop(0.75, '#7e8288');
      gradLobe2.addColorStop(1, '#686c72');
      ctx.fillStyle = gradLobe2;
      ctx.fill();

      // Highlight ribbon along the left rim of Lobe 2's curl
      ctx.beginPath();
      ctx.moveTo(-125 + wMid * 10, 180);
      ctx.bezierCurveTo(
        pVal1X - 10, pVal1Y - 40,
        pLobe2LeftX - 8, pLobe2LeftY - 55,
        pLobe2LeftX + 6, pLobe2LeftY - 12
      );
      ctx.bezierCurveTo(
        pLobe2LeftX + 18, pLobe2LeftY - 62,
        pVal1X + 35, pVal1Y - 45,
        -105 + wMid * 10, 180
      );
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      // C. Central Chest & Main Crease Shadow (Leading into Lobe 3 & Valley 2)
      ctx.beginPath();
      ctx.moveTo(42 + wMid * 5, -52);
      ctx.bezierCurveTo(
        18 + wMid * 10, 68,
        -10 + wLow * 16, 220,
        pVal2X - 8, pVal2Y + 10
      );
      ctx.lineTo(pLobe3LeftX + 16, pLobe3LeftY + 10);
      ctx.bezierCurveTo(
        118 + wLow * 20, 320,
        62 + wMid * 14, 95,
        42 + wMid * 5, -52
      );
      ctx.closePath();
      const gradCenterFold = ctx.createLinearGradient(
        -10, 160,
        135 + wLow * 16, 210
      );
      gradCenterFold.addColorStop(0, 'rgba(185, 190, 196, 0.35)');

      const gradButton = ctx.createLinearGradient(-70, -550, -15, -525);
      gradButton.addColorStop(0, '#FFFFFF');
      gradButton.addColorStop(0.55, '#8a8e94');
      gradButton.addColorStop(1, '#222428');
      ctx.fillStyle = gradButton;
      ctx.fill();
      ctx.strokeStyle = '#070809';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.restore();

      ctx.restore(); // End Cap Crown transform
      ctx.restore(); // End whole character transform
      ctx.restore(); // End root scale & transform
    }

    // Inisialisasi Kontrak Aset Engine (window.asset)
    window.asset = {
      canvas: canvas,
      meta: {
        width: W,
        height: H,
        fps: 30,
        duration: 8.0, // 2 siklus @ 4s (memenuhi standar Adobe Stock min 5s)
      },
      params: {
        bg: 'black',
        duration: 8.0,
        loopSeconds: LOOP_SECONDS,
      },
      setup: async (customCtx) => {
        if (typeof window !== 'undefined' && window.__cliParams) {
          Object.assign(window.asset.params, window.__cliParams);
        }
        window.__assetReady = true;
      },
      applyParams: () => {},
      render: (t) => {
        const cycle = Number(window.asset.params.loopSeconds) || LOOP_SECONDS;
        const theta = (((t % cycle) + cycle) % cycle) / cycle * Math.PI * 2;
        renderGhostFrame(theta);
      }
    };

    window.__assetReady = true;

    // High-precision requestAnimationFrame loop untuk preview interaktif di browser
    let startTime = null;
    function animate(timestamp) {
      if (startTime === null) startTime = timestamp;
      const elapsedSeconds = (timestamp - startTime) * 0.001;
      window.asset.render(elapsedSeconds);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
