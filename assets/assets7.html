<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand-Drawn Curved Arrow Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: auto;
    background-color: #000000;
  }
</style>
</head>
<body>
<canvas id="canvas" width="3840" height="2160"></canvas>
<script>
window.DURATION = 10;
window.FPS = 30;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CX = 1920;
const CY = 1080;
const TAU = Math.PI * 2;

// Flat Solid Matte Palette (NO glow, NO shadowBlur, NO gradients)
const COLOR_WHITE = '#FFFFFF';
const COLOR_YELLOW = '#FFD93D';

// Discrete 12fps Line Boil (12 steps/sec * 10s = 120 integer steps per loop)
const BOIL_FPS = 12;
const TOTAL_BOIL_STEPS = window.DURATION * BOIL_FPS; // 120

// Deterministic Seeded PRNG
function createSeededPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rand = createSeededPRNG(618493);

// Precompute discrete line-boil offset table (2-4 px) indexed by [boilStep][slot]
const NUM_BOIL_SLOTS = 512;
const BOIL_X = [];
const BOIL_Y = [];

for (let step = 0; step < TOTAL_BOIL_STEPS; step++) {
  const rx = new Float32Array(NUM_BOIL_SLOTS);
  const ry = new Float32Array(NUM_BOIL_SLOTS);
  for (let i = 0; i < NUM_BOIL_SLOTS; i++) {
    const a = rand() * TAU;
    const mag = 2.0 + rand() * 2.2; // 2.0 to 4.2 px discrete offset
    rx[i] = Math.cos(a) * mag;
    ry[i] = Math.sin(a) * mag;
  }
  BOIL_X.push(rx);
  BOIL_Y.push(ry);
}

// Helper: Catmull-Rom spline interpolation through hand-drawn waypoints with marker width variation (14-22px)
function buildHandDrawnSpline(waypoints, numSamples, minW, maxW, boilOffset, seedPhase) {
  const pts = [];
  const n = waypoints.length - 1;

  function getCtrl(idx) {
    return waypoints[Math.max(0, Math.min(n, idx))];
  }

  for (let i = 0; i <= numSamples; i++) {
    const u = i / numSamples;
    const scaled = u * n;
    const segIdx = Math.min(n - 1, Math.floor(scaled));
    const t = scaled - segIdx;

    const p0 = getCtrl(segIdx - 1);
    const p1 = getCtrl(segIdx);
    const p2 = getCtrl(segIdx + 1);
    const p3 = getCtrl(segIdx + 2);

    const t2 = t * t;
    const t3 = t2 * t;

    const x = 0.5 * (
      (2 * p1.x) +
      (-p0.x + p2.x) * t +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
    );
    const y = 0.5 * (
      (2 * p1.y) +
      (-p0.y + p2.y) * t +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
    );

    // Subtle hand-drawn organic imperfection along the curve
    const wobbleX = Math.sin(u * 34 + seedPhase) * 2.4 + Math.cos(u * 19 - seedPhase) * 1.6;
    const wobbleY = Math.cos(u * 38 + seedPhase) * 2.4 + Math.sin(u * 23 + seedPhase) * 1.6;

    // Marker pressure variation between minW and maxW (14-22px)
    const pressure = 0.5 + 0.5 * Math.sin(u * TAU * 3.2 + seedPhase);
    let taper = 1.0;
    if (u < 0.04) taper = 0.65 + 0.35 * (u / 0.04);
    else if (u > 0.96) taper = 0.72 + 0.28 * ((1 - u) / 0.04);

    const width = (minW + (maxW - minW) * pressure) * taper;

    pts.push({
      x: x + wobbleX,
      y: y + wobbleY,
      u,
      width,
      boilSlot: (boilOffset + i) % NUM_BOIL_SLOTS
    });
  }

  return pts;
}

// 1. PRIMARY WHITE CURVED ARROW SHAFT (Sweeping from Bottom-Left to Upper-Right with a playful loop/arch)
// Safe margins: X in [-760, +720], Y in [-470, +510] around center (1920, 1080)
const mainShaftWaypoints = [
  { x: -730, y: 485 },
  { x: -575, y: 410 },
  { x: -420, y: 245 },
  { x: -315, y: 45 },
  { x: -385, y: -55 },  // Playful little loop-de-loop / dip in the middle-left of the shaft
  { x: -480, y: 20 },
  { x: -415, y: 145 },
  { x: -210, y: 165 },
  { x: 65,   y: 85 },
  { x: 335,  y: -75 },
  { x: 545,  y: -275 },
  { x: 685,  y: -445 }  // Upper-Right Arrow Tip
];
const MAIN_ARROW_SHAFT = buildHandDrawnSpline(mainShaftWaypoints, 240, 16, 22, 0, 0.4);

// 2. PRIMARY WHITE ARROWHEAD AT UPPER-RIGHT TIP (x: 685, y: -445, pointing upper-right ~ -48 deg)
// Drawn as a continuous hand-drawn V-barb with a double-sketch back-cross bar
const mainHeadWaypoints = [
  { x: 485, y: -405 }, // Upper-left barb wing tip
  { x: 590, y: -428 },
  { x: 692, y: -452 }, // Sharp upper-right apex of arrowhead
  { x: 642, y: -348 },
  { x: 605, y: -245 }, // Lower-right barb wing tip
  { x: 552, y: -322 }, // Sketchy triangular return stroke closing the open-head doodle arrow
  { x: 495, y: -398 }
];
const MAIN_ARROW_HEAD = buildHandDrawnSpline(mainHeadWaypoints, 96, 16, 22, 250, 1.8);

// 3. SECONDARY SKETCHED WHITE UNDER-SHAFT (Parallel double-line doodle accent along the main arch)
const sketchShaftWaypoints = [
  { x: -690, y: 515 },
  { x: -510, y: 430 },
  { x: -165, y: 205 },
  { x: 115,  y: 122 },
  { x: 380,  y: -42 },
  { x: 585,  y: -245 },
  { x: 660,  y: -365 }
];
const SKETCH_WHITE_SHAFT = buildHandDrawnSpline(sketchShaftWaypoints, 150, 14, 18, 350, 3.1);

// 4. SECONDARY WARM YELLOW (#FFD93D) ACCENT CURVE & ARROWHEAD HIGHLIGHT (Overlapping delayed follow-through)
const yellowShaftWaypoints = [
  { x: -655, y: 445 },
  { x: -490, y: 345 },
  { x: -195, y: 120 },
  { x: 85,   y: 32 },
  { x: 340,  y: -125 },
  { x: 530,  y: -310 },
  { x: 635,  y: -415 }
];
const YELLOW_ACCENT_SHAFT = buildHandDrawnSpline(yellowShaftWaypoints, 150, 14, 19, 120, 5.0);

const yellowHeadWaypoints = [
  { x: 525, y: -445 },
  { x: 638, y: -472 },
  { x: 728, y: -488 }, // Slightly ahead of the white arrowhead tip for comic emphasis
  { x: 688, y: -395 },
  { x: 652, y: -292 }
];
const YELLOW_ACCENT_HEAD = buildHandDrawnSpline(yellowHeadWaypoints, 64, 14, 19, 200, 2.7);

// 5. AMBIENT DOODLE ACCENTS: Tail Feathers at Bottom-Left, Target Impact Rays & Doodle Stars at Upper-Right
const AMBIENT_DOODLES = [
  // Bottom-left tail feather chevrons
  { x: -755, y: 505, ang: 2.35,  len: 64, color: COLOR_YELLOW, phaseOff: 0.46, type: 'chevron', slot: 420 },
  { x: -805, y: 545, ang: 2.35,  len: 58, color: COLOR_WHITE,  phaseOff: 0.50, type: 'chevron', slot: 425 },
  // Upper-right arrowhead target emphasis burst rays
  { x: 765,  y: -525, ang: -0.78, len: 68, color: COLOR_YELLOW, phaseOff: 0.22, type: 'ray',     slot: 435 },
  { x: 795,  y: -455, ang: -0.15, len: 64, color: COLOR_WHITE,  phaseOff: 0.25, type: 'ray',     slot: 440 },
  { x: 710,  y: -555, ang: -1.35, len: 62, color: COLOR_WHITE,  phaseOff: 0.19, type: 'ray',     slot: 445 },
  // Motion speed dashes along the outer belly of the curve
  { x: 255,  y: 115,  ang: -0.62, len: 78, color: COLOR_YELLOW, phaseOff: 0.12, type: 'ray',     slot: 455 },
  { x: 455,  y: -45,  ang: -0.72, len: 72, color: COLOR_YELLOW, phaseOff: 0.16, type: 'ray',     slot: 460 },
  // Hand-drawn 4-stroke doodle stars
  { x: 835,  y: -345, ang: 0.25,  len: 34, color: COLOR_YELLOW, phaseOff: 0.28, type: 'star',    slot: 470 },
  { x: -575, y: 125,  ang: -0.20, len: 32, color: COLOR_WHITE,  phaseOff: 0.62, type: 'star',    slot: 480 },
  { x: 145,  y: -215, ang: 0.40,  len: 30, color: COLOR_YELLOW, phaseOff: 0.36, type: 'star',    slot: 490 }
];

// Progressive Draw-On (Bottom-Left to Upper-Right) -> Hold -> Erase from Start (Bottom-Left to Upper-Right)
// Given local cycle phase c in [0, 1):
// - c in [0.00, 0.40]: Draws itself progressively from start to end (uStart = 0, uEnd: 0 -> 1)
// - c in [0.40, 0.60]: Holds full stroke (uStart = 0, uEnd = 1)
// - c in [0.60, 0.96]: Erases from the start (bottom-left) toward the end (upper-right) (uStart: 0 -> 1, uEnd = 1)
// - c in [0.96, 1.00]: Brief reset pause (uStart = 0, uEnd = 0)
function getDrawEraseWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  if (c < 0.40) {
    return { uStart: 0.0, uEnd: smoothStep(c / 0.40) };
  } else if (c < 0.60) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.60) / 0.36), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Specific Draw-On -> Hold -> Erase window for the Arrowhead so it draws right as the shaft reaches the tip!
function getArrowheadWindow(localCyclePhase) {
  const c = ((localCyclePhase % 1.0) + 1.0) % 1.0;

  const smoothStep = (x) => {
    const t = Math.max(0, Math.min(1, x));
    return t * t * (3 - 2 * t);
  };

  // Shaft reaches tip around c = 0.32; arrowhead whips on between c = 0.28 and 0.42, holds through 0.78, and erases 0.78 -> 0.96
  if (c < 0.28) {
    return { uStart: 0.0, uEnd: 0.0 };
  } else if (c < 0.42) {
    return { uStart: 0.0, uEnd: smoothStep((c - 0.28) / 0.14) };
  } else if (c < 0.76) {
    return { uStart: 0.0, uEnd: 1.0 };
  } else if (c < 0.96) {
    return { uStart: smoothStep((c - 0.76) / 0.20), uEnd: 1.0 };
  } else {
    return { uStart: 0.0, uEnd: 0.0 };
  }
}

// Render a partial marker stroke between [uStart, uEnd] with discrete 12fps line boil & elastic arch flex
function renderMarkerPath(pts, uStart, uEnd, color, boilStep, phase, flexAmp) {
  if (uEnd - uStart <= 0.003) return;

  const totalSegs = pts.length - 1;
  const exactStart = uStart * totalSegs;
  const exactEnd = uEnd * totalSegs;
  const idxStart = Math.floor(exactStart);
  const idxEnd = Math.min(totalSegs, Math.ceil(exactEnd));

  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  function getAnimatedVertex(idx) {
    const p = pts[idx];
    const pPrev = pts[Math.max(0, idx - 1)];
    const pNext = pts[Math.min(totalSegs, idx + 1)];

    // Discrete 12fps line boil (2-4 px) smoothed slightly with adjacent vertices
    const bx = boilRowX[pPrev.boilSlot] * 0.25 + boilRowX[p.boilSlot] * 0.5 + boilRowX[pNext.boilSlot] * 0.25;
    const by = boilRowY[pPrev.boilSlot] * 0.25 + boilRowY[p.boilSlot] * 0.5 + boilRowY[pNext.boilSlot] * 0.25;

    // Subtle organic arch flex & follow-through along the arrow (integer cycles per loop)
    const archEnv = Math.sin(p.u * Math.PI);
    const flexX = Math.sin(TAU * (phase * 2 - p.u * 0.8)) * flexAmp * archEnv;
    const flexY = -Math.cos(TAU * (phase * 2 - p.u * 0.8)) * flexAmp * archEnv;

    // Slight forward thrust at the arrow tip when the arrowhead snaps on
    const tipThrust = (p.u > 0.75 ? (p.u - 0.75) / 0.25 : 0) * Math.sin(TAU * phase * 2) * 14;

    return {
      x: p.x + bx + flexX + tipThrust * 0.7,
      y: p.y + by + flexY - tipThrust * 0.7,
      width: p.width
    };
  }

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const batchSize = 4;
  for (let i = idxStart; i < idxEnd; i += batchSize) {
    const segEnd = Math.min(idxEnd, i + batchSize);
    const pMid = pts[Math.floor((i + segEnd) * 0.5)];

    ctx.lineWidth = pMid.width;
    ctx.beginPath();

    for (let j = i; j <= segEnd; j++) {
      let v = getAnimatedVertex(j);

      // Sub-segment interpolation at the erasing start tip
      if (j === idxStart && exactStart > idxStart && j < totalSegs) {
        const frac = exactStart - idxStart;
        const vNext = getAnimatedVertex(j + 1);
        v = {
          x: v.x + (vNext.x - v.x) * frac,
          y: v.y + (vNext.y - v.y) * frac
        };
      }
      // Sub-segment interpolation at the drawing end tip
      if (j === idxEnd && exactEnd < idxEnd && j > 0) {
        const frac = exactEnd - (idxEnd - 1);
        const vPrev = getAnimatedVertex(j - 1);
        v = {
          x: vPrev.x + (v.x - vPrev.x) * frac,
          y: vPrev.y + (v.y - vPrev.y) * frac
        };
      }

      if (j === i) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// Render Ambient Hand-Drawn Tail Feathers, Target Impact Rays & Doodle Stars
function renderAmbientDoodles(phase, boilStep) {
  const boilRowX = BOIL_X[boilStep];
  const boilRowY = BOIL_Y[boilStep];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < AMBIENT_DOODLES.length; i++) {
    const d = AMBIENT_DOODLES[i];
    const localC = (phase * 2 + d.phaseOff) % 1.0;
    const win = getDrawEraseWindow(localC);
    if (win.uEnd - win.uStart <= 0.02) continue;

    const bx = boilRowX[d.slot];
    const by = boilRowY[d.slot];
    const cx = d.x + bx;
    const cy = d.y + by;

    ctx.strokeStyle = d.color;
    ctx.lineWidth = 16;

    if (d.type === 'ray') {
      const d0 = win.uStart * d.len;
      const d1 = win.uEnd * d.len;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(d.ang) * d0, cy + Math.sin(d.ang) * d0);
      ctx.lineTo(cx + Math.cos(d.ang) * d1, cy + Math.sin(d.ang) * d1);
      ctx.stroke();
    } else if (d.type === 'chevron') {
      // V-shaped tail feather notch at bottom-left of arrow
      const wingA1 = d.ang - 0.55;
      const wingA2 = d.ang + 0.55;
      const d0 = win.uStart * d.len;
      const d1 = win.uEnd * d.len;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(wingA1) * d1, cy + Math.sin(wingA1) * d1);
      ctx.lineTo(cx + Math.cos(wingA1) * d0, cy + Math.sin(wingA1) * d0);
      ctx.moveTo(cx + Math.cos(wingA2) * d0, cy + Math.sin(wingA2) * d0);
      ctx.lineTo(cx + Math.cos(wingA2) * d1, cy + Math.sin(wingA2) * d1);
      ctx.stroke();
    } else if (d.type === 'star') {
      const s = d.len;
      const axes = [0, Math.PI * 0.5, Math.PI * 0.25, Math.PI * 0.75];
      ctx.lineWidth = 14;
      for (let k = 0; k < 4; k++) {
        const a = d.ang + axes[k];
        const l0 = -s + win.uStart * (2 * s);
        const l1 = -s + win.uEnd * (2 * s);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * l0, cy + Math.sin(a) * l0);
        ctx.lineTo(cx + Math.cos(a) * l1, cy + Math.sin(a) * l1);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
}

window.renderFrame = function(t) {
  const phase = ((t % window.DURATION) + window.DURATION) % window.DURATION / window.DURATION;

  // 0. Solid Pure Black Background (#000000 across the whole frame)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 3840, 2160);

  // Discrete 12fps Line Boil step index (0..119, identical at phase 0 and phase 1)
  const boilStep = Math.floor(phase * TOTAL_BOIL_STEPS) % TOTAL_BOIL_STEPS;

  // Whole-arrow subtle squash & stretch, diagonal surge, and tilt wobble (integer harmonics)
  const sin1 = Math.sin(TAU * phase * 1);
  const cos1 = Math.cos(TAU * phase * 1);
  const sin2 = Math.sin(TAU * phase * 2);
  const cos2 = Math.cos(TAU * phase * 2);

  const scaleX = 1.0 + 0.018 * sin2;
  const scaleY = 1.0 - 0.018 * sin2;
  const wobbleRot = 0.025 * sin1 + 0.015 * cos2;
  // Subtle diagonal anticipation & point-thrust toward upper right
  const thrustShiftX = 12 * sin2 + 8 * cos1;
  const thrustShiftY = -12 * sin2 + 8 * sin1;

  ctx.save();
  ctx.translate(CX + thrustShiftX, CY + thrustShiftY);
  ctx.rotate(wobbleRot);
  ctx.scale(scaleX, scaleY);

  // 2 Complete Bottom-Left to Upper-Right Draw-On -> Hold -> Erase Cycles per 10s loop (k = 2)
  // Staggered phase offsets so at phase=0 and phase=1 the Primary White Curved Arrow + Arrowhead
  // are in their FULL held state, while the Secondary Sketch Line and Yellow Accent Trail overlap:
  const baseCycle = phase * 2;

  const winPrimaryShaft = getDrawEraseWindow(baseCycle + 0.50);
  const winPrimaryHead  = getArrowheadWindow(baseCycle + 0.50);

  const winSketchWhite  = getDrawEraseWindow(baseCycle + 0.04);

  const winYellowShaft  = getDrawEraseWindow(baseCycle + 0.26);
  const winYellowHead   = getArrowheadWindow(baseCycle + 0.26);

  // 1. Secondary Motion Layer: Parallel Sketchy White Under-Shaft
  renderMarkerPath(
    SKETCH_WHITE_SHAFT,
    winSketchWhite.uStart,
    winSketchWhite.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    10
  );

  // 2. Secondary Motion Layer: Warm Yellow (#FFD93D) Accent Trail & Highlight Arrowhead
  renderMarkerPath(
    YELLOW_ACCENT_SHAFT,
    winYellowShaft.uStart,
    winYellowShaft.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    12
  );
  renderMarkerPath(
    YELLOW_ACCENT_HEAD,
    winYellowHead.uStart,
    winYellowHead.uEnd,
    COLOR_YELLOW,
    boilStep,
    phase,
    6
  );

  // 3. Primary Motion Layer: Hero White Curved Arrow Shaft & Bold Hand-Drawn Arrowhead
  renderMarkerPath(
    MAIN_ARROW_SHAFT,
    winPrimaryShaft.uStart,
    winPrimaryShaft.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    9
  );
  renderMarkerPath(
    MAIN_ARROW_HEAD,
    winPrimaryHead.uStart,
    winPrimaryHead.uEnd,
    COLOR_WHITE,
    boilStep,
    phase,
    5
  );

  // 4. Ambient Motion Layer: Tail Feathers, Target Emphasis Rays & Doodle Stars
  renderAmbientDoodles(phase, boilStep);

  ctx.restore();
};

// Normal playback loop
function animate(now) {
  requestAnimationFrame(animate);
  window.renderFrame(now / 1000);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
